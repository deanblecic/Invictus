# Stranica se objavljuje na Cloudflare Pages (sy-invictus.pages.dev) i GitHub Pages; Netlify adresa samo preusmjerava.
[build]
  publish = "."
  command = ""
  # Netlify objavljuje samo kad se promijeni ova datoteka (npr. adresa preusmjeravanja);
  # nove objave dnevnika ne pokreću Netlify i ne troše kredite.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml"

[[redirects]]
  from = "/*"
  to = "https://sy-invictus.pages.dev/:splat"
  status = 301
  force = true
