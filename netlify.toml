# Stranica se sada objavljuje na GitHub Pages; Netlify adresa samo preusmjerava.
[build]
  publish = "."
  command = ""
  # Netlify više ne objavljuje nove verzije (preusmjeravanje ostaje); svaka objava trošila bi kredite.
  ignore = "exit 0"

[[redirects]]
  from = "/*"
  to = "https://deanblecic.github.io/Invictus/:splat"
  status = 301
  force = true
