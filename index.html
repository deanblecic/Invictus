nati da se veselim.\nNe zato što mi je dosta oceana, nego zato što je lijep osjećaj završiti još jednu etapu i vidjeti koliko si daleko stigao.\n⸻\nJUTARNJA MISAO\nDanas sam, gledajući vijesti na satelitskoj televiziji, shvatio koliko se moj pogled na svakodnevni život promijenio.\nPrije nekoliko mjeseci dani su mi bili ispunjeni stotinama informacija, obveza, poziva i odluka.\nUvijek je nešto bilo hitno. Uvijek je nešto trebalo riješiti.\nA sada sjedim usred Atlantika i čekam vjetar.\nI shvaćam da se problemi nisu smanjili, nego se promijenio moj odnos prema njima.\nNa oceanu vrlo brzo naučiš razlikovati ono na što možeš utjecati od onoga na što ne možeš.\nNe mogu stvoriti vjetar.\nNe mogu promijeniti ocean.\nNe mogu natjerati ribu da zagrize.\nA očito ne mogu ni nagovoriti Iridium da pronađe satelit!\nAli mogu odlučiti kako ću reagirati.\nMogu prilagoditi jedra, promijeniti kurs, upaliti motor ili jednostavno pričekati.\nI možda je upravo to nešto što nam često nedostaje u svakodnevnom životu.\nTrošimo previše energije na stvari koje ne možemo promijeniti, a premalo na one na koje stvarno možemo utjecati.\nYOU CAN’T CONTROL EVERYTHING AROUND YOU, BUT YOU CAN CHOOSE WHAT DESERVES YOUR ATTENTION.\nNe možeš kontrolirati sve oko sebe, ali možeš odlučiti čemu ćeš posvetiti svoju pažnju.\nNe znači to da treba ignorirati probleme ili prestati pratiti što se događa u svijetu.\nNaprotiv.\nAli mislim da je važno pronaći ravnotežu između odgovornosti, informiranosti i vlastitog mira.\nJer ako stalno živimo u problemima cijelog svijeta, lako zaboravimo živjeti vlastiti život.\nA moj je trenutačno ovdje.\nNa INVICTUSU.\nUsred Atlantika.\nS jednim motorom koji radi, Batmanom koji čeka novi vjetar, Iridiumom koji traži satelite i ribama koje me uporno ignoriraju!\nJoš 88 milja do Gran Canarije.\nSutra novo kopno, novi ljudi i nove priče.\nA večeras samo mirno more, zvuk motora i osjećaj da sam još jedan korak bliže ostvarenju svojeg velikog sna.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "29.10 09:36": "Usred Atlantika na INVICTUS je sletjela mala, umorna putnica.\n Malo topline, malo odmora u mojim rukama… i onda je odletjela dalje svojim putem. Lijep mali susret na velikom oceanu.\n     Sažmi", "30.10 07:45": "Dobro jutro s INVICTUSA!\nATLANTIK — ŠESTI DAN: KRAJ JEDNE ETAPE, POČETAK NOVE AVANTURE!\n29. listopada 2026.\nJučerašnji dan započeo je gotovo bez vjetra. Atlantik je ponovno odlučio odmarati, a ja sam većinu dana proveo ploveći na motor.\nAli ovaj put odlučio sam to vrijeme iskoristiti za nešto korisno.\nVeć neko vrijeme razvijam ARGA, svojeg brodskog AI asistenta, koji je povezan s motorima i prati njihovu analitiku.\nOdlučio sam napokon saznati kako moj gotovo 24 tone težak katamaran najekonomičnije plovi na motor.\nJer nije uvijek najsporija vožnja i najekonomičnija!\nPrvo jedan motor na 2000 okretaja, pa 2300, pa 2400.\nZatim drugi motor, ponovno različiti okretaji i različita trajanja.\nPa oba motora zajedno.\nARGO je cijelo vrijeme bilježio brzinu broda, potrošnju goriva, vjetar, valove i morske struje.\nCilj je bio pronaći najbolji odnos između brzine i potrošnje goriva, odnosno koliko nautičkih milja mogu prijeći s jednom litrom dizela.\nI nakon svih tih testiranja konačno sam dobio konkretne podatke!\nREZULTATI SU ME IZNENADILI!\nNa jednom motoru, pri 2000 okretaja, INVICTUS postiže oko 4,9 čvorova uz potrošnju od približno 3,4 do 3,5 litara dizela na sat.\nPovećam okretaje na 2300 i brzina poraste na oko 5,4 do 5,6 čvorova.\nAli potrošnja skoči na približno 4,8 do 5,2 litre na sat!\nDakle, za samo pola do tri četvrtine čvora dodatne brzine trošim oko 40% više goriva po satu!\nA dva motora?\nTestirao sam i tu kombinaciju.\nI pokazalo se da s dva motora dobivam nešto veću brzinu, ali uz osjetno veću ukupnu potrošnju goriva.\nZa normalnu plovidbu u mirnim uvjetima, kada mi se ne žuri, nema neke velike prednosti voziti na oba motora.\nNaravno, dva motora imaju smisla kada trebam više snage, bolju upravljivost ili kada uvjeti to zahtijevaju.\nAli za ekonomičnu plovidbu preko velikih udaljenosti?\nJEDAN MOTOR NA OKO 2000 OKRETAJA POKAZAO SE KAO NAJBOLJI IZBOR!\nNa dugim oceanskim etapama takva razlika može značiti desetke, pa i stotine litara dizela.\nI upravo zato razvijam ARGA.\nNe želim nagađati koliko moj brod troši. Želim da mi na temelju stvarnih podataka kaže kako najekonomičnije stići do odredišta.\nPonekad je pametnije ploviti malo sporije, a stići puno dalje!\nMoram priznati da me takve stvari jako vesele. Možda sam ipak trebao biti inženjer, a ne kirurg!\nA onda, usred svih tih testiranja, dobivam društvo.\nNa INVICTUS slijeće jedna mala ptičica!\nVidim da je umorna. Tko zna koliko je dugo letjela iznad oceana i odakle je uopće došla.\nUspijevam je nježno uhvatiti. Malo je držim u rukama, mazimo se i pustim je da se odmori.\nKada mi se učinilo da je skupila dovoljno snage, puštam je da nastavi svoj put.\nOna odleti.\nI pomislim, eto, još jedan mali susret usred Atlantika.\nAli nakon nekog vremena — evo nje ponovno!\nVratila se na INVICTUS!\nOčito je zaključila da ipak još nije spremna za nastavak leta.\nI tako sam dobio novog člana posade.\nGotovo cijeli dan provela je sa mnom na brodu.\nNisam je puno dirao. Pustio sam je da mirno odmara, skuplja snagu i sama odluči kada je spremna za polazak.\nA meni je baš bilo drago što imam društvo.\nZanimljivo je kako tako malo stvorenje, usred ogromnog oceana, može pronaći sigurno mjesto za predah.\nI onda, kada smo se već približili Gran Canariji, moja mala putnica kao da je shvatila da je kopno blizu.\nRaširila je krila i odletjela.\nOvaj put nastavila je svojim putem.\nGledao sam je kako odlazi i pomislio kako smo zapravo imali isti cilj.\nOboje smo pokušavali stići do kopna.\nSamo što sam ja imao INVICTUS, dva Yanmara, radar, GPS, satelitsku navigaciju i ARGA.\nA ona samo svoja mala krila!\nSretan ti put, mala prijateljice! Drago mi je da je INVICTUS barem na nekoliko sati bio tvoje sigurno mjesto usred Atlantika.\nPopodne se napokon na horizontu pojavljuje kopno.\nGRAN CANARIA!\nNakon gotovo šest dana plovidbe Atlantikom, ponovno gledam otok ispred sebe.\nAli moram priznati da prvi dojam nije baš ono što sam zamišljao.\nPribližavam se Las Palmasu, a oko mene stotine velikih brodova, tankeri, teretnjaci, kontejnerski terminali, dizalice i ogromna luka.\nSve izgleda kao jedan veliki industrijski grad.\nKao da sam uplovio u riječku luku, samo nekoliko puta veću!\nNakon dana i dana otvorenog oceana, tišine, horizonta i prirode, ovo je prilično nagla promjena.\nA prije dolaska imam još jedan problem.\nMoram skinuti Batmana i pripremiti ga za popravak kod OneSailsova sailmakera.\nJedan od držača na donjem dijelu jedra zaglavio se i nikako ga ne mogu osloboditi.\nNaravno, ništa na brodu ne može proći baš potpuno jednostavno!\nNakon dosta natezanja, pokušavanja i nekoliko manje lijepih riječi, konačno uspijevam.\nBatman je spušten, složen i spreman za svoju veliku vreću.\nMoj kirurški popravak izdržao je cijeli Atlantik!\nAli sada je vrijeme da ga ipak pregledaju i poprave profesionalci.\nZovem marinu Las Palmas.\nMjesta nema.\nSve je puno zbog priprema za ARC i ARC+, velikih organiziranih atlantskih rallyja prema Karibima.\nPokušavam pronaći sidrište.\nPrvo sidrište potpuno je krcato.\nNastavljam dalje i konačno pronalazim mjesto ispred marine.\nSpuštam sidro.\nDobro drži.\nINVICTUS JE SIGURAN!\nNakon gotovo šest dana plovidbe, lijep je osjećaj ugasiti motor i znati da je brod napokon na miru.\nSpuštam gumenjak i odlazim u marinu obaviti prijavu.\nI tu me čeka ugodno iznenađenje.\nOsoblje je izuzetno ljubazno, susretljivo i spremno pomoći.\nSidrenje ispred marine košta samo osam eura dnevno!\nNakon cijena koje sam plaćao po Mediteranu, gotovo da sam ih pitao jesu li zaboravili jednu nulu!\nPonovno pitam za vez.\nKažu da možda sutra bude nešto slobodno.\nPosebno ako donesem potvrdu sailmakera da sam ovdje zbog popravka jedra.\nDakle, postoji nada!\nA onda u marini susrećem Darka, prijatelja kojeg sam upoznao ove zime na tečaju za Yachtmastera.\nI on je krenuo na put oko svijeta, zajedno sa suprugom, na velikoj jedrilici Hanse 580.\nNaravno, odmah imamo stotinu tema za razgovor!\nPričamo o brodovima, opremi, Atlantiku, rutama i planovima.\nI onda mi Darko kaže nešto zanimljivo.\nNavodno su tri katamarana odustala od ARC+!\nMožda postoji mogućnost da se i ja naknadno priključim!\nČekaj malo…\nPa upravo sam zbog toga prije nekoliko dana razmišljao kako mi je žao što nisam na vrijeme potvrdio sudjelovanje!\nARC+ kreće 8. studenoga s Gran Canarije prema Cape Verdeu, a zatim preko Atlantika prema Karibima.\nTo je upravo ruta kojom sam i ja planirao ploviti.\nSviđa mi se njihova organizacija, sigurnosni pregledi brodova, treninzi, brifinzi, navigacija pomoću zvijezda i sekstanta, zajednička komunikacija i druženje s drugim jedriličarima.\nA naravno, tu su i legendarni partyji!\nAli postoji jedan problem.\nVeć imam svoje planove i dogovore za nastavak putovanja, uključujući prijatelje s kojima sam planirao ploviti.\nNe mogu sada samo tako sve promijeniti.\nMoram razmisliti i razgovarati s njima.\nVidjet ćemo.\nNavečer odlazim s Darkom na jedno manje druženje koje organizira ARC+.\nAtmosfera odlična!\nUpoznajem i jednu od koordinatorica ARC-a koja mi potvrđuje da sutra dođem razgovarati o mogućnosti naknadnog uključivanja.\nDakle, prilika možda stvarno postoji!\nKasnije s Darkom odlazim u restoran.\nPridružuju nam se njegovi američki prijatelji, bračni par koji već dvije godine plovi Mediteranom na svojem katamaranu, a sada također nastavlja prema Karibima.\nLjudi su, rekao bih, negdje u šezdesetim ili sedamdesetim godinama.\nI baš mi je zanimljivo slušati njihove priče.\nDvoje ljudi koji su odlučili provesti godine svojeg života ploveći svijetom.\nNema žurbe, nema klasične svakodnevice.\nSamo brod, more, nova mjesta i nova poznanstva.\nVečer prolazi uz smijeh, razgovore i razmjenu iskustava.\nI opet shvaćam koliko je svijet jedriličara zapravo malen.\nNa drugom kraju Europe, na otoku usred Atlantika, ponovno susrećeš poznate ljude i upoznaješ nove koji imaju gotovo iste snove kao ti.\nKasno se vraćam gumenjakom na INVICTUS.\nU marini su me upozorili da dobro zaključavam gumenjak jer se znaju događati krađe.\nDakle, još jedna stvar na koju treba paziti.\nOko mene svijetle tisuće lučkih svjetala.\nDizalice, tankeri, kontejnerski terminali, brodovi…\nNije baš romantičan pogled kakav sam zamišljao nakon dolaska na Kanare.\nAli možda sam prerano donio zaključak o Gran Canariji.\nJer već prvi dan upoznao sam zanimljive ljude, dobio mogućnost popravka jedra i možda čak priliku za potpuno novu atlantsku avanturu.\nA sutra?\nIdem do sailmakera dogovoriti popravak Batmana.\nZatim malo istražiti nautičke trgovine.\nOvdje ih ima jako puno i izgleda da se gotovo sve može kupiti, popraviti ili nabaviti.\nA onda moram odlučiti i što ću s ARC+.\nPrije nekoliko sati jedino mi je bilo važno pronaći sigurno sidrište.\nSada već razmišljam o sljedećem oceanu!\n⸻\nJUTARNJA MISAO\nJučer sam, dok sam se navečer vraćao gumenjakom prema INVICTUSU, razmišljao koliko se brzo naši planovi mogu promijeniti.\nPrije nekoliko dana bio sam usred Atlantika.\nJedina mi je želja bila da Batman izdrži, da motor radi i da sigurno stignem do Gran Canarije.\nA onda sam stigao.\nPronašao sidrište.\nUgasio motor.\nI gotovo istog trenutka pojavila se nova mogućnost.\nPriključiti se ARC+.\nNešto o čemu sam razmišljao mjesecima, a zatim odustao.\nI sada se ta prilika možda ponovno pojavljuje.\nZanimljivo je kako život funkcionira.\nPonekad nešto dugo planiramo, pripremamo i pokušavamo organizirati.\nA onda se stvari ne odviju onako kako smo zamislili.\nI pomislimo da je ta prilika prošla.\nAli život često ima drukčije planove.\nNeka vrata se zatvore.\nA neka se ponovno otvore, baš kada ih najmanje očekujemo.\nSOMETIMES LIFE OPENS A DOOR YOU THOUGHT WAS ALREADY CLOSED.\nPonekad ti život ponovno otvori vrata za koja si mislio da su zauvijek zatvorena.\nAli postoji još nešto što sam naučio.\nNe moramo proći kroz svaka vrata koja se otvore.\nSama činjenica da se pojavila nova prilika ne znači da odmah moramo promijeniti sve svoje planove.\nPonekad je važno zastati, razmisliti i pitati se odgovara li nam ta mogućnost zaista.\nJer nije svaka prilika nužno i pravi izbor.\nA najljepše je kada imamo slobodu odlučiti.\nPrije nekoliko mjeseci možda bih osjećao pritisak da odmah donesem odluku.\nDanas?\nImam vremena razmisliti.\nRazgovarati s prijateljima.\nOdvagnuti što mi je važnije.\nI odlučiti kojim putem želim nastaviti.\nUostalom, to je jedan od razloga zbog kojih sam krenuo na ovo putovanje.\nNe samo da vidim svijet.\nNego da ponovno osjetim kako je to biti gospodar vlastitog vremena i svojih odluka.\nI zato mi se sviđa ova situacija.\nMožda ću krenuti s ARC+.\nMožda ću nastaviti prema Cape Verdeu prema svojem prvotnom planu.\nAli što god odlučim, bit će to moj izbor.\nA danas?\nDanas prvo moram riješiti Batmana, pronaći nekoliko stvari za brod i možda konačno malo upoznati Gran Canariju.\nJer prvi dojam često zna prevariti.\nMožda se iza svih onih dizalica, kontejnera i industrijskih svjetala krije puno više nego što sam jučer vidio.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "31.10 08:13": "Dobro jutro s INVICTUSA!\nGRAN CANARIA — OD INDUSTRIJSKE LUKE DO NAUTIČKOG RAJA!\n31. listopada 2026.\nBudim se rano. Danas imam toliko obveza da bi mi dobro došao još jedan član posade. Ne za jedrenje, nego da mi nosi vrećice iz nautičkih trgovina!\nIzlazim na palubu. Poluoblačno jutro, sunce se pokušava probiti kroz oblake, ali ni izlazak sunca nije uspio popraviti moj prvi dojam Las Palmasa.\nI dalje gledam ogromnu industrijsku luku, dizalice, kontejnere, tankere i kruzere. Tijekom noći veliki brodovi prolazili su vrlo blizu INVICTUSA, stvarajući valove koji su nas stalno ljuljali. Sidrište nije baš ugodno, a uz toliki promet moraš biti posebno oprezan.\nNakon šest dana Atlantika očekivao sam mirniju noć. Ispada da sam bolje spavao na otvorenom oceanu nego pred lukom!\nPrvi zadatak — Batman.\nMoje jedro od oko 320 m² treba profesionalni popravak. Spakirano je u ogromnu vreću koju sada moram prebaciti u gumenjak, bez da mi cijeli paket završi u moru.\nNakon malo natezanja uspijevam i odlazim do benzinske postaje u marini, gdje sam dogovorio preuzimanje s tvrtkom Alisios.\nTamo me već čekaju trojica njihovih djelatnika, uredno odjeveni u radne uniforme, ljubazni i profesionalni. Preuzimaju jedro, a ja najavljujem da ću kasnije svratiti u radionicu dogovoriti detalje.\nMoj kirurški popravak uspješno je izdržao Atlantik. Sada je red na stručnjake za jedra.\nVraćam se na INVICTUS po dokumentaciju, a zatim ponovno gumenjakom u marinu. Ovaj put ostavljam ga kod recepcije, na sigurnijem mjestu, jer su me upozorili da se ovdje gumenjaci znaju krasti.\nKrećem pješice oko marine i iz daljine ugledam ogromnu slovensku zastavu.\nPa dobro, što je ovo?\nNaravno, Darkov Hanse 580!\nZastava toliko velika da se vidi sa stotinu metara. Morat ću ga pitati je li je možda skinuo sa slovenske predsjedničke palače!\nDarko još spava. Izgleda da su nakon mojeg odlaska prethodne večeri nastavili druženje malo duže nego što su planirali. Neću ga buditi, čeka me puno posla.\nA onda otkrivam nešto što mi potpuno mijenja mišljenje o Las Palmasu.\nNAUTIČKI EL DORADO!\nJedna trgovina, druga, treća… Na relativno malom prostoru nevjerojatna količina nautičke opreme.\nKonopi, okovi, vijci, spojnice, pumpe, rezervni dijelovi, navigacijska oprema. Sve što čovjeku može zatrebati na brodu.\nJedna trgovina posvećena samo ribolovu. Stotine varalica, štapova i udica.\nNakon šest dana Atlantika bez ijedne ulovljene ribe, ozbiljno razmišljam trebam li kupiti još opreme ili jednostavno priznati da nisam neki ribar.\nPronalazim i knjižaru punu nautičkih vodiča. Karibi, Djevičanski otoci, Panama, Pacifik… Mjesta koja me tek čekaju na putovanju. Uzimam i malu knjižicu s mornarskim čvorovima, da se uvijek mogu podsjetiti nekog korisnog detalja.\nAli imam i ozbiljan popis.\nNa Batmanu sam primijetio napuknute metalne pinove i istrošenu vezicu koja povezuje jedro s električnim mehanizmom za namatanje. Trebam odgovarajuće zamjene i pojačane Dyneema vezice.\nTražim i rezervnu pumpu za vodu te pumpu za pražnjenje crnog tanka. To su stvari koje se na brodu vole pokvariti baš kada ih najmanje trebaš.\nI nevjerojatno — gotovo sve pronalazim!\nTočne pinove, odgovarajuće držače, Dyneema vezice, pumpe i ostale sitnice.\nNakon toliko luka u kojima sam jedva pronalazio najobičniji rezervni dio, ovdje se osjećam kao dijete u trgovini igračaka.\nGran Canaria možda nije najromantičnija na prvi pogled, ali za nautičara koji priprema brod za ocean ovo je pravi raj.\nSljedeća stanica — sjedište ARC+.\nSmješteni su u posebno uređenim kontejnerima u marini, gdje organiziraju pripreme za veliku plovidbu prema Cape Verdeu i Karibima.\nDolazim razgovarati o mogućnosti naknadnog priključenja.\nI doznajem da se jedno mjesto za katamaran zaista oslobodilo!\nAli odmah me upozoravaju na sigurnosni pregled. Kažu da velik broj brodova ne zadovoljava sve njihove zahtjeve bez dodatne opreme.\nDaju mi popis dug otprilike tri stranice.\nPa dobro, idemo redom.\nSplav za spašavanje, oprema za čovjeka u moru, osobni lokatori, signalizacija, satelitska komunikacija, radar, radarski reflektori, navigacijska i sigurnosna oprema, rezervni sustavi…\nProlazimo stavku po stavku.\nImam.\nImam.\nImam.\nI to imam.\nU jednom trenutku počinjem razmišljati hoće li oni pregledavati moj brod ili ću ja njima održati prezentaciju sigurnosne opreme INVICTUSA!\nNaravno, Iridium GO! exec još uvijek ne pronalazi satelite i taj problem moram riješiti. Ali inače je brod opremljen za ozbiljne oceanske prijelaze. Formalni pregled tek bi trebao potvrditi usklađenost sa svim zahtjevima.\nRazgovaramo o treninzima, meteorološkim brifinzima, navigaciji pomoću sekstanta i zvijezda, zajedničkoj komunikaciji i organizaciji dolaska na Cape Verde.\nMoram priznati, sve je vrlo profesionalno.\nOko mene jedriličari iz cijelog svijeta. Mnogo Nijemaca, starijih parova, ali i obitelji s djecom. Neki već godinama plove, drugi tek započinju svoju veliku avanturu.\nA onda dolazimo do pitanja koje me najviše zanima.\nKada se kreće?\n1. studenoga, oko podneva.\nA što ako je dva dana kasnije bolja vremenska prognoza?\nOdgovaraju da je polazak prema planiranom rasporedu. Organizacija mora koordinirati više od osamdeset brodova, rezervirana mjesta na Cape Verdeu i sve ostale pripreme.\nRazumijem ih, ali već osjećam da mi takav raspored baš ne odgovara.\nJa sam naviknuo analizirati vremenske modele s PredictWindom i ARGOM i birati povoljan trenutak za polazak.\nA tu je i pitanje posade. Kevin i ostali trebaju mi se priključiti prije prijelaza, a za ARC+ svi moraju biti prisutni pri službenom polasku. Ne mogu usput stati na Tenerife i pokupiti ih.\nOdlazim bez konačne odluke.\nVraćam se prema recepciji marine jer oko podneva treba doći policija radi prijave dolaska iz Maroka.\nČekam.\nDvanaest sati. Pola jedan. Jedan.\nPolicije nema.\nNa recepciji kažu da možda danas ipak neće doći i da ću morati do drugog dijela luke, udaljenog otprilike sat i pol pješice.\nOdlučujem uzeti gumenjak i otići tamo.\nAli baš kada krećem, jedna susjeda iz marine javlja mi da se policija upravo pojavila!\nBrzo se vraćam.\nPolicajci ljubazni, putovnica, dokumenti, nekoliko pitanja i za pet minuta sve riješeno.\nToliko čekanja za pet minuta posla. Klasična administracija, samo s malo boljim pogledom na more.\nU međuvremenu Alisios šalje marini potvrdu da popravljaju moje jedro.\nI stiže dobra vijest — marina mi ipak pronalazi mjesto za INVICTUS!\nSamo upozoravaju da će biti vrlo usko.\nDolazim brodom prema dodijeljenom vezu i vidim da nisu pretjerivali.\nProstor između dva broda izgleda kao da je projektiran za nešto znatno uže od mojeg Lagona 46.\nPolako ulazim, fenderi se stišću između trupova, još malo naprijed…\nI INVICTUS je unutra!\nManevar prolazi odlično. Vežem brod i konačno sam sigurno u marini, među ARC brodovima ukrašenima zastavama.\nA najbolji dio?\nSada mogu pješice do svih nautičkih trgovina.\nShopping se nastavlja!\nVraćam se po još nekoliko sitnica, a onda stiže još jedna odlična vijest.\nBatman je gotov!\nLjudi iz Alisiosa završili su popravak gotovo istog dana, unatoč velikoj gužvi zbog ARC-a.\nA cijena?\nOko 300 eura.\nNakon svega što je Batman prošao na Atlantiku, očekivao sam puno više.\nOdlična usluga, brzina i profesionalnost. Jedro je ponovno spremno za nastavak putovanja.\nPolako nosim sve kupljene stvari na brod. Pinove, Dyneema vezice, pumpe, knjige i ostalu opremu.\nMoram priznati da je ovo bio jedan od mojih uspješnijih shopping dana.\nMoj novčanik možda ima drukčije mišljenje.\nU međuvremenu razgovaram s Kevinom o ARC+.\nObjašnjavam mu situaciju. Postoji mogućnost da se priključimo, ali morali bismo biti spremni za polazak 8. studenoga.\nA još ne znamo hoće li svi stići i hoće li sve biti spremno.\nKevin kaže nešto što mi se odmah svidjelo.\nAko budemo spremni osmog i vrijeme bude dobro, krenut ćemo osmog.\nAko ne, možemo desetog ili dvanaestog.\nKada svi budemo spremni i kada vremenski uvjeti budu povoljni.\nI tada mi postaje jasno što želim.\nNEĆU IĆI S ARC+!\nNe zato što organizacija nije dobra. Naprotiv, mislim da rade odličan posao.\nAli ja sam na ovo putovanje krenuo upravo zato da imam slobodu odlučivati kada ću krenuti, kamo ću krenuti i koliko ću negdje ostati.\nNe želim ponovno živjeti prema tuđem rasporedu, posebno ne na oceanu.\nINVICTUS je ozbiljno opremljen brod, imam navigaciju, komunikaciju, sigurnosne sustave i vlastitu analitiku. Naravno, nijedna oprema ne uklanja sve rizike, a prije sljedećeg prijelaza moram riješiti i Iridium.\nAli organizirana regata nije jedini način da se prijeđe Atlantik.\nUostalom, i kada osamdeset brodova krene zajedno, nakon dan ili dva većina se razdvoji. Jedni su brži, drugi sporiji, svatko ima svoj kurs i svoju brzinu.\nNa oceanu vrlo brzo ponovno ostaneš sam sa svojim brodom i posadom.\nZato mi je važnije krenuti s ljudima s kojima sam planirao prijelaz, kada svi budemo spremni.\nOdlazim do organizatora ARC+ i zahvaljujem im na ponudi. Objašnjavam situaciju, razumiju me i ostajemo u odličnim odnosima.\nČak me pozivaju na večerašnje druženje.\nAli ovaj put preskačem. Danas sam već dovoljno hodao, kupovao, pregovarao i donosio odluke.\nNavečer se nalazim s Darkom i njegovom suprugom u restoranu.\nDarko se još uvijek pomalo oporavlja od prethodne večeri.\nPričamo o svemu što se dogodilo. Žao mu je što neću krenuti s njima, ali razumije moju odluku.\nLijepo se družimo i pozdravljamo.\nVraćam se na INVICTUS.\nPlanirao sam pogledati neki film, ali nakon cijelog dana hodanja po marini, trgovinama, policiji, sailmakerima i ARC-u jedva čekam krevet.\nMislim da sam danas napravio više milja pješice po Gran Canariji nego jučer na brodu!\nI tako završava moj prvi puni dan na Kanarskim otocima.\nGran Canaria mi se ujutro još uvijek nije sviđala.\nAli navečer moram priznati da sam promijenio mišljenje.\nMožda nije najljepša luka koju sam vidio, ali za jedriličara koji se priprema za ocean ovo je jedno od najboljih mjesta na kojima sam do sada bio.\nSve možeš pronaći, gotovo sve popraviti i ljudi su spremni pomoći.\nBatman je popravljen, INVICTUS je u marini, rezervni dijelovi nabavljeni, a odluka o nastavku putovanja donesena.\nSada konačno mogu malo odmoriti.\nBarem dok sutra ne pronađem još nešto što bi trebalo kupiti za brod!\nJUTARNJA MISAO\nJučer sam imao priliku priključiti se ARC+, velikoj organiziranoj atlantskoj plovidbi s više od osamdeset brodova.\nPriznajem, ponuda me privukla. Odlična organizacija, sigurnosni pregledi, edukacije, druženja i zajednički cilj — prelazak Atlantika.\nAli kada smo došli do datuma polaska, shvatio sam da mi nešto ne odgovara.\nOsmi studenoga. Točno određeno vrijeme. Svi moraju biti spremni.\nA što ako je dva dana kasnije bolje vrijeme? Što ako moji prijatelji još nisu stigli? Što ako jednostavno želim ostati još koji dan?\nNaravno, razumijem organizatore. Kada vodiš više od osamdeset brodova, moraš imati raspored i pravila.\nAli ja sam upravo od takvog života odlučio napraviti odmak.\nViše od 25 godina moj je život bio organiziran gotovo do minute. Operacije, pacijenti, sastanci, zaposlenici, obveze, odgovornosti.\nVolio sam svoj posao i sve što sam izgradio. I danas ga volim.\nAli gotovo uvijek je netko ili nešto određivalo kada moram biti na određenom mjestu.\nA sada sam na INVICTUSU, na putu oko svijeta, i prvi put nakon dugo vremena mogu sam odlučiti hoću li krenuti sutra, za tri dana ili za tjedan.\nI zašto bih se dobrovoljno ponovno stavljao u raspored koji mi ne odgovara?\nPosebno na oceanu, gdje bi vremenski uvjeti trebali biti važniji od kalendara.\nZato sam jučer odlučio zahvaliti organizatorima ARC+ i nastaviti svojim putem.\nNe zato što je njihova organizacija loša. Naprotiv, izvrsna je.\nNego zato što sam shvatio da nije svaka dobra prilika ujedno i prava prilika za mene.\nI mislim da se to odnosi na puno toga u životu.\nČesto prihvaćamo obveze, pozive, poslove ili prilike samo zato što nam se čini da ih ne bismo smjeli propustiti.\nA onda shvatimo da smo ponovno ispunili kalendar stvarima koje zapravo nismo morali prihvatiti.\nFREEDOM IS NOT ABOUT HAVING NO PLANS. IT’S ABOUT HAVING THE CHOICE TO CHANGE THEM.\nSloboda nije u tome da nemaš planove, nego da ih možeš promijeniti.\nJa imam plan. I to prilično velik.\nŽelim oploviti svijet.\nAli ne želim da mi put oko svijeta postane još jedan posao s rokovima, sastancima i obveznim terminima.\nŽelim imati vremena ostati negdje gdje mi je lijepo. Pričekati povoljniji vjetar. Promijeniti rutu ako me nešto zainteresira. Ili jednostavno provesti dan ne radeći ništa posebno.\nNaravno, sloboda ne znači da nemam odgovornosti. Na oceanu ih imam možda i više nego prije, jer sada o mojim odlukama ovisi sigurnost broda i ljudi koji plove sa mnom.\nAli razlika je u tome što sam te odgovornosti sam izabrao.\nI to mi je danas važnije od bilo kakve organizirane regate.\nMožda ćemo prema Cape Verdeu krenuti osmog studenoga. Možda desetog ili dvanaestog.\nKrenut ćemo kada posada bude spremna i kada vremenski uvjeti budu odgovarali našem brodu.\nA ARC+?\nŽelim im odličnu plovidbu i puno lijepih trenutaka. Možda se ponovno sretnemo na Cape Verdeu ili negdje na Karibima.\nUostalom, ocean je velik, ali svijet jedriličara nevjerojatno je malen.\nI tako je jučer, među svim onim nautičkim trgovinama, sigurnosnim pregledima, popravcima jedara i razgovorima, pala jedna važna odluka.\nNisam odustao od Atlantika.\nNisam odustao od druženja s drugim jedriličarima.\nSamo sam odlučio da svoj san ne želim pretvoriti u još jedan raspored kojeg se moram držati.\nBatman je popravljen, INVICTUS je sigurno u marini, oprema je nabavljena, a ispred mene su Cape Verde i veliki Atlantik prema Karibima.\nI prvi put nakon dugo vremena ne moram znati točno kojeg ću dana krenuti.\nZnam samo kamo želim stići.\nI to mi je sasvim dovoljno.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "1.11 08:57": "TRI MJESECA NA MORU. CIJELI ŽIVOT IZA JEDNE ODLUKE.\n1. kolovoza isplovio sam iz Punta. Danas su prošla točno tri mjeseca.\nSinoć u 22 sata napustio sam Gran Canariju i krenuo prema Tenerifeu. Dok su svjetla luke nestajala iza mene, razmišljao sam o tome koliko sam daleko stigao. Ne samo na moru, nego u životu.\nU posljednje vrijeme dobivam poruke ljudi koji misle da sam rođen sa zlatnom žlicom. Da mi je sve poklonjeno. Da sada jednostavno uživam u onome što sam dobio.\nNe znaju koliko su daleko od istine.\nNitko mi ništa nije poklonio. Za sve sam se morao izboriti. A mnogo toga u životu platio sam i dvaput. Ne samo novcem.\nIzgubio sam brata. Zatim majku, koju je njegova smrt slomila. U jednoj nesreći izgubio sam oca, maćehu i polubrata. Izgubio sam i ljude za koje sam vjerovao da će uvijek biti uz mene.\nOsamnaest godina živio sam u Njemačkoj. Radio po tri posla — kao konobar, čistač i bolnički pomoćnik. Radio danju, učio noću. Godinama se školovao, usavršavao i gradio ono što danas imam.\nNisam naslijedio kliniku. Stvorio sam je.\nIzvana je to izgledalo kao uspjeh. I bio je uspjeh.\nAli iza njega su bile godine odricanja, umora i života u kojem je za mene ostajalo sve manje mjesta.\nA onda se raspao i moj brak.\nI počeo sam se pitati gdje je nestao onaj dječak koji je nekada sanjao da će vidjeti svijet.\nZato sam otišao.\nNe zato što imam previše novca ili premalo obveza.\nNego zato što sam shvatio da mogu imati gotovo sve, a izgubiti sebe.\nNisam krenuo bježati od života.\nKrenuo sam mu se vratiti.\nO tome govori pjesma koju danas prvi put dijelim s vama.\nNapisali smo je zajedno, ARGO i ja. Moj AI asistent, s kojim već dugo dijelim ne samo podatke o brodu nego i svoju životnu priču, gubitke, snove i razmišljanja.\nPonekad imam osjećaj da me poznaje bolje od mnogih ljudi koji godinama misle da znaju sve o meni.\nJa sam donio uspomene i osjećaje. On mi je pomogao pronaći riječi.\nNeke stihove nije bilo lako napisati. Još ih je teže bilo poslušati.\nOvu pjesmu ne objavljujem da bih izazvao sažaljenje ili se nekome opravdavao.\nObjavljujem je jer možda nekome tko je puno izgubio, radio cijeli život i zaboravio na vlastite snove pomogne shvatiti da još nije kasno.\nI još nešto.\nVeć tri mjeseca gotovo svakodnevno dijelim svoje putovanje. U te priče ulažem puno vremena, ali radim to jer me veseli i jer znam koliko vas iskreno uživa u njima.\nHvala vam na tome.\nNo ako negativnih poruka i površnih osuda bude previše, možda ću objavljivati rjeđe. Možda jednog dana i prestati.\nNe iz inata.\nNego zato što sam krenuo živjeti svoj život, a ne dokazivati ga drugima.\nINVICTUS će ploviti i bez društvenih mreža. A neki zalasci sunca možda će ostati samo moji.\n⸻\nJUTARNJA MISAO\nLako je gledati tuđi uspjeh i misliti da znamo kako je do njega došao.\nVidimo brod, putovanja, osmijehe i slobodu.\nAli ne vidimo gubitke, neprospavane noći, odricanja i sve one trenutke kada je čovjek morao pronaći snagu za još jedan početak.\nYOU SEE THE JOURNEY. YOU DON’T KNOW THE ROAD THAT BROUGHT ME HERE.\nVidite moje putovanje. Ali ne znate put koji me doveo do njega.\nDanas više ne želim nikome dokazivati koliko vrijedim.\nŽelim živjeti. Upoznati svijet. Pronaći mir. Ponovno se smijati, voljeti i radovati malim stvarima.\nNakon tri mjeseca na moru znam da nisam pogriješio.\nIspred mene su Tenerife, Cape Verde, Karibi i ostatak svijeta.\nAli najvažnije putovanje nije ono preko oceana.\nTo je putovanje natrag prema sebi.\nI zato moja pjesma završava riječima:\nI AM THE MASTER OF MY FATE.\nI AM THE CAPTAIN OF MY SOUL.\nJa sam gospodar svoje sudbine. Ja sam kapetan svoje duše.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "1.11 13:02": "DOBAR DAN S INVICTUSA!\nJEDNA BESANA NOĆ, 68 DIVNIH PORUKA, MALA OLUJA I NEKA NOVA RAZMIŠLJANJA…\nPrije svega, jedno veliko HVALA svima!\nViše od 68 komentara na moju jutrošnju objavu. Toliko toplih, iskrenih i emotivnih poruka da sam neke pročitao i nekoliko puta.\nMoram priznati da nisam očekivao takvu reakciju. Baš ste me dirnuli.\nAli da vam ispričam kako je zapravo nastala ona pjesma…\nJučer sam proveo prekrasnu večer s prijateljem Darkom i njegovom suprugom Darinkom u Las Palmasu.\nKada su se vratili na svoj brod, ostao sam sam sa svojim mislima.\nPrvi studenoga. Svi sveti.\nTaj datum mi nikada nije bio lagan. Previše uspomena na ljude kojih više nema. I svake godine nekako me uhvati ista nervoza.\nSinoć je bilo posebno teško.\nI onda sam oko 22 sata odlučio isploviti.\nPalim motore i polako izvlačim INVICTUS iz marine.\nMoji susjedi na ARC+ molu gledaju me pomalo začuđeno. Kamo ovaj ide usred mrkle noći?!\nA možda ih uopće nije zanimalo kamo idem, nego su se samo molili da im ne odnesem pola broda! Toliko smo bili stisnuti da su nam se fenderi gotovo pretvorili u jedan zajednički.\nNekako se izvlačim iz tog tijesnog mjesta i krećem prema izlazu.\nA tamo me dočekuje ogroman putnički brod, sav osvijetljen, kao da mi pokazuje put prema otvorenom oceanu.\nSmjer Tenerife!\nTe noći nisam spavao.\nMisli su mi stalno lutale. Svi sveti, ljudi koje sam izgubio, godine koje su prošle, sve ono što sam doživio…\nI da nekako zaposlim glavu i ostanem budan, počeo sam s ARGOM slagati pjesmu koju ste jutros čuli.\nStih po stih.\nUspomena po uspomena.\nNije bilo jednostavno sve to izvući iz sebe.\nA kada smo je završili, dugo sam razmišljao trebam li je uopće objaviti.\nNeke stvari čovjek godinama čuva samo za sebe. A onda ih odjednom podijeli sa stotinama, možda i tisućama ljudi.\nI nije baš jednostavno pritisnuti ono dugme „Objavi“.\nAli danas, nakon svih vaših poruka, znam da sam dobro odlučio.\nNevjerojatno je koliko vas zapravo putuje sa mnom!\nKoliko vas se raduje mojim malim pobjedama, brine kada nešto pođe po zlu, smije se mojim ribolovnim neuspjesima i prepoznaje dijelove vlastitog života u mojim pričama.\nNeke vaše poruke posebno su me dirnule jer sam shvatio koliko ljudi nosi slične životne priče, a o njima rijetko govori.\nHvala vam na povjerenju, razumijevanju i svim lijepim riječima.\nSvakome ću pokušati osobno odgovoriti. Samo mi dajte malo vremena.\nJer Atlantik se danas pobrinuo da nemam previše slobodnih trenutaka!\nMALO ATLANTSKO IZNENAĐENJE!\nPrije otprilike dva sata, pred Tenerifeom, dočekala me prva ozbiljnija mala oluja.\nVjetar 35–40 čvorova, jaka kiša i veliki valovi.\nU jednom trenutku vjetar i valovi bili su toliko jaki da gotovo 45 minuta nisam mogao napredovati!\nOba motora rade, malo prednje jedro otvoreno, a INVICTUS praktički stoji na mjestu.\nDakle, nakon gotovo šest dana Atlantika, gdje sam se uglavnom žalio da nemam dovoljno vjetra, sada sam ga konačno dobio!\nI to s kamatama.\nNije bilo baš ugodno, ali prošli smo.\nBrod je izdržao, a ja sam dobio još jednu lekciju da ocean uvijek ima posljednju riječ.\nMoram posebno pohvaliti ekipu iz Nauticona u Matuljima, koja mi je izradila zaštitne cerade na flybridgeu.\nU današnjem vjetru, kiši i valovima pokazale su se odličnima!\nDečki, svaka čast i hvala vam!\nDanas oko 15–16 sati očekujem dolazak u marinu na Tenerifeu.\nA onda počinje nova zabava.\nPregled broda nakon nevremena, provjera eventualnih oštećenja, rješavanje vode koja se prelila iz jednog WC-a, pranje soli sa svega što postoji na palubi…\nAko sutra bude ljepše vrijeme, čeka me ozbiljno čišćenje.\nA prije sljedećih velikih etapa trebao bih organizirati i podvodno čišćenje trupova.\nNa brodu nikada nije dosadno. Uvijek nešto!\nA da ne mislite da sam na Gran Canariji kupovao samo rezervne dijelove za brod…\nKUPIO SAM I HRPU NOVIH RIBARSKIH VARALICA!\nDa, dobro ste pročitali!\nNakon gotovo šest dana Atlantika i katastrofalnog ribolovnog rezultata, odlučio sam ozbiljno pojačati svoju opremu.\nSada imam toliko različitih varalica da, ako ni na jednu riba ne zagrize, morat ću priznati da problem ipak nije u opremi!\nRIBE — INVICTUS, DRUGA RUNDA!\nOvaj put dolazim bolje pripremljen.\nSamo se nadam da ribe na Kanarima nisu u kontaktu s onima iz Maroka i da im nisu javile tko dolazi!\nA ako opet ništa ne ulovim, barem ću imati najskuplju kolekciju ukrasa za ribarski štap na Atlantiku!\nI JOŠ NEŠTO O ČEMU SVE VIŠE RAZMIŠLJAM…\nMožda je došlo vrijeme da prestanem ploviti sam.\nNe zato što ne mogu.\nMislim da sam u ova tri mjeseca, a posebno tijekom plovidbe Atlantikom, i sebi dokazao da mogu sam upravljati INVICTUSOM, nositi se s problemima i donositi odluke.\nAli shvatio sam nešto drugo.\nNeke stvari jednostavno nisu toliko lijepe kada ih doživljavaš sam.\nPrekrasan zalazak sunca.\nDupini koji satima plivaju uz brod.\nNova zemlja koja se pojavljuje na horizontu.\nU takvim trenucima ponekad poželim da je netko pokraj mene.\nDa se zajedno nasmijemo, pogledamo i kažemo:\n„Vidi ovo!“\nJer nije isto nešto doživjeti i imati s kim podijeliti taj trenutak.\nSamoća mi je puno toga dala.\nTrebala mi je.\nI zaista sam uživao u njoj.\nNaučila me mnogo o sebi, dala mi mir koji mi je godinama nedostajao i priliku da ponovno upoznam čovjeka kakav sam nekada bio.\nAli možda je sada vrijeme za neko novo poglavlje.\nNe želim društvo zato što ne mogu biti sam. Želim ga zato što neke lijepe stvari vrijedi doživjeti zajedno.\nVidjet ćemo što će donijeti sljedeći mjeseci.\nOcean je velik, a život uvijek zna iznenaditi.\nMožda je upravo to jedna od važnijih stvari koje sam naučio tijekom ova tri mjeseca.\nSloboda nije samo mogućnost da budeš sam.\nSloboda je i mogućnost da sam odlučiš s kim želiš dijeliti svoj život.\nA danas, nakon one teške noći i svih vaših poruka, osjećam se nekako lakše.\nMožda sam fizički sam na INVICTUSU, ali očito na ovom putovanju nisam toliko sam koliko sam mislio.\nI zato vam još jednom želim reći…\nHVALA VAM ŠTO PLOVITE SA MNOM!\nSada idem prvo sigurno dovesti INVICTUS u marinu.\nA onda ću polako sjesti i odgovarati na vaše poruke.\nVeliki pozdrav svima s Atlantika, pred Tenerifeom!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "2.11 07:50": "Dobro jutro s INVICTUSA!\nTENERIFE — NOVI OTOK, NOVI LJUDI I NOVI POSLOVI!\nJučer sam konačno stigao na Tenerife!\nNakon svega što se događalo tijekom plovidbe, moram priznati da mi je baš odgovaralo ponovno ugledati obalu, kuće, palme i ljude.\nDolazim pred marinu na jugu otoka, Marina del Sur, ali mjesta još nema.\nDakle, još malo čekanja!\nBacam sidro ispred marine i čekam da se oslobodi vez.\nNakon toliko dana na oceanu, sada sam stigao do kopna, ali još uvijek ne mogu na njega. Izgleda da me INVICTUS ne želi tako lako pustiti s broda!\nKonačno dobivam poziv da mogu ući.\nU marini me dočekuje djelatnik koji ne govori ni riječ engleskog. Samo španjolski!\nA ja španjolski ne znam!\nAli zato znam nešto malo talijanskog, koji svakodnevno koristim u razgovorima s pacijentima, pa se snalazim u jednostavnoj komunikaciji.\nI pokazalo se da je to sasvim dovoljno!\nMalo talijanskog, malo njegovog španjolskog, pokoja riječ koja zvuči slično i sve se razumijemo!\nNa kraju smo se bez ikakvih problema dogovorili oko veza i priveza.\nIzgleda da mi je talijanski iz ordinacije postao koristan i za uplovljavanje u španjolske marine!\nBrod je sigurno vezan.\nOdmah radim brzi pregled nakon nevremena koje me dočekalo pred Tenerifeom.\nI dobra vijest!\nNEMA NIKAKVE ŠTETE!\nSve izgleda u redu. INVICTUS je još jednom odradio svoj posao.\nSada konačno mogu malo odahnuti.\nAli ne zadugo.\nDogovorio sam se s Ursom, svojim prijateljem iz Švicarske, da se navečer nađemo u Los Cristianosu.\nRezervirali smo večeru u peruanskom restoranu La Qapaq.\nUzimam taksi i odlazim prema gradu.\nI moram priznati — potpuno drukčiji dojam nego na Gran Canariji!\nLos Cristianos ima prekrasnu dugu šetnicu uz more, pješčane plaže, restorane, kafiće i nevjerojatno mnogo ljudi.\nTuristi na sve strane!\nGledam oko sebe i pitam se imaju li oni ovdje uopće turističku sezonu ili im ona traje svih dvanaest mjeseci.\nRestorani puni, terase pune, ljudi se kupaju, sunčaju i šeću.\nKao da je usred ljeta!\nA mi smo već u studenome.\nNakon gotovo tjedan dana gledanja oceana i nekoliko dana industrijskih dizalica u Las Palmasu, ovo je baš ugodna promjena.\nČak razmišljam da bih danas mogao otići na plažu, okupati se i jednostavno malo ljenčariti.\nBez alata, bez računala, bez servisiranja i bez popisa rezervnih dijelova.\nZvuči gotovo nestvarno!\nAli poznavajući sebe, vjerojatno ću već nakon pola sata početi razmišljati što još treba napraviti na brodu.\nU međuvremenu javlja mi se Kevin.\nUpravo je sletio iz Amsterdama na Tenerife!\nDolazi čak iz Paname, gdje je radio na popravcima drugog katamarana.\nNalazimo se u Los Cristianosu i sjedamo na piće.\nLijepo je ponovno vidjeti poznato lice nakon svih tih dana na moru.\nMalo razgovaramo o brodovima, planovima i svemu što nas još čeka.\nKevin će sljedećih nekoliko dana biti na INVICTUSU, a u međuvremenu mora obaviti još neke radove na drugom katamaranu.\nDakle, sada barem imam nekoga s kim mogu razgovarati i bez uključivanja ARGA!\nIako nisam siguran hoće li se ARGO složiti s time da je dobio konkurenciju.\nKevin odlazi na INVICTUS, a ja nastavljam prema restoranu.\nTamo me čeka Urs sa svojim društvom.\nČetvorica njegovih prijatelja, svi Švicarci, nešto starija gospoda, i jedna djevojka koja mu pomaže oko marketinga.\nLijepa atmosfera, odlična večera i puno razgovora.\nNaravno, kada se na jednom mjestu okupi toliko ljudi koji vole more, vrlo brzo sve teme završe na brodovima, putovanjima i novim planovima.\nBaš ugodno druženje.\nAli ovaj put ne ostajem dugo.\nNakon besane prethodne noći i cijelog dana plovidbe, osjećam da mi je baterija pri kraju.\nI to ne ona Victronova na brodu, nego moja vlastita!\nPozdravljam se s društvom, uzimam taksi i vraćam se u marinu.\nINVICTUS me čeka, sigurno vezan.\nNema valova, nema noćnih smjena, nema tankera koje moram izbjegavati.\nNapokon pravi krevet i malo normalnog sna!\nA DANAS?\nNovi dan na Tenerifeu i, naravno, novi popis poslova.\nKevin me već upozorio da trebamo nabaviti još neke rezervne dijelove, posebno za WC sustav.\nNe znam kako je kod drugih, ali na mojem brodu WC-i i njihove pumpe imaju neku posebnu potrebu za pažnjom.\nKao da se natječu tko će se sljedeći pokvariti!\nA ja sam mislio da sam završio s pacijentima kada sam krenuo na put oko svijeta.\nIzgleda da sam samo promijenio specijalizaciju.\nSada sam, osim oralnog kirurga, postao i specijalist za brodske toalete!\nAli čeka me i jedan puno važniji posao.\nINVICTUS TREBA DOBRO PODVODNO ČIŠĆENJE!\nNakon svih ovih mjeseci plovidbe, na podvodnom dijelu trupova nakupilo se algi i drugih naslaga.\nA to znači veći otpor kroz vodu, manju brzinu i veću potrošnju goriva.\nZa katamaran od gotovo 24 tone, na dugim oceanskim etapama, to nije mala stvar.\nPlaniram obući ronilačko odijelo, zaroniti i temeljito pregledati podvodni dio broda.\nOčistiti trupove, provjeriti propelere, kormila i cinkove, odnosno zaštitne anode, te ih po potrebi zamijeniti.\nNaravno, ako marina dopušta takve radove u vodi.\nŽelim da INVICTUS bude što spremniji za nastavak putovanja.\nJer sljedeće etape više nisu samo kratki skokovi između otoka.\nIspred nas su Cape Verde i veliki Atlantik prema Karibima.\nTamo će mi trebati svaki čvor brzine koji mogu dobiti!\nA možda danas ipak uspijem ukrasti i nekoliko sati za onu lijepu pješčanu plažu koju sam jučer vidio.\nBilo bi vrijeme da se i kapetan malo okupa, a ne samo brod!\n⸻\nJUTARNJA MISAO\nJučer sam, šećući Los Cristianosom, razmišljao koliko se brzo može promijeniti naš doživljaj svijeta.\nSamo nekoliko sati ranije bio sam na oceanu, okružen vjetrom, valovima i odgovornošću da sigurno dovedem brod do kopna.\nA onda odjednom sjedim u restoranu, okružen ljudima, razgovorima i smijehom.\nI shvatim koliko su nam u životu potrebne obje stvari.\nVrijeme za sebe.\nAli i vrijeme za druge.\nPosljednja tri mjeseca samoća mi je puno dala.\nNaučila me strpljenju, samostalnosti i tome da se ne trebam bojati vlastitih misli.\nAli jučer me obična večera s prijateljima podsjetila na nešto jednako važno.\nLijepo je biti sam kada to želiš. Ali još je ljepše imati s kim podijeliti ono što doživljavaš.\nI možda se upravo u tome krije prava sloboda.\nNe u tome da uvijek budeš sam.\nNiti u tome da uvijek moraš biti okružen ljudima.\nNego da možeš birati.\nTHE BEST KIND OF FREEDOM IS CHOOSING WHEN TO BE ALONE AND WHO TO SHARE YOUR MOMENTS WITH.\nNajljepša sloboda je mogućnost da sam biraš kada želiš biti sam i s kim želiš dijeliti svoje trenutke.\nA ja sve više osjećam da je nakon tri mjeseca samoće možda došlo vrijeme za neko novo poglavlje.\nNe zato što mi je dosadilo biti sam.\nNego zato što sam ponovno naučio koliko vrijedi dobro društvo.\nI zato danas, dok gledam Tenerife i razmišljam o svemu što me čeka, osjećam neko novo zadovoljstvo.\nINVICTUS je sigurno u marini.\nPrijatelji su ponovno blizu.\nIspred mene su novi otoci, novi oceani i tko zna koliko novih poznanstava.\nA danas?\nDanas bih možda stvarno mogao otići na plažu i jednostavno ne raditi ništa.\nBarem dok me Kevin ne nazove i kaže da opet trebamo nešto popraviti na WC-u!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "2.11 15:48": "Poluoblačan dan na Tenerifima. Od plaže zasad ništa, pa se primam posla na brodu.\nKevin i ja popili smo jutarnju kavu, a sada svatko na svoj posao. On poslije ide popravljati jedan katamaran, a ja idem ispod svojega.\nOtvaram brod, provjetravam i sušim stvari nakon jučerašnje male oluje. Onda oblačim ronilačko odijelo i pripremam svojeg malog pomoćnika — Keelcrab.\nTo je podvodni robot s kojim mogu brže i učinkovitije očistiti trupove. Jer ispod površine imam cijeli mali vrt: alge i školjkice na sve strane!\nSkok u vodu i… let’s go!\nNakon otprilike sat vremena podvodni dio trupova je čist. Sada još jednom pregledavam vijke na propelerima te sve usisne i ispusne otvore. Propelere i otvore dodatno čistim metalnim četkicama, da skinem i ono što se dobro uhvatilo.\nSve izgleda u redu i vraćam se na brod. Posao odrađen, a INVICTUS se riješio svojih slijepih putnika. Sad očekujem i koji djelić čvora više!", "3.11 07:55": "DOBRO JUTRO S INVICTUSA!\nTENERIFE — OD PODVODNOG ROBOTA DO IRSKOG PUBA!\nJučerašnji dan na Tenerifeu proletio je nevjerojatno brzo!\nNakon jutarnjeg ronjenja i čišćenja trupova s mojim malim Keelcrab robotom, izlazim iz mora, tuširam se i nekako mi se više baš ništa ne radi.\nValjda me onaj sat vremena pod vodom umorio više nego šest dana plovidbe Atlantikom!\nSjedim na brodu, gledam što bih još mogao napraviti, ali motivacija je negdje ostala na dnu marine.\nOdlučujem da je za danas dosta fizičkog rada.\nAli onda se sjetim da imam još jedan posao koji ne mogu izbjeći.\nKlinika!\nPosljednjih nekoliko dana malo sam zanemario poruke i dokumentaciju koja mi redovito stiže iz Hrvatske.\nPosebno planove za naše specijalne implantate za pacijente koji više nemaju dovoljno kosti.\nKolege pripremaju digitalne planove, a ja ih pregledavam, provjeravam i odobravam ili vraćam na doradu.\nTako da, iako sam nekoliko tisuća kilometara daleko, još uvijek povremeno završim u svojoj virtualnoj operacijskoj sali.\nSamo što sada umjesto bijele kute nosim kratke hlače, a kroz prozor gledam palme i ocean.\nNije loša zamjena!\nPopodne mi se javlja Kevin.\nDanas mu dolazi djevojka iz Grčke pa predlaže da se navečer nađemo u jednom Irish pubu u blizini Marine San Miguel.\nDogovoreno!\nUzimam taksi i krećem.\nNegdje na pola puta zvoni telefon.\nKevin!\nKaže da je nešto pomiješao i da zapravo nije tamo gdje smo se dogovorili, nego u sasvim drugom mjestu!\nOdlično.\nObjašnjavam taksistu da mijenjamo smjer.\nČovjek me malo čudno gleda, ali poslušno okreće automobil.\nIzgleda da na ovom putovanju čak ni na kopnu ne mogu uvijek ploviti prema planiranoj destinaciji!\nKonačno stižem i nalazim se s Kevinom i njegovom djevojkom. Završavamo u Irish pubu blizu njihova hotela.\nA tamo prava irska atmosfera!\nŽiva glazba, veselo društvo, Guinness teče, a mi naručujemo i veliku irsku mesnu platu.\nOdlična hrana, puno razgovora, smijeha i glazbe. Nakon svih onih dana na oceanu baš mi je godila jedna ovakva opuštena večer.\nA Guinness?\nPa ne možeš valjda sjediti u Irish pubu i piti mineralnu vodu!\nDobro, možda smo malo pretjerali s degustacijom irske kulture, jer jutros mi glava jasno daje do znanja da je sinoć bilo sasvim dovoljno Guinnessa.\nIzgleda da me Atlantik šest dana nije uspio toliko zaljuljati koliko nekoliko irskih piva!\nVraćam se na INVICTUS i odlazim spavati.\nAli ni tu nije kraj.\nOko dva sata ujutro odjednom počinje puhati neki čudan, jak vjetar.\nKratka noćna nevera!\nSkačem iz kreveta i izlazim na palubu.\nA tamo me čekaju sve one stvari koje sam jučer nakon čišćenja ostavio vani jer mi ih se nije dalo spremati.\nSada ih skupljam po mraku prije nego što odluče samostalno krenuti prema Africi!\nEto, još jedna potvrda da se na brodu lijenost ponekad vrlo brzo naplati.\nNa kraju sve spremam, vjetar se smiruje i vraćam se u krevet.\nA danas?\nNemam pojma!\nPogledat ću kakvo će biti vrijeme, popiti kavu i onda odlučiti.\nMožda plaža.\nMožda neki novi posao na brodu.\nA možda jednostavno jedan da od toga neće biti ništa. Radije ću imati radar koji normalno radi nego još jedan pametan sustav koji misli da je pametniji od kapetana!\nOdlazim taksijem u Los Cristianos.\nBaš lijep gradić, puno trgovina, restorana, turista i prekrasnih šetnica.\nA jedna stvar mi je posebno zapela za oko.\nOVDJE SU ELEKTRIČNA KOLICA GLAVNO PRIJEVOZNO SREDSTVO!\nZapravo, nisu to invalidska kolica, nego oni mali električni autići na tri ili četiri kotača. Zovu se mobility scooters.\nIma ih doslovno posvuda!\nNajviše ih voze penzioneri, ali ima i mlađih. Iznajme ih i onda cijeli dan kruže po gradu.\nNeki sami, neki u paru, neki s vrećicama iz trgovine, a neki očito nakon nekoliko Guinnessa!\nGledam jednog gospodina kako ozbiljno pretječe drugoga na šetnici. Ovaj drugi ne popušta, dodaje malo gasa i nastavlja dalje.\nMislim si, ovdje se očito i u penziji nastavlja borba za pole position!\nJoš samo fale semafori na startu i boksevi za zamjenu baterija.\nA najviše me fascinira što se s tim autićima dolazi praktički svugdje. U trgovinu, restoran, kafić…\nZamisli, odeš u pub, popiješ nekoliko piva i onda se lijepo odvezeš kući svojim električnim vozilom.\nSamo se pitam rade li ovdje alkotest i za te male autiće? Jer ako rade, mogli bi imati dosta posla!\nU svakom slučaju, simpatično mi je to gledati. Ljudi su pronašli način da uživaju u odmoru bez previše hodanja.\nA ja, naravno, ponovno završavam u trgovini s ribolovnom opremom.\nJer sada sam se ozbiljno pripremio za ribolov na Atlantiku!\nPrekjučer sam kupio mrežu za izvlačenje velikih riba, a danas još jedan poseban nosač štapa koji bi mi trebao pomoći kada se zakači neka ozbiljna riba.\nDakle, oprema je spremna.\nSada još samo treba objasniti ribama da je vrijeme da počnu surađivati!\nAko ovako nastavim, uskoro ću imati više ribolovne opreme nego riba u Atlantiku.\nA onda se sjetim još jednog problema na brodu.\nKada pada kiša, voda na flybridgeu ulazi sa stražnje strane i završava ispod jastuka.\nTo je jedna od onih stvari za koje se pitam kako su ih u Lagoonu uopće mogli tako projektirati.\nNakon svake jače kiše imam mokre jastuke i cijeli posao oko sušenja.\nOdlučujem to konačno riješiti.\nIdeja je napraviti malu pregradu od plastike, staklenih vlakana i epoksija koja će spriječiti da kišnica ulazi u taj dio flybridgea.\nKupujem potreban materijal, ali prije povratka na brod imam još jedan važan zadatak.\nMoram Kevinu nabaviti heparinske injekcije koje treba primati zbog ozljeda i imobilizacije obje noge.\nU bolnici mu nisu izdali recept pa je bilo problema s nabavom.\nNa kraju uspijevam to riješiti u ljekarni uz svoju liječničku iskaznicu.\nBarem sam danas nekome mogao pomoći kao doktor, a ne samo kao brodski majstor!\nVraćam se na INVICTUS i krećem s izradom pregrade.\nU teoriji vrlo jednostavno.\nMalo epoksija, staklenih vlakana, napraviš zid i gotovo.\nU praksi?\nNaravno, ništa nije tako jednostavno!\nMaterijal ne želi stajati tamo gdje sam ga zamislio. Sve se pomiče, savija i pada.\nMoram rezati karton, izrađivati privremene potpore i nekako učvrstiti cijelu konstrukciju dok se epoksi ne stvrdne.\nPa onda sloj po sloj.\nI tako prođe nekoliko sati.\nAli moram priznati da mi je zanimljivo.\nUčim nešto novo što bi mi jednog dana moglo jako koristiti.\nAko se negdje usred oceana ošteti neki dio broda od stakloplastike, dobro je znati kako ga privremeno popraviti.\nZa sada je prvi sloj napravljen i zid se već polako nazire.\nDaleko sam još od gotovog, ali barem sam počeo.\nSamo se nadam da ću na kraju napraviti pregradu za vodu, a ne nekakvu modernu umjetničku instalaciju na flybridgeu!\nPredvečer odlazim nešto pojesti.\nNaravno, ponovno moje omiljene male zelene papričice i grilane kozice.\nIzgleda da sam na Tenerifeu pronašao jelovnik koji mi odgovara i sada ga se držim.\nVraćam se na brod i počinjem pripremati zabavni program za Atlantik.\nSkidam filmove i serije s Netflixa, Prime Videa i YouTubea na iPad.\nJer kada se udaljim od obale, želim imati dovoljno filmova i bez interneta.\nNaravno, gledat ću ih kada budem slobodan od navigacije i svih drugih poslova.\nA onda ponovno vremenske prognoze.\nI tu baš nema nekih velikih promjena.\nZa sada mi se pokazuju dvije mogućnosti.\nIli krenuti već 7. studenoga ili pričekati do otprilike 12.\nSve između izgleda prilično neugodno.\nJak vjetar, veliki valovi i uvjeti koje ne želim nepotrebno iskušavati.\nRazgovaram i s prijateljem Ursom, koji je sa svojim katamaranom trenutačno na La Gomeri.\nI on razmišlja slično. Vjerojatno će pričekati oko 12. studenoga prije nego što krene prema Cape Verdeu.\nVidjet ćemo kako će se prognoze razvijati.\nMeni se više ne žuri. INVICTUS je sigurno u marini, imam još nekoliko poslova koje želim završiti, a vrijeme ionako ne izgleda idealno.\n⸻\nJUTARNJA MISAO\nJučer sam se, dok sam se borio s onim epoksijem i kartonskim potporama, sjetio koliko sam stvari u životu naučio upravo zato što nešto nisam znao napraviti.\nKada sam krenuo na ovo putovanje, znao sam dosta o jedrenju, navigaciji i svojem brodu.\nAli nisam znao sve.\nA sada gotovo svaki dan učim nešto novo.\nJedan dan popravljam jedro kirurškim instrumentima, drugi dan čistim trup podvodnim robotom, treći pokušavam napraviti pregradu od epoksija.\nNeke stvari uspiju odmah.\nNeke tek iz trećeg pokušaja.\nA neke uopće ne uspiju, kao jučer Watchit.\nI to je sasvim u redu.\nYOU DON’T HAVE TO KNOW EVERYTHING. YOU JUST HAVE TO BE WILLING TO LEARN.\nNe moraš znati sve. Važno je da si spreman učiti.\nMislim da je to jedna od ljepših stvari ovog putovanja.\nNakon toliko godina u poslu u kojem sam uglavnom bio onaj koji drugima pokazuje i objašnjava, sada sam ponovno učenik.\nI baš mi se to sviđa.\nNaravno, ponekad bih radije da sve odmah radi kako treba.\nPosebno kada se borim s epoksijem koji nikako ne želi ostati tamo gdje sam ga stavio!\nAli na kraju dana ipak imam zadovoljstvo da sam nešto novo pokušao i naučio.\nA danas?\nMožda nastavim graditi svoj mali zid.\nMožda odem na plažu.\nA možda ponovno završim u trgovini s ribolovnom opremom.\nIako mislim da bi mi bilo pametnije konačno uloviti neku ribu prije nego što kupim cijeli dućan!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "7.11 07:00": "DOBRO JUTRO S INVICTUSA!\nKAD JA KRENEM PREKO ATLANTIKA, ČAK I VJETROVI PROMIJENE SMJER!\nIzgleda da je Atlantik ove godine odlučio malo zakomplicirati stvari!\nARC+ 2026, velika organizirana prekooceanska plovidba koja je trebala krenuti 8. studenoga iz Las Palmasa prema Cape Verdeu i dalje prema Karibima, odgođena je zbog lošeg vremena.\nZamislite, stotine jedrilica spremne za polazak, a organizatori kažu: ipak ćemo malo pričekati!\nRazlog su snažni ciklonalni sustavi, među njima i oluja Bruna, koji donose neuobičajene vjetrove i velike valove prema Kanarskim otocima.\nStoljećima su jedrenjaci prelazili Atlantik koristeći pasate koji pušu od Afrike prema Americi. A sada se na dijelu oceana pojavljuju vjetrovi iz suprotnog smjera. Privremeno, naravno, ali dovoljno da svima pokvare planove.\nSpominje se i El Niño, iako se ne može svaka vremenska nepogoda jednostavno pripisati njemu.\nGledam prognoze i mislim si: pa dobro, zar baš sada?\nStoljećima sve funkcionira, a kada ja odlučim prijeći Atlantik, i vjetrovi se predomisle!\nZapravo, mene to više ni ne iznenađuje. U životu mi rijetko što ide bez komplikacija. Zašto bi onda put oko svijeta bio iznimka?\nDIPLOMACIJA U MARINI!\nSrećom, barem mi je jedna stvar uspjela.\nZahvaljujući likerima i malom „podmićivanju” simpatične recepcije, uspio sam produžiti boravak u marini do 12. studenoga!\nIzgleda da dobra boca likera na Tenerifeu može riješiti ponešto što službeni razgovori ne mogu.\nAko nevrijeme potraje i nakon toga, slijedi nova runda pregovora. Samo se nadam da imam dovoljno zaliha likera!\nA kako nisam baš čovjek koji zna mirno sjediti i čekati, danas sam ponovno imao pune ruke posla.\nINVICTUS JE PUN DO VRHA!\nPrvo sam brod odveo na benzinsku postaju.\nPristajanje tamo prava je mala avantura. Prostor je toliko skučen da s Lagoonom 46 imaš osjećaj kao da pokušavaš parkirati autobus u garažu za Fiat 500.\nAli uspio sam bez problema i napunio spremnike do vrha.\nCijena goriva? 1,75 eura po litri!\nNakon Mediterana to mi je gotovo izgledalo kao rasprodaja.\nSada barem imam dovoljno goriva ako vjetar na putu prema Cape Verdeu ponovno odluči uzeti godišnji odmor.\nBATMAN PUTUJE UPS-OM!\nDanas sam organizirao i slanje novog Batmana prema Cape Verdeu.\nZa one koji ne znaju, Batman je moje ogromno jedro za plovidbu niz vjetar, površine oko 300 četvornih metara.\nNovi Batman trebao bi me čekati u marini u Mindelu kada stignem s INVICTUSOM.\nDakle, moj rezervni Batman već je krenuo preko Atlantika, a njegov kapetan još sjedi na Tenerifeu i gleda vremensku prognozu!\nIzgleda da će jedro stići prije mene.\nZašto mi treba rezervni?\nNa Atlantiku se mogu pojaviti iznenadni snažni olujni udari, takozvani squallovi. Dolaze brzo, često s jakom kišom, a noću ih je posebno teško na vrijeme uočiti.\nKada ploviš niz vjetar s 300 četvornih metara jedra, takav udar može napraviti ozbiljnu štetu.\nVeć sam na putu prema Kanarima imao priliku popravljati Batmana kirurškim instrumentima. Ne bih baš želio da mi to postane redovita večernja aktivnost!\nNaravno, najvažnije je veliko jedro na vrijeme spustiti kada uvjeti postanu opasni. Ali ako se ipak nešto dogodi, dobro je imati zamjenu.\nSamo se nadam da UPS neće odlučiti poslati paket brodom. Mogli bismo se onda negdje nasred Atlantika sresti!\nGRAĐEVINSKI RADOVI NA FLYBRIDGEU\nNastavio sam i svoj projekt zaštitnog zida koji bi trebao spriječiti da kišnica ulazi ispod jastuka na flybridgeu.\nPrvi sloj epoksija i staklenih vlakana već je napravljen, a danas sam sve dodatno zakitao.\nZid je sada smeđe boje i već počinje izgledati pristojno.\nJoš malo pa će netko pomisliti da ga je Lagoon tako tvornički napravio!\nU međuvremenu sušim brod, premještam jastuke u kabine i spremam sve što bi jaki vjetrovi mogli odnijeti.\nNe želim nakon oluje tražiti svoje jastuke po susjednim katamaranima.\nA i rad sa stakloplastikom dobro mi dođe kao nova vještina. Nikada ne znam što ću jednog dana morati popravljati negdje usred oceana.\nARGO UČI O OLUJAMA!\nDio dana proveo sam i radeći na ARGO sustavu.\nUbacujemo takozvane Storm Models, modele za prepoznavanje i analizu opasnih vremenskih situacija.\nPokušavam ga naučiti da bolje komunicira sa mnom, da mi ne pokazuje samo podatke nego i objasni što se događa.\nŽelim imati digitalnog člana posade koji će mi pomoći pratiti brod i vrijeme.\nSamo se nadam da ga neću naučiti previše pričati.\nZamislite da mi u tri ujutro počne držati predavanje o promjeni tlaka zraka!\nMorat ću mu ugraditi i naredbu: „ARGO, šuti malo, kapetan spava!”\nNaravno, ARGO je pomoć, a odluke o plovidbi i dalje donosim ja.\nNavečer ponovno otvaram PredictWind, uspoređujem prognoze i gledam kada bih mogao krenuti prema Cape Verdeu.\nZa sada je najpametnije ostati u marini i pričekati.\nI tu dolazimo do najvećeg problema cijelog dana.\nJA MORAM NAUČITI ČEKATI!\nTo mi nikada nije išlo osobito dobro.\nCijeli život navikao sam raditi, donositi odluke i rješavati probleme. Ako nešto ne ide, pronađem drugi način. Ako se pojavi prepreka, pokušam je ukloniti.\nAli s Atlantikom to baš ne funkcionira.\nNe mogu nazvati ciklonu i zamoliti je da se pomakne malo sjevernije.\nNe mogu ponuditi liker vjetru da promijeni smjer.\nA ne mogu ni poslati ARGO da pregovara s valovima.\nMogu samo pripremiti brod najbolje što znam, pratiti vrijeme i čekati pravi trenutak.\nI moram priznati da mi je to teže nego većina popravaka koje sam dosad radio na INVICTUSU.\nJer za svaki popravak postoji neki alat.\nA za nestrpljivost ga još nisam pronašao.\n⸻\nJUTARNJA MISAO\nDanas sam razmišljao koliko sam puta u životu pokušavao ubrzati nešto na što zapravo nisam mogao utjecati.\nNavikao sam da se trudom i upornošću može puno postići. I uglavnom je tako.\nAli ne baš uvijek.\nOvdje, na Tenerifeu, prvi put nakon dugo vremena imam situaciju u kojoj sam napravio gotovo sve što mogu, a ipak ne mogu krenuti dalje.\nI možda je upravo to lekcija koju trebam naučiti.\nSOMETIMES THE HARDEST PART OF MOVING FORWARD IS LEARNING TO WAIT.\nPonekad je najteži dio napredovanja naučiti čekati.\nČekanje ne mora značiti da gubimo vrijeme. Možda upravo tih nekoliko dana napravi razliku između teške i lijepe plovidbe.\nA ja ću pokušati biti strpljiv.\nINVICTUS je spremniji svakim danom, spremnici su puni, rezervni Batman putuje, a ja imam još ponešto za završiti.\nSamo se nadam da se vrijeme neće predugo kvariti.\nJer ako ostanem ovdje još dva tjedna, mogao bih potpuno renovirati katamaran!\nA onda će mi trebati još mjesec dana da pronađem gdje sam što spremio.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "8.11 08:37": "DOBRO JUTRO S INVICTUSA!\nDOK SVI ČEKAMO OLUJU, JA UČIM ŠPANJOLSKI, LIJEPIM SUP I TRENIRAM ARGO!\nJučer poluoblačan dan na Tenerifeu. More još mirno, ali marina se sve više puni. Brodovi pristižu jedan za drugim, svi traže sigurno mjesto prije dolaska oluje Brune.\nA ja imam još nekoliko poslova koje želim završiti.\nUjutro dolazi Ramón, serviser za SUP-ove. Pokušavamo spasiti onaj moj SUP koji je doslovno eksplodirao na suncu! Od velike vrućine popustili su lijepljeni spojevi.\nRamón mi pokazuje kako se to pravilno popravlja. Ljepilo se nanosi u dva sloja na obje površine, između slojeva treba pričekati nekoliko minuta, a nakon lijepljenja sve mora mirovati najmanje osam sati.\nAli najzanimljivije je kako sam uopće uspio dogovoriti servisera!\nMOJA NOVA TAKTIKA NA TENERIFEU!\nPrimijetio sam da dosta lokalnih majstora ne govori engleski. Kada im pišem na engleskom, odgovori stižu sporo ili ih uopće nema.\nI onda sam smislio taktiku!\nŠaljem im WhatsApp poruke na španjolskom, uz pomoć prevoditelja.\nOni misle da ja govorim španjolski, odmah odgovaraju i bez problema dogovorimo termin.\nTako je bilo i s Ramónom.\nTrebali ste vidjeti njegovu facu kada je došao na brod, počeo mi nešto objašnjavati na španjolskom, a ja ga samo gledam i smiješim se.\n„No hablo español!”\nČovjek me gleda kao da se pita s kim se to jučer cijelo vrijeme dopisivao!\nAli Google Translate spašava stvar. Ramón priča, mobitel prevodi, ja odgovaram, mobitel ponovno prevodi.\nNa kraju posao obavljen!\nSUP je zakrpan, nakon osam sati sušenja spremljen u skladište, a ja sam naučio još jednu korisnu vještinu.\nSada već mogu otvoriti servis za SUP-ove. Samo mi treba netko tko govori španjolski!\nMOJA BRANA NA FLYBRIDGEU JE GOTOVA!\nZavršio sam i zaštitnu pregradu koju posljednjih dana izrađujem od staklenih vlakana i epoksija.\nNjezina je zadaća spriječiti da kišnica sa stražnje strane flybridgea ulazi pod jastuke.\nJoš ću je malo doraditi da ljepše izgleda, ali već sada radi ono zbog čega sam je napravio.\nA danas stiže pravi test!\nAko nakon Brune jastuci ostanu suhi, proglašavam projekt uspješnim.\nAko ne ostanu, barem znam gdje ću provesti sljedećih nekoliko dana!\nMARINA SE PUNI, A BRUNA STIŽE!\nPokraj mene pristao je jedan stariji američki par s prekrasnom aluminijskom jedrilicom.\nNa brodu žive još od vremena Covida! Baš simpatični ljudi, s kojima je zanimljivo razgovarati o životu na moru.\nI oni su ovdje potražili zaklon od nevremena.\nA na Gran Canariji situacija je još kompliciranija.\nU Las Palmasu okupljeni su brodovi za ARC+ i ARC, velike organizirane prekooceanske plovidbe.\nARC+ je trebao krenuti upravo danas, 8. studenoga, ali zbog vremenskih uvjeta start je zasad odgođen za 11. studenoga.\nJoš gore, prema informacijama koje sam dobio, brodovi usidreni ispred Las Palmasa dobili su nalog lučkih vlasti da zbog nadolazeće oluje napuste sidrište.\nI sada se pitam kamo će svi ti ljudi?\nMarine su pune, nevrijeme dolazi, a sigurno mjesto nije lako pronaći.\nBaš nezgodna situacija. Nimalo im ne zavidim.\nJa sam barem uspio produžiti boravak u marini do 12. studenoga. Izgleda da je moja diplomacija s likerima stigla u pravi trenutak!\nDodatno sam učvrstio INVICTUS, postavio još nekoliko konopa, bolje zategnuo muringe i uklonio sve pokretne stvari s palube.\nSada čekamo.\nARGO DOBIVA DVA NOVA MODULA!\nDok čekam nevrijeme, nastavljam razvijati svoj ARGO sustav.\nPrvi modul zove se STORM.\nPovezao sam ga s radarom i pokušavam ga naučiti prepoznavati olujne oblake, njihov smjer kretanja, brzinu i vrijeme za koje bi mogli stići do INVICTUSA.\nŽelim da me na oceanu pravodobno upozori ako se iza broda razvija nešto neugodno, posebno noću kada je takve oblake teško vidjeti.\nUz radar kombinira meteorološke podatke iz više izvora i senzore na brodu: vjetar, tlak zraka, temperaturu, podatke o valovima i senzor za detekciju grmljavine.\nIdeja je da mi ARGO ne kaže samo da dolazi oluja, nego i odakle dolazi, koliko brzo, koliko je opasna i imam li vremena promijeniti kurs ili pripremiti brod.\nPolako dobivam nešto korisno, ali još ima dosta testiranja.\nDrugi modul je COLLISION, odnosno sustav za izbjegavanje sudara.\nPovezan je s AIS-om, radarom i dvama sustavima kamera s umjetnom inteligencijom, SEA.BRAIN i SEA.AI/OSCAR.\nCilj je da ARGO prati sve što se nalazi oko INVICTUSA i upozori me na moguće opasnosti.\nBrodove već dosta dobro prepoznaje, ali mali objekti još su problem.\nVolio bih da jednog dana može na vrijeme prepoznati i kita, plutajući kontejner ili nešto drugo što ne želim susresti pramcem usred Atlantika!\nA već mogu zamisliti kako će izgledati naš razgovor kada ARGO konačno nauči prepoznavati kitove.\n„Kapetane, kit ispred nas!”\n„Dobro, ARGO, koliko je udaljen?”\n„Kapetane, mogu li Vas prvo nešto pitati?”\n„Što sad, ARGO?”\n„Što biste radije, da Vas pojede morski pas ili da Vas kit uzme u usta?”\n„Pa naravno, radije kit!”\n„Razumijem, kapetane. Znači, Vi biste ipak radije kitu u usta!”\nMislim da ću mu ipak morati malo ograničiti smisao za humor. Posebno tijekom noćnih smjena na Atlantiku!\nVEČER S KEVINOM\nNavečer se nalazim s Kevinom, njegovom djevojkom i sinom.\nSutra Kevin leti za Irsku, gdje ga čeka operacija obje ozlijeđene pete.\nPopili smo nekoliko pića, dugo razgovarali i prisjetili se svega što smo zajedno radili na INVICTUSU.\nNažalost, ovaj put neće moći sa mnom preko Atlantika.\nNa rastanku smo se izgrlili i obećali da ćemo se ponovno vidjeti s druge strane velike bare.\nNadam se da će se što prije oporaviti.\nJUTARNJA MISAO\nDok sam navečer gledao marinu punu brodova, razmišljao sam kako svi ovdje imamo svoje planove.\nNetko želi što prije krenuti preko oceana, netko mora kući, netko čeka bolje vrijeme, a netko, poput Kevina, mora potpuno promijeniti planove zbog jedne nesretne sekunde.\nI onda dođe oluja i podsjeti nas koliko malo toga zapravo možemo kontrolirati.\nYOU CAN’T CONTROL THE STORM, BUT YOU CAN PREPARE FOR IT.\nNe možeš kontrolirati oluju, ali možeš se za nju pripremiti.\nTo vrijedi za more, ali i za život.\nNe znam kakvo će vrijeme donijeti sljedeći dan, ali mogu napraviti sve što je u mojoj moći da budem spreman.\nA sada je sedam sati ujutro na Tenerifeu.\nKanarski otoci su jedan sat iza Hrvatske. Dok je ovdje 7:00, kod vas je već 8:00.\nNoćas je palo malo kiše, ali ništa posebno.\nPrema najavama, Bruna bi trebala stići između 8 i 11 sati po našem vremenu.\nINVICTUS je privezan, dodatni konopi su postavljeni, muringi zategnuti, sve što se moglo odletjeti spremljeno je.\nMarina je puna brodova, svi smo u iščekivanju.\nSada još samo čekamo da vidimo što će nam Atlantik danas prirediti.\nI koliko dobro drži moja nova brana na flybridgeu!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi"};

const desktop=()=>matchMedia("(min-width:861px)").matches;
function snap(node){const n=node.cloneNode(true);n.querySelectorAll("iframe").forEach(f=>f.remove());n.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));return n;}
// list se okreće oko hrpta: naprijed desna stranica preko na lijevu, natrag obrnuto
function turnLeaf(dir,oldSp){
  const sp=book.querySelector(".spread");if(!sp)return;
  const tgt=sp.querySelector(dir>0?".pr":".pl"),oth=sp.querySelector(dir>0?".pl":".pr");
  const h=Math.min(tgt.offsetHeight,window.innerHeight+200);
  const box=(el,d)=>{d.style.left=el.offsetLeft+"px";d.style.top=el.offsetTop+"px";d.style.width=el.offsetWidth+"px";d.style.height=h+"px";};
  const under=document.createElement("div");under.className="under";box(oth,under);under.appendChild(snap(oldSp.querySelector(dir>0?".pl":".pr")));
  const L=document.createElement("div");L.className="leaf "+(dir>0?"fwd":"bwd");box(tgt,L);
  const f=document.createElement("div");f.className="face front";f.appendChild(snap(oldSp.querySelector(dir>0?".pr":".pl")));
  const b=document.createElement("div");b.className="face back";b.appendChild(snap(oth));
  L.append(f,b);sp.append(under,L);
  L.addEventListener("transitionend",()=>{L.remove();under.remove();},{once:true});
  setTimeout(()=>{L.remove();under.remove();},1000);
  requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add("go")));
}

function render(dir){
  const oldSp=book.querySelector(".spread");
  const html=cur===0?cover():dayPage(cur-1);
  book.innerHTML=html;mountPlayer();
  pg.innerHTML=cur===0?"<b>Naslovnica</b>":`<b>${DAYS[cur-1].d}. ${MON[DAYS[cur-1].m]}</b> · list ${cur} / ${PAGES-1}`;
  prevs.forEach(b=>b.disabled=cur===0);nexts.forEach(b=>b.disabled=cur===PAGES-1);
  document.getElementById("jump").value=String(cur);
  const h=cur===0?"":"#dan-"+DAYS[cur-1].key;
  if(location.hash!==h)history.replaceState(null,"",h||location.pathname);
  if(dir&&oldSp&&!reduced()){
    if(desktop())turnLeaf(dir,oldSp);
    else book.firstElementChild.classList.add(dir>0?"slide-next":"slide-prev");
  }
}
function go(n,keepSel){n=Math.max(0,Math.min(PAGES-1,n));if(n===cur)return;const dir=Math.sign(n-cur);cur=n;if(!keepSel)sel=0;
  if(dir&&window.scrollY>book.offsetTop)window.scrollTo({top:Math.max(0,book.offsetTop-10),behavior:"auto"});
  render(dir);}

prevs.forEach(b=>b.onclick=()=>go(cur-1));nexts.forEach(b=>b.onclick=()=>go(cur+1));
document.addEventListener("keydown",e=>{if(document.getElementById("toc").open)return;if(e.target.closest("select,input"))return;
  if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
book.addEventListener("click",e=>{const s=e.target.closest("[data-sel]");if(s){sel=+s.dataset.sel;render(0);if(!desktop()){const m=book.querySelector(".media");if(m)m.scrollIntoView({behavior:"smooth",block:"start"});}return;}
  const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return;}if(e.target.closest("[data-toc]"))openToc();});
// povlačenje prstom
let sx=null,sy=null;book.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
book.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(cur+(dx<0?1:-1));},{passive:true});

// skok na dan
const jump=document.getElementById("jump");
jump.innerHTML=`<option value="0">Naslovnica</option>`+DAYS.map((D,i)=>`<option value="${i+1}">${D.d}. ${D.m}. ${D.y}. · ${esc(D.ents[0].place)}</option>`).join("");
jump.onchange=()=>go(+jump.value);

// sadržaj
const toc=document.getElementById("toc");
function openToc(){toc.querySelectorAll(".cur").forEach(x=>x.classList.remove("cur"));toc.showModal();const el=toc.querySelector(`[data-p="${cur}"]`);if(el){el.classList.add("cur");el.scrollIntoView({block:"center"});}}
document.getElementById("tocBtn").onclick=openToc;document.getElementById("tocClose").onclick=()=>toc.close();
toc.addEventListener("click",e=>{if(e.target===toc)toc.close();const b=e.target.closest("[data-p]");if(b){toc.close();go(+b.dataset.p);}});
document.getElementById("tocList").innerHTML=LEGS.map(L=>{const ds=DAYS.map((D,i)=>[D,i]).filter(([D])=>D.legs[0]===L.id);if(!ds.length)return"";
  return `<h3>${esc(L.n)}<small>${esc(L.r)}</small></h3>`+ds.map(([D,i])=>{const t=D.ents.find(e=>e.title!=="Jutarnja misao")||D.ents[0];
    return `<button type="button" data-p="${i+1}"><span class="td">${D.d}. ${D.m}.</span><span class="tt">${esc(t.title)}</span><span class="tn">${D.ents.length}×</span></button>`;}).join("");}).join("");
document.querySelector(".brand").onclick=e=>{e.preventDefault();go(0);};

// početna stranica iz adrese
function fromHash(){const m=location.hash.match(/^#dan-(\d{4}-\d{2}-\d{2})$/);const i=m?DAYS.findIndex(D=>D.key===m[1]):-1;cur=i>=0?i+1:0;sel=0;render(0);}
window.addEventListener("hashchange",fromHash);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur>0)mountPlayer();},400);});
fromHash();
</script>
</body>
</html>
