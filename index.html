orenost, srdačnost, osmijeh i taj neki opušteni način života.\nMAROKO, ZA SADA SI ME OSVOJIO PUNIM SRCEM!\nPOSLJEDNJE PRIPREME ZA ATLANTIK!\nVraćam se na INVICTUS.\nJoš malo rada na ARGO sustavu, provjera opreme i pripreme za plovidbu.\nPunim spremnike vode.\nPospremam stvari koje bi se mogle pomicati tijekom plovidbe.\nProvjeravam navigaciju, vremenske prognoze i sve što će mi trebati sljedećih nekoliko dana.\nPosebno pratim valove, njihov period i smjer.\nJer nije uvijek najveći problem koliko su valovi visoki.\nPuno je važnije kako dolaze, koliko su česti i pod kojim kutom udaraju u brod.\nA nakon svih oluja na sjevernom Atlantiku, prognoze su se posljednjih dana stalno mijenjale.\nZato sam i odgodio polazak nekoliko puta.\nNema smisla nepotrebno mučiti brod i sebe ako mogu pričekati povoljnije uvjete.\nSada se napokon otvara mogućnost za nastavak putovanja.\nIspred mene nekoliko dana otvorenog Atlantika.\nA INVICTUS mora biti spreman.\nA ONDA — MALI NOĆNI GOST!\nI taman dok završavam ovu priču, na INVICTUS se pojavljuje mala mačkica!\nBez najave.\nBez rezervacije.\nJednostavno se prošetala po kokpitu i ušla u salon!\nGledam je kako znatiželjno istražuje brod.\nMalo smo se pomazili, dao sam joj nešto za pojesti, a ona je zadovoljno prihvatila gostoprimstvo.\nNakon kratkog druženja odlučila je nastaviti svojim putem.\nBez putovnice.\nBez carine.\nBez izlaznih dokumenata!\nA ja sutra u sedam ponovno moram na carinu!\nIzgleda da neki ipak puno jednostavnije putuju svijetom.\nLaku noć, mala prijateljice!\nSUTRA — 24. LISTOPADA!\nU 07:00 moram prebaciti INVICTUS na carinski ponton.\nMarokanske službe obavit će posljednji pregled broda i izlazne formalnosti.\nAko sve prođe prema planu i vremenski uvjeti dopuste, oko 08:00 napuštam Tangier i krećem prema Kanarskim otocima!\nNakon gotovo tri mjeseca putovanja od Hrvatske, ovo je jedan od onih trenutaka koje sam dugo čekao.\nMediteran je iza mene.\nIspred mene Atlantik.\nNadam se povoljnim vjetrovima, mirnijim valovima i, naravno, orkama koje će ovaj put biti samo znatiželjni promatrači!\nADIO MAROKO!\nHvala ti na prekrasnim danima, srdačnim ljudima, dobroj hrani, odličnom čaju, smiješnim situacijama i svim iznenađenjima!\nSigurno ću te pamtiti!\nA sada…\nATLANTIK, STIŽEM!\n⸻\nJUTARNJA MISAO\nJučerašnji susret s Igorom podsjetio me na nešto zanimljivo.\nPonekad ljudi imaju velik utjecaj na naš život, a da toga nisu ni svjesni.\nGodinama sam gledao njegove videozapise, slušao iskustva s putovanja i učio iz njegovih savjeta.\nNeke stvari koje sam vidio kod njega danas su dio mojeg INVICTUSA.\nOve zime prvi smo se put osobno upoznali.\nTada sam još pripremao brod, planirao putovanje i razmišljao o svemu što me čeka.\nA jučer, nekoliko mjeseci kasnije, ponovno sjedimo zajedno.\nSamo ovaj put u Africi!\nI sada mu mogu pokazati kako su neke od tih ideja zaživjele u stvarnoj plovidbi.\nTo me podsjetilo i na moj posao.\nTijekom godina predavao sam, educirao kolege i dijelio svoja iskustva iz oralne kirurgije i implantologije.\nPonekad mi se javi netko koga nisam vidio godinama i kaže da mu je neki moj savjet ili predavanje pomoglo u karijeri.\nA ja se toga možda više ni ne sjećam.\nI tada shvatim koliko je važno dijeliti znanje.\nJer nikada ne znaš kome će baš tvoja ideja, iskustvo ili savjet jednog dana pomoći.\nMožda nekome tko tek počinje.\nMožda nekome tko se priprema za veliki izazov.\nA možda nekome tko upravo oprema svoj brod za put oko svijeta.\nSOMETIMES THE PEOPLE WHO INSPIRE US ARE CLOSER THAN WE THINK.\nPonekad su ljudi koji nas inspiriraju bliže nego što mislimo.\nI zato mi je jučerašnji susret bio posebno drag.\nNe samo zato što sam ponovno sreo izvrsnog nautičara.\nNego zato što sam imao priliku još jednom razgovarati s čovjekom od kojeg sam mnogo naučio.\nA možda je upravo to jedna od najljepših stvari na ovom putovanju.\nNikada ne znaš koga ćeš susresti iza sljedećeg ugla.\nIli tko će se jednoga dana pojaviti ispred tvojeg broda, negdje na drugom kontinentu.\nA za Igora imam neki poseban osjećaj.\nZNAM DA ĆEMO SE NAS DVOJICA JOŠ NEGDJE SRESTI!\nMožda na drugoj strani Atlantika.\nMožda na Pacifiku.\nMožda u nekoj maloj luci za koju danas još ni ne znam da postoji.\nI veselim se tom susretu!\nA danas?\nJoš jedno posljednje jutro u Tangieru.\nINVICTUS je spreman za novo poglavlje.\nIspred mene Atlantik, Kanarski otoci i još toliko toga što tek trebam naučiti i doživjeti.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "24.10 16:31": "Kratko javljanje s Atlantskog oceana!\n Oko mene samo more i horizont. Batman na pola, glavno jedro potpuno otvoreno, a pramac INVICTUSA prema Kanarima. Prekrasan sunčan dan, štapovi izbačeni… Jedra love vjetar, a ja se nadam da ću uloviti nešto za večeru.\n     Sažmi", "24.10 19:51": "Na jednoj strani veliki, prekrasni Mjesec polako se diže. Na drugoj sunce tone u Atlantik. A ja između njih, slušam samo šum oceana i zvuk svog broda.\nNe govorim ništa. Šteta bi bilo prekinuti ovakav trenutak.", "25.10 07:31": "Dobro jutro s INVICTUSA!\nTHE JOURNEY DOESN’T END WHEN SOMETHING BREAKS. IT TEACHES YOU HOW TO CONTINUE.\nATLANTIK — PRVI DAN I VEĆ PRVA AVANTURA!\nJučer se budim oko šest ujutro.\nINVICTUS je spreman za polazak. Spremnici puni, oprema posložena, prognoze provjerene.\nNakon nekoliko dana u Tangieru konačno je došao trenutak koji sam toliko čekao.\n07:00 — POSLJEDNJA MAROKANSKA CARINA!\nDižem vezove i prebacujem INVICTUS na carinski ponton.\nPotpuna bonaca. Marinero mi pomaže i pristajanje prolazi bez problema.\nU sedam dolazim na carinu.\nDočekuju me policajac i carinik iz noćne smjene.\nAli izgleda da im se baš ne žuri!\nKažu da pričekam.\nSedam i pol.\nOsam.\nNišta.\nOko 08:15–08:30 konačno dolaze trojica službenika.\nUlaze u brod, pregledavaju salon, otvaraju ormariće i kutije.\nDesetak minuta i gotovo!\nJa već pripremio dokumente, a njih papiri gotovo uopće ne zanimaju.\nMalo razgovora, pozdravljanje i napokon…\nADIO MAROKO!\nMotori se pale.\nINVICTUS napušta Tangier.\nGIBRALTARSKI TJESNAC — JOŠ JEDNOM!\nPrekrasan sunčan dan.\nDok izlazim iz marine, snimam posljednje kadrove Tangiera, ogromne pješčane plaže, šetnice i grada koji me toliko oduševio.\nA onda ponovno Gibraltarski tjesnac.\nTankeri, teretni brodovi, morske struje i promet koji nikada ne prestaje.\nDržim se bliže marokanskoj obali, gdje je to sigurno, jer upravo je ovo područje poznato po susretima s orkama.\nSjećate se odlomljenog kormila katamarana Bali 5.5 koje sam vidio u nautičkoj trgovini?\nE pa sada prolazim područjem u kojem je zabilježena ozbiljna interakcija s orkama samo sedam milja od Tangiera!\nGledam more i mislim si…\nDrage moje orke, danas bih stvarno volio da se samo pozdravimo iz daljine!\nCAP SPARTEL — POZDRAV AFRICI!\nProlazim pokraj poznatog svjetionika Cap Spartel.\nPrije nekoliko dana stajao sam gore i gledao prema Atlantiku, razmišljajući kako će izgledati trenutak kada ovuda prođem svojim brodom.\nA sada sam ovdje.\nINVICTUS plovi ispod svjetionika.\nGore turisti gledaju prema moru.\nA ja gledam prema njima.\nKakav osjećaj!\nNastavljam uz marokansku obalu.\nDugačke pješčane plaže nižu se jedna za drugom.\nSunce, plavo more i Afrika koja polako ostaje iza mene.\nKONAČNO — JEDRENJE!\nPolako dolazi vjetar.\nGasim motor i okrećem prema Kanarskim otocima.\nAli još ne odlazim naglo daleko od obale.\nŽelim postupno izaći prema pučini, prateći uvjete i područja mogućih susreta s orkama.\nA kada vjetar počinje jačati…\nPOČINJE MOJA MALA JEDRILIČARSKA LABORATORIJA!\nOdlučujem isprobati gotovo sve kombinacije jedara koje imam.\nGlavno jedro i jib.\nZatim Batman na 50%, moj Half Code Zero.\nPa Batman potpuno otvoren.\nBatman s glavnim jedrom.\nBatman bez glavnog jedra.\nPa ponovno polovica Batmana.\nRazličiti kutovi prema vjetru, različite brzine, različite konfiguracije.\nZašto sve to radim?\nJer ARGO AI sada bilježi podatke i pomaže mi izraditi vlastitu polarnu krivulju INVICTUSA!\nŽelim točno znati pri kojoj jačini i kutu vjetra moj brod najbolje plovi i s kojim jedrima.\nNe želim se oslanjati samo na tvorničke tablice Lagona.\nMoj INVICTUS, potpuno opremljen za put oko svijeta, ima gotovo 24 tone i ponaša se drukčije od standardnog broda.\nA rezultati?\nODLIČNI!\nPri samo 12–13 čvorova vjetra s krme postižem oko sedam čvorova brzine!\nZa ovako težak katamaran to je jako dobar rezultat.\nA Batman ponovno pokazuje zašto mi je toliko važan.\nRIBOLOV — NULA BODOVA!\nNaravno, izbacujem i štapove.\nMožda danas napokon nešto ulovim!\nČekam.\nGledam.\nI onda — nešto je na udici!\nPovlačim…\nPLASTIČNA VREĆICA!\nNe samo da nisam ulovio ribu nego sam usput izgubio i jednu varalicu!\nDakle, ribolovna bilanca prvog dana Atlantika:\nRibe: 0.\nVrećice: 1.\nIzgubljene varalice: 1.\nOdličan početak!\nSUNCE NA JEDNOJ, MJESEC NA DRUGOJ STRANI!\nPolako se spušta večer.\nI događa se nešto prekrasno.\nS jedne strane Atlantika sunce polako nestaje u moru.\nA na drugoj strani pojavljuje se veliki mjesec.\nMore obasjano nježnim svjetlom.\nSamo šum valova, zvuk broda i beskrajno plavetnilo koje polako prelazi u tamu.\nJedan od onih trenutaka zbog kojih sam krenuo na ovo putovanje.\nPripremam INVICTUS za noćnu plovidbu.\nInstrumenti, navigacija, svjetla, sve spremno.\nU početku jedrim s glavnim i prednjim jedrom.\nAli vrijeme je lijepo, vjetar povoljan, pa odlučujem ponovno otvoriti Batmana.\nI INVICTUS ponovno lijepo ubrzava.\nA ONDA — PRVI PROBLEM NA ATLANTIKU!\nTijekom noći valovi postupno postaju veći.\nBatman se sve više pomiče gore-dolje, posebno njegov donji dio.\nI u jednom trenutku primjećujem da je donji rub jedra zapeo za vreću u kojoj držim jedra.\nNažalost, dolazi do oštećenja!\nDonji porub Batmana se poderao, a iz njega je izašla mala bijela špagica koja je dio konstrukcije ruba jedra.\nPA DOBRO, ZAR BAŠ PRVU NOĆ?!\nOdmah zatvaram Batmana.\nNe želim riskirati da se oštećenje proširi.\nNastavljam ploviti s glavnim i prednjim jedrom.\nAli razlika je velika.\nS Batmanom sam postizao oko sedam čvorova.\nSada brzina pada na približno pet.\nA to na putovanju od pet ili šest dana može značiti puno!\nBatman je moje najvažnije jedro za slabe vjetrove niz krmu.\nS njim bih, u idealnim uvjetima, možda mogao stići do Kanara za četiri dana.\nBez njega realnije računam na šest.\nI sada, već prve noći, ostajem bez njega.\nMoram priznati da me to malo iznerviralo.\nAli što mogu?\nNoć je.\nBrod plovi.\nSve ostalo funkcionira.\nA kada svane, pregledat ću oštećenje i vidjeti mogu li ga privremeno popraviti na brodu.\nVeć ozbiljno razmišljam da bih za ovakva putovanja trebao imati i rezervnog Batmana.\nJer sve više shvaćam koliko mi to jedro znači.\n⸻\nJUTARNJA MISAO\nJučer sam napokon krenuo na Atlantik.\nNakon mjeseci priprema, tisuća prijeđenih milja i bezbroj sitnih popravaka, bio je to trenutak koji sam dugo čekao.\nPrekrasan dan.\nOdličan vjetar.\nINVICTUS plovi fantastično.\nSunce zalazi, mjesec izlazi, a ja uživam u osjećaju da sam napokon na oceanu.\nI onda, već prve noći, poderano jedro.\nMoram priznati da mi nije bilo svejedno.\nNe toliko zbog samog popravka.\nNego zato što znam koliko mi Batman znači za ovu plovidbu.\nAli dok sam nastavljao jedriti s glavnim i prednjim jedrom, razmišljao sam o jednoj stvari.\nKoliko često očekujemo da će, nakon svih priprema, stvari napokon ići upravo onako kako smo zamislili?\nUložimo vrijeme.\nNovac.\nZnanje.\nTrud.\nSve provjerimo.\nI onda se dogodi nešto što nismo planirali.\nTo sam mnogo puta doživio i u poslu.\nMožeš savršeno pripremiti operaciju, imati najbolju opremu i iskusan tim.\nAli uvijek postoji mogućnost da se pojavi nešto neočekivano.\nI tada nije najvažnije što je pošlo po zlu.\nVažno je kako ćeš reagirati.\nJučer nisam mogao popraviti Batmana usred noći.\nAli mogao sam ga sigurno zatvoriti, promijeniti konfiguraciju jedara i nastaviti plovidbu.\nSporije, ali nastaviti.\nTHE JOURNEY DOESN’T END WHEN SOMETHING BREAKS. IT TEACHES YOU HOW TO CONTINUE.\nPutovanje ne završava kada se nešto pokvari. Ono te uči kako nastaviti dalje.\nI možda je upravo to jedna od stvari koje najviše volim na moru.\nOno te stalno podsjeća da ne možeš kontrolirati baš sve.\nAli možeš učiti, prilagođavati se i donositi odluke.\nDanas me čeka pregled Batmana.\nMožda ću ga uspjeti popraviti.\nMožda ću do Kanara morati bez njega.\nAli jedno je sigurno.\nINVICTUS I DALJE PLOVI PREMA KANARIMA!\nA Batman?\nNadam se da ćemo se uskoro pomiriti, jer mi već nedostaje onih dodatnih dva čvora!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "25.10 10:44": "Batman je opet u akciji!\nUsred oceana, između Afrike i Kanara, malo sam se vratio kirurgiji — ovaj put pacijent je bilo jedro.\n Spustio sam Batmana, uzeo kirurške instrumente i konac koji sam našao na brodu pa pokrpao poderotinu. Ponovno je gore i radi perfektno! Vjerujem da će izdržati do Kanara, gdje ga čeka pošteniji popravak.\nSunčan dan, a oko mene puni horizont tankera. Dolaze sa svih strana i jako su brzi, pa pogled stalno kruži.\nS vjetrom odostraga od svega 8–10 čvorova, Batman vuče INVICTUS brzinom od 4,5 do 5,5 čvorova. Baš za ovakve lagane vjetrove je i napravljen. Zašiven, ponovno leti — a ja nastavljam prema Kanarima.\n     Sažmi", "26.10 07:00": "Dobro jutro s INVICTUSA!\nKNOWLEDGE IS NEVER WASTED. ONE DAY, IT WILL HELP YOU IN WAYS YOU NEVER EXPECTED.\nATLANTIK — DRUGI DAN, OPERACIJA BATMAN I 70 DELFINA!\nJučer sam vam pisao kako mi se već prve noći na Atlantiku dogodilo nešto što me prilično pogodilo.\nPODERAO SAM BATMANA!\nZa one koji ne znaju, Batman je moje najveće i najvažnije jedro za plovidbu niz vjetar. Ima oko 320 m², izrađen je od posebnog laganog materijala i namijenjen slabijim vjetrovima koji dolaze odostraga.\nProizvodi ga slovenska tvrtka OneSails, iza koje stoji Željko Perović, poznatiji kao Huck, jedan od naših najboljih jedriličara.\nBio sam među prvima u Europi koji su dobili to jedro. Čekao sam ga mjesecima!\nA zašto mi toliko znači?\nZato što je Batman moj TURBO!\nKada ga otvorim, INVICTUS sa svojih gotovo 24 tone jednostavno poleti. Pri samo devet čvorova vjetra s krme postiže šest do sedam čvorova brzine, a pri dvadesetak čvorova vjetra može juriti i 9–9,5 čvorova!\nZa ovako težak katamaran to je fantastično.\nI onda, već prve noći…\nZbog velikih valova i poniranja broda donji rub Batmana zapinje za metalni dio vreće u kojoj ga spremam. Jedro se rasparalo na gotovo tri metra, a uzica koja zateže njegov rub potpuno je izašla van.\nMorao sam ga odmah zatvoriti kako se oštećenje ne bi proširilo.\nZamjenjujem ga malim prednjim jedrom, jibom, ali nije to isto. Pogotovo kada vjetar dolazi odostraga.\nBrzina pada, a ja cijelu noć razmišljam kako ću popraviti svoje najvažnije jedro.\nOPERACIJA BATMAN — USRED ATLANTIKA!\nDolaze prvi zraci zore.\nVrijeme je za akciju!\nAli prije popravka moram napraviti nešto prilično nezgodno. Otvoriti cijelog Batmana od 320 m² i spustiti ga na palubu, dok brod plovi na otvorenom oceanu!\nZamislite pokušaj kontroliranja ogromnog komada laganog materijala koji vjetar stalno pokušava odnijeti, dok brod poskakuje na valovima.\nA najvažnije je da ništa ne završi u moru.\nI tada se sjetim savjeta Igora Stropnika!\nSjećate se Igora, slovenskog jedriličara koji me posjetio u Tangieru?\nJednom mi je objasnio odličan trik za rukovanje velikim jedrima.\nOtvoriti malo prednje jedro, jib, i iza njega raditi s Batmanom!\nJib djelomično zaklanja Batmana od vjetra i olakšava spuštanje i podizanje ogromnog jedra.\nOdlučujem pokušati.\nOtvaram jib i iza njega postupno spuštam Batmana. Nije jednostavno, ali Igorov trik funkcionira!\nNakon dosta borbe uspijevam ga spustiti na palubu.\nHVALA, IGORE!\nŠteta je velika, ali izgleda popravljivo.\nOdmah šaljem fotografije i poruke Željku Peroviću iz OneSailsa.\nNedjelja je, ali čovjek mi odmah odgovara!\nHVALA, ŽELJKO!\nDaje mi savjete kako popraviti jedro. Misli da bi specijalno lijepljenje moglo biti dovoljno.\nAli gledam taj rasparani rub i nekako nisam uvjeren.\nTri metra oštećenja, ogromno jedro i velika opterećenja…\nMislim da to ipak treba dodatno ojačati.\nI tada mi pada na pamet nešto zanimljivo.\nPA JA SAM KIRURG!\nNa INVICTUSU imam gotovo malu kiruršku ambulantu!\nZa put oko svijeta ponio sam ozbiljnu medicinsku opremu, kirurške instrumente, materijale za šivanje i zbrinjavanje rana.\nPripremio sam se i za puno ozbiljnije situacije — od otvorenih prijeloma kostiju, velikih posjekotina i dubokih rana do opeklina i drugih hitnih stanja.\nJer kada si usred oceana, nekoliko dana udaljen od najbliže bolnice, moraš biti spreman barem stabilizirati ozbiljnu ozljedu dok ne dobiješ stručnu pomoć.\nA sada, nakon više od 25 godina kirurgije, moja medicinska oprema dobiva potpuno novu namjenu!\nVadim kirurški držač igle, pripremam konac i započinjem operaciju!\nPacijent?\nBATMAN — 320 KVADRATA!\nMoram priznati da je vrlo zahvalan pacijent.\nNe žali se, ne krvari, ne traži anesteziju i, što je najbolje, ne postavlja pitanja koliko će zahvat trajati!\nPolako šivam oštećeni rub, učvršćujem materijal i dodatno ga osiguravam posebnom ljepljivom trakom za jedra.\nNakon dosta posla operacija je završena.\nPACIJENT JE PREŽIVIO!\nSada samo još treba vidjeti hoće li izdržati povratak na posao!\nBATMAN IS BACK IN THE GAME!\nPonovno koristim Igorov trik. Otvaram jib, a iza njega polako podižem Batmana.\nJedro je djelomično zaštićeno od vjetra i puno ga je lakše kontrolirati.\nI funkcionira!\nBatman se podiže, otvara, zatvaram jib i vjetar ponovno puni ogromno jedro.\nINVICTUS ubrzava!\nGledam popravljeni dio.\nDrži!\nKakav osjećaj! Nakon cijele noći razmišljanja i nekoliko sati rada, moj turbo ponovno radi!\nSTARLINK — INTERNET SKUPLJI OD GORIVA!\nNapokon malo doručka, pregled prognoza, kursa i navigacije.\nRibarski štap ponovno je u vodi. Naravno, ribe niotkuda!\nSlažem video za društvene mreže, a onda pogledam potrošnju interneta.\nPA DOBRO, JE LI OVO NORMALNO?!\nStarlink me na kopnu i blizu obale stoji oko 200 € mjesečno za neograničen promet.\nAli čim se udaljim više od 12 nautičkih milja od obale, moram prijeći na oceanski način rada.\nA tamo je cijena oko 5,20 € po gigabajtu!\nJučer sam potrošio gotovo 10 GB.\nDakle, više od 50 € interneta u jednom danu!\nAko ovako nastavim, do Kanara će me internet stajati više nego hrana, gorivo i marina zajedno!\nMorat ću malo smanjiti doživljaje. Ili barem prestati gledati videozapise u visokoj rezoluciji!\nTANKERI — PRAVILA SU JEDNO, OCEAN DRUGO!\nDan prolazi uz jedrenje i stalno praćenje prometa.\nOgromni tankeri i teretni brodovi prolaze u blizini. Neki dugi 250–350 metara, brzi 10, 15, pa i više od 20 čvorova!\nNa otvorenom oceanu brzo naučiš da se ne isplati raspravljati tko ima prednost.\nJedrilica pod jedrima u mnogim situacijama ima prednost, ali postoje važna izuzeća, a najveći brodovi ne mogu jednostavno promijeniti kurs kao ja.\nPratim radar, AIS i kursove drugih brodova, na vrijeme procjenjujem situaciju i izbjegavam bliske susrete.\nZa odmor koristim svoj sustav alarma svakih 20 minuta, kako bih redovito provjeravao okolinu. Naravno, ni radar ni AIS ne vide baš sve, a alarm nije zamjena za stalno motrenje.\nNema dugog spavanja.\nAli to je dio solo plovidbe.\nA ONDA — 70 DELFINA!\nOko 13:00 događa se nešto nevjerojatno!\nPrvo nekoliko dupina.\nPa još nekoliko.\nA onda…\nCIJELO MORE OKO INVICTUSA PUNO JE DELFINA!\nProcjenjujem da ih ima između 50 i 70!\nVeliki, mali, čak i nekoliko mladunaca!\nPlivaju ispred pramaca, skaču iz mora, rone ispod broda i ponovno izranjaju.\nI kao da uživaju u utrci s INVICTUSOM!\nA izgleda da i oni vole Batmana!\nGotovo dva sata ostaju uz mene.\nOdmah vadim ribarski štap iz mora da se slučajno neki od njih ne zakači.\nSjedim i gledam ih.\nNevjerojatno koliko su brzi, elegantni i razigrani. Ponekad se okrenu prema meni, kao da me promatraju, a onda ponovno ubrzaju i nestanu ispod pramca.\nJedan od najljepših trenutaka ovog putovanja.\nARGO AI — INVICTUS UČI SAM SEBE!\nU međuvremenu nastavljam razvijati ARGO.\nSvaki put kada promijenim konfiguraciju jedara, označim što je otvoreno.\nBatman FULL, Batman 50% — Half Code Zero, Batman s glavnim jedrom, jib s glavnim jedrom, glavno jedro skraćeno na prvi, drugi ili treći reef…\nARGO sve to povezuje s podacima o vjetru, kutu, valovima i brzini broda.\nNa taj način izrađujem vlastitu polarnu krivulju INVICTUSA.\nZašto mi je to toliko važno?\nZato što moj brod nije standardni Lagoon 46 iz kataloga. Ima gotovo 24 tone, dodatnu opremu i posebna jedra.\nŽelim znati kako se stvarno ponaša u različitim uvjetima.\nPrimjerice, PredictWind mi za ovu rutu izračunava približno šest do sedam dana plovidbe.\nA ja vjerujem da s Batmanom, uz povoljne uvjete, mogu stići za oko pet dana!\nTo je ogromna razlika!\nU samo dva dana ARGO je prikupio tisuće stvarnih podataka i nastavlja učiti.\nNaravno, trebat će još dosta plovidbe u različitim uvjetima da bi moja polarna krivulja bila pouzdana, ali rezultati zasad izgledaju obećavajuće.\nA Batman?\nPopravak za sada odlično drži.\nI sve ozbiljnije razmišljam da bih trebao imati rezervno takvo jedro.\nNOVI EKSPERIMENT — SMANJIVANJE BATMANA!\nPredvečer odlučujem isprobati još nešto.\nBatman je izrađen od vrlo laganog materijala i proizvođač ga izvorno nije predvidio za klasično reefanje.\nAli Peter Bresnan iz OneSails Mallorce rekao mi je da su u novijim testiranjima isprobavali djelomično smanjivanje površine.\nOtprilike 20%, odnosno deset okretaja.\nOdlučujem pokušati.\nPostupno smanjujem Batmana. Donji dio jedra namata se i ostaje ispod otvorenog dijela.\nŠaljem Peteru fotografije i video.\nOn potvrđuje da konfiguracija izgleda pravilno.\nA rezultat?\nINVICTUS SE SMIRUJE!\nManje poskakivanja, manje pomicanja jedra, a brzina i dalje oko sedam čvorova!\nOvo bi moglo biti odlično rješenje za noćnu plovidbu, ako se pokaže pouzdanim i pri promjenama vjetra i valova.\nSUNCE, MJESEC I OCEAN!\nPonovno prekrasan zalazak sunca.\nAtlantik mirniji, nebo obasjano toplim bojama, a na drugoj strani ponovno izlazi veliki mjesec.\nGotovo pun.\nDaje dovoljno svjetla da vidim more oko sebe.\nPripremam INVICTUS za noć. Svi instrumenti prelaze u prigušene crvene nijanse.\nNa flybridge donosim jastuke i pokrivače za kratke odmore između provjera.\nOblačim topliju odjeću jer noći na Atlantiku znaju biti prilično svježe.\nBrod lijepo plovi.\nBatman radi.\nMore je prekrasno.\nLIJEPO JE BITI NA OCEANU!\nPROPELERI KOJI PJEVAJU KITOVIMA!\nIza INVICTUSA cijeli dan vučem dva hidrogeneratora SeaWatt.\nNjihovi propeleri okreću se u vodi i proizvode dodatnu električnu energiju.\nTo mi je posebno važno kada je otvoren Batman, moje ogromno jedro od 320 m², koje zasjenjuje velik dio solarnih panela.\nAli ti propeleri imaju jednu zanimljivu osobinu.\nPri određenim brzinama i valovima počinju proizvoditi neobičan zvuk.\nKao da neki kit pjeva iza broda!\nPonekad je zvuk toliko glasan da mi ide na živce.\nAli možda to i nije tako loše!\nSjećam se priča starih mornara koji su iza jedrilica znali vući praznu bocu sa žličicom unutra.\nZveckanje žličice trebalo je upozoriti kitove da se brod približava.\nNe znam koliko je ta metoda stvarno učinkovita, ali ideja je zanimljiva.\nJer sudar s kitom nije nikakva šala!\nJEDRILICA OD 55 STOPA POTONULA NAKON SUDARA S KITOM?!\nPrije nekoliko dana čitao sam o slučaju jedrilice duge oko 55 stopa koja je, prema informacijama koje sam dobio, potonula nakon sudara s kitom tijekom plovidbe prema Francuskoj Polineziji.\nJoš nisam uspio potvrditi sve detalje tog događaja, ali sama mogućnost takvog sudara vrlo je stvarna.\nZamislite!\nVelika oceanska jedrilica, opremljena za daleke plovidbe, i jedan nesretan susret s golemom morskom životinjom može izazvati ozbiljna oštećenja trupa.\nKit ne mora biti agresivan niti namjerno napasti brod. Može izroniti ispod njega ili se sudariti s trupom dok se kreće blizu površine.\nA jedrilice koje plove bez motora, poput mojeg INVICTUSA, mogu biti vrlo tihe.\nZato me takve priče posebno zanimaju.\nNADAM SE DA MOJI PROPELERI IMAJU JOŠ JEDNU FUNKCIJU!\nMožda će njihovo neprestano pjevanje barem upozoriti nekog znatiželjnog kita da INVICTUS prolazi.\nNaravno, nemam nikakav dokaz da to stvarno djeluje.\nAli ako već moram slušati njihovo zavijanje cijelu noć, neka barem postoji neka korist od toga!\nDragi kitovi, more je dovoljno veliko za sve nas.\nJa ću paziti na vas, a vi, molim vas, malo pripazite na moj INVICTUS!\nJOŠ JEDNO IZNENAĐENJE — CALIMA!\nI dok ovo pišem, usred noći, stiže poruka moje prijateljice.\nNa Kanarskim otocima najavljuje se Calima — saharska prašina koju vjetrovi nose preko Atlantika.\nPa dobro, je li moguće?!\nPrvo orke ispred Tangiera.\nPa poderani Batman već prve noći.\nPa tankeri i kitovi.\nA sada me na odredištu možda čeka i saharska prašina!\nIzgleda da Atlantik ima prilično bogat program dobrodošlice.\nNadam se da će do mojeg dolaska već proći.\nJer nakon svega što sam posljednjih dana doživio, još mi samo treba da INVICTUS stigne na Kanare prekriven saharskim pijeskom!\nJoš nekoliko sati do izlaska sunca.\nBatman je otvoren, INVICTUS lijepo plovi, a mjesec osvjetljava ocean.\nSjedim na flybridgeu, slušam svoje raspjevane hidrogeneratore i gledam u beskrajnu tamu Atlantika.\nNegdje daleko ispred mene čekaju Kanarski otoci.\nI tako završava moj drugi dan na Atlantiku.\nDan koji je počeo s poderanim jedrom, a završio s popravljenim Batmanom, sedamdesetak dupina, novim iskustvima i prekrasnom noći pod mjesečinom.\nA sada se polako približava zora i moj treći dan na oceanu.\n⸻\nJUTARNJA MISAO\nJučer sam usred Atlantika, stotinama milja od najbliže luke, sjedio na palubi i kirurškim instrumentima šivao jedro od 320 kvadrata.\nMoram priznati da mi je cijela situacija bila pomalo smiješna.\nViše od 25 godina radim kao oralni kirurg. Iza mene su tisuće operacija, godine učenja, predavanja i usavršavanja.\nAli nikada nisam zamišljao da ću jednog dana svoje kirurško znanje koristiti za popravak jedra na otvorenom oceanu!\nI nije mi pomoglo samo moje iskustvo.\nPomogao mi je Igorov savjet kako rukovati ogromnim jedrom, Željko koji mi je u nedjelju odmah odgovorio i savjetovao kako popraviti oštećenje, a kasnije i Peterovo iskustvo s novim načinom smanjivanja Batmana.\nTri čovjeka, tri različita iskustva i jedno moje poderano jedro.\nA rezultat?\nBATMAN IS BACK IN THE GAME!\nI upravo me to potaknulo na razmišljanje.\nKoliko često tijekom života nešto naučimo, a u tom trenutku nemamo pojma kada će nam to zatrebati?\nNeki savjet koji usput čujemo, neka vještina koju smo godinama usavršavali ili nešto što nam je netko pokazao, a mi smo gotovo zaboravili.\nI onda se jednog dana nađemo u potpuno drukčijoj situaciji i shvatimo koliko je to znanje dragocjeno.\nIsto sam doživljavao tijekom godina kada sam predavao kolegama iz kirurgije. Ponekad bi mi se netko javio mnogo kasnije i rekao da mu je neki moj savjet pomogao u poslu.\nA možda se ja tog savjeta više nisam ni sjećao.\nJučer sam se našao s druge strane takve priče.\nKNOWLEDGE IS NEVER WASTED. ONE DAY, IT WILL HELP YOU IN WAYS YOU NEVER EXPECTED.\nZnanje nikada nije uzaludno. Jednog dana pomoći će ti na način koji nisi mogao ni zamisliti.\nZato mislim da je važno ostati znatiželjan, učiti od drugih i nesebično dijeliti ono što znamo.\nJer nikada ne možemo znati gdje će i kada nekome naše iskustvo zatrebati.\nMožda u operacijskoj sali.\nMožda u nekoj radionici.\nA možda usred Atlantskog oceana, dok pokušava spasiti svoje najdraže jedro!\nJučer sam bio kirurg, jedriličar, krojač, meteorolog i programer.\nA usput sam imao i privatnu predstavu sedamdesetak dupina!\nNije loše za jedan dan.\nA danas?\nBatman ponovno radi, INVICTUS plovi prema Kanarima, ARGO nastavlja prikupljati podatke, a moji hidrogeneratori i dalje pjevaju kitovima.\nJoš nekoliko sati do izlaska sunca.\nIspred mene novi dan, ocean dokle pogled seže i tko zna kakva nova iznenađenja.\nSamo se nadam da danas neće biti novih pacijenata za moju improviziranu operacijsku salu!\nJer Batman je operiran, ali ja baš ne bih želio otvarati intenzivnu njegu na Atlantiku!\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "27.10 07:00": "Dobro jutro s INVICTUSA!\nATLANTIK — TREĆI DAN: KADA OCEAN UTIHNE…\n26. listopada 2026.\nNakon jučerašnje operacije Batmana, moj pacijent se odlično oporavlja!\nŠavovi drže, jedro radi i, moram priznati, danas mi je spasilo cijeli dan.\nNaime, vjetar je od jutra sve slabiji.\nPrvo deset čvorova, pa osam, pa sedam…\nA onda jedva šest.\nI tako satima.\nINVICTUS sa svojih gotovo 24 tone polako klizi preko Atlantika. Batman je otvoren, hvata i najmanji dašak vjetra, a ja uspijevam održavati oko četiri čvora brzine čak i kada vjetar padne na samo šest ili sedam čvorova.\nNije brzo, ali plovimo!\nBez Batmana bih vjerojatno već odavno morao upaliti motore.\nI dok gledam to ogromno jedro kako se jedva primjetno pomiče na slabom vjetru, razmišljam koliko sam sretan što sam ga jučer uspio popraviti.\nBATMAN — MOJ ATLANTSKI TURBO!\nARGO cijeli dan bilježi podatke o brzini, kutovima vjetra i konfiguraciji jedara.\nOvo će biti posebno vrijedni podaci za moju polarnu krivulju jer upravo na ovako slabim vjetrovima želim znati što moj brod stvarno može.\nKada jednog dana ponovno budem planirao duge oceanske rute, neće mi trebati samo tvorničke tablice. Imat ću vlastite podatke, prikupljene upravo ovdje, usred Atlantika.\nA RIBE?\nNaravno, ništa!\nŠtap je u vodi, mamac radi, ocean je ogroman…\nAli izgleda da su sve ribe odlučile plivati nekim drugim putem!\nSiguran sam da ih ima.\nSamo ih ja očito ne znam uloviti!\nOsim ponekog tankera koji se pojavi na AIS-u, cijeli dan gotovo ništa.\nNema kopna.\nNema drugih jedrilica.\nNema ni mojih jučerašnjih dupina.\nSamo more, nebo i INVICTUS koji polako putuje prema Kanarima.\nIRIDIUM — KADA REZERVA ODLUČI OTKAZATI!\nJedina nova tehnička nevolja danas je moj satelitski telefon Iridium GO! exec.\nTo je uređaj koji imam kao rezervnu komunikaciju uz Starlink.\nAko Starlink prestane raditi, Iridium bi mi trebao omogućiti satelitsku komunikaciju.\nAli danas se više ne želi uključiti!\nPokušavam ga pokrenuti, provjeravam što mogu, kontaktiram tehničku podršku…\nZa sada bez uspjeha.\nBaš lijepo!\n S nastavlja prema Kanarskim otocima.\nMilje prolaze, ocean se mijenja, a svaki dan donosi neku novu priču.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "28.10 12:50": "Pozdrav s Atlantskog oceana!\nOko mene mir, gotovo bonaca. Pirka tek šest-sedam čvorova vjetra, ali Batman i iz toga nešto izvuče — INVICTUS klizi oko četiri čvora prema Kanarima. Još nekih 200 nautičkih milja. Polako, ali ide.\nDelfina danas nema. Ribe možda i ima, ali na mom štapu sigurno je nema. Izgleda da sam jedino ja ovdje zainteresiran za ribolov.\nA kako prolaze dani? Malo satelitske televizije, malo knjige, uvijek neki posao na brodu i malo vježbanja da se baš ne ulijenim. Između toga pogledam horizont i provjerim jedra.\nNema nekih velikih događaja za prepričavanje. Danas ocean daje malo predaha, a ja ga rado prihvaćam. Kanari su svakim satom malo bliže.\n     Sažmi", "29.10 07:00": "Dobro jutro s INVICTUSA!\nATLANTIK — PETI DAN: KADA VJETAR ODLUČI UZETI SLOBODNO!\n1. listopada 2026.\nJučerašnji dan započeo je mirno. Zapravo, toliko mirno da sam se počeo pitati je li Atlantik odlučio malo odmoriti od mene.\nVjetra je bilo vrlo malo, ali moj Batman ponovno je pokazao zašto ga toliko obožavam. Hvatao je i najmanji dašak vjetra i uporno gurao gotovo 24 tone teškog INVICTUSA prema Kanarskim otocima.\nNakon svih problema koje sam s njim imao posljednjih dana, moram priznati da mi je postao najdraži član posade. Ne žali se, ne traži plaću, a radi i kada gotovo nitko drugi ne bi mogao!\nAli oko 15 sati vjetar potpuno nestaje.\nBonaca.\nBatman više nema što uhvatiti. More se smiruje, brod usporava, a ja čekam.\nGledam prognozu, gledam jedro, gledam more.\nNišta.\nČekam još malo.\nI dalje ništa.\nNa kraju zaključujem da od čekanja neću stići na Kanare, zatvaram Batmana i palim jedan motor. Oko 2300 okretaja i polako nastavljamo dalje.\nNije baš ono što sam zamišljao kada sam krenuo jedriti preko Atlantika, ali barem se krećemo!\nRibarski štap je, naravno, ponovno u vodi.\nI ponovno ništa!\nNajgore je što ribe stalno skaču oko broda. Vidim ih, ima ih, očito se dobro zabavljaju, ali moj mamac ih uopće ne zanima.\nPočinjem sumnjati da sam jedini čovjek koji je krenuo preko Atlantika s ribarskim štapom, a da ribe to doživljavaju kao neku vrstu zabavnog programa.\nAli onda se uhvatim kako razmišljam što bih zapravo napravio kada bih napokon ulovio neku veliku ribu.\nKako bih je izvukao? Kako bih je očistio? I ono najvažnije, bih li je uopće imao srca usmrtiti?\nDakle, ja želim uloviti ribu, ali nisam siguran da želim da riba zagrize!\nMožda je ipak najbolje da nastavimo ovako. Ja pecam, one plivaju i svi smo zadovoljni.\nPoslijepodne gledam malo satelitsku televiziju. Na ekranu prolaze vijesti, a među naslovima vidim izvještaj o velikoj željezničkoj nesreći u Španjolskoj.\nStrašno. Jadni ljudi i njihove obitelji.\nI dok gledam te vijesti, shvaćam koliko se moj svijet u posljednjih nekoliko mjeseci promijenio.\nNekada su mi misli bile pune posla, klinike, pacijenata, sastanaka, obveza i svega što treba napraviti.\nA sada?\nSjedim usred Atlantika i razmišljam o vjetru, valovima, tankerima, kitovima i plutajućim kontejnerima.\nHoće li se pojaviti oluja? Radi li sve na brodu? Ima li negdje vode gdje je ne bi smjelo biti? Je li sve sigurno od požara?\nOdjednom su to stvari koje su mi najvažnije.\nProblemi nisu nestali. Samo su postali drukčiji.\nI nekako je sve jednostavnije. Ne nužno lakše, ali jasnije.\nU jednom trenutku iznad broda pojavljuje se ptica, možda galeb. Kruži neko vrijeme, a ja je promatram i razmišljam znači li to da se kopno konačno približava.\nNakon nekoliko dana kada oko sebe uglavnom vidiš samo more, i jedna obična ptica postane zanimljiv događaj!\nA onda ponovno malo administracije.\nPokušavam rezervirati mjesto u marini Las Palmas na Gran Canariji.\nI tu počinje nova avantura!\nMarina je praktički puna.\nRazlog je ARC+, veliki organizirani atlantski rally koji 8. studenoga kreće s Gran Canarije preko Cape Verdea prema Karibima.\nPrema informacija
