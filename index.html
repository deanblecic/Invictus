 puno. Malo mora, malo brzine i jedan dobar dan.\n     Sažmi", "29.8 06:14": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam u Sivoti ponovno stao na e-foil.\nPrvih nekoliko trenutaka još si na vodi. Tražiš ravnotežu, razmišljaš o svakom pokretu i pokušavaš sve držati pod kontrolom.\nA onda se daska odjednom podigne… i letiš iznad vode.\nNevjerojatan osjećaj.\nI pomislio sam koliko je toga u životu slično.\nČesto ostajemo tamo gdje nam je poznato i sigurno samo zato što ne znamo što će se dogoditi ako pokušamo nešto drugačije.\nA možda nikada nećemo saznati koliko možemo dok se barem jednom ne usudimo podignuti iznad onoga na što smo navikli.\nPonekad jednostavno treba pokušati.\nA ako padneš?\nNasmiješ se, popneš ponovno i ideš dalje.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "30.8 06:06": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNa društvenim mrežama najčešće se vide jedra, more, prekrasne uvale, zalasci sunca i oni trenuci zbog kojih ovakvo putovanje izgleda kao san.\nAli posljednjih nekoliko dana izgledalo je malo drugačije.\nSkinuli smo problematične prednje solarne panele i postavili nove. Nakon toga trebalo je očistiti ljepilo koje se raspršilo po brodu. Mijenjala se litijska baterija, polirale plastike, uređivao Flexiteek, premještala splav za spašavanje, reorganizirala paluba i dodatno učvršćivala oprema.\nWakeboard je otišao na popravak u Atenu, a lista još nije gotova.\nDo sljedećeg petka čeka nas još dosta onih „malih“ stvari koje na moru zapravo uopće nisu male.\nŽelim poboljšati sustav konopa za skraćivanje glavnog jedra kako bi sve bilo jednostavnije i sigurnije ako nas uhvati ozbiljno nevrijeme. Slijede dodatna učvršćivanja, popravak jedne klime i pumpe za vodu te bolja zaštita i dodatno učvršćivanje pomoćnog čamca na stražnjoj platformi zbog većih valova koje očekujem na sljedećim etapama.\nI još desetak sitnica koje se možda ne vide, ali svaka od njih može postati jako važna kada si daleko od kopna.\nZbog svega toga boravak u Grčkoj malo se produžuje.\nI to je u redu.\nNema smisla držati se kalendara samo zato što je nešto bilo zapisano u planu. More neće pitati jesmo li krenuli na vrijeme. Važno je da INVICTUS i mi krenemo spremni.\nAdventure is what you see.\nThe preparation makes it possible.\nItalija može pričekati još koji dan.\nSigurnost ne može.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "31.8 06:28": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNavikli smo napredak mjeriti kretanjem.\nKoliko smo napravili. Koliko smo daleko stigli. Što smo sljedeće ostvarili.\nA život na moru me sve više uči da ponekad upravo suprotno ima smisla.\nPonekad treba stati.\nNe zato što odustaješ od cilja, nego zato što želiš biti spreman za ono što dolazi poslije.\nINVICTUS će još nekoliko dana ostati u Grčkoj. Mogao bih gledati kartu i misliti koliko sam milja već mogao napraviti prema Italiji.\nAli ne gledam tako.\nPut oko svijeta neće odlučiti nekoliko dana više ili manje.\nPuno je važnije krenuti dalje onda kada osjećaš da si spreman.\nMožda isto vrijedi i izvan mora.\nStati ne znači uvijek zaostajati.\nPonekad upravo tako stignemo dalje.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "1.9 06:42": "Dobro jutro s INVICTUSA.\nDanas je točno mjesec dana otkako sam odvezao konope i krenuo na ovo putovanje.\nMjesec dana mora, novih mjesta, jedrenja, kvarova, popravaka, planova koji su se mijenjali… i trenutaka koje nisam mogao isplanirati.\nJučer sam stigao u Lefkas i, naravno, dio dana ponovno proveo radeći na INVICTUSU.\nAli večer me još jednom podsjetila na nešto što sve više osjećam na ovom putovanju.\nUpoznao sam divne ljude iz Hrvatske koji svojim katamaranom krstare Grčkom — dva bračna para, prijatelji već 15 godina.\nTomislav Zelić sa suprugom i djecom te Danijel Giergia sa suprugom i kćeri.\nPrvo druženje na INVICTUSU, a zatim svi zajedno u grad na večeru. Puno smijeha, priče o moru, brodovima, životu i, naravno, putovanjima.\nPosebno mi je bilo zanimljivo slušati Danijela jer i on ima svoj san — za nekoliko godina želi sa svojim katamaranom krenuti na put oko svijeta.\nPrije mjesec dana mislio sam da krećem upoznavati svijet.\nA već sada shvaćam da ću kroz ovaj put možda još više upoznavati ljude.\nNeke ću poznavati godinama, neke samo jednu večer. Neki će ploviti sa mnom, neki će samo nakratko ukrstiti svoju rutu s mojom.\nAli upravo od tih susreta polako nastaje prava priča ovog putovanja.\nPrvih mjesec dana je iza mene.\nA osjećaj je kao da je priča tek počela.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "2.9 07:05": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nKada kažeš da živiš na brodu i putuješ oko svijeta, ljudi uglavnom zamišljaju jedra, more, sunce i novu uvalu svakih nekoliko dana.\nA onda dođe jedan sasvim običan dan na INVICTUSU.\nJučer sam u Lefkadi otišao u radionicu gdje su mi iz marine plywooda izrezali i obradili dijelove za nove držače boca za ronjenje.\nNa stražnjem dijelu flybridgea želio sam ugraditi još pet inox držača. Lokalni inox majstor dao mi je ponudu od 2.000 €.\nHm… ne.\nOtišao sam u nautic shop, pronašao odgovarajuće inox držače za oko 150 €, kupio ih i ugradio sam.\nNastavio sam s ugradnjom nosača i vodilica za Batman jedro, postavio nosač za elektromotor i zamijenio brave na ormarićima.\nA između bušenja, mjerenja, rezanja i montiranja — trebalo je oprati i veš.\nI onda, usred svega toga, otvoriti CT snimku pacijenta, pogledati nalaz i na nekoliko minuta vratiti se u svoj profesionalni svijet.\nKad sam navečer pogledao što sam sve taj dan radio, zapravo sam se nasmijao.\nOd marine plywooda i inoxa, preko elektromotora i veš-mašine, do CT-a pacijenta.\nŽivot se promijenio, ali svakodnevica nije nestala.\nI dalje postoje posao, obaveze, problemi koje treba riješiti i stvari koje treba napraviti.\nSamo je ured malo drugačiji.\nA pogled kroz prozor definitivno bolji.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "3.9 07:40": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNisu svi dani na putovanju dani velikih avantura.\nJučer je bio jedan od onih običnih — ali dobrih dana.\nMoj mali pomoćni čamac dobio je novu „odjeću“\n — napravljena je zaštita preko bočnih tubusa kako bi bio bolje zaštićen od sunca, mora i svega što ga čeka na putu.\nA nakon svih ovih dana rada na INVICTUSU, red je bio i na mene. Grčki frizer i konačno malo manje kose.\nBilo je i manje zabavnog dijela — dosta razgovora i natezanja sa servisom u Ateni oko mog Awake boarda. Prema dogovoru, danas bi se napokon trebao vratiti na INVICTUS.\nA dan je završio jednostavno.\nPogled prema nebu i prekrasan mjesec iznad Lefkasa.\nI možda upravo takvi dani najbolje pokazuju kako zapravo izgleda ovo putovanje.\nNe mora se svaki dan dogoditi nešto veliko.\nPonekad popraviš jednu stvar, riješiš jedan problem, ošišaš se, pogledaš mjesec… i shvatiš da je i to bio sasvim dobar dan.\nJer život se na kraju ne sastoji samo od velikih trenutaka.\nVećinom ga čine upravo oni mali.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "4.9 06:22": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer još jedan pravi dan života na brodu.\nU spremištu kod kompresora ugradio sam nove držače za boce za ronjenje.\nDvije klime trenutno ne hlade kako bi trebale, pa čekam servisera — vjerojatno nedostaje plina.\nKod sidra sam popravio relej i ugradio automatski osigurač kako bih spriječio probleme kod brzog prebacivanja između spuštanja i podizanja sidra. Hvala Kristijan Kamenar  koji mi je poslao potreban dio.\nPosla na INVICTUSU uvijek ima. Jednu stvar prekrižiš s liste, dvije nove se pojave.\nAli život ne može biti samo lista stvari koje još treba napraviti.\nZato sam navečer ostavio alat, sjeo u auto i otišao do FLY ME Sun & Stars Bara iznad Lefkasa.\nPogled na more, prekrasan zalazak sunca i za kraj moja prva galatopita.\nI dok sam tamo sjedio, pomislio sam da možda upravo tako izgleda ravnoteža koju tražimo.\nNe čekati da sve bude završeno kako bismo počeli uživati — jer uvijek će postojati još nešto što treba napraviti.\nPopravi ono što treba popraviti.\nUživaj u onome u čemu vrijedi uživati.\nI pronađi mjesta za oboje.\nDanas ponovno mala promjena plana. INVICTUS mora napustiti gradski dok jer je petak i kreću radovi na mooring linijama. Tako da se ponovno selimo.\nP.S. AWAKE board?\nJoš uvijek nije stigao.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "4.9 08:08": "Krećem iz Lefkasa prema prvom sidrištu južno.\nJoš uvijek čekam da se moj Awake e-foil board vrati iz Atene, a onda — pravac Italija.\nDo tada, INVICTUS ne stoji. Samo se polako pomičemo dalje.\n     Sažmi", "5.9 06:53": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam konačno napustio Lefkas.\nPrvo samo kratko — prebacio sam INVICTUS na prvo sidrište južno od grada, a pomoćnim čamcem vratio se po moj AWAKE board koji je napokon stigao s popravka. Još ga nisam stigao ni isprobati.\nOprostio sam se od prijatelja Ursa Tannera i njegove posade, Jean-Marca i njegove supruge, i krenuo natrag kroz kanal Lefkasa prema sjeveru.\nA tamo — ludnica.\nViše od pedeset jedrilica i katamarana naguralo se u kanalu čekajući most koji se otvara tek u 14 sati. Puhalo je dosta, prostora malo, brodovi jedan uz drugoga… i vrlo brzo počeli su problemi.\nNasukavanja, udarci, brodovi koji se približavaju jedan drugome više nego što bi itko želio.\nPogledao sam sve to i odlučio: INVICTUS neće sudjelovati u ovoj predstavi.\nMaknuo sam se iz gužve, vratio na kraj i pričekao.\nKada sam konačno prošao kanal, plan je bio — Antipaxos.\nAli more je imalo drugi plan.\nVjetar ravno u lice, veliki valovi i nakon nekog vremena odluka: danas ne moram ništa dokazivati.\nAntipaxos će pričekati.\nPromijenio sam kurs prema Two Rocks Bayu.\nI taman ispred uvale — novi zaplet.\nElektromotor sidra odjednom je poludio i počeo sam spuštati sidro. Nisam ga mogao zaustaviti.\nUz telefonsku pomoć prijatelja Josip Spoljarevic uspio sam pronaći problem, otkloniti kvar i konačno sigurno usidriti INVICTUS. Hvala, Josipe!\nA onda potpuni kontrast svemu prije toga.\nPrekrasna mirna uvala. Pješčana plaža. Mali kafić gore na brdu. Navečer pomoćnim čamcem natrag prema INVICTUSU, more mirno, dan polako završava.\nI pomislim koliko je život na moru zapravo jednostavan kada ga prestaneš pokušavati prisiliti da ide po tvom planu.\nJučerašnji cilj bio je Antipaxos.\nNisam stigao.\nAli završio sam na mjestu na kojem možda nikada ne bih bio da je sve išlo po planu.\nCHANGE OF PLANS\nSometimes the wrong destination\nleads to the right place.\nI možda je baš to bila najbolja stvar koja mi se jučer dogodila.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "6.9 05:48": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNEW CHAPTER\nYou can be grateful for what you leave behind\nand still be excited for what lies ahead.\nJučer je bio moj posljednji cijeli dan u Grčkoj.\nU 5 ujutro podigao sam sidro u Two Rocks Bayu i krenuo prema Krfu.\nPut me vodio pokraj malog otoka Vido. Mjesta s teškom poviješću i sjećanjem na ljude koji su nakon povlačenja preko Albanije ondje izgubili život. Prolazeći pokraj njega, na trenutak sam usporio u mislima i tiho im odao počast.\nNastavio sam pokraj grada Krfa prema marini Gouvia. INVICTUS je dobio puni tank dizela, a pomoćni čamac benzin. Sve spremno za ono što slijedi.\nJedino što bih radije zaboravio je cijena dizela — 2,30 € po litri!\nKad puniš INVICTUS, to više nije gorivo, to je investicija.\nNa izlazu iz marine još jedan podsjetnik koliko more ne oprašta pogreške — remorker je upravo izvlačio veliku jahtu koja se nasukala u plićaku.\nA onda ponovno otvoreno more.\nPosljednji cilj u Grčkoj bio je mali otok Ereikousa.\nNakon 70,8 NM i gotovo 13 sati plovidbe, stigao sam pred sam kraj dana. Sunce je polako nestajalo iza horizonta, brzo sam spustio sidro, isprao INVICTUS od soli i valova, spustio pomoćni čamac i otišao na kopno.\nI kao da mi je Grčka za kraj ostavila nešto posebno.\nMalo mjesto, pješčane plaže, prijateljski ljudi, dobra večera i čaša vina uz posljednje boje dana. Bez velike pompe. Samo jedan lijep, miran završetak ovog dijela puta.\nNatrag na INVICTUS. Nekoliko sati sna.\nAlarm u 4:00.\nMrak. Tišina. Sidro gore.\nI sada, dok ovo pišem, INVICTUS plovi noću prema novoj zemlji.\nIza mene ostaje Grčka — puno duže nego što sam prvotno planirao. Ostavlja mi prekrasna mjesta, nove prijatelje, puno napravljenog posla na brodu i još više uspomena.\nIspred mene je novo poglavlje.\nI možda je upravo to jedna od ljepših stvari ovog putovanja.\nMožeš biti zahvalan za ono što ostavljaš iza sebe, a istovremeno se veseliti onome što te čeka ispred.\n ITALIJA, DOLAZIM!\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "6.9 07:57": "ITALIJA SVE BLIŽE!\nNegdje na sredini mora… još malo pa podižem talijansku zastavu.\nPred nama još oko 20 sati plovidbe, more mirno, dan prekrasan, INVICTUS ide dalje prema Italiji.\nOnaj poseban osjećaj kada iza tebe ostaje jedna zemlja, a na horizontu počinje nova priča.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "7.9 10:36": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer — prvi pravi dan u Italiji.\nNakon prelaska iz Grčke cijelim putem pratio me bočni vjetar i INVICTUS je lijepo jedrio prema talijanskoj obali.\nNakon 58,5 NM i nešto više od 11 sati, stigao sam u prekrasnu Santa Maria di Leuca, na samom jugu talijanske „čizme“.\nSidro dolje. Prvo, naravno, oprati INVICTUS od soli.\nA onda trenutak koji sam čekao danima — konačno isprobati moj BRABUS wakeboard koji se vratio s popravka iz Atene.\nI… radi!\nNe samo da radi — ponovno leti po moru kao lud. Nakon svih razgovora, čekanja i natezanja oko popravka, konačno malo zabave.\nNavečer ono zbog čega volim Italiju. Jednostavna talijanska večera: tartar od tune, tjestenina sa svježom ribom i čaša dobrog vina.\nNekoliko sati sna.\nU 01:00 ponovno alarm.\nU mraku sam potiho spremio INVICTUS, podigao sidro pokušavajući ne probuditi susjedne brodove i krenuo dalje.\nPrvih nekoliko sati ponovno potpuni mrak. Radari, navigacija i termalne AI kamere — sasvim drugačiji svijet od jučerašnjeg sunca i wakeboarda.\nA onda se počelo razdanjivati.\nNoćna faza je iza mene, sada su sva jedra gore, Batman je prebačen na jednu stranu i otvorena je ogromna genoa od oko 150 m².\nVjetar dolazi odostraga, malo sa strane, INVICTUS klizi dalje s oko 7 čvorova.\nI dok jutros gledam kako se novi dan polako otvara ispred mene, pomislim koliko mi ovaj način života sve više odgovara.\nStigneš.\nUživaš.\nOdmoriš.\nA onda ponovno digneš sidro.\nNe zato što ti tamo gdje jesi nije lijepo.\nNego zato što želiš vidjeti što je sljedeće.\nKEEP MOVING\nEnjoy where you are.\nBut never lose the curiosity\nto discover what comes next.\nBit će lijep dan.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "7.9 13:18": "INVICTUS i ja nastavljamo prema jugu Italije.\nPrekrasan dan za jedrenje, more nas nosi, a Batman je sada otvoren u fullu i radi svoj posao.\nSunce, vjetar i more pred nama. Baš onako kako treba.\n     Sažmi", "8.9 05:18": "Kako izgleda noćna plovidba na INVICTUSU?\nKarta, Sea.AI, radar, pogled u mrak… i dobra muzika u pozadini.\nNoću je more potpuno drugačiji svijet — manje vidiš, ali zato puno više pratiš i osjećaš.\n     Sažmi", "8.9 08:20": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer jedan od onih dana koji se uglavnom mogu opisati brojkama.\n114,7 nautičkih milja.\n18 sati i 13 minuta plovidbe.\nProsječna brzina 6,3 čvora.\nNajveća brzina preko dna 9,9 čvorova, a kroz vodu 12,1.\nNajduža etapa i jedan od najboljih dana jedrenja na ovom putovanju do sada.\nVjetar je bio odličan, INVICTUS je jurio prema jugu Italije i satima oko mene gotovo samo more i horizont.\nA onda se usred svega toga na brodu pojavila — bubamara.\nNasred pučine.\nGledam je i razmišljam: odakle si ti došla? Koliko si kilometara letjela? Je li te donio vjetar? I od svih mjesta na tom ogromnom moru, završila si baš na INVICTUSU.\nJučer sam napravio više od 114 milja, postavio nekoliko svojih malih rekorda i imao odličan dan jedrenja.\nAli možda ću se za nekoliko godina od svih tih brojki najviše sjećati upravo ovog malog putnika koji mi je došao u posjet nasred mora.\nJer često nisu najveće stvari one koje najduže pamtimo.\nPonekad je dovoljan jedan sasvim mali trenutak da veliki dan postane poseban.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "9.9 09:43": "Čekam pravi trenutak za prolaz kroz Messinski tjesnac.\nMjesto gdje se susreću Jonsko i Tirensko more, gdje snažne struje i danas stvaraju vrtloge — i gdje su, prema Homeru, mornare čekale Scylla i Charybdis.\nPovoljna struja prema sjeveru dolazi oko 12:20. Do tada — INVICTUS čeka.\n     Sažmi", "9.9 18:28": "Scila i Haribda su iza mene.\nProšao sam Messinski tjesnac i stigao u Scillu – mjesto koje već više od 3.000 godina živi s legendom o čudovištu iz Homerove Odiseje.\nAli za danas je dosta plovidbe. Ostajem ovdje, idem prošetati Scillom i posjetiti Castello Ruffo, tvrđavu na stijeni iznad mora.\nNakon današnjeg prolaska između Scile i Haribde, baš je ovdje pravo mjesto za završiti dan.\n     Sažmi", "10.9 06:38": "Dobro jutro s INVICTUSA.\nJučer jedan od onih dana koje ću sigurno dugo pamtiti.\nProšao sam INVICTUSOM kroz Messinski tjesnac, između Sicilije i Kalabrije — kroz more kojim su ljudi plovili tisućama godina i oko kojeg je nastala jedna od najpoznatijih priča pomorske mitologije.\nS jedne strane Haribda — golemi vrtlog koji je prema Homeru gutao more i brodove.\nS druge Scila — čudovište sa stijena koje je čekalo mornare koji bi joj se previše približili.\nIzmeđu njih morao je proći Odisej.\nA jučer sam istim prolazom prošao i ja s INVICTUSOM.\nDanas, naravno, nema mitskih čudovišta.\nAli ono zbog čega su te priče vjerojatno i nastale još uvijek je ovdje.\nSnažne struje. Vrtlozi. Uzak prolaz. I more koje određuje svoja pravila.\nIako danas imam GPS, radar, elektroničke karte, prognozu i precizne podatke o strujama, ipak sam morao napraviti ono isto što su mornari radili stoljećima prije mene.\nČekati pravi trenutak.\nČekao sam promjenu struje i tek kada se nakon stanca počeo razvijati povoljni Montante prema sjeveru, krenuo sam kroz tjesnac.\nTehnologija se promijenila.\nBrodovi su se promijenili.\nOno što su nekada mornari pretvarali u čudovišta danas možemo izmjeriti, predvidjeti i vidjeti na ekranu.\nAli jedno se nije promijenilo.\nMore i dalje određuje pravila.\nNakon prolaska ostao sam u Scilli i jučer proveo dan upravo ovdje — na mjestu koje sam nekoliko sati ranije gledao s mora kao dio Homerove priče.\nI nekako je poseban osjećaj stajati danas na istim stijenama i gledati isti tjesnac kojim su mornari prolazili tisućama godina prije nas.\nJutros je INVICTUS još uvijek ovdje.\nAli polako spremam brod, uskoro dižem sidro i nastavljam dalje uz talijansku obalu.\nJedna priča završava. Sljedeća već čeka iza horizonta.\nBETWEEN SCYLLA & CHARYBDIS\nThe monsters have changed.\nThe sea has not.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "10.9 08:50": "SCILLA — BEYOND THE LEGEND\nNakon prolaska kroz Messinski tjesnac odlučio sam ostati u Scilli i upoznati mjesto koje sam do tada poznavao uglavnom iz Homerove priče o Scili i Haribdi.\nA iza legende o čudovištu pronašao sam jedno prekrasno malo mjesto na obali Kalabrije.\nIznad mora stoji Castello Ruffo, tvrđava na stijeni koja stoljećima čuva ulaz u tjesnac.\nOd tamo stepenice vode prema moru, maloj crkvi, plaži i uskim uličicama starog mjesta.\nBez žurbe sam lutao ulicama, gledao more kojim sam samo nekoliko sati ranije prošao s INVICTUSOM i pokušavao zamisliti kako je isti taj prolaz izgledao mornarima prije nekoliko tisuća godina.\nNavečer, naravno, Italija.\nMali restoran, dobra hrana i još jedan pogled prema moru.\nI možda mi je upravo to najljepši dio ovog putovanja.\nS jednog mjesta prvo vidiš obalu s broda.\nOnda spustiš sidro, izađeš na kopno i otkriješ da iza imena na karti postoji potpuno drugačija priča.\nJučer sam prošao pokraj Scile.\nA onda sam upoznao Scillu.\nJutros je vrijeme za dalje.\nINVICTUS ponovno diže sidro i nastavlja prema sjeveru uz talijansku obalu.\n     Sažmi", "10.9 14:24": "Prvi pogled na Tropeu.\nPješčane plaže, kristalno plavo Tirensko more i Santa Maria dell’Isola visoko iznad obale.\nINVICTUS je već na sidru, a ja još nisam ni zakoračio na kopno. Za sada samo uživam u ovom pogledu s mora… a Tropeu tek idem otkriti.\n     Sažmi", "11.9 06:23": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer navečer — potpuno drugačije more.\nBonaca. Prekrasna večer u gradu, ugodna glazba i mirno more.\nZnao sam da se vrijeme tijekom noći može pogoršati pa sam se prije spavanja pripremio. INVICTUS je bio na sidru sa 75 metara lanca, oko mene gotovo nijedan brod.\nOko 4 ujutro — alarm.\nJak vjetar. Udari postaju sve snažniji. Na horizontu munje i grmljavina, a more se počinje dizati.\nU blizini je ostao još samo jedan veliki jedrenjak koji je stigao tijekom noći.\nI tako smo neko vrijeme samo čekali.\nOn i ja.\nGledali što će more odlučiti.\nOprema za nevrijeme na meni. Motori upaljeni i spremni pomoći INVICTUSU. Sidro drži, brod se drži, ali situacija postaje sve neugodnija.\nU jednom trenutku veliki jedrenjak odustaje od sidrišta i odlazi van.\nNedugo nakon njega donosim istu odluku.\nIdemo.\nDizanje sidra po jakom vjetru i valovima bilo je malo akcije. Hladnoća, voda preko palube, INVICTUS pleše po valovima — ali sve funkcionira.\nUpravo za ovakve trenutke pripremao sam se dugo.\nI ja i brod.\nIzlazim iz uvale, okrećem INVICTUS prema sjeveru i otvaram prvo skraćeno jedro kako bih stabilizirao brod.\nI onda, nakon otprilike sat vremena borbe…\nmore se polako smiruje.\nSjedim za kormilom i razmišljam koliko se sve može promijeniti u samo nekoliko sati.\nSinoć bonaca i glazba.\nJutros munje, vjetar i valovi.\nA sada ponovno plovim prema sjeveru.\nTo je more.\nTo je život.\nNe možemo odlučiti kada će doći oluja.\nAli možemo odlučiti koliko ćemo biti spremni kada dođe.\nMožda sam upravo zato i krenuo na ovaj put.\nDa na neko vrijeme prestanem pokušavati kontrolirati svaki dan i prihvatim život u kojem more određuje ritam, vrijeme i ponekad čak i smjer.\nREADY\nYou don’t prepare for the storm when it arrives.\nYou prepare long before it comes.\nŽelim vam miran dan, gdje god bili.\n     Sažmi", "11.9 16:43": "Poslije burne noći, danas nastavljamo prema sjeveru.\nAli vrijeme još nije završilo svoju priču.\nNa radaru se jasno vide nove olujne ćelije koje se stvaraju nad morem. Danas ih ne čekamo — pratimo ih, gledamo njihov smjer i pokušavamo ih zaobići.\nINVICTUS ide na dva motora uz prednje jedro. Cilj je jednostavan: što prije doći do sigurnog utočišta prije novog pogoršanja.\nNa moru ponekad nije najvažnije ići najkraćim putem. Važnije je znati što ti dolazi ususret — i na vrijeme mu se maknuti s puta.\nDanas nema romantike. Danas se bježi od nevremena.\n     Sažmi", "11.9 17:44": "SIGURNOST NA MORU\nKad ploviš sam, jedna stvar vrlo brzo postane jasna: ako nešto krene po zlu, prvo moraš pomoći sam sebi.\nZato uz svu elektroniku i sigurnosnu opremu na INVICTUSU imam i nekoliko stvari koje su uvijek uz mene.\n Prsluk za spašavanje – ako završim u moru, automatski se napuhuje i drži me na površini.\n Sigurnosna kuka i tether – njima se vežem za brod kada su uvjeti loši, noću ili kada izlazim iz kokpita. Jer najbolja zaštita od čovjeka u moru je – ne pasti s broda.\n AIS MOB – ako ipak završim u moru, šalje moju poziciju preko AIS-a brodovima u blizini.\n PLB – moj osobni satelitski SOS. Aktiviram ga u ozbiljnoj nevolji i službama traganja i spašavanja šalje alarm i moju GPS poziciju.\n Ručni VHF – omogućuje mi komunikaciju s drugim brodovima i službama spašavanja čak i ako više nisam na INVICTUSU.\nSve to možda izgleda kao puno opreme.\nAli kada ploviš sam, postoji jedan vrlo neugodan detalj: ako padneš u more, tvoj brod nastavlja ploviti bez tebe.\nZato moj plan ima nekoliko slojeva:\nOstati na brodu.\nAko padnem – ostati na površini.\nPokazati gdje sam.\nPozvati pomoć.\nI nadati se da ništa od toga nikada neću morati upotrijebiti.\nAli more me svaki dan podsjeća na isto: priprema nije strah. Priprema je ono što ti omogućuje slobodu.\n     Sažmi", "12.9 06:56": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer je bio dug dan.\nNakon noćne oluje, vjetra, valova i ranog izlaska sa sidrišta, cijeli dan sam tražio put prema sjeveru i sigurno mjesto gdje ću ponovno spustiti sidro.\nPredvečer, kada sam se približavao uvali, iz sivog neba pojavila se duga.\nI ono što me nasmijalo — završavala je gotovo točno na mjestu prema kojem sam plovio.\nNekoliko minuta kasnije upravo sam tamo spustio sidro.\nNaravno, znam da na kraju duge nema lonca sa zlatom.\nAli jučer mi zlato nije ni trebalo.\nNakon svega što je more donijelo prethodne noći, mirno more, sigurno sidro i nekoliko sati sna bili su sasvim dovoljno bogatstvo.\nI možda nas život često upravo tako podsjeti koliko se brzo promijeni ono što smatramo vrijednim.\nJednog dana tražimo velike stvari.\nDrugog dana samo malo mira.\nA ponekad, nakon oluje, shvatiš da si već dobio sve što ti u tom trenutku treba.\nJutros ponovno druga slika.\nKiša. Munje. Grmljavina.\nINVICTUS ponovno ide dalje.\nJer poslije svake oluje ne dolazi nužno zauvijek lijepo vrijeme.\nAli uvijek dođe trenutak u kojem možeš ponovno podići pogled, provjeriti smjer — i nastaviti.\nAFTER THE STORM\nSometimes the treasure\nat the end of the rainbow\nis simply a safe place to rest.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "12.9 17:20": "Stigao sam pred Positano, jedan od najljepših bisera Italije.\nPosebno se veselim ovom dolasku jer ovdje imam puno prijatelja i svojih pacijenata iz klinike. Čini mi se da me čeka nekoliko lijepih dana i još ljepših druženja.", "13.9 07:37": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam uplovio u Positano.\nMjesto za INVICTUS ovdje nije baš jednostavno dobiti. Obala je prepuna brodova, vezovi i bove rezerviraju se dugo unaprijed, ali moji prijatelji iz Positana uspjeli su mi organizirati mjesto.\nUlazim među desetke brodova, sve izgleda kao mali kontrolirani kaos, ali organizacija funkcionira savršeno. Dolazi gumenjak koji mi pomaže postaviti INVICTUS na pravo mjesto.\nGasim motore.\nNije prošlo ni pet minuta.\nPrema meni dolazi taxi boat.\nNa njemu Alfonso, Stefano i Andrea.\nI odjednom sam se osjećao kao da nisam doplovio u novi grad, nego kao da sam se vratio među svoje ljude.\nDošli su me pozdraviti, ali i pomoći.\nU posljednjem nevremenu stradao mi je nosač pomoćnog čamca. Skinuli smo gumenjak, pregledali što treba napraviti i Stefano je odmah organizirao gdje će se nosač popraviti. Napravit ćemo dodatno inox pojačanje kako bi sljedeći put bio spremniji za ono što more odluči poslati prema INVICTUSU.\nA onda — čaša šampanjca.\nI Positano.\nMoram priznati da je ovo vjerojatno najljepše mjesto koje sam do sada vidio u Italiji.\nKuće kao da su naslagane jedna na drugu po stijeni, male ulice i stepenice, restorani, hoteli, more ispod svega… i nevjerojatna količina ljudi. U vrhuncu sezone ovdje dnevno prođu deseci tisuća posjetitelja.\nAli za mene Positano ima još jednu priču.\nOvdje žive stotine ljudi koje sam tijekom svih ovih godina liječio i operirao.\nAlfonsa poznajem gotovo 15 godina.\nPrvo je bio moj pacijent.\nS vremenom je počeo dovoditi druge ljude iz ovog kraja u našu kliniku.\nA nakon toliko godina više ga teško mogu nazvati samo pacijentom.\nPostao je prijatelj.\nŠetamo Positanom i događa se nešto što nisam očekivao.\nUđemo na aperitiv — poznato lice. Natalia, naša pacijentica.\nProđemo ulicom — netko me pozdravlja.\nU restoranu — ponovno ljudi koje poznajem iz klinike.\nNeki imaju restorane, neki hotele, neki rade u turizmu.\nGodinama su oni dolazili k meni.\nSada sam prvi put ja došao k njima.\nI to potpuno drugim putem.\nMorem.\nNa INVICTUSU.\nNavečer prekrasna večera, puno smijeha, priča i prijateljstva.\nA posebno zanimljivi razgovori sa Stefanom, koji je godinama bio kapetan broda Guardia di Finanza dugog oko 40 metara i proveo velik dio života na moru. Slušao sam njegove priče, iskustva i savjete o ovom dijelu Mediterana, vremenu i stvarima na koje trebam paziti dok nastavljam prema sjeveru.\nI sinoć sam razmišljao o jednoj stvari.\nKroz život često mislimo da gradimo posao, karijeru ili neku svoju priču.\nTek puno kasnije shvatimo da smo cijelo to vrijeme zapravo gradili nešto puno vrijednije.\nOdnose među ljudima.\nPrije gotovo 15 godina Alfonso je prvi put ušao u moju kliniku kao pacijent.\nJučer je došao brodom do INVICTUSA kao prijatelj.\nMislim da je to jedna od ljepših nagrada koje ti život može vratiti.\nFRIENDSHIPS\nSome people enter your life as patients.\nYears later, you realize they became friends.\nDanas ostajem još malo u Positanu. Moji domaćini žele mi pokazati još nekoliko mjesta, a možda odem i do Pompeja.\nA kada ponovno dignem sidro, čeka me još jedna priča.\nIspred Positana nalaze se Li Galli, otočići povezani s drevnom legendom o sirenama koje su svojim pjevanjem pokušale zavesti Odiseja.\nNakon Scile i Haribde izgleda da Odisej i INVICTUS još neko vrijeme plove sličnim vodama.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "13.9 14:09": "Nekad stvarno mrzim Facebook i iPhone kada mi izbace ovakve uspomene.\nPrije 8 godina.\nA meni izgleda kao da je bilo jučer.\nMoj kauč, moj dom i moj Thai.\nMoj engleski buldog i prvi pas u mom životu.\nPrije njega nisam ni znao koliko ti jedan pas može ući pod kožu. Nisam mogao zamisliti da ću ga toliko voljeti, niti da će me toliko godina poslije svaki put zaboljeti kada vidim njegovu sliku ili neki naš zajednički trenutak.\nThai je bio jedna od najvećih ljubavi u mom životu.\nI nekako vjerujem da ću na ovom putovanju jednoga dana naići na svog novog Thaija.\nMožda na nekom malom otoku usred Pacifika. Možda negdje gdje ga uopće ne očekujem. Bit će neki pas koji će mi jednostavno doći.\nNe znam gdje. Ne znam kada.\nAli znam da ga neću morati tražiti.\nKad ga ugledam, znat ću.\nTi si taj. Ti ideš sa mnom.\nMožda me zato ovakve uspomene toliko bole.\nJer neke ljubavi nikada zapravo ne prođu. Sažmi", "14.9 07:58": "Pozdrav s Amalfi Coast.\nDanas je INVICTUS malo odmarao, a ja sam zamijenio kormilo za motor.\nMoj prijatelj Alfonso odlučio je biti moj vozač i vodič te mi pokazati svoju Amalfi Coast onako kako je poznaju ljudi koji ovdje žive.\nPositano, Amalfi, Ravello, Scala… vozili smo se cijelom obalom, kroz nevjerojatne zavoje iznad mora, male gradiće i mjesta na kojima jednostavno moraš stati i pogledati oko sebe.\nAli najljepše od svega nije samo ono što vidiš.\nNajljepše je kada ti prijatelj pokazuje svoj kraj, priča njegove priče i od običnog izleta napravi dan koji ćeš pamtiti.\nHvala Alfonso na vožnji, vodstvu i prijateljstvu.\nLa dolce vita na Amalfi Coast.\n     Sažmi", "15.9 07:05": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNa moru brzo naučiš jednu stvar.\nKada nešto pukne, nije dovoljno samo vratiti ga u stanje kakvo je bilo prije.\nJer ako je jednom popustilo, more ti je možda upravo pokazalo gdje je slaba točka.\nU posljednjoj oluji stradao mi je jedan od nosača pomoćnog čamca na stražnjoj platformi INVICTUSA.\nMogao sam ga jednostavno popraviti.\nAli odlučio sam napraviti nešto drugo.\nKad već popravljam jedan — napravit ću oba bolje i jače nego prije.\nJutros sam zato rano krenuo sa Stefanom Rossijem iz Positana preko brda prema Castellammare di Stabia.\nStefano je godinama bio kapetan velikog broda i more poznaje jako dobro, pa smo zajedno otišli pronaći rješenje koje neće biti samo popravak.\nDošli smo u malu obiteljsku radionicu.\nBez velikih ureda, recepcija i kompliciranja.\nObjasnio sam što trebam, pogledali su dijelove i krenuli raditi.\nZa otprilike dva sata napravili su mi nove inox dijelove i pojačanja točno kako smo zamislili.\nPerfektno napravljeno.\nI upravo takva mjesta volim pronaći na ovom putovanju — malu obiteljsku radionicu u kojoj ljudi znaju svoj posao, poslušaju što ti treba i jednostavno naprave stvar kako treba.\nVratili smo se u Positano, zajedno otišli na ručak, a nakon toga ponovno na INVICTUS.\nMontaža.\nProvjera.\nGotovo.\nI danas sam ponovno pomislio koliko je zanimljivo da mi more gotovo svaki tjedan nešto novo pokaže.\nPonekad prekrasno mjesto.\nPonekad nevjerojatnog čovjeka.\nA ponekad — slabu točku na brodu.\nAli možda se ista stvar može primijeniti i na život.\nKad nešto pukne, ne moramo se uvijek truditi samo vratiti sve na staro.\nPonekad nam upravo taj lom pokaže što trebamo napraviti bolje.\nBETTER\nDon’t just fix what broke.\nMake it stronger than before.\nI onda nastavi dalje.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "15.9 13:30": "Teška srca napustio sam Positano.\nTamo je ostalo mnogo mojih prijatelja i pacijenata, ljudi zbog kojih Positano za mene nije samo jedno od najljepših mjesta u Italiji, nego mjesto kojem ću se uvijek rado vratiti.\nProšao sam pokraj Li Galli, legendarnih otoka Sirena, zatim pokraj Caprija i sada s INVICTUSOM polako nastavljam prema sjeveru.\nVrijeme je dobro, more lijepo, a ja nigdje ne žurim. Na ovakvom putovanju nije najvažnije što prije stići, nego uživati u svakom dijelu puta.\nOdiseja su morali vezati za jarbol kako bi odolio pjesmi Sirena. Ja sam bio sam, pa sam se morao vezati sam.\nSrećom, autopilot nije čuo njihovu pjesmu.\n     Sažmi", "16.9 07:02": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nTHE OTHER SIDE\nFor years, they came into my world.\nThis time, I had the privilege of entering theirs.\nJučer sam otišao iz Positana.\nI moram priznati — teškog srca.\nNe samo zato što je Positano možda najljepše mjesto koje sam do sada vidio u Italiji.\nNego zbog ljudi koji su tamo ostali.\nOd 2011. godine iz Positana i cijelog tog područja u moju kliniku dolaze pacijenti. Kroz sve te godine operirao sam ih sigurno između 200 i 300.\nGodinama sam ih poznavao iz jednog sasvim drugačijeg svijeta.\nDolazili su k meni kao pacijenti.\nBili nervozni prije operacije. Vjerovali meni i mom timu. Vraćali se na kontrole. Dovodili svoje obitelji, prijatelje, susjede…\nA sada, nakon gotovo 15 godina, prvi put sam ja došao k njima.\nNe avionom.\nNe zbog posla.\nDoplovio sam INVICTUSOM u njihov Positano.\nI odjednom sam ljude koje sam godinama poznavao iz ordinacije počeo upoznavati iz potpuno druge perspektive.\nU njihovim restoranima. Kafićima. Hotelima. Na ulicama kojima svaki dan hodaju. U njihovim obiteljima i njihovom stvarnom životu.\nI gotovo gdje god bih došao — poznato lice.\nTu je Luigi.\nNjega ću zauvijek pamtiti po jednoj operaciji koju je gotovo prespavao.\nZaspao je i zakasnio na avion.  Došao poslije isti dan kasno u noć sa vlakom.  Kako bi se sljedeći dan mogao vratiti zajedno sa svojom grupom, operirali smo ga  usred noći.\nDanas se tome zajedno smijemo.\nTu je Natalia.\nDođem u njezin kafić i opet sam među svojim ljudima. Tamo radi i Victoria, još jedno lice koje je postalo dio ovih nekoliko posebnih dana u Positanu.\nA onda dolazi Natalijin brat Jacky Tiffany Romano, također naš stari pacijent, kojeg pamtim iz potpuno drugačijeg okruženja.\nDanas živi jedan sasvim drugačiji, šareni svijet kao drag queen performer Tiffany Romano.\nProveli smo prekrasnu večer zajedno.\nPričao mi je o svom životu, nastupima, ljudima koje je upoznao i nevjerojatnim situacijama koje je kroz godine doživio kao drag queen.\nPuno smijeha i jedan od onih razgovora koje nikada ne možeš doživjeti u ordinaciji.\nI pomislim:\nKoliko malo zapravo znamo o životu čovjeka kojeg godinama poznajemo samo kao pacijenta.\nTu je i Eugenia.\nŽena velikog srca koja pomaže djeci i radi za crkvu.\nKada je čula da sam stigao, napravila je posebno za mene tortu i poslala je na INVICTUS.\nI tako smo sjedili na brodu — Stefano, Maria, Andrea, Alfonso i ja — rezali tortu, jeli, pričali i smijali se, pili kavu.\nNaizgled mala stvar.\nAli upravo takve male stvari najviše ostanu.\nNetko je odvojio svoje vrijeme, napravio nešto svojim rukama i želio te razveseliti.\nTo se ne kupuje.\nOnda Andrea.\nČovjek kojem očito ništa nije problem.\nJa pogriješim mjere za ploču koja mi treba na INVICTUSU.\nAndrea uzme ploču, ode po alat, donese pet fleksica\n i vrlo brzo je ploča izrezana upravo kako treba.\nProblem riješen.\nBez filozofiranja.\nA onda Stefano Rossi.\nČovjek koji je velik dio života proveo na moru kao kapetan velikog broda Guardia di Finanza. Desetljeća iskustva po Mediteranu i čovjek od kojeg mogu naučiti stvari koje ne pišu ni u jednom priručniku.\nU oluji mi je puknuo nosač pomoćnog čamca.\nTrebao sam pronaći radionicu, napraviti novi dio i dodatno pojačati cijelu konstrukciju.\nStefanu nije bio nikakav problem rano ujutro sjesti sa mnom u auto i krenuti preko brda prema Castellammare di Stabia, gotovo do Napulja, samo zato da mi pomogne riješiti problem na brodu.\nDošli smo u malu obiteljsku radionicu, objasnili što trebamo i za dva sata imali gotovo rješenje.\nVratili se u Positano, zajedno ručali, a nakon toga ponovno na INVICTUS sve montirati.\nMogao mi je jednostavno dati adresu i reći:\n„Idi tamo.“\nNije.\nOtišao je sa mnom.\nTakve stvari pamtim.\nI onda Alfonso.\nNjega poznajem još od 2011. godine.\nPrvo pacijent.\nOnda čovjek koji nam je godinama dovodio ljude iz ovog kraja.\nA danas — prijatelj.\nOvih nekoliko dana Alfonso je praktički postao moj osobni vodič po Amalfi Coastu.\nOn na motoru, ja iza njega — i krenemo.\nPositano, Amalfi, mjesta visoko iznad obale, vidikovci, male ceste, restorani i mjesta koja kao običan turist vjerojatno nikada ne bih pronašao.\nVozili smo se toliko da smo na kraju potrošili cijeli tank benzina na motoru.\nAli zahvaljujući njemu nisam vidio samo Amalfi Coast s mora.\nVidio sam ga očima čovjeka koji tamo živi.\nBilo je tu ručkova, večera, aperitiva, vožnje motorom, popravaka na brodu, priča, savjeta i nevjerojatno puno smijeha.\nI onda sam shvatio zašto mi je ovih nekoliko dana bilo toliko posebno.\nPetnaest godina oni su dolazili u moj svijet.\nU kliniku.\nNa moje radno mjesto.\nVjerovali su mi u trenucima kada njima nije bilo lako.\nA sada su oni otvorili vrata svog svijeta meni.\nI tek tada shvatiš nešto što tijekom godina rada ponekad zaboraviš.\nOsoba koja sjedi preko puta tebe nikada nije samo pacijent.\nIza nje postoji cijeli jedan život.\nObitelj.\nPrijatelji.\nPosao.\nLjubavi.\nSnovi.\nProblemi.\nI stotine priča koje nikada nisi čuo.\nMožda sam nekima od tih ljudi svojim radom promijenio dio života.\nAli ovih nekoliko dana u Positanu oni su nešto promijenili u meni.\nPokazali su mi koliko odnosi koje stvaramo kroz život mogu trajati puno duže od razloga zbog kojeg smo se prvi put upoznali.\nI zato mi je bilo tako teško otići.\nKada sam podigao sidro i pogledao Positano iza sebe, nisam više gledao samo jedan prekrasan grad na Amalfi obali.\nGledao sam mjesto u kojem su ostali moji ljudi.\nI jedan mali dio mojega srca.\nZato ovo sigurno nije bilo zbogom.\nSamo:\nArrivederci, Positano.\nVratit ću se.\nTHE OTHER SIDE\nFor years, they came into my world.\nThis time, I had the privilege of entering theirs.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "16.9 10:20": "Dobro jutro s INVICTUSA.\nIschia je ostala iza mene.\nNastavljam prema sjeveru. Prošao sam uz Santo Stefano, mali otok s nevjerojatnom i pomalo mračnom poviješću, na kojem se nalazi veliki napušteni zatvor star više od 200 godina, pa dalje uz Ventotene.\nDanas je more mirno, vrijeme lijepo i nema razloga za žurbu.\nKurs je prema Pontinskim otocima i Ponzi. Tamo ćemo pronaći neku lijepu uvalu, baciti sidro i odlučiti gdje INVICTUS ostaje večeras.\nA sutra… Palmarola.\nPolako prema sjeveru. Dan po dan. Otok po otok.\n     Sažmi", "16.9 16:53": "Chiaia di Luna, Ponza.\nJedno od onih mjesta zbog kojih vrijedi skrenuti s rute.\nOgromna bijela stijena, tirkizno more i plaža u obliku polumjeseca po kojoj je i dobila ime — Chiaia di Luna.\nDanas je plaža zbog opasnosti od odrona zatvorena za pristup s kopna, ali s mora izgleda još impresivnije.\nINVICTUS na sidru, kupanje i nekoliko sati bez ikakvog razloga da se ide dalje.\nPonekad je najbolji plan jednostavno — ostati.\n     Sažmi", "17.9 07:02": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam završio u jednom malom lokalnom restoranu.\nNišta fancy.\nCijela obitelj radi zajedno. Netko kuha, netko poslužuje, netko razgovara s gostima. Hrana odlična, atmosfera još bolja.\nNema velike predstave.\nSve nekako jednostavno funkcionira.\nA onda u jednom trenutku pogledam prema vlasniku.\nPosao se malo smirio, gosti jedu, sve je pod kontrolom…\nČovjek uzme jastuk, legne na stol i — odmara.\nPrvo sam se nasmijao.\nA onda pomislio:\nMožda čovjek zapravo zna nešto što smo mi ostali zaboravili.\nMi stalno negdje jurimo.\nJoš jedan posao. Još jedan mail. Još jedan cilj. Još nešto što „moramo“ napraviti prije nego što si konačno dopustimo stati.\nA ovdje?\nHrana je dobra.\nObitelj je zajedno.\nGosti su zadovoljni.\nSunce polako pada.\nI ako je sve u redu…\nzašto ne bi malo legao?\nTalijani imaju savršenu riječ za to:\nTranquillo.\nNe znači da te nije briga.\nNe znači da nemaš obaveza.\nMožda samo znači da znaš prepoznati trenutak kada je sve dovoljno dobro da jednostavno budeš tu.\nŠto duže putujem, sve više mislim da možda ne moramo svaki dan napraviti velikim.\nNeki dani trebaju biti samo…\ndobra hrana, dobri ljudi, malo smijeha i mir.\nA ako se otvori pet minuta…\nnađeš stol.\nTRANQUILLO\nNot every moment needs a plan.\nSometimes, life is simply good as it is.\nŽelim vam jedan tranquillo dan, gdje god bili.\n     Sažmi", "18.9 07:16": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nVALUE\nPrice is what you pay.\nValue is what you get.\nJučer sam stigao u Porto Turistico di Roma, u Ostiji, na morskim vratima Rima.\nOvaj put nisam tražio marinu zato što mi treba struja ili voda.\nUpravo suprotno.\nINVICTUS je napravljen tako da može dugo biti potpuno neovisan. Imam velike baterije, solar, generator, watermaker… tako da su mi priključci za struju i vodu u marini zapravo luksuz koji realno gotovo i ne trebam.\nRazlog dolaska je puno jednostavniji.\nVrijeme.\nZa danas i sutra ovdje se očekuje ozbiljnije pogoršanje vremena, s grmljavinom, pljuskovima i nestabilnim uvjetima.\nNakon posljednjih iskustava s noćnim olujama i sidrom, ovaj put nemam nikakvu potrebu dokazivati bilo što ni sebi ni moru.\nINVICTUS ide u sigurnu marinu.\nPonekad je najbolja pomorska odluka upravo ona najdosadnija.\nDoći ranije. Dobro se vezati. I pustiti nevrijeme da prođe.\nA onda me marina ugodno iznenadila.\nVeliki vez za INVICTUS, struja i voda, odlična infrastruktura, servisi, riggeri, trgovine, restorani, kafići… praktički sve što brodu može zatrebati.\nI onda cijena:\n110 € dnevno.\nOdmah sam se sjetio zadnje marine koju sam platio u Hrvatskoj.\nSlano — 310 € za jednu noć.\nGotovo tri puta više.\nNe želim od toga raditi priču Italija protiv Hrvatske. Lokacija, sezona, potražnja i uvjeti nisu isti.\nAli natjeralo me ponovno razmisliti o jednoj jednostavnoj stvari:\nCijena i vrijednost nisu isto.\nMožeš nešto platiti puno i dobiti malo.\nA ponekad platiš puno manje nego što očekuješ — i dobiješ upravo sve što ti treba.\nI nekako mi se čini da isto vrijedi i za život.\nNajskuplji restoran ne mora ti dati najbolju večeru.\nNajskuplji hotel ne mora ti ostaviti najljepšu uspomenu.\nNajskuplji brod ne mora imati najsretniju posadu.\nA najbolja večera ponekad bude za običnim drvenim stolom, s hranom koju je napravila jedna obitelj i ljudima s kojima se smiješ cijelu večer.\nNajljepše mjesto ponekad nije ono s pet zvjezdica, nego mala uvala u kojoj si potpuno sam.\nA čovjek kojeg slučajno upoznaš uz kavu od dva eura može ti dati razgovor ili priču koju ćeš pamtiti cijeli život.\nŠto duže putujem, sve manje gledam koliko nešto košta, a sve više što mi to daje.\nVrijeme.\nMir.\nSigurnost.\nIskustvo.\nSmijeh.\nLjude.\nUspomene.\nJer neke od najvrjednijih stvari koje sam do sada dobio na ovom putovanju nisu imale nikakvu cijenu.\nI možda je upravo to razlika između price i value.\nCijena je broj koji piše na računu.\nVrijednost je ono što ostane nakon što račun zaboraviš.\nA danas meni vrijednost ove marine nisu ni struja ni voda.\nTo su siguran vez, mirna noć i mogućnost da bez razmišljanja gledam grmljavinu iz marine, a ne s otvorenog sidrišta.\nI izgleda da ovdje imaju i vrlo povoljnu terapiju za kapetana.\nAperol & Campari Therapy — 9,90 €.\nIspod još bolja poruka:\nIl tuo psicologo costa di più.\nTvoj psiholog košta više.\nMožda je i to dio talijanskog shvaćanja vrijednosti.\nZa sada INVICTUS ostaje sigurno vezan.\nNeka kiša pada. Neka grmi.\nKad vrijeme ponovno otvori vrata — nastavljamo prema sjeveru.\nVALUE\nPrice is what you pay.\nValue is what you get.\nSY INVICTUS • AROUND THE WORLD\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "19.9 06:29": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer nije bilo velikih avantura.\nNisam napravio 100 milja. Nisam se borio s valovima. Nisam otkrio neko spektakularno mjesto.\nAli napravio sam puno malih stvari koje će mi omogućiti da danas ponovno dignem konope i krenem dalje.\nJoš uvijek tražim odakle mi se povremeno pojavljuje malo slane vode u lijevoj kaljuži. Pregledavao sam, tražio, provjeravao… odgovor još nemam.\nNisu svi problemi riješeni isti dan.\nOnda glavno jedro.\nVeć neko vrijeme nisam ga mogao podignuti potpuno do vrha jer mi se konop gore stalno zapetljavao.\nJučer sam se konačno primio toga kako treba.\nMalo razmišljanja, pokušavanja, živciranja…\nI na kraju — riješeno.\nOprao sam čak i dvije mašine robe\n.\nNakon toga bicikl i malo Ostije.\nMoram priznati, nije me oduševila. Ima lijepu dugu plažu i šetnicu uz more, ali ostatak grada na mene je ostavio prilično tmuran dojam.\nVratio sam se u marinu, nešto pojeo i onda ponovno na INVICTUS.\nA tamo druga polovica mojeg života koja putuje sa mnom.\nLaptop.\nCT-i pacijenata koje sam morao očitati, planiranja implantoloških slučajeva koje još uvijek radim i nekoliko stvari za kliniku.\nKad je i to bilo gotovo — čišćenje.\nOprao sam INVICTUS, posložio stvari i pripremio brod za najavljeno nevrijeme.\nI onda čekanje.\nOko dva ujutro stigla je grmljavina.\nKiša, munje…\nI nakon otprilike pola sata — gotovo.\nJutros ponovno mir.\nI dok gledam novi dan, razmišljam kako na društvenim mrežama uglavnom pokazujemo velike trenutke.\nOluje. Prekrasne zalaske. Positano. Jedrenje. Delfine. Ljude koje upoznajemo.\nAli život — pa tako i put oko svijeta — najvećim dijelom se ne sastoji od tih trenutaka.\nSastoji se od stotina malih stvari koje nitko ne vidi.\nPopraviti konop.\nPronaći gdje ulazi voda.\nOdgovoriti na poruku.\nNapraviti posao.\nOprati brod.\nProvjeriti prognozu.\nPripremiti se.\nI možda upravo te male, obične stvari određuju koliko daleko na kraju možemo stići.\nNapredak nije uvijek velika promjena.\nPonekad je samo jedan riješen problem više nego jučer.\nDanas gledam prognozu, platit ću marinu i, ako uvjeti ostanu dobri, INVICTUS ponovno ide prema sjeveru.\nPROGRESS\nNot every day brings a great adventure.\nSome days simply prepare you for the next one.\nSY INVICTUS • AROUND THE WORLD\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "19.9 10:46": "Danas je INVICTUS prošao pokraj ušća Tibera — rijeke koja je stoljećima bila životna arterija Rima.\nPrije dvije tisuće godina ovdje su iz cijelog tada poznatog svijeta stizali veliki trgovački brodovi puni žita, vina, ulja, mramora i amfora.\nVeliki brodovi iskrcavali su teret u Ostiji, a zatim su ga manjim teglenicama prevozili Tiberom sve do Rima. Neke su uzvodno, s obale, vukli ljudi i volovi.\nTeško je danas, dok mirno prolazim ovim ušćem, ne pokušati zamisliti sve te brodove, mornare i trgovce koji su prije gotovo dvije tisuće godina plovili istim vodama.\nDanas velikim jedrilicama više nije moguće doploviti Tiberom do samog Rima. Mostovi su preniski, rijeka je plića, a vremena su se promijenila.\nAli more je još uvijek isto.\nVrijeme je prekrasno, sunce prati INVICTUS, a ja nastavljam dalje prema sjeveru — prema Civitavecchiji.\nPolako, bez žurbe.\nJoš jedan dan, još jedan dio povijesti i još nekoliko milja prema novom mjestu.\n     Sažmi", "19.9 14:30": "Danas napokon jedrim na prednje i potpuno otvoreno glavno jedro — jučer sam ga popravio!\nDesno od mene ostaje Civitavecchia, velika luka puna kruzera, a INVICTUS nastavlja prema sjeveru, u smjeru Orbetella. Malo oblaka oko mene, ali radar ne pokazuje ništa ozbiljno. Vrijeme je odlično i idemo dalje!", "20.9 07:00": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam nastavio prema sjeveru. Prošao Civitavecchiju i predvečer stigao do Monte Argentaria, gdje sam spustio sidro ispred Porto Ercole.\nA nekoliko milja prije dolaska more mi je poklonilo jedan od onih trenutaka koje ne možeš planirati.\nPored mene je prošla prekrasna jedrilica.\nPod punim jedrima, okupana večernjim suncem, jednostavno je klizila kroz more.\nBez buke. Bez žurbe.\nNekoliko minuta samo sam je gledao i snimao.\nVjetar. More. Jedra. Sunce.\nSve je bilo na svom mjestu.\nHarmonija.\nI pomislio sam koliko često u životu tražimo harmoniju na potpuno pogrešan način.\nMislimo da ćemo je pronaći kada riješimo sve probleme. Kada bude manje posla, manje briga, manje obaveza. Kada se more konačno smiri i prestane puhati.\nAli možda harmonija uopće nije u tome.\nJedrilici treba vjetar da bi plovila.\nNe može birati odakle će vjetar doći, koliko će trajati ni kada će promijeniti smjer.\nAli može prema njemu namjestiti svoja jedra.\nMožda je tako i sa životom.\nNe možemo kontrolirati sve što nam dolazi. Ne možemo zaustaviti svaki val niti cijeli život ploviti samo po bonaci.\nPonekad treba otvoriti sva jedra.\nPonekad ih treba skratiti.\nPonekad promijeniti kurs.\nA ponekad jednostavno prestati tvrdoglavo ploviti protiv vjetra.\nNe moraš pobijediti svaki vjetar.\nPonekad je dovoljno naučiti ploviti s njim.\nMožda je upravo to harmonija.\nJutros se budim na sidru ispred Porto Ercole.\nNovi dan. Novo mjesto. Novi vjetar.\nI nigdje ne žurim.\nHARMONY\nHarmony begins when you stop fighting the wind\nand learn to sail with it.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "20.9 15:16": "Dobar dan s INVICTUSA.\nJučer Porto Ercole, jutros Porto Santo Stefano i prekrasni poluotok Monte Argentario.\nVrijedilo ih je vidjeti, ali to ipak nisu ona mjesta koja ja tražim na ovom putovanju. Prevelika su, puna ljudi i turista, pomalo kao naš Rovinj.\nMene više privlače ona mala mjesta koja jedva pronađeš na karti. Nekoliko kuća, mala ribarska luka, par barki i konoba uz more. Mjesta u kojima navečer još uvijek znaš da si stigao na otok, a ne u turističko središte.\nZato sam danas ponovno krenuo na more, prema Isola del Giglio.\nMali otok, ali s nevjerojatno velikom pričom.\nOvdje su još Etruščani i Rimljani živjeli od mora, vina i granita. Godine 1544. otok je napao čuveni Barbarossa i velik dio stanovništva odveo u ropstvo. Visoko iznad mora i danas stoji utvrđeni Giglio Castello, podsjetnik na stoljeća u kojima su stanovnici ovog malog otoka morali paziti tko im dolazi s horizonta.\nA gotovo pet stoljeća poslije ime Giglio ponovno je obišlo svijet.\n13. siječnja 2012. – Costa Concordia.\nVeliki kruzer udario je u hridi Le Scole, neposredno uz otok. Nakon udara završio je kod Punta Gabbianara, uz Giglio Porto. U tragediji su poginule 32 osobe.\nDanas s INVICTUSOM prolazim upravo tim morem.\nOd Etruščana i Rimljana, preko Barbarosse, pa sve do Costa Concordije – nevjerojatno koliko priča može stati na jedan tako mali komadić zemlje usred Tirenskog mora.\nI upravo takva mjesta tražim na ovom putovanju.\nNe najveća.\nNe najpoznatija.\nNe ona s najviše turista.\nNego ona koja još uvijek imaju svoju priču.\nSY INVICTUS – Around the World\n     Sažmi", "21.9 07:00": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nRETURN\nJučer sam stigao na Isola del Giglio.\nPrekrasan mali otok, mirno more, mala luka i ona atmosfera ribarskog mjesta koju toliko volim.\nAli ovdje postoji priča od koje se ne može pobjeći.\nCosta Concordia.\n1. siječnja 2012. u 21:45, Costa Concordia udarila je u stijene Le Scole, samo oko 90 metara od obale Giglia. Udar je otvorio veliku pukotinu na lijevoj strani trupa. Na brodu je bilo 4.229 ljudi. 32 osobe izgubile su život.\nJučer predvećer  sam došao do spomenika u Giglio Portu.\nIspod kipa nalaze se dvije ploče.\nNa desnoj, brončanoj, uklesana su imena 32 ljudi koji se te noći nisu vratili kući. Ta je ploča otkrivena na prvu godišnjicu tragedije, 2013.\nA pokraj nje je svijetla mramorna ploča.\nNa vrhu piše:\n“Ai caduti in mare del Costa Concordia\nil 13-01-2012.”\nPoginulima u moru s Costa Concordije\n13. 1. 2012.\nI ispod toga:\nLA PREGHIERA DEI NAVIGANTI\nMolitva pomoraca.\nTa je ploča postavljena deset godina nakon tragedije, 2022., uz postojeću ploču s imenima žrtava.\nI upravo je kombinacija te dvije ploče ono što me zaustavilo.\nS jedne strane 32 imena.\nS druge strane molitva ljudi koji odlaze na more.\nKada i sam gotovo svakog jutra podižem sidro i odlazim prema nekom novom mjestu, riječi te molitve više nisu samo riječi na kamenu.\nOne govore o kursu.\nO vjeri.\nO obitelji koja ostaje na kopnu.\nO moru koje nas razdvaja, ali nas ponovno i spaja.\nI prije svega — o povratku.\nJer iza svih naših ruta, milja, avantura, oluja i novih mjesta postoji jedna jednostavna želja koju vjerojatno dijeli svaki pomorac:\nvratiti se kući.\nKad isplovim, razmišljam o vremenu, vjetru, valovima, motorima, jedrima, sidru, elektronici…\nAli možda je najvažniji cilj svakog putovanja onaj koji nikada ne upisujemo u navigaciju.\nPovratak.\nOploviti svijet bilo bi prekrasno.\nAli još je važnije jednog dana zatvoriti krug.\nVratiti se ljudima koje voliš.\nJučer sam stajao pred 32 imena ljudi kojima to nije bilo dano.\nI zato danas, kada ponovno podignem sidro, možda ću malo drugačije gledati na svaku odluku koju donesem na moru.\nNe treba pobijediti more.\nTreba ga poštovati dovoljno da ti dopusti da se jednog dana vratiš.\nRETURN\nMay every ship stay true to its course,\nand every sailor keep the faith.\nAnd may every journey end\nwith a safe return home.\nIn memory of the 32 victims of Costa Concordia\n13 January 2012\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "21.9 13:34": "MONTE ARGENTARIO\nJučer sam odlučio malo bolje upoznati Monte Argentario prije nego nastavim dalje prema sjeveru.\nMjesto koje s mora izgleda kao otok, a s kopnom ga povezuju uski pješčani pojasevi oko lagune Orbetello.\nKrenuo sam od Porto Ercole i napravio krug oko poluotoka.\nIz zraka se tek vidi koliko je ovo mjesto posebno — strme obale, male uvale, luke pune brodova i stare utvrde koje još uvijek gledaju prema moru.\nProšao sam uz Forte Filippo, zatim Porto di Cala Galera i Rocca Spagnola, pa dalje prema Porto Santo Stefano.\nLijepo je ponekad vidjeti obalu i iz druge perspektive. Mjesta pokraj kojih s INVICTUSOM samo prođem odjednom dobiju potpuno drugačiji oblik kada ih pogledaš odozgo.\nA onda, pred kraj dana, još jedan gost.\nDok sam bio uz jedan stari brod, ovaj pernati gospodin potpuno mirno sjedi među konopima kao da je vlasnik broda i pita se što ja tu radim.\nČini mi se da što duže putujem, sve manje su mi važna velika turistička mjesta, a sve više upravo ovakvi mali trenuci.\nSada je vrijeme ponovno podignuti sidro.\nMonte Argentario ostaje iza mene.\nINVICTUS ide dalje prema sjeveru.\n     Sažmi", "21.9 17:15": "ELBA\n | Promjena plana\nDanas je plan bio Portoferraio.\nAli… planovi su tu da se mijenjaju.\nKad sam se približio Portoferraiu, shvatio sam da to ipak nije ono što danas tražim. Ogromni trajekti koji neprestano ulaze i izlaze, promet, gužva, veliki grad… jednostavno nije moj đir.\nZato sam samo produžio dalje.\nI mislim da nisam pogriješio.\nStigao sam u Marciana Marinu, prekrasno malo mjesto na sjeverozapadnoj strani Elbe, stisnuto između mora i zelenih brda. Potpuno drugačija atmosfera. Mirnija, manja, nekako više moja.\nElba je mali otok, ali iza sebe ima nevjerojatnu povijest.\nNaravno, najpoznatija je priča o Napoleonu Bonaparteu.\nNakon abdikacije 1814. Napoleon je prognan upravo na Elbu. Ali ovdje zapravo nije bio zatvorenik u klasičnom smislu. Postao je suveren otoka, imao svoju malu vojsku, zastavu, rezidencije i upravljao Elbom.\nNa otoku je proveo oko deset mjeseci, sve dok u veljači 1815. nije pobjegao i vratio se u Francusku. Uslijedilo je njegovih čuvenih Sto dana, koji su završili porazom kod Waterlooa.\nAli Elba je puno više od Napoleona.\nPlanine, šume, stara kamena sela, mala mjesta uz more, rudarska povijest i potpuno različiti krajolici na tako malom prostoru.\nI iskreno, nakon toliko vremena na moru, malo sam se zaželio kopna.\nZato je plan za sutra upoznati Elbu na potpuno drugačiji način.\nMožda izvadim bicikl s INVICTUSA, a možda ipak unajmim motor i napravim pravi đir po otoku. Želim otići u unutrašnjost, pronaći ona mala stara mjesta u brdima, proći kroz Marcianu i vidjeti Elbu koju s mora jednostavno ne možeš upoznati.\nA onda – Monte Capanne.\nNajviši vrh Elbe, 1.019 metara iznad mora.\nDo gore vodi jedna od najzanimljivijih žičara koje sam vidio. Nema velike zatvorene kabine. Umjesto nje vise male, otvorene žute košare u koje stanu samo dvije osobe.\nVeć sama vožnja izgleda kao mala avantura.\nA s vrha, ako vrijeme bude na mojoj strani, pogled bi trebao sezati preko cijele Elbe i velikog dijela Toskanskog arhipelaga.\nNakon toliko vremena provedenog na moru i gledanja kopna s palube INVICTUSA, sutra ćemo stvari malo okrenuti…\ngledat ćemo more s vrha Elbe.\nI možda je upravo to ono najljepše na ovom putovanju.\nNe moraš uvijek završiti tamo gdje si ujutro planirao.\nPonekad samo nastaviš još nekoliko milja dalje…\ni pronađeš mjesto na kojem zapravo želiš ostati.\nSY INVICTUS | Around the World\n     Sažmi", "22.9 08:22": "IMPOSSIBLE\nDobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam stigao na Elbu.\nOtok koji je zauvijek ostao povezan s jednim od najpoznatijih ljudi u povijesti.\nNapoleonom Bonaparteom.\nČovjekom koji je osvojio veliki dio Europe, postao car Francuske, izgubio gotovo sve — i 1814. završio upravo ovdje, u egzilu na malom otoku u Tirenskom moru.\nA Napoleon je godinu dana ranije u jednom pismu napisao rečenicu koja će ga nadživjeti:\n“Impossible is not French.”\nOdnosno, u originalnom kontekstu:\n„Pišete mi da to nije moguće. To nije francuski.“\nSviđa mi se ta rečenica.\nNe zato što mislim da je u životu baš sve moguće.\nNije.\nPostoje granice koje nam postavljaju priroda, vrijeme, zdravlje, more i život.\nAli postoji još jedna vrsta granica.\nOne koje sami sebi postavimo.\n„Prekasno je.“\n„Prestari smo.“\n„Nemam vremena.“\n„Ne mogu.“\n„To nije za mene.“\n„Jednog dana…“\nKoliko stvari u životu nikada ni ne pokušamo samo zato što smo ih unaprijed proglasili nemogućima?\nNapoleon je s Elbe gledao prema kontinentu nakon što je izgubio carstvo.\nMnogi bi njegovu priču tada smatrali završenom.\nAli manje od godinu dana kasnije napustio je Elbu, vratio se u Francusku i ponovno preuzeo vlast — započelo je njegovih poznatih Sto dana.\nKako je završilo, znamo.\nWaterloo.\nAli meni danas nije zanimljiva njegova pobjeda ni poraz.\nZanimljiv mi je trenutak prije pokušaja.\nOnaj trenutak kada još ne znaš hoćeš li uspjeti.\nKada postoji samo odluka:\npokušati ili odustati.\nPrije nekoliko godina ideja da ostavim posao, sjednem na svoj brod i krenem oko svijeta mnogima je vjerojatno zvučala prilično nemoguće.\nPonekad je tako zvučala i meni.\nA jutros se budim na Elbi.\nTisućama milja od prvog dana ovog putovanja, s još gotovo cijelim svijetom ispred pramca INVICTUSA.\nNe znam hoću li ostvariti svaki plan koji sam napravio.\nNe znam gdje će me more zaustaviti, gdje će promijeniti moj kurs i koliko će ovo putovanje na kraju trajati.\nAli jedno znam.\nDa nisam krenuo, odgovor bih znao unaprijed.\nZato možda nije potrebno vjerovati da je sve moguće.\nDovoljno je ne odlučiti prerano da nešto nije.\nIMPOSSIBLE\nNever decide too early\nwhat cannot be done.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "22.9 16:12": "MONTE CAPANNE – ELBA\nDanas jedan potpuno drugačiji dan na INVICTUSU.\nMore sam na nekoliko sati zamijenio planinama.\nUjutro sam u Marciana Marini uzeo skuter i krenuo prema unutrašnjosti Elbe, sve do podnožja Monte Capannea, najvišeg vrha otoka na 1.019 metara.\nA onda žičarom – i to ne bilo kakvom.\n Male otvorene žute košare vode gotovo do samog vrha, a posljednji dio nastavio sam pješice, preko stijena, sve do vrha.\nI vrijedilo je svakog koraka.\nPogled odozgo je nevjerojatan. Elba ispod mene, more na sve strane, otoci Toskanskog arhipelaga u daljini i savršen sunčan dan.\nVeć gotovo dva mjeseca s INVICTUSA gledam kopno s mora.\nDanas sam napravio upravo suprotno.\nS vrha Elbe gledao sam more kojim putujem.\nPonekad je dobro ostaviti brod na jedan dan i pogledati svoje putovanje iz neke sasvim druge perspektive.\nSY INVICTUS | Around the World\n     Sažmi", "23.9 07:25": "PERSPECTIVE\nDobro jutro s INVICTUSA.\nJutarnja misao…\nJučer sam se popeo na Monte Capanne, najviši vrh Elbe.\nViše od tisuću metara iznad mora gledao sam otok, obalu i beskrajno plavetnilo kojim plovim već gotovo dva mjeseca.\nI pomislio koliko jedna te ista stvar može izgledati potpuno drugačije kada je pogledaš iz druge perspektive.\nS mora planina izgleda ogromna.\nS vrha planine more izgleda beskrajno.\nA tako je nekako i u životu.\nPonekad smo toliko blizu problemu da vidimo samo problem.\nPonekad nas netko povrijedi i želimo odgovoriti odmah. Nešto krene krivo i odmah želimo donijeti odluku. U tom trenutku sve izgleda veliko, važno i hitno.\nA možda nije.\nPonekad je najbolje odmaknuti se.\nPogledati istu stvar iz drugog smjera.\nPričekati nekoliko sati.\nPrespavati jednu noć.\nNe odgovoriti odmah.\nNe donositi odluku dok još govore emocije.\nJer vrijeme možda neće promijeniti ono što se dogodilo, ali može promijeniti način na koji to vidimo.\nI onda problem koji je jučer izgledao kao planina, danas možda izgleda samo kao još jedna prepreka na putu.\nNe moramo uvijek promijeniti život.\nNe moramo uvijek promijeniti ljude oko sebe.\nNe moramo čak ni promijeniti smjer.\nPonekad samo trebamo promijeniti mjesto s kojeg gledamo.\nPERSPECTIVE\nSometimes nothing needs to change —\nexcept the way you look at it.\nA jutros je i Elba promijenila perspektivu.\nJučer sunce i gotovo ljetni dan, a danas oblaci i osjetno hladnije.\nČekam da se otvori ona mala benzinska u Marciana Marini. Toliko je mala da će biti poprilično veselo dovesti INVICTUS do nje i natočiti gorivo.\nA onda ponovno prema sjeveru.\nNajvjerojatnije prema Capraiji – malom, divljem vulkanskom otoku između Elbe i Korzike.\nOtok ima samo oko 19 km², gotovo cijeli je zaštićena priroda, a umjesto velikih gradova čekaju me mala luka, mjesto iznad nje, stara genoveška tvrđava, divlja obala i crvene vulkanske stijene Cala Rosse.\nDrugim riječima…\nzvuči baš kao moje mjesto.\nJučer sam gledao more s vrha Elbe.\nDanas ću ponovno gledati kopno s mora.\nNova perspektiva. Novi otok. I put dalje.\nSY INVICTUS | Around the World\n     Sažmi", "23.9 10:37": "ELBA\n | Više od Napoleona\nDva dana na Elbi u manje od tri minute.\nNa Elbu sam došao znajući uglavnom jednu priču – Napoleon Bonaparte.\nOdlazim shvaćajući da je Napoleon samo mali dio onoga što ovaj otok ima za ponuditi.\nOd mora i Marciana Marine, preko malih kamenih mjesta u unutrašnjosti, vožnje skuterom zavojitim cestama, pa sve do one nevjerojatne otvorene žičare i Monte Capannea na 1.019 metara.\nJučer sam INVICTUS ostavio dolje uz more i otišao upoznati Elbu s kopna.\nI vrijedilo je.\nJer otok koji s mora izgleda kao još jedan komadić zemlje u Mediteranu, iznutra je potpuno druga priča.\nNapravio sam mali video o tome kako sam ja doživio Elbu.\n2 minute i 40 sekundi jednog prekrasnog dana.\nA sada je vrijeme ponovno podignuti sidro i nastaviti prema sjeveru.\nArrived by sea. Explored by land. Remembered forever.\nSY INVICTUS | Around the World\n     Sažmi", "24.9 06:47": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nSIMPLICITY\nJučer sam stigao na Capraiju.\nMaleni otok s jednim mjestom i malom lukom u koju s INVICTUSOM nije baš jednostavno ući.\nOd luke do gornjeg dijela mjesta vodi jedna cesta, duga možda 800 metara.\nProšao sam njome polako. Bez cilja koji moram stići, bez gledanja na sat.\nCapraia je izolirana, ali ne djeluje tužno ni prazno.\nMeni se učinila nekako zadovoljnom.\nKao da ovdje život ima dovoljno prostora upravo zato što se ne pokušava stalno negdje požuriti.\nA onda sam se predvečer biciklom vraćao prema luci.\nNigdje nikoga.\nSamo cesta, drveće i tišina.\nSunce je prolazilo kroz krošnje, milovalo me po licu i grijalo dok sam se polako spuštao prema INVICTUSU.\nI baš tada me pogodila jedna sasvim jednostavna misao.\nPa ovo je dovoljno.\nNišta se posebno nije događalo.\nNije bilo spektakularnog zalaska, oluje, delfina ni neke velike avanture.\nSamo sunce na licu, bicikl, prazna cesta i osjećaj da baš nigdje ne moram biti.\nI možda me taj osjećaj toliko pogodio upravo zato što sam više od 25 godina živio potpuno drugačije.\nVoditi kliniku u Opatiji s 35 ljudi koji rade s tobom.\nPacijenti. Operacije. Organizacija.\nVoditi naše vanjske partnerske klinike i stalno putovati iz jedne klinike u drugu.\nRazvijati individualne No Bone implantate.\nEducirati druge stomatologe, u svojoj klinici i izvan nje.\nPredavanja. Kongresi. Avioni. Hoteli.\nTelefoni koji stalno zvone. Poruke na koje treba odgovoriti. Odluke koje treba donijeti.\nA paralelno s time firma koja svakog mjeseca mora funkcionirati.\nPlaće.\nKrediti.\nLeasingi.\nObaveze.\nSvjetske krize.\nInflacija.\nI još stotinu stvari koje nitko drugi neće riješiti ako ih ti ne riješiš.\nI negdje između svega toga — privatni život.\nOnaj koji je možda najčešće čekao da sve drugo bude gotovo.\nA nikada nije bilo gotovo.\nI to ne jedan težak dan.\nNe jedan mjesec.\nNe jedna naporna godina.\nGodinama.\nProbudiš se i već razmišljaš što danas moraš riješiti.\nLegneš navečer, a glava još uvijek radi.\nDok razgovaraš s nekim, već u mislima slažeš sljedeću obavezu.\nČak i kada napokon sjedneš, treba ti vremena da se iznutra zaustaviš.\nI najzanimljivije je što nakon nekog vremena više ni ne misliš da si pod stresom.\nNavikneš se.\nPostane normalno.\nNosiš ga sa sobom toliko dugo da ga više gotovo ni ne osjećaš.\nAli to što ga ti više ne osjećaš, ne znači da on ne radi.\nI onda ti nakon godina takvog života počne govoriti tijelo.\nPočeli su se pojavljivati zdravstveni problemi.\nNišta o čemu želim ovdje posebno pisati, ali dovoljno da shvatim kako takav tempo ipak ima svoju cijenu.\nDugo sam i tada radio ono što sam najbolje znao.\nRiješiti problem i nastaviti dalje.\nJoš malo izdržati.\nZavršiti još ovo.\nRiješiti još ono.\nProći još jedan težak period.\nA onda će biti mirnije.\nSamo što to „onda“ nikako nije dolazilo.\nUvijek se pojavi nešto novo.\nI danas razmišljam da mi možda tijelo nije govorilo da trebam pronaći još jedan način kako izdržati isti tempo.\nMožda mi je govorilo da moram promijeniti tempo.\nI zato me jučer toliko pogodila jedna obična cesta na jednom malom otoku usred mora.\nVozim bicikl prema luci.\nSunce prolazi kroz krošnje drveća, miluje me po licu i grije.\nNigdje ne kasnim.\nNitko me ne čeka.\nU tom trenutku ne moram ništa riješiti.\nSamo cesta.\nSunce.\nTišina.\nI ja.\nI pomislim:\nMožda je upravo ovo luksuz koji sam cijeli život tražio.\nNe veći brod.\nNe bolji auto.\nNe još jedan uspjeh.\nNego trenutak u kojem nigdje ne moraš žuriti.\nJer sreća nam često promakne.\nNe zato što je nema.\nNego zato što kroz vlastiti život ponekad prolazimo prebrzo da bismo je primijetili.\nNaravno, ne možemo svi živjeti na malom otoku.\nNiti mir znači da više nemamo problema i obaveza.\nAli možda možemo ponekad usporiti dovoljno da stvarno budemo tamo gdje jesmo.\nPopiti kavu bez žurbe.\nSaslušati nekoga do kraja.\nPogledati oko sebe.\nOsjetiti sunce na licu.\nBiti s ljudima koje volimo, a da u glavi već nismo negdje drugdje.\nGodinama sam mislio da ću se odmoriti kada završim sve što trebam.\nSada polako shvaćam nešto drugo.\nNikada nećeš završiti sve.\nUvijek će postojati još jedan posao.\nJoš jedan poziv.\nJoš jedan problem.\nJoš jedno „moram“.\nAko čekaš da sve završi kako bi počeo živjeti mirnije, možda ćeš čekati cijeli život.\nCapraia me jučer podsjetila da mir ne počinje kada obavimo baš sve.\nPočinje
