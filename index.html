<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brodski dnevnik INVICTUS</title>
<meta name="description" content="Brodski dnevnik SY INVICTUS: put oko svijeta katamaranom, dan po dan, kao stara knjiga koja se lista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600;700&family=Caveat:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&display=swap">
<style>
/* Knjiga: stari brodski dnevnik. Kožne korice, požutjeli papir, rukom pisani upisi.
   Svaki dan je jedan dvostruki list: lijevo tablica dana i javljanja, desno zalijepljena "fotografija" (video).
   Na mobitelu jedno ispod drugog. */
:root{
  --desk:#22170f;--leather:#5b2a1b;--leather2:#3b1a10;--gold:#c9a24b;--gold2:#e6c97a;
  --paper:#eee1c0;--paper2:#e4d3a8;--edge:#cdb886;
  --ink:#2b2118;--ink2:#5a4a38;--red:#9b2d20;--blue:#22406a;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --blot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .1  0 0 0 .22 -.04'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>");
  --book:min(1200px,calc(100vw - 160px));
}
*{box-sizing:border-box}
html{color-scheme:light;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:400 18px/1.62 "EB Garamond",Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(255,200,120,.10),transparent 60%),
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,220,170,.03) 9px 11px,transparent 11px 23px),
    linear-gradient(180deg,#2b1d13,#1b120c);
  background-attachment:fixed}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.hand{font-family:Caveat,cursive;color:var(--blue)}

/* gornja traka */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:calc(var(--book) + 40px);margin:0 auto;padding:14px 20px 10px;color:var(--gold2)}
.brand{font:600 15px/1.2 Cinzel,serif;letter-spacing:.14em;color:var(--gold2);text-decoration:none;margin-right:auto;text-transform:uppercase}
.brand b{font-weight:600;color:#f4dfa0}
.tb{appearance:none;border:1px solid rgba(201,162,75,.55);background:rgba(20,12,7,.45);color:var(--gold2);font:500 13px/1 Cinzel,serif;letter-spacing:.06em;padding:9px 13px;border-radius:3px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tb:hover{background:rgba(201,162,75,.16)}
select.tb{max-width:260px;padding-right:8px}
select.tb option{background:#2b1d13;color:#f0e2bd}

/* knjiga */
.book{width:var(--book);margin:6px auto 0;position:relative}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:14px;border-radius:8px 8px 10px 10px;perspective:2600px;
  background:var(--noise),linear-gradient(135deg,var(--leather),var(--leather2));
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,220,160,.08),inset 0 0 40px rgba(0,0,0,.45)}
/* listovi papira ispod stranice */
.page{position:relative;min-height:calc(100vh - 150px);padding:34px 44px 56px;
  background:var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28)}
.pl{border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,transparent 88%,rgba(90,60,25,.10) 96%,rgba(60,35,10,.38)),var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28),-1px 1px 0 var(--edge),-3px 3px 0 #e8d9b3,-4px 4px 0 var(--edge),-6px 6px 0 #e3d2a8,-7px 7px 0 var(--edge)}
.pr{border-radius:0 4px 4px 0;
  background:linear-gradient(270deg,transparent 88%,rgba(90,60,25,.10) 96%,rgba(60,35,10,.38)),var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28),1px 1px 0 var(--edge),3px 3px 0 #e8d9b3,4px 4px 0 var(--edge),6px 6px 0 #e3d2a8,7px 7px 0 var(--edge)}
/* hrbat s koncem */
.spread>.pl::after{content:"";position:absolute;top:30px;bottom:30px;right:-1px;width:2px;
  background:repeating-linear-gradient(180deg,rgba(80,50,20,.55) 0 7px,transparent 7px 26px);z-index:2}
.folio{position:absolute;bottom:18px;font:500 14px/1 "Cormorant SC",serif;letter-spacing:.12em;color:var(--ink2)}
.pl .folio{left:44px}.pr .folio{right:44px}

/* zaglavlje stranice */
.run{display:flex;justify-content:space-between;gap:10px;font:600 13px/1.3 "Cormorant SC",serif;letter-spacing:.16em;color:var(--ink2);border-bottom:1px solid rgba(43,33,24,.45);padding-bottom:6px;margin-bottom:14px}
.run .leg{color:var(--red)}
.title-day{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.title-day .dn{font:700 54px/0.9 "Cormorant SC",serif;color:var(--ink)}
.title-day .mo{font:600 24px/1.1 "Cormorant SC",serif;letter-spacing:.06em}
.title-day .wd{font:400 26px/1 Caveat,cursive;color:var(--blue)}

/* tablica dnevnika */
table.log{width:100%;border-collapse:collapse;margin:4px 0 22px;font-size:14px}
.log th{font:600 11.5px/1.2 "Cormorant SC",serif;letter-spacing:.14em;color:var(--ink2);text-align:left;padding:5px 8px;border:1px solid rgba(43,33,24,.5);background:rgba(120,85,30,.07)}
.log td{padding:5px 8px 4px;border:1px solid rgba(43,33,24,.5);vertical-align:top;font:400 21px/1.15 Caveat,cursive;color:var(--blue)}
.log td.c{white-space:nowrap}
.log .n{text-align:center;width:1%}

/* javljanja */
.list{position:relative}
.ent{position:relative;display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:4px 0 22px}
.ent::before{content:"";position:absolute;left:64px;top:0;bottom:0;border-left:1.5px solid rgba(155,45,32,.55)}
.ent .tm{font:700 24px/1.2 Caveat,cursive;color:var(--red);text-align:right;padding-right:6px}
.ent .tm .st{display:block;font-size:20px;line-height:1}
.ent>div:last-child{padding-left:14px;min-width:0}
.ent h3{margin:0 0 1px;font:700 22px/1.2 "Cormorant SC",serif;letter-spacing:.03em;color:var(--ink)}
.ent .pl-name{margin:0 0 8px;font:400 22px/1.1 Caveat,cursive;color:var(--blue)}
.ent .txt p{margin:0 0 .62em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.ent .txt h4{margin:.9em 0 .35em;font:600 16px/1.3 "Cormorant SC",serif;letter-spacing:.1em;color:var(--red)}
.ent .txt>:first-child::first-letter{font-family:"Cormorant SC",serif;font-weight:700;float:left;font-size:3.1em;line-height:.82;padding:6px 6px 0 0;color:var(--red)}
.ent .txt>h4:first-child::first-letter{all:unset}
.ent.sel h3{text-decoration:underline;text-decoration-color:rgba(34,64,106,.55);text-decoration-thickness:2px;text-underline-offset:4px}
.act{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.chip{appearance:none;background:none;border:0;padding:0;cursor:pointer;font:600 21px/1.2 Caveat,cursive;color:var(--blue);text-decoration:none;border-bottom:1.5px dashed rgba(34,64,106,.45)}
.chip:hover{color:var(--red);border-color:rgba(155,45,32,.5)}
.chip.on{color:var(--red);border-bottom-style:solid}
.sep{text-align:center;color:var(--ink2);letter-spacing:.6em;margin:-6px 0 14px;font-size:14px}

/* desna stranica: zalijepljena fotografija */
.media{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center}
.photo{position:relative;background:#f8f3e6;padding:12px 12px 14px;transform:rotate(-1.3deg);
  box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px rgba(60,35,10,.35);margin-top:10px}
.photo::before,.photo::after{content:"";position:absolute;width:96px;height:28px;background:rgba(232,220,180,.72);
  box-shadow:0 1px 2px rgba(0,0,0,.15);backdrop-filter:blur(.5px)}
.photo::before{top:-12px;left:-26px;transform:rotate(-38deg)}
.photo::after{top:-12px;right:-26px;transform:rotate(38deg)}
.player{height:min(calc(100vh - 290px),620px);aspect-ratio:9/16;background:#1d1610;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.fbonly{flex-direction:column;gap:14px;text-decoration:none;color:#f1e4c4;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 35%,#3a2a1c,#17110b 75%)}
.fbonly .pb{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gold2);padding-left:6px;transition:transform .15s}
.fbonly:hover .pb{transform:scale(1.08);background:rgba(201,162,75,.15)}
.fbonly .fl{font:600 30px/1.1 Caveat,cursive;color:var(--gold2)}
.fbonly .why{font:italic 15px/1.4 "EB Garamond",serif;color:#bfae88;max-width:240px}
.ph{color:#cdbb92;text-align:center;padding:20px;font:400 22px/1.3 Caveat,cursive}
.ph a{color:var(--gold2)}
.cap{margin:8px 2px 0;text-align:center;font:400 23px/1.15 Caveat,cursive;color:var(--blue);max-width:340px}
.cap span{color:var(--red);margin-left:8px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 0}
.tab{appearance:none;cursor:pointer;border:1px solid rgba(43,33,24,.45);background:rgba(255,248,230,.55);padding:3px 11px 1px;font:600 20px/1.2 Caveat,cursive;color:var(--ink2);border-radius:2px 2px 8px 8px}
.tab.on{background:var(--red);color:#fbeedd;border-color:var(--red)}
.mnote{margin:12px 0 0;font-size:14.5px;font-style:italic;color:var(--ink2);text-align:center}
.nophoto{margin-top:60px;text-align:center;border:1.5px dashed rgba(43,33,24,.4);padding:40px 24px;transform:rotate(.6deg);max-width:340px}
.nophoto p{font:400 24px/1.3 Caveat,cursive;color:var(--ink2);margin:0 0 8px}
blockquote{margin:34px auto 0;max-width:380px;text-align:center;padding:16px 10px 0;border-top:1px solid rgba(43,33,24,.35)}
blockquote q{display:block;font:italic 400 21px/1.4 "EB Garamond",serif;quotes:"„" "“"}
blockquote cite{display:block;margin-top:6px;font:600 12px/1.3 "Cormorant SC",serif;letter-spacing:.14em;font-style:normal;color:var(--red)}

/* naslovnica: kožne korice + naslovni list */
.leather{position:relative;border-radius:6px 2px 2px 6px;color:var(--gold2);text-align:center;padding:30px;
  background:var(--noise),radial-gradient(ellipse at 40% 35%,#6f3524,#45200f 75%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 60px rgba(0,0,0,.55),inset -14px 0 18px -8px rgba(0,0,0,.6)}
.frame{position:relative;height:100%;min-height:calc(100vh - 210px);border:2px solid rgba(201,162,75,.75);outline:1px solid rgba(201,162,75,.5);outline-offset:-9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 24px}
.frame::before,.frame::after{content:"❦";position:absolute;font-size:22px;color:var(--gold)}
.frame::before{top:14px;left:50%;transform:translateX(-50%)}
.frame::after{bottom:14px;left:50%;transform:translateX(-50%) rotate(180deg)}
.gilt{background:linear-gradient(180deg,#f6e2a2,#c9a24b 55%,#8e6a26);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.leather .small{font:600 15px/1 Cinzel,serif;letter-spacing:.42em;margin:0}
.leather h1{margin:4px 0 0;font:700 clamp(40px,5.2vw,68px)/1 "Cinzel Decorative",serif;letter-spacing:.06em}
.leather .sub{margin:0;font:500 15px/1.3 Cinzel,serif;letter-spacing:.3em}
.leather svg{width:150px;height:150px;margin:12px 0}
.leather .verse{margin:16px 0 0;font:italic 400 19px/1.45 "EB Garamond",serif;color:#e7cf8f}
.leather .henley{margin:0;font:500 11px/1 Cinzel,serif;letter-spacing:.24em;color:#bfa063}
.titlep{display:flex;flex-direction:column;align-items:center;text-align:center}
.titlep h2{margin:16px 0 0;font:700 40px/1.05 "Cormorant SC",serif;letter-spacing:.06em}
.titlep .of{font:italic 400 20px/1.4 "EB Garamond",serif;margin:2px 0 18px;color:var(--ink2)}
.rule{width:60%;height:10px;margin:2px auto 18px;background:linear-gradient(var(--ink2),var(--ink2)) center/100% 1px no-repeat;position:relative}
.rule::after{content:"⚓";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:var(--paper);padding:0 10px;font-size:16px;color:var(--ink2)}
.ledger{width:100%;max-width:470px;margin:0 0 20px;text-align:left}
.ledger div{display:grid;grid-template-columns:150px 1fr;align-items:baseline;border-bottom:1px solid rgba(43,33,24,.35);padding:5px 0 1px}
.ledger dt{font:600 13px/1.2 "Cormorant SC",serif;letter-spacing:.12em;color:var(--ink2)}
.ledger dd{margin:0;font:400 24px/1.1 Caveat,cursive;color:var(--blue)}
.stats{width:100%;max-width:470px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:4px 0 22px}
.stats>div{border:1px solid rgba(43,33,24,.4);padding:8px 10px 6px;text-align:center;background:rgba(255,250,235,.25)}
.stats>div.nm{grid-column:1/-1}
.stats b{display:block;font:700 30px/1 Caveat,cursive;color:var(--red)}
.stats .nm b{font-size:40px}
.stats span{display:block;font:500 13px/1.25 "Cormorant SC",serif;letter-spacing:.07em;color:var(--ink2);margin-top:3px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{appearance:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 15px/1 "Cormorant SC",serif;letter-spacing:.12em;padding:11px 16px 9px;border-radius:2px}
.btn:hover{background:rgba(43,33,24,.08)}
.btn.go{background:var(--leather);border-color:var(--leather);color:var(--gold2)}
.btn.go:hover{background:#6c3322}
.how{margin:18px 0 0;max-width:430px;font-style:italic;font-size:16px;color:var(--ink2)}

/* strelice sa strane knjige */
.side{position:fixed;top:50%;z-index:20;width:58px;height:58px;margin-top:-29px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(201,162,75,.8);color:var(--gold2);font:400 34px/1 "EB Garamond",serif;display:flex;align-items:center;justify-content:center;padding:0 0 4px;
  background:var(--noise),radial-gradient(circle at 35% 30%,#7a3a26,#3b1a10);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.25);transition:transform .15s,opacity .2s}
.side:hover{transform:scale(1.08)}
.side:disabled{opacity:.25;cursor:default;transform:none}
#sprev{left:max(8px,calc(50vw - var(--book)/2 - 74px))}
#snext{right:max(8px,calc(50vw - var(--book)/2 - 74px))}
.side .lb{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 Cinzel,serif;letter-spacing:.14em;color:#bfa063;pointer-events:none}

/* donja traka */
.nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:22px 16px 30px;color:#d8c08a}
.nav button{appearance:none;background:none;border:1px solid rgba(201,162,75,.45);color:var(--gold2);border-radius:3px;padding:7px 14px;cursor:pointer;font:500 13px/1 Cinzel,serif;letter-spacing:.06em}
.nav button:disabled{opacity:.3;cursor:default}
.pg{font:500 13px/1.3 Cinzel,serif;letter-spacing:.08em;text-align:center}
.pg b{font-weight:600;color:#f1dc9f}

/* okretanje lista */
.leaf{position:absolute;z-index:10;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.3,1);pointer-events:none}
.leaf.fwd{transform-origin:left center}.leaf.bwd{transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}.leaf.bwd.go{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face>.page{min-height:100%;height:100%;box-shadow:inset 0 0 70px rgba(130,90,35,.28)}
.face.back{transform:rotateY(180deg)}
.leaf .face.front::after,.leaf .face.back::after{content:"";position:absolute;inset:0;pointer-events:none;animation:shade .75s ease-in-out forwards}
@keyframes shade{0%{background:rgba(0,0,0,0)}50%{background:rgba(40,25,10,.28)}100%{background:rgba(0,0,0,0)}}
.under{position:absolute;z-index:5;overflow:hidden;pointer-events:none}
.under>.page{min-height:100%;height:100%}
.slide-next{animation:sn .4s ease-out}.slide-prev{animation:sp .4s ease-out}
@keyframes sn{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sp{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* sadržaj */
dialog{border:0;padding:0;width:min(720px,94vw);max-height:86vh;border-radius:4px;color:var(--ink);
  background:var(--blot),var(--noise),var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(130,90,35,.3)}
dialog::backdrop{background:rgba(15,9,5,.72)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 26px 10px;background:var(--paper);border-bottom:1px solid rgba(43,33,24,.45);z-index:1}
.dh h2{margin:0;font:700 28px/1 "Cormorant SC",serif;letter-spacing:.1em}
.dh .btn{padding:8px 12px 6px}
.toc{padding:6px 26px 26px}
.toc h3{margin:22px 0 6px;font:700 19px/1.2 "Cormorant SC",serif;letter-spacing:.08em;color:var(--red);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(155,45,32,.4);padding-bottom:3px}
.toc h3 small{font:400 15px/1.3 "EB Garamond",serif;font-style:italic;color:var(--ink2);letter-spacing:0}
.toc button{appearance:none;display:grid;grid-template-columns:62px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted rgba(43,33,24,.35);padding:5px 4px 3px;cursor:pointer;align-items:baseline}
.toc button:hover,.toc button.cur{background:rgba(155,45,32,.08)}
.toc .td{font:700 19px/1 Caveat,cursive;color:var(--red)}
.toc .tt{font-size:17px}
.toc .tn{font:400 18px/1 Caveat,cursive;color:var(--blue)}

@media (max-width:1100px){.page{padding:28px 30px 54px}.pl .folio{left:30px}.pr .folio{right:30px}}
@media (max-width:860px){
  :root{--book:calc(100% - 12px)}
  body{font-size:17.5px}
  .top{padding:10px 12px 8px;gap:8px}.brand{flex-basis:100%;font-size:13px}
  #jump{flex:1 1 150px;min-width:0;max-width:none}
  .spread{grid-template-columns:1fr;padding:7px;perspective:none}
  .page{min-height:0;padding:22px 30px 50px}
  .pl,.pr{border-radius:3px;box-shadow:inset 0 0 50px rgba(130,90,35,.28)}
  .spread>.pl::after{display:none}
  .day .pl,.day .pr{display:contents}
  .day{grid-template-areas:"head" "media" "list";background:var(--noise),linear-gradient(135deg,var(--leather),var(--leather2))}
  .day .phead,.day .list,.day .pmedia{background:var(--blot),var(--noise),var(--paper);box-shadow:inset 0 0 50px rgba(130,90,35,.25)}
  .day .phead{grid-area:head;padding:22px 30px 6px;border-radius:3px 3px 0 0}
  .day .pmedia{grid-area:media;padding:10px 30px 26px}
  .day .list{grid-area:list;padding:14px 30px 50px;border-radius:0 0 3px 3px;position:relative}
  .day .folio{display:none}
  .media{position:static}
  .player{height:auto;width:min(100%,340px)}
  .fbonly{aspect-ratio:9/12}
  .photo{transform:rotate(-1deg)}
  .title-day .dn{font-size:46px}
  .log th:nth-child(4),.log td:nth-child(4){display:none}
  .ent{grid-template-columns:46px 1fr;gap:0 8px}
  .ent::before{left:46px}
  .ent>div:last-child{padding-left:10px}
  .ent .tm{font-size:21px;padding-right:2px}
  .ent .txt p{text-align:left}
  .frame{min-height:480px;padding:48px 16px}
  .leather .sub{letter-spacing:.18em;font-size:13px}
  .leather{border-radius:4px;margin-bottom:7px}

["hrvatska","1. 8.","10:09","punat","Odvezani konopi","Nakon više od 25 godina rada, preko 30.000 operiranih pacijenata i izgradnje Poliklinike Smile, isplovljavam iz Marine Punat. Odluku je ubrzao gubitak dragih ljudi, među njima i prijatelja Damira Žića, kapetana Marine Punat.","pfbid02fRrqeZ5ATTM5uo3Y1uau6sag5EHVLRBzZAptXoSMoBBs6fpyzAKRn5JacnpbXTmhl",1,"Marina Punat"],
["hrvatska","2. 8.","12:02","zadar","Pozdrav usred mora","Kod Zadra mi brzim brodićem dolaze mahnuti Kristijan Tominić i njegova djevojka. Nisam imao pojma da dolaze.","pfbid02tLpfVDQTNqeTL9SBUJm7Vjka5QbSAQ56iBT9EMVbRUvrgqs4kim5LKggRBtUc3nTl",0,"Kod Zadra"],
["hrvatska","3. 8.","06:00","rogoznica","Dupini me ispraćaju","Na izlazu iz Rogoznice iz mora izranja cijela obitelj dupina i neko vrijeme plovi uz INVICTUS, baš dok svira Tu t'en vas. Kao mali pozdrav mora na početku velikog putovanja.","pfbid02MqcsVELbdTd6XzYhAcxiixwuyMa4YvhgddQAPq3yu69KTpfRVohjjhYZDQVPrhkyl",1,"Rogoznica"],
["hrvatska","3. 8.","10:23","split","Dupini, drugi put","U Splitu su mi otkazali servise i bio sam razočaran, pa sam okrenuo pramac prema Braču. A onda opet dupini, drugi put u istom danu.","1035403229214114",0,"Split – Brač"],
["hrvatska","3. 8.","16:26","hvarch","Jedrenje prema Jelsi","Kratko javljanje s jedrima gore, na putu prema Jelsi na Hvaru.","1726261451943191",0,"Hvarski kanal"],
["hrvatska","4. 8.","09:46","jelsa","Blagoslov u Jelsi","Don Ivan Jurin dolazi na brod blagosloviti mene i INVICTUS. Na rastanku mi daruje Novi zavjet i krunicu Gospe od Zdravlja, koji će biti sa mnom cijelim putem.","pfbid02ZYU9Zn8aXuRF2QEmXTenkUjT2vUuRzMAmAKAqdjTisy2CrBde4Uw3R8kxUumhmVbl",0,"Jelsa"],
["hrvatska","4. 8.","12:53","jelsa","Teretana na palubi","Dan bez vjetra, motori rade, more ravno. Da ne poludim od monotonije, paluba postaje teretana: sklekovi, trbušnjaci i trčanje po brodu.","1347010187539517",0,"Na putu prema Lastovu"],
["hrvatska","4. 8.","22:54","lastovo","Doček u Skrivenoj Luci","Očekivao sam mirnu uvalu i noć na sidru, a na obali me čekaju kum Dražen Galić, dr. Andrej Kravanja, dr. Andrej Božić i Bojan Galić s obiteljima. Večer koju neću zaboraviti.","pfbid0334FJYPxXiD1KQG8VgjyxqiJzrw3woovUmWCoKCqgnJUzhcCtMr1ZGsxTLTb7t54wl",0,"Skrivena Luka, Lastovo"],
["hrvatska","5. 8.","13:19","lastovo","Lastovo me zadržava","Danas ne isplovljavam. Ostajem zbog ljudi, a dan koristim da prvi put snimim otok dronom.","1391158946314910",0,"Skrivena Luka, Lastovo"],
["hrvatska","6. 8.","06:19","lastovo","Put nije utrka","Rano ujutro krećem s Lastova prema Šipanu i priznajem da pomalo odgađam odlazak iz Hrvatske. Na ovoj etapi pridružuje mi se kum Dražen Galić.","pfbid02hLGgEDUDCe72MAof6VnhEfuxA5BnreE5FE6mpoCsjyVcQhqeMzzAyhjMC4UhzAgFl",0,"Lastovo – Šipan"],
["hrvatska","6. 8.","17:53","sipan","Suze zahvalnosti","Radovan Jovančević iz Suđurđa šalje nam dvije boce vina, a u restoranu Bowa čeka šampanjac od dr. Jurkovića i supruge Vivian. Onda mi kći prijatelja dr. Andrije Božića stavlja narukvicu za sreću i sretan povratak, i tu više ne mogu zadržati suze.","pfbid02wDhKr8HBmHzGka65Mtd2h8EysoiTTZvaNtsoN1TZCHiyT6H6Ap3iG1wKutkYvBWxl",0,"Šipan, restoran Bowa"],
["hrvatska","8. 8.","06:46","dubrovnik","Odvezujem konope i odlazim iz Hrvatske","Jučer sam iz Slanog stigao u Dubrovnik, gdje me čekao rezervni propeler koji je Zlatko preusmjerio iz Splita. Večer s kolegama implantolozima dr. Miroslavom Kordom i dr. Varisom Krehićem, a sad konopi odlaze s rive.","pfbid02v2EnPEGXKfnWYY17LojXqi4VsguNex6XjoqeWzoX4osv3Z7Kqa9H3exVpKQPQPYbl",1,"Dubrovnik"],
["crna-gora","9. 8.","14:14","kotor","Prva strana zastava","Zelenika, prijava i carina, pa Marina Kotor i kolega Milan Vučetić. Iznenađenje je ekipa crnogorske nacionalne televizije, koju su nazvali ljudi što prate moje putovanje.","pfbid0J1Nrx2MPq6XZ4dW32iY6BMgCbcTnLc7F3keUGY6gxFzpzcsPFdMUfX5YfqUzmvdJl",1,"Zelenika – Kotor"],
["crna-gora","10. 8.","11:06","budva","Sidro kod Svetog Nikole","Kratko sidrim kod Budve, uz otok od kojeg nosim nekoliko amajlija. Kava, sitni popravci i dalje.","1347106120815285",0,"Budva"],
["crna-gora","11. 8.","06:37","bar","Doviđenja, Crna Goro","Iz Bara krećem prema Albaniji. Odlazim pun emocija, posebno zbog druženja s dr. Milanom Vučetićem, Darkom Mrvošem i dr. Igorom Ristićem.","1056335510213326",0,"Bar"],
["crna-gora","11. 8.","08:10","bar","Plavo ispod motora","Na jutarnjem pregledu motora sve je plavo: na protupožarnom cilindru puklo je kućište i tekućina je iscurila ispod lijevog motora. Gasim motore i pumpicama čistim prostor.","1365843409009524",0,"Na putu prema Albaniji"],
["albanija","13. 8.","14:44","vlora","Prema Zelenoj obali","Kratko javljanje s plovidbe od Vlorë prema Green Coastu.","27528487740186786",0,"Vlorë – Dhërmi"],
["albanija","14. 8.","07:25","green","Mreža na sidru","U pet ujutro sidro ne ide gore: preko noći netko je preko njega postavio neoznačenu ribarsku mrežu. Oslobađam je, ribe ostavljam vlasniku, a usput mi izbaci osigurač sidrenog vitla.","1385914083696424",0,"Green Coast"],
["albanija","14. 8.","13:22","green","Dan koji se pamti","Iz Vlore plovim s prijateljem dr. Ergysom Camijem i njegovom kćeri Efom. Kajgana i tost za doručak, puno jedrenja i još više smijeha.","1357844386540063",0,"Vlorë – Green Coast"],
["albanija","14. 8.","17:47","palermo","Tvrđava i podmornički tunel","Porto Palermo, uvala pod tvrđavom koja se veže uz Ali-pašu Tepelenskog. Nekoliko minuta dalje u stijenu je ukopan golemi podmornički tunel iz vremena Envera Hoxhe.","2308108319929182",0,"Porto Palermo"],
["albanija","14. 8.","19:58","palermo","Porto Palermo iz zraka","Tvrđava, tirkizno Jonsko more i INVICTUS usidren ispod nje, snimljeni dronom.","2508515122978226",0,"Porto Palermo"],
["albanija","15. 8.","06:01","saranda","Jutarnja misao","Sloboda nije uvijek bijeg od nečega. Ponekad je to samo odluka da napokon počneš živjeti život koji želiš.","1540566891416262",0,"Sarandë"],
["albanija","15. 8.","08:47","saranda","Posljednja albanska luka","Javljam se iz Sarandë, antičkog Onchesmosa, kamo brodovi dolaze više od 2.000 godina. Sidro ispred luke, lučka kapetanija na kanalu 11 i odjava iz Albanije, a onda pramac prema Grčkoj.","1624766405928596",0,"Sarandë"],
["grcka","15. 8.","15:20","krf","Planovi za Krf","Kratko javljanje s planovima do utorka, kad se vraćam u grad Krf.","1751264522664906",0,"Krf"],
["grcka","15. 8.","17:13","stefanos","Prva večer u Grčkoj","Stižem u Agios Stefanos na Krfu: male plaže, brodice na sidru i taverne uz more. Spuštam dinghy i idem potražiti dobru grčku tavernu.","927635873724151",1,"Agios Stefanos, Krf"],
["grcka","16. 8.","05:32","stefanos","Jutarnja misao","Ne mora svaki korak biti isplaniran. Ponekad treba krenuti, vjerovati sebi i vidjeti kamo će te put odvesti.","1679346210277815",0,"Agios Stefanos, Krf"],
["grcka","16. 8.","08:48","acharavi","Jutarnje kupanje","Prva stanica je plaža Acharavi: sidro, skok u kristalno Jonsko more i dalje prema Porto Timoniju.","27798507513145148",0,"Acharavi, Krf"],
["grcka","16. 8.","13:04","timoni","Porto Timoni","Dvije tirkizne uvale leđa uz leđa ispod sela Afionas. Do njih nema ceste, a ja dolazim s mora i ostatak priče prepuštam dronu.","4702185473390877",0,"Porto Timoni, Krf"],
["grcka","16. 8.","17:42","ermones","Odisejeva uvala","Agios Georgios me nije privukao, pa sam nastavio do Ermonesa. Prema legendi ovdje je more izbacilo brodolomca Odiseja, kojeg je pronašla Nausikaja.","1067807642404909",0,"Ermones, Krf"],
["grcka","17. 8.","05:40","ermones","Jutarnja misao","Godinama sam čekao pravi trenutak. Odlasci dragih ljudi naučili su me da vrijeme ne čeka, a oni na neki način plove sa mnom.","1095166999708735",0,"Ermones, Krf"],
["grcka","17. 8.","09:03","gordios","Prazna uvala usred kolovoza","Agios Gordios, duga pješčana plaža i stijena Ortholithi, a oko INVICTUSA nikoga. Dinghyjem idem po kavu i u supermarket.","1746295926499192",0,"Agios Gordios, Krf"],
["grcka","17. 8.","13:23","gordios","673 milje","Iz logbooka sam izvukao točan odgovor: od 1. do 17. kolovoza INVICTUS je prešao 673 nautičke milje kroz četiri države. Samo jedan dan nisam napravio nijednu milju, kad sam ostao na Lastovu.","827774633695698",1,"Krf"],
["grcka","17. 8.","17:00","krfjug","Glavno jedro i Batman","Vjetar odostraga, a INVICTUS klizi s glavnim jedrom i Batmanom oko juga Krfa prema istočnoj obali. Plan za večer: mala uvala i dobra taverna.","1415980513785468",0,"Jug Krfa"],
["grcka","18. 8.","06:26","krf","Jutarnja misao","More brzo objasni da neke stvari nisu u tvojim rukama. Ne biram vjetar ni valove, ali biram kako ću na njih reagirati.","1099847799246337",0,"Krf"],
["grcka","18. 8.","13:16","krf","Najava obilaska uživo","Na vašu želju za pola sata idem uživo na Facebooku i pokazujem vam brod, a vi pitajte što vas zanima.","1058228067086674",0,"Krf"],
["grcka","18. 8.","18:08","krf","INVICTUS TOUR","Napokon obilazak broda koji ste toliko tražili: 21 minuta kroz unutrašnjost, kokpit, flybridge, elektroniku, jedra i strojarnicu, s titlovima na talijanskom i engleskom.","1098629046157159",0,"Krf"],
["grcka","19. 8.","06:56","krf","Jutarnja misao","Mislio sam da ću najviše pamtiti mjesta, a već sada vidim da će najljepše uspomene biti ljudi.","961142226849284",0,"Krf"],
["grcka","19. 8.","08:58","krf","Nova posada","Jučer tri delfina uz brod, piratski izletnički brod i dolazak Ursa i Kevina, nove posade INVICTUSA. Dan smo završili šetnjom i večerom u gradu Krfu.","1784535359351431",0,"Krf"],
["grcka","19. 8.","13:52","antipaxos","Mala flota na Antipaxosu","Stižemo na Antipaxos: nestvarno more, ali i prava ljetna gužva. Usput skidamo prednje solare za servis u Lefkadi, a uz nas su i Ursovi katamarani Tamiro i Azul.","2857468374623666",0,"Antipaxos"],
["grcka","20. 8.","06:16","antipaxos","Jutarnja misao","Hrabrost nije trenutak kad strah nestane, nego kad ga prihvatiš i ipak odvežeš konope.","1379703070222000",0,"Antipaxos"],
["grcka","20. 8.","11:10","lefkada","Pacijent putuje sa mnom","Na putu prema Lefkadi, između jedara i alata, rješavam CT i planiranje za jednog svog pacijenta.","1422284216410291",0,"Antipaxos – Lefkada"],
["grcka","21. 8.","07:17","lefkada","Jutarnja misao","Na moru ne možeš požuriti vjetar. Polako učim da čekanje nije izgubljeno vrijeme.","2931435120545512",0,"Lefkada"],
["grcka","22. 8.","07:17","sivota","Jutarnja misao","Dugo sam živio za još jedan posao i još jedan cilj. U jednom trenutku moraš sebi reći dosta, ne zato što odustaješ, nego zato što želiš više od života.","1794331608678182",0,"Sivota, Lefkas"],
["grcka","22. 8.","11:06","sivota","Radni dani u Sivoti","Servis, popravak solara i provjera litijske baterije. Navečer novo poznanstvo s divnim 75-godišnjim jedriličarem.","1578498823670197",0,"Sivota, Lefkas"],
["grcka","23. 8.","06:36","sivota","Jutarnja misao","Sve manje mislim da bogatstvo čine stvari, a sve više vrijeme, ljudi i trenuci koji postaju uspomene.","3540258332818229",0,"Sivota, Lefkas"],
["grcka","23. 8.","16:02","lefkada","Testna vožnja","Novi solari su postavljeni, Batman otvoren i testna vožnja u tijeku. Sutra nastavljamo s popravcima.","1095290009856481",0,"Lefkada"],
["grcka","24. 8.","06:42","sivota","Niall, 75 godina","U Sivoti sam upoznao Nialla, koji je nakon velikih promjena u životu doplovio do Grčke, živi na brodu i još radi kao skiper. Podsjetio me da nikad nije prekasno.","3186077871740937",0,"Sivota, Lefkas"],
["grcka","24. 8.","17:01","nydri","Kratko u Nydriju","Kratko stajanje u zaštićenoj uvali punoj brodova da pokupimo još nekoliko stvari za INVICTUS.","1739876380565053",0,"Nydri, Lefkas"],
["grcka","25. 8.","06:03","meganisi","Jutarnja misao","Rano jutro na brodu, bez buke i telefona. Možda mir nije mjesto na koje trebamo stići.","2903295106692414",0,"Meganisi"],
["grcka","25. 8.","14:53","kastos","Kastos na grčki način","Sidro dolje, krma konopima za stijenu. INVICTUS je danas praonica: vodom iz watermakera perem ljepilo zaostalo od radova na solarima, a navečer slijedi restoran kod stare vjetrenjače.","1694454135163958",0,"Kastos"],
["grcka","25. 8.","17:13","kastos","Tender i novi dron","Malo zabave s tenderom od 30 konja i prvi pravi test novog drona koji nas sam prati dok jurimo po moru.","979917511771958",0,"Kastos"],

["spanjolska","13. 10.","07:00","mazarron","Nova taktika","Isplovljavam u 03:48 dok more spava i radim 88,1 milju, 21 više nego dan prije. Vjetra nema cijeli dan, pa motori troše gorivo.","1858466768670016",0,"Puerto de Mazarrón"],
["spanjolska","14. 10.","08:15","aguadulce","Prije nevremena","U 02:27 isplovljavam pod zvijezdama da stignem u marinu Aguadulce prije najavljene oluje. Noćne plovidbe me podsjete koliko smo slijepi na moru, unatoč radaru, AIS-u i termalnoj kameri.","2739166833205064",0,"Aguadulce"],
["spanjolska","15. 10.","07:45","aguadulce","Dan bez plovidbe","INVICTUS je sigurno privezan, a ja šetam plažama i doručkujem za 4 eura. Kupujem rezervnu pumpu za pitku vodu, jer bez nje ne radi nijedan od četiri watermakera.","1488178953152874",0,"Aguadulce"],
["spanjolska","16. 10.","07:00","aguadulce","Dan za elektroniku","Sređujem Raymarine plotere, instaliram Windy, PredictWind i Spotify i popravljam AIS. Malo više povjerenja u opremu prije Atlantika.","1756073112360512",0,"Aguadulce"],
["maroko","16. 10.","19:00","malaga","Pratnja prema Gibraltaru","Usred plovidbe prema Gibraltaru pojavljuje se deset do petnaest dupina i igra se oko oba pramca. Predstava koju nijedan Netflix ne može nadmašiti.","1454310163265684",1,"Kod Málage"],
["maroko","17. 10.","07:00","malaga","Surfanje prema Gibraltaru","Jučer u pet ujutro napuštam Aguadulce, uz ostatke nevremena. Valovi i struja guraju me prema Gibraltaru, a jedan dupin dolazi sasvim blizu i gleda me ravno u oči.","1143324508286303",0,"Aguadulce – Gibraltar"],
["maroko","18. 10.","07:38","gibraltar","Noć među tankerima","U četiri ujutro, nakon 19 sati i 121 milje, obilazim Gibraltarsku stijenu u mraku i slalomom između pedesetak tankera dolazim do sidrišta La Línea. Slijede komarci, majmuni, policija, preskakanje ograda i birokracija.","5556284634596170",1,"La Línea, Gibraltar"],
["maroko","18. 10.","10:59","gibraltar","Sidro gore, prema Africi","Po kiši se provlačim između tankera iz zaljeva. Nisam riješio svu dokumentaciju, mislim na orke, a pred pramcem je novi kontinent.","1466947508623776",0,"Gibraltar"],
["maroko","19. 10.","07:43","strait","Afrika!","Prelazim Gibraltarski tjesnac, provlačeći se između divova od nekoliko stotina metara. Nakon sat i pol ispred pramca je Afrika, a marokanski vojni brod mirno prolazi pokraj mene.","1392194362961314",1,"Gibraltarski tjesnac – Tanger"],
["maroko","20. 10.","09:27","tangier","Kiša u Africi","Budim se uz kišu i odgađam obilazak grada. Umjesto toga satima čekam marinera i INVICTUS od 24 tone premještam u boks, gdje se brod vezuje sasvim drugačije nego na Mediteranu.","1150161064031929",0,"Tanger"],
["maroko","21. 10.","07:39","tangier","Vodič bez zajedničkog jezika","Dogovorio sam vodiča koji govori engleski, njemački ili talijanski, a stigao je onaj koji ne govori nijedan. Prevodimo mobitelom s arapskog na francuski pa na engleski, a on me vodi na tržnicu koju sam već vidio.","2631388870662878",0,"Tanger"],
["maroko","22. 10.","07:09","tangier","Dan s ARGOM","Budim se po hrvatskom vremenu, s curenjem nosa i boli u grlu, pa dan provodim na brodu. Radim na ARGO AI sustavu koji sada povezuje vjetar, valove, struje i otvorena jedra kako bi mi savjetovao kada skratiti jedra.","2079467569379773",0,"Tanger"],
["maroko","23. 10.","07:00","tangier","Tri lica Tangera","Novi vodič Abdul govori savršen engleski i godinama je vodio brzi katamaran između Španjolske i Maroka. Pokazuje mi staru medinu i marokanski Beverly Hills.","1687834116213369",0,"Tanger"],
["maroko","24. 10.","07:00","tangier","Upozorenje u trgovini","Posljednji dan u Tangeru. U nautičkoj trgovini vidim izloženo kormilo katamarana koje su orke odlomile u veljači 2025., samo sedam milja od Tangera, i to dan prije mog isplovljavanja.","1829373944921368",0,"Tanger"],
["atlantik","24. 10.","16:31","atl1","Atlantik","Kratko javljanje s Atlantika: Batman na pola, glavno jedro otvoreno, pramac prema Kanarima i štapovi u moru.","2377898589615403",1,"Atlantski ocean"],
["atlantik","24. 10.","19:51","atl1","Mjesec i sunce","S jedne strane izlazi Mjesec, s druge sunce tone u Atlantik. Ne govorim ništa.","955758000586906",0,"Atlantski ocean"],
["atlantik","25. 10.","07:31","atl1","Atlantik, prvi dan","Carinici dolaze sat i pol kasnije, desetak minuta pregledavaju brod i napokon adio Maroko. Još jednom kroz Gibraltarski tjesnac, uz marokansku obalu.","880210561780907",0,"Tanger – ocean"],
["atlantik","25. 10.","10:44","atl2","Batman je opet u akciji","Spustio sam Batmana, uzeo kirurške instrumente i konac i pokrpao poderotinu. Jedro je opet gore i radi, a oko mene je horizont pun brzih tankera.","4566373800308147",0,"Između Afrike i Kanara"],
["atlantik","26. 10.","07:00","atl2","Operacija Batman","Prve noći donji rub Batmana, jedra od 320 m² tvrtke OneSails, zapeo je i rasparao se na gotovo tri metra. Usred oceana sam ga zašio, a dan su obilježila i 70 dupina.","1838237323859325",1,"Atlantski ocean"],
["atlantik","27. 10.","07:00","atl2","Kad ocean utihne","Moj pacijent se odlično oporavlja: šavovi drže, a Batman i pri šest čvorova vjetra gura gotovo 24 tone broda brzinom od oko četiri čvora.","1442427604510532",0,"Atlantik, treći dan"],
["atlantik","28. 10.","06:45","atl3","Mali gost i novi rekordi","Napokon pravo atlantsko jedrenje sa skraćenim Batmanom, oko 20 % manje površine, s vjetrom odostraga i valovima od metar do dva.","2316524949167820",0,"Atlantik, četvrti dan"],
["atlantik","28. 10.","12:50","atl3","Dani na oceanu","Gotovo bonaca, ali Batman i dalje vuče oko četiri čvora; još 200 milja do Kanara. Dani prolaze uz satelitsku televiziju, knjigu, poslove na brodu i malo vježbanja.","1442473881162588",0,"Atlantski ocean"],
["atlantik","29. 10.","07:00","lanzarote","Kad vjetar uzme slobodno","Batman hvata i najmanji dašak vjetra, a onda oko 15 sati potpuna bonaca. Zatvaram jedro i palim jedan motor, a ribe skaču oko broda i ignoriraju moj mamac.","1462817505712922",0,"Atlantik, peti dan"],
["atlantik","29. 10.","09:36","lanzarote","Putnica","Na brod slijeće mala, umorna ptica. Odmara se u mojim rukama i odleti dalje.","1151477407438581",0,"Kod Lanzarotea"],
["atlantik","30. 10.","07:45","laspalmas","Kraj etape","Dan bez vjetra koristim da s ARGOM izmjerim najekonomičniju vožnju na motor: jedan motor na 2000 okretaja daje oko 4,9 čvorova uz 3,4 do 3,5 litara na sat. Stižem u Las Palmas.","1124283953680201",1,"Las Palmas, Gran Canaria"],
["kanari","31. 10.","08:13","laspalmas","Od industrijske luke do nautičkog raja","Noć pred lukom bila je nemirnija od oceana. Batman ide na profesionalni popravak u tvrtku Alisios, a dan prolazi u nautičkim trgovinama.","1149760050822655",0,"Las Palmas, Gran Canaria"],
["kanari","1. 11.","08:57","aldea","Tri mjeseca","Točno tri mjeseca od Punta. Noću plovim s Gran Canarije prema Tenerifeu i odgovaram onima koji misle da sam rođen sa zlatnom žlicom.","1123391220283428",1,"Gran Canaria – Tenerife"],
["kanari","1. 11.","13:02","tenerife","68 poruka i besana noć","Hvala na više od 68 poruka. Prvi studenoga mi nikad nije bio lak zbog uspomena na ljude kojih nema, pa sam sinoć u 22 sata isplovio, a ispred luke me dočekao osvijetljeni putnički brod, kao da mi pokazuje put.","1059801730407121",0,"Tenerife"],
["kanari","2. 11.","07:50","tenerife","Tenerife","Sidrim ispred Marine del Sur dok se ne oslobodi vez, a s marinerom se sporazumijem talijanskim iz ordinacije. Pregled nakon nevremena: nema nikakve štete.","1131109375980444",0,"Las Galletas, Tenerife"],
["kanari","2. 11.","15:48","tenerife","Robot ispod trupa","Kava s Kevinom, pa ronilačko odijelo i Keelcrab, podvodni robot kojim čistim alge i školjkice s trupova.","1683258559810279",0,"Las Galletas, Tenerife"],
["kanari","3. 11.","07:55","tenerife","Od robota do irskog puba","Sat vremena pod vodom umorio me više nego šest dana Atlantika. Večer završava u irskom pubu.","2618944291877259",0,"Las Galletas, Tenerife"],
["kanari","4. 11.","09:38","tenerife","Metoda za lijene","Pokušavam Keelcrab upravljati izvana, ali u marini koja se ljulja to baš ne ide, pa perem sol s paluba. Saznajem da 5. studenoga moram napustiti marinu, a Iridium i dalje ne pronalazi satelite.","28392005643806409",0,"Las Galletas, Tenerife"],
["kanari","5. 11.","06:53","tenerife","Jedan val, jedan pad","Moj prijatelj Kevin McKenna, s kojim sam trebao prijeći Atlantik, pao je s krova katamarana na sidru i slomio obje pete; čeka ga operacija u Irskoj i dugi oporavak. Meni je marina ipak produžila vez, a preko oceana neću sam: uskoro mi se pridružuje draga osoba iz Hrvatske.","1988867232518547",0,"Las Galletas, Tenerife"],
["kanari","6. 11.","07:23","tenerife","Formula 1 za penzionere","Watchit sa mnom radarom ne surađuje, pa od njega odustajem. U Los Cristianosu gledam umirovljenike kako se utrkuju električnim skuterima, Kevinu nabavljam injekcije uz svoju liječničku iskaznicu, a navečer epoksijem gradim pregradu za kišnicu na flybridgeu. Za Atlantik vidim dva prozora: 7. ili oko 12. studenoga. Jutarnja misao: ne moraš znati sve, dovoljno je biti spreman učiti.","2256971764702425",0,"Las Galletas, Tenerife"],
["kanari","7. 11.","07:00","tenerife","Moram naučiti čekati","ARC+ je odgođen zbog oluje Bruna i vjetrova iz suprotnog smjera, pa i ja čekam na Tenerifeu; uz malo likera marina mi je produžila vez do 12. studenoga. Natočio sam gorivo po 1,75 eura, rezervni Batman putuje UPS-om u Mindelo, a ARGO uči modele oluja. Najteže mi je naučiti čekati.","1842747620190215",0,"Las Galletas, Tenerife"],
["kanari","8. 11.","08:37","tenerife","Čekajući Brunu","Marina se puni brodovima koji bježe od oluje Brune, a ja preko prevoditelja na španjolskom dogovaram Ramóna da zakrpa moj eksplodirani SUP. Završio sam branu na flybridgeu, ARGO uči nove module za oluje i izbjegavanje sudara, a navečer sam se oprostio od Kevina koji leti na operaciju u Irsku. Jutarnja misao: oluju ne možeš kontrolirati, ali se za nju možeš pripremiti.","1175818875010852",0,"Las Galletas, Tenerife"]

const T={"1.8 10:09": "Prije više od 25 godina krenuo sam graditi svoj životni i profesionalni put.\nImao sam privilegiju operirati više od 30.000 pacijenata, upoznati tisuće divnih ljudi i zajedno sa svojim timom izgraditi Polikliniku Smile – nešto na što sam neizmjerno ponosan.\nAli život nas s vremenom nauči koliko je sve to krhko.\nU posljednje vrijeme prerano sam ispratio nekoliko dragih ljudi. Posebno mog prijatelja Damira Žića, kapetana Marine Punat. Njegov odlazak podsjetio me koliko je život nepredvidiv i koliko je važno živjeti svoje snove – danas, a ne jednog dana.\nPonekad izgubimo ljude koje volimo. Ponekad ih pustimo kada nismo trebali. Ali ono što je bilo stvarno, nikada ne nestane. Ostane u nama i nastavi nas oblikovati.\nA duboko u meni godinama je živio još jedan san.\nSan o slobodi.\nO oceanu.\nO putovanju oko svijeta.\nZato danas u 12 sati isplovljavam iz Marine Punat na put oko svijeta svojim katamaranom SY INVICTUS.\nNe odlazim zato što bježim od života koji sam imao.\nOdlazim zato što želim živjeti život o kojem sam sanjao.\nVažno mi je da znate kako Poliklinika Smile ostaje u sigurnim rukama. Naš tim nastavlja dalje, jači nego ikad, a ja se, uz malo sreće, vraćam za godinu ili dvije.\nBogatiji za iskustva.\nI nadam se, još bolji čovjek.\nA onda nastavljamo zajedno.\nJoš jači nego prije.\nNa ovo putovanje ne nosim samo svoje snove.\nNosim svoju obitelj.\nSvoje prijatelje.\nSvoje pacijente.\nSvoj tim.\nI nosim sve one koji su prerano otišli iz mog života, ali su zauvijek ostali u mom srcu. Vjerujem da će, na neki svoj tihi način, ploviti zajedno sa mnom.\nNe znam što me čeka.\nZnam samo da će biti i prekrasnih trenutaka i teških iskušenja.\nI upravo zato idem.\nJer vjerujem da se najljepše stvari u životu ne mogu kupiti.\nMogu se samo doživjeti.\nHvala svima koji ste bili dio mog života i mog puta.\nAko vas bude zanimalo kako izgleda život na oceanu, s vremena na vrijeme podijelit ću ga s vama – onakav kakav jest.\nVidimo se na moru.\nA onda, uz malo sreće…\n…ponovno i kod kuće.\nDarko\nSY INVICTUS", "2.8 12:02": "Postoje susreti koje ne možeš isplanirati.\nDok sam upravo prolazio pokraj Zadra, sam sa svojim mislima i morem ispred sebe, odjednom sam začuo zvuk brzog brodića. Pomislio sam da netko samo prolazi…\nA onda – iznenađenje.\nKristijan Tominić i njegova djevojka došli su me pozdraviti usred mora. Nisam imao pojma da dolaze.\nTakve sitnice čovjek ne zaboravlja. U trenutku kada krećeš na put oko svijeta, shvatiš da najveće bogatstvo nisu ni brod ni odredišta, nego ljudi koji odvoje svoje vrijeme samo da ti stisnu ruku, požele sretan put i pokažu da im je stalo.\nHvala ti, Kristijane. Hvala i tvojoj dragoj. Ovo će mi ostati jedna od onih uspomena koje nose više emocija nego tisuću fotografija.\nPrijateljstvo je, baš kao i more, najljepše kada je iskreno.\n      Sažmi", "3.8 06:00": "Jutros, na izlazu iz Rogoznice, dok plovim prema Splitu, dočekalo me nešto što neću zaboraviti.\nIz mora je izronila cijela obitelj dupina. Nisu se samo pojavili – neko su vrijeme plovili uz INVICTUS, kao da su me došli ispratiti i poželjeti mi mirno more.\nU tom trenutku svirala je pjesma Tu t’en vas – Alain Barrière.\n“Ti odlaziš…”\nNe znam postoje li slučajnosti. Ali postoje trenuci koji nas zaustave, nasmiju i podsjete zašto smo krenuli.\nMožda je to bio samo susret s divljinom.\nA možda mali pozdrav mora na početku jednog velikog putovanja.\n      Sažmi", "3.8 10:23": "Nevjerojatno…\nJutros, na izlazu iz Rogoznice, ispratila me obitelj dupina.\nKasnije sam stigao u Split, pun planova. Servisi su otkazani i, priznajem, bio sam razočaran. Promijenio sam plan i okrenuo pramac prema Braču.\nA onda…\nOpet dupini.\nDrugi put u istom danu.\nNe znam postoji li objašnjenje za ovakve trenutke. Znam samo da, baš kada sam pomislio da je dan krenuo u krivom smjeru, more mi je poslalo nešto što se ne može kupiti, isplanirati ni očekivati.\nMožda je to samo slučajnost.\nA možda more zna kako vratiti osmijeh baš onda kada je najpotrebniji.\nPlovimo dalje.", "3.8 16:26": "Jedrenje prema Jelsi", "4.8 09:46": "Jutro u Jelsi koje neću zaboraviti.\nPrije nastavka mog puta oko svijeta, na brod je došao don Ivan Jurin kako bi blagoslovio mene i INVICTUS.\nMolio je da me Bog čuva od svih nesreća, da mi podari mirno more, mudrost u svakoj odluci i da se jednog dana sretno vratim kući.\nNa kraju mi je darovao mali Novi zavjet i krunicu Gospe od Zdravlja iz Jelse. Darove koji će cijelim putem biti uz mene.\nNa ovakvom putovanju čovjek shvati da ne nosi samo gorivo, karte i opremu. Nosi i vjeru, nade, molitve i ljubav ljudi kojima je stalo do njega.\nOd srca hvala don Ivanu Jurinu na blagoslovu i riječima ohrabrenja.\nPosebno hvala mom prijatelju dr. Ivi Tomiću, koji je sve ovo organizirao kao iznenađenje.\nNeka ovaj blagoslov bude moj tihi suputnik na svakoj prijeđenoj milji.", "4.8 12:53": "Svi misle da je jedrenje samo zalazak sunca, delfini i čaša vina…\nA onda dođe dan bez vjetra.\nMotori rade, more je ravno, a sati prolaze. Da ne poludim od monotonije, brod postaje moja teretana. Sklekovi, trbušnjaci, trčanje po palubi… sve je bolje nego gledati isti horizont satima.\nPut oko svijeta nije samo avantura. To je i borba da ostaneš fizički i mentalno jak – čak i kad se naizgled ništa ne događa. A i da sebe i gledatelje malo zabaviš\nKako vi ubijate dosadu na dugim putovanjima?\n       Sažmi", "4.8 22:54": "Nakon cijelog dana na moru stigao sam u Skrivenu Luku na Lastovu, očekujući samo mirnu uvalu, zalazak sunca i noć na sidru.\nA onda – potpuno iznenađenje.\nNa obali me čekaju moj kum Dražen Galić s obitelji, dr. Andrej Kravanja s obitelji, dr. Andrej Božić s obitelji i Bojan Galić, CEO Straumann Adriatic Grupe.\nNe mogu opisati koliko me ovo dirnulo. Kad si sam na putovanju, ovakvi trenuci vrijede više od bilo čega. Shvatiš koliko si bogat ljudima koji odvoje svoje vrijeme samo da te zagrle, nazdrave s tobom i požele ti sretan nastavak puta.\nHvala vam na ovom ludom dočeku i večeri koju neću zaboraviti.\nSvijet je velik, ali prijateljstva ga čine nevjerojatno malim. Sažmi", "5.8 13:19": "Danas nisam isplovio.\nPonekad je najljepši dio putovanja upravo trenutak kada odlučiš ostati još jedan dan.\nLastovo me zadržalo. Ne zbog vremena, nego zbog ljudi. Okružen sam divnim društvom i upravo takvi susreti daju posebnu vrijednost ovom putovanju oko svijeta.\nIskoristio sam dan da podignem dron i snimim malo ljepote ovog otoka iz zraka. Kad ga pogledaš iz te perspektive, još jasnije shvatiš koliko je Jadran zaista poseban.\nNekad kilometri mogu pričekati. Uspomene ne mogu.\n SY INVICTUS – Skrivena Luka, Lastovo Sažmi", "6.8 06:19": "Danas smo krenuli rano ujutro iz Skrivene Luke na Lastovu prema otoku Šipanu.\nPriznajem, kao da pomalo odgađam odlazak iz Hrvatske. Toliko lijepih susreta, prijatelja i trenutaka dogodilo se u ovih nekoliko dana da mi nije lako okrenuti pramac prema otvorenom moru.\nPlan je stići u Grčku malo kasnije nego što sam prvotno zamislio. I to je sasvim u redu. Put oko svijeta nije utrka. Neke uspomene vrijede više od savršeno isplaniranog rasporeda.\nDanas mi se na ovom dijelu puta pridružio i moj kum Dražen Galić. Drago mi je da ćemo zajedno podijeliti još jednu etapu ovog velikog putovanja.\nPonekad je najljepši dio svakog putovanja upravo društvo s kojim ga dijeliš.\n       Sažmi", "6.8 17:53": "Danas je trebao biti samo još jedan dan plovidbe.\nKum Dražen i ja stigli smo do restorana Bowa. Usput nas je nazvao gospodin Radovan Jovančević iz Suđurđa na Šipanu i pozvao nas na ručak. Nažalost, nismo uspjeli stati, ali nas je svejedno dočekala njegova pažnja – dvije boce vina kao znak dobrodošlice.\nA u Bowi novo iznenađenje. Čekao nas je šampanjac koji su poslali dr. Jurković iz Opatije i njegova supruga Vivian koji su sada na Mykonosu.\nPomislio sam da me više ništa danas ne može iznenaditi.\nA onda mi je za stol prišla kći mog prijatelja dr. Andrije Božića. U ruku mi je stavila narukvicu i rekla da je za sreću i sretan povratak.\nU tom trenutku nisam više mogao zadržati suze.\nNisu to bile suze tuge.\nTo su bile suze zahvalnosti.\nNa ovom putovanju shvaćam da najveće bogatstvo koje čovjek može ponijeti nisu stvari koje stanu na brod, nego ljudi koje nosi u srcu.\nHvala svima koji me ispraćate, koji mislite na mene i koji mi na svoj način poručujete da se vratim kući.\nTakvi trenuci ostaju zauvijek.\n       Sažmi", "8.8 06:46": "ODVEZUJEM KONOPE I ODLAZIM IZ HRVATSKE\nJučer sam iz Slanog stigao u Dubrovnik.\nTu me dočekao i rezervni propeler koji je prvotno bio naručen za Split, ali su ga ipak uspjeli dostaviti do Dubrovnika.\nHvala, Zlatko!\nKako više nije bilo dovoljno vremena da isti dan stignem u Crnu Goru, odlučio sam ostati i provesti jedan miran dan u Dubrovniku.\nA večer nije mogla završiti ljepše.\nProveo sam je u društvu dvojice pravih dubrovačkih gospara i mojih kolega implantologa, dr. Miroslava Korde i dr. Varisa Krehića.\nHvala vam na divnoj večeri, gostoprimstvu i još boljim razgovorima. Takvi susreti ostaju u sjećanju puno duže od mjesta kroz koja prolazimo.\nJutros je alarm zazvonio u 4:00.\nJoš u potpunom mraku krenuo sam s INVICTUSOM prema carini u Dubrovniku.\nPrvi put prolazim proceduru izlaska brodom iz Hrvatske i, priznajem, u glavi je bilo puno upitnika. Ali kapetan, policajac i carinik bili su izuzetno ljubazni i profesionalni i sve je prošlo brzo i jednostavno.\nPapiri su završeni.\nVraćam se na brod.\nPalim motore.\nOdvezujem konope.\nI onda shvatim da ovaj trenutak ipak nije samo još jedno isplovljavanje.\nDo sada sam plovio poznatim morem, uz hrvatske otoke i obalu. Uvijek nekako blizu doma.\nA jutros prvi put na ovom putovanju napuštam Hrvatsku.\nIspred mene je Crna Gora… a nakon nje more i svijet koji sam toliko dugo zamišljao.\nDok Dubrovnik polako ostaje iza krme, u meni su neki čudni osjećaji.\nMalo uzbuđenja.\nMalo tuge.\nMalo straha od nepoznatog.\nI ogromna zahvalnost za sve ljude koje sam ovih dana susreo.\nGledam svjetla hrvatske obale kako polako ostaju iza mene i prvi put stvarno osjećam:\nPut oko svijeta je počeo.\nVidimo se, Hrvatska.\nSY INVICTUS\nSomewhere between home and the world. Sažmi", "9.8 14:14": "CRNA GORA – prva država nakon Hrvatske\nJučer sam uplovio u prvu državu izvan Hrvatske na ovom mom putu oko svijeta – Crnu Goru.\nPrvo Zelenika. Prijava, carina, sve one procedure koje prvi put prolaziš s brodom kada ulaziš u novu državu. A onda prema Kotoru.\nU Marini Kotor dočekali su me nevjerojatno ljubazno, a ubrzo je stigao i moj kolega, stomatolog Milan  Vučetić. Ugodno druženje, razgovori, smijeh… i onda još jedno potpuno iznenađenje.\nDošla je ekipa nacionalne crnogorske televizije.\nRekli su mi da su dobili toliko poziva ljudi iz Crne Gore koji prate moje putovanje da su poželjeli napraviti priču. Ne samo snimiti brod i čovjeka koji ide oko svijeta, nego pokušati ispričati zašto netko u jednom trenutku života odluči odvezati konope i krenuti živjeti svoj san. Navodno slijedeći utorak u 9:00 to če biti na televiziji u emisiji boje jutra.\nI baš mi je drago što su u tome vidjeli jednu pozitivnu priču.\nAli Crna Gora tu nije završila sa svojim iznenađenjima.\nPoslije me televizijska ekipa povela na ribarsku feštu u Muo. Pivo, gemišti, ljudi, glazba… a riba besplatna za sve – domaće ljude i turiste. Gledao sam oko sebe i razmišljao kada sam posljednji put negdje vidio nešto tako jednostavno i lijepo: mjesto koje se samo želi družiti i počastiti ljude koji su došli.\nVečer sam završio šetnjom starim Kotorom.\nA jutros – novi dan i novi ljudi.\nMilan me proveo kroz Kotor, Tivat i Porto Montenegro, a pridružio nam se i Riječanin Darko Mrvoš, koji danas živi ovdje sa svojom crnogorskom suprugom. Zajednički doručak, još novih priča i poznanstava, a onda žičara iznad Kotora.\nFenomenalno. Pogled koji jednostavno moraš doživjeti.\nI opet mi se događa ono što mi se događa gotovo od prvog dana ovog putovanja…\nPlaniram otići – a ljudi me zadrže.\nToliko topline, toliko gostoprimstva, toliko novih poznanstava i emocija u samo jednom danu da sam odlučio ostati u Crnoj Gori još jedan dan.\nBrod se puni marmeladama, uljem, vinom…\nUpravo napuštam marinu i prebacujem INVICTUS u drugi zaljev, prema otoku Sveti Marko. Večeras sidro, more i – kako stvari ovdje idu – opet neko novo društvo.\nTek sam izašao iz Hrvatske i već počinjem shvaćati nešto važno.\nMožda put oko svijeta na kraju uopće neće biti priča o tome koliko sam milja prešao i koliko sam zemalja vidio.\nMožda će to prije svega biti priča o ljudima koje sam putem sreo.\n Hvala, Crna Goro. Nisam očekivao ovakav prvi dan.\nSY INVICTUS", "10.8 11:06": "Prva stanica za danas – Budva.\nJutros sam se ponovno rano digao i krenuo dalje.\nStao sam na sidro kod Budve, blizu otoka Sveti Nikola od kojega i dosta amajlija imam sa sobom.\nMalo odmora, nekoliko sitnih popravaka na INVICTUSU, kava uz pogled na obalu… i uskoro ponovno dižemo sidro.\nPut se nastavlja.", "11.8 06:37": "DOVIĐENJA, CRNA GORO…\nJutros sam odvezao konope iz Bara i krenuo prema Albaniji, prema Draču.\nCrna Gora je prva zemlja u koju sam uplovio nakon što sam napustio Hrvatsku — i prva koju sada ostavljam iza sebe na ovom mom putu oko svijeta.\nA odlazim pun emocija.\nU samo nekoliko dana toliko lijepih mjesta, toliko susreta i, prije svega, toliko dobrih ljudi. Od prvog uplovljavanja i Zelenike, preko Kotora i Boke, pa sve do Bara.\nPosebno ću pamtiti druženja s dragim kolegama i prijateljima — dr. Milanom Vučetićem, Darkom Mrvošem i dr. Igorom Ristićem. Razgovori, smijeh, gostoprimstvo i ona toplina zbog koje se negdje, iako si prvi put, osjećaš kao da nisi stranac.\nCrna Gora mi je još jednom pokazala nešto što, čini mi se, postaje jedna od najljepših priča ovog putovanja:\nMjesta su prekrasna, ali ljudi su ti koji ih učine nezaboravnima.\nHvala vam na svemu, Crna Goro.\nNosim vas sa sobom u lijepom sjećanju.\nA INVICTUS sada okreće pramac prema jugu.\nSljedeća stanica — Drač, Albanija\n, gdje me već čekaju moji albanski kolege i, kako čujem, pripremaju mi poseban doček.\nIdemo dalje…", "11.8 08:10": "JUTARNJE IZNENAĐENJE NA INVICTUSU\nJutros, kao i svaki dan, pregled oba motora.\nOtvaram prostor lijevog, port motora — sve plavo.\nPrva pomisao: rashladna tekućina? Ali nema alarma, temperature normalne… Gledam dalje i onda pronalazim krivca.\nNa jednom MABO protupožarnom cilindru jednostavno je mehanički puklo kućište, napravio se procjep i sva plava tekućina završila je ispod motora.\nA onda kreće onaj manje romantični dio putovanja oko svijeta.\nUgasiti motore, izvaditi pumpice i pokupiti svu tu tekućinu iz prostora ispod motora.\nSrećom, za ovakve stvari sam se dobro pripremio. Imao sam odgovarajuće pumpice i relativno brzo sve očistio, iako sam već bio poprilično daleko od obale.\nNije bilo opasnosti ni panike. Samo još jedan podsjetnik zašto na moru svako jutro otvaram, gledam i provjeravam baš sve.\nPrikupljenu tekućinu nisam, naravno, ispustio u more. Spremio sam je i predat ću je na zbrinjavanje čim stignem u Albaniju.\nPut oko svijeta nije samo more, zalasci sunca i lijepe fotografije.\nPonekad je i ležanje ispod motora, pumpica u ruci i — sve plavo.\nINVICTUS ide dalje.", "13.8 14:44": "Na putu od Vlore prema Green Coast", "14.8 07:25": "Jutarnja priča s INVICTUSA – planovi su jedno, more nešto sasvim drugo.\nPlan je bio krenuti rano, oko 5 ujutro, prema Porto Palermu, prekrasnoj prirodnoj uvali na jugu Albanije.\nAli čim sam počeo dizati sidro – iznenađenje.\nOko lanca i sidra bila je potpuno zapetljana ribarska mreža. Jučer smo se usidrili na normalnom, dozvoljenom sidrištu, a netko je očito preko noći baš tuda postavio neoznačenu mrežu.\nNekako sam uspio osloboditi mrežu, zajedno s nekoliko riba koje su već bile u njoj – njih sam ostavio vlasniku.\nAli tu priča nije završila.\nZbog opterećenja je izbacio osigurač sidrenog vitla. Glavni osigurač je izgledao u redu, a vitlo i dalje – mrtvo.\nI tako je počela jutarnja potraga za kvarom. Otvaranje kutija, provjera instalacije, releja… dok konačno nisam pronašao krivca: mali osigurač od samo 5 A skriven u kutiji releja sidrenog vitla.\nA onda onaj trenutak sreće kad shvatiš da među rezervnim dijelovima imaš baš takav.\nNovi osigurač unutra. Vitlo ponovno radi. Sidro gore. I možemo dalje.\nNa moru ponekad cijeli jutarnji plan zaustavi komadić plastike od 5 ampera.\nPorto Palermo – dolazim.", "14.8 13:22": "ALBANIJA – DAN KOJI SE NE PLANIRA, NEGO PAMTI\nJučer sam iz Vlore krenuo prema jugu, ali ovaj put INVICTUS nije nosio samo mene. Sa mnom su bili moj prijatelj dr. Ergys Cami i njegova kćer Efa.\nIspao je to jedan od onih dana zbog kojih sam zapravo i krenuo na ovo putovanje.\nPuno jedrenja, dobar vjetar, more, sunce… i još više smijeha. Bez žurbe. Bez velikog plana. Samo brod, prijatelji i osjećaj da je baš u tom trenutku sve kako treba biti.\nNismo nigdje “jurili” – jutro smo proveli baš onako kako treba na brodu.\nJa sam im napravio doručak – kajganu i tost, uz kavu i laganu muziku u pozadini.\nČitalo se, pričalo, smijalo… onaj jednostavni mir koji se ne može isplanirati, nego se samo dogodi.\nUsput smo nastavili jedriti prema jugu, a onda prema mjestu koje me potpuno osvojilo.\nGreen Coast.\nOd svega što sam do sada vidio u Albaniji, meni osobno – najljepše mjesto u zemlji.\nPrekrasno uređeno naselje uz more, fantastične kuće uklopljene u prirodu, kristalno more, plaže, restorani… mjesto koje ima neku posebnu energiju. Gledaš oko sebe i jednostavno ti se ne ide dalje.\nErgys i njegova obitelj ovdje imaju prekrasnu kuću i pozvali su me da ostanem kod njih, da prespavam i nastavim sutra.\nAli nisam mogao.\nKoliko god kuća bila lijepa i gostoprimstvo iskreno, nakon ovih dana INVICTUS je postao moj dom.\nNisam ga mogao ostaviti samog.\nNa kraju sam se vratio na brod, ali s još jednim danom koji ću dugo pamtiti.\nJer sve više shvaćam da ovo putovanje oko svijeta neće obilježiti samo zemlje, mora i mjesta koja ću vidjeti.\nObilježit će ga ljudi s kojima ću ih doživjeti.\nHvala ti, Ergys. Hvala, Efa.\nZa jedrenje, doručak na palubi, smijeh, knjige, muziku i jedan stvarno poseban dan u Albaniji.\nA Green Coast? Tamo se definitivno želim vratiti. Sažmi", "14.8 17:47": "PORTO PALERMO – mjesto gdje se susreću stoljeća povijesti i tajne Hladnog rata\nDanas me put doveo u Porto Palermo, jednu od najljepših prirodnih uvala albanske obale.\nIznad mora stoji impresivna tvrđava Porto Palermo, koju se najčešće povezuje s Ali-pašom Tepelenskim, moćnim osmansko-albanskim vladarom s početka 19. stoljeća. S njezinih zidina kontrolirao se ovaj dio obale i pomorski put uz Jonsko more.\nAli samo nekoliko minuta dalje nalazi se nešto iz sasvim drugog vremena.\nU stijenu je ukopan golemi podmornički tunel, izgrađen tijekom komunističkog razdoblja Envera Hoxhe. Dug je stotine metara i napravljen tako da podmornice i vojna plovila mogu ući direktno s mora i ostati skriveni unutar planine.\nStoljećima razlike, a ista ideja – kontrolirati i zaštititi ovu strateški važnu uvalu.\nDanas ovdje više nema ratne vreve. Samo nevjerojatno čisto Jonsko more, stijene, tvrđava, tajanstveni tunel… i INVICTUS na sidru.\nJoš jedno mjesto koje vjerojatno nikada ne bih upoznao na ovaj način da nisam krenuo na ovo putovanje.\nPorto Palermo, Albania\nSY INVICTUS\n\n::: Sažmi", "14.8 19:58": "Porto Palermo iz zraka.\nJedno od onih mjesta gdje priroda, povijest i more zajedno naprave prizor koji jednostavno moraš snimiti.\nTvrđava Ali-paše, tirkizno Jonsko more i INVICTUS usidren ispod nje.\nAlbanija me iz dana u dan sve više iznenađuje.\n\n::: Sažmi", "15.8 06:01": "Dobro jutro s INVICTUSA.\nMala jutarnja misao…\nSloboda nije uvijek bijeg od nečega.\nPonekad je sloboda jednostavno odluka da napokon počneš živjeti život koji želiš.\nŽelim vam lijep dan, gdje god bili.", "15.8 08:47": "Danas se javljam iz Sarandë, moje posljednje luke u Albaniji prije ulaska u Grčku.\nZanimljivo je da se ovdje brodovima dolazi već više od 2.000 godina. U antičko vrijeme Sarandë se zvala Onchesmos i bila je važna luka na Jonskom moru, a spominjali su je čak i antički pisci poput Strabona i Cicerona.\nPostoji i stara legenda koja ovu luku povezuje s Anhizom, ocem trojanskog junaka Eneje. More kojim danas plovi INVICTUS bilo je pomorski put još u antičko doba.\nA današnje ime Sarandë povezano je s bizantskim samostanom Četrdeset svetaca.\nDanas ovdje imam puno manje romantičan zadatak.\nSidro ispred luke, Harbour Master na VHF kanalu 11, odjava iz Albanije, zadnji pečati i papiri…\n…a onda INVICTUS okreće pramac prema Grčkoj.\n  Sažmi", "15.8 15:20": "Planovi do utorka kada se opet vraćamo u grad Krf (Corfu)", "15.8 17:13": "Prva večer na Krfu.\nStigao sam u Agios Stefanos, prekrasnu malu uvalu koja izgleda baš onako kako zamišljam Grčku.\nMale plaže, brodice na sidru, nekoliko taverni i restorana tik uz more… bez velikih hotela i gužve, samo pravi grčki otočni ugođaj.\nINVICTUS je sigurno na sidru, a ja jedva čekam spustiti dinghy i otići na obalu vidjeti kako sve izgleda izbliza — i naravno pronaći neku dobru grčku tavernu.\nKrf, lijepo si me dočekao.\n #CatamaranLife#Lagoon46 •#SYInvictus Sažmi", "16.8 05:32": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nKad sam krenuo na ovaj put, nisam znao što me čeka iza sljedećeg horizonta. I još uvijek ne znam.\nAli možda upravo zato toliko uživam u svemu ovome.\nNe mora svaki korak biti isplaniran. Ponekad jednostavno treba krenuti, vjerovati sebi i vidjeti kamo će te put odvesti.\nŽelim vam lijep dan, gdje god bili.", "16.8 08:48": "Jutro na Krfu počelo je baš kako treba.\nPrva stanica — Arachavi Beach. Malo sidrenja, kratka snimka, skok u kristalno Jonsko more i jutarnje kupanje.\nNema dugog zadržavanja — INVICTUS nastavlja dalje uz obalu Krfa.\nSljedeći cilj: Porto Timoni i Agios Georgios.\nDanas bez žurbe. Samo more, otok i nova mjesta koja čekaju iza sljedećeg rta.\n     Sažmi", "16.8 13:04": "Porto Timoni – jedno od onih mjesta gdje priroda napravi nešto gotovo nestvarno.\nNa sjeverozapadu Krfa, ispod sela Afionas, dvije prekrasne tirkizne uvale nalaze se leđa uz leđa, odvojene samo uskim komadom kopna. Upravo zbog tog neobičnog oblika Porto Timoni je postao jedan od najprepoznatljivijih prizora Krfa. (Greece Tours Guide)\nDo njega nema ceste – može se spustiti pješice ili, kao što se meni ipak više sviđa\n, doći s mora.\nA iz zraka… najbolje da dron ispriča ostatak priče.\n     Sažmi", "16.8 17:42": "Na kraju danas ipak nisam stao u Agios Georgios Bay. Plaža me nekako nije privukla pa sam poslušao osjećaj i nastavio dalje prema jugu, uz zapadnu obalu Korfua.\nI tako sam stigao u Ermones.\nMala uvala, visoki zeleni brežuljci oko mene, more ispred mene i INVICTUS gotovo sam u uvali. Upravo ona mjesta koja najviše volim.\nA onda sam otkrio da Ermones ima i svoju priču…\nPrema jednoj od legendi vezanih uz Homerovu Odiseju, upravo je ovdje more izbacilo brodolomca Odiseja, gdje ga je pronašla Nausikaja, kći kralja Alkinoja. Mali potok i danas utječe u more na plaži, baš kao u opisima koji se povezuju s tom pričom.\nJe li Homer mislio baš na ovu uvalu, vjerojatno nikada nećemo sa sigurnošću znati.\nAli dok ovako sam sjedim na INVICTUSU, okružen zelenim liticama i gledam prema obali, mogu razumjeti zašto je legenda nastala baš ovdje.\nSad idem tenderom na obalu, malo prošetati i vidjeti što Ermones skriva.\nPonekad su najbolja mjesta upravo ona koja uopće nisi planirao posjetiti.\n     Sažmi", "17.8 05:40": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nGodinama sam mislio da za neke stvari jednostavno treba doći pravi trenutak.\nJoš malo posla. Još jedna obaveza. Još nešto završiti… i onda ću imati vremena.\nA onda shvatiš da vrijeme ne čeka.\nNeki ljudi koji su mi bili važni više nisu ovdje. I možda su me upravo njihovi odlasci najviše naučili koliko je vrijeme koje imamo dragocjeno.\nČesto ih se sjetim ovdje na moru. Nisu fizički sa mnom, ali na neki način plove sa mnom na ovom putovanju.\nZato više ne želim čekati da sve bude savršeno posloženo.\nMožda pravi trenutak nije sutra, sljedeće godine ili „jednog dana“.\nMožda je pravi trenutak jednostavno — sada.\nŽelim vam lijep dan, gdje god bili.", "17.8 09:03": "Još jedna stanica na zapadnoj obali Krfa – Agios Gordios Bay.\nPrekrasna duga pješčana plaža, zelena brda iza nje i karakteristična stijena Ortholithi koja se izdiže iz mora.\nOno što me najviše iznenadilo – sredina kolovoza, a u uvali oko INVICTUSA nema nikoga.\nZa mene idealno. Malo mira, more i cijela uvala gotovo samo za mene.\nSad spuštam dinghy i idem malo do Agios Gordiosa – pronaći dobru kavu, prošetati mjestom i, što je trenutno najvažnije, pronaći supermarket i malo obnoviti zalihe na brodu.\n     Sažmi", "17.8 13:23": "Puno vas me pitalo koliko sam zapravo preplovio od polaska iz Marine Punat.\nEvo sada točnog odgovora — izvukao sam podatke iz logbooka INVICTUSA za svaki dan plovidbe.\nOd 1. do 17. kolovoza INVICTUS je prešao ukupno 673 nautičke milje.\nPut nas je dosad vodio kroz Hrvatsku\n, Crnu Goru\n, Albaniju\n i sada Grčku\n.\nBilo je dugih dana na moru, jedrenja, bonace, jakog vjetra, neplaniranih situacija, prekrasnih uvala i ljudi koje ću dugo pamtiti. Jedan dan nisam napravio niti jednu milju — ostao sam na Lastovu s kumovima Galićima.\n17 dana. 4 države. 673 NM.\nA ovo je tek početak puta oko svijeta.\n     Sažmi", "17.8 17:00": "Jedrimo dalje prema jugu Korfua.\nZapadnu stranu polako ostavljamo iza sebe i danas obilazim jug otoka kako bih se ponovno prebacio na istočnu obalu.\nDan je kao stvoren za jedrenje — vjetar nam dolazi odostraga, a INVICTUS lijepo klizi u kombinaciji glavnog jedra i Batmana.\nPlan za večeras je jednostavan: pronaći neku malu uvalu na istočnoj strani, baciti sidro i pronaći dobru grčku tavernu uz more. Ne preveliko mjesto, ne premalo… taman onako kako ja volim.\nBez žurbe. Danas je put jednako dobar kao i cilj.\n     Sažmi", "18.8 06:26": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nVeći dio života pokušavamo držati stvari pod kontrolom. Planiramo, organiziramo i pokušavamo predvidjeti što slijedi.\nA onda dođe more i vrlo brzo ti objasni da neke stvari jednostavno nisu u tvojim rukama.\nNe mogu birati vjetar, valove ni ono što će me sutra dočekati.\nAli mogu odlučiti kako ću na njih reagirati.\nMožda je tako i u životu. Ne možemo uvijek promijeniti ono što nam dolazi, ali možemo promijeniti način na koji ćemo kroz to proći.\nPonekad samo treba prilagoditi jedra i nastaviti dalje.\nŽelim vam lijep dan, gdje god bili.", "18.8 13:16": "Za 30 min idemo LIVE obilazak broda, postavljate pitanja sve što vas zanima. Na želju mnogih od Vas idem napraviti šetnju sa brodom sa Vama ovdje na Facebook-u !!!", "18.8 18:08": "INVICTUS TOUR – napokon!\nOvo ste me stvarno puno puta tražili — da vam pokažem INVICTUS iznutra i izvana, kako izgleda moj dom na moru i što ga sve čini posebnim.\nU ovih 21 minutu vodim vas kroz brod, od unutrašnjosti i kokpita do flybridgea, elektronike, jedara, strojarnice i svega onoga što se inače ne vidi u kratkim videima.\nA kako me prati sve više ljudi izvan Hrvatske, posebno moji prijatelji i pratitelji iz Italije, napravio sam i titlove na talijanskom\n i engleskom\n — upravo kako ste me mnogi od vas zamolili.\nDobrodošli na INVICTUS.\nOvako izgleda brod koji će mi sljedećih godina biti dom na putu oko svijeta.\n     Sažmi", "19.8 06:56": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nKada sam krenuo na ovaj put, mislio sam da ću najviše pamtiti mjesta.\nUvale. Otoke. Gradove. Izlaske i zalaske sunca.\nAli već sada shvaćam da će najljepše uspomene ipak biti vezane uz ljude.\nNeke poznajem godinama. Neke sam sreo sasvim slučajno. S nekima provedem nekoliko dana, a s nekima možda samo jednu večer.\nI često upravo ti neplanirani susreti ostave najdublji trag.\nMožda na kraju nije toliko važno koliko smo svijeta vidjeli.\nVažnije je s koliko smo ga ljudi podijelili.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "19.8 08:58": "Jučerašnji dan na Krfu imao je baš sve.\nTri delfina koja su se igrala uz INVICTUS i neko vrijeme nam pravila društvo.\nPiratski turistički brod koji je prošao pored nas i na trenutak vratio prizore iz nekih drugih vremena.\nA onda su stigli Urs i Kevin — novo društvo na INVICTUSU i početak još jednog dijela ovog putovanja.\nDan smo završili onako kako treba — izlaskom u grad Krf, šetnjom njegovim ulicama, večerom i dobrim razgovorima.\nPonekad jedan dan donese toliko različitih trenutaka da ga je teško prepričati. Zato je najbolje samo ih sačuvati… i nastaviti dalje.\n     Sažmi", "19.8 13:52": "Stigli smo na Antipaxos.\nDošli smo s Krfa, ovaj put u malo većem društvu, i usidrili se u prekrasnoj pješčanoj uvali. More je nestvarno, boje fantastične… ali mir definitivno nije riječ kojom bih danas opisao ovo mjesto.\n Krcato turista, brodova na sve strane i prava ljetna ludnica.\nAli na INVICTUSU se i putem radi.\nNa plovidbi prema Antipaxosu već smo skinuli prednje solarne panele i počeli pripremati sve što treba napraviti, kako bismo u Lefkadi mogli što prije odraditi servis i popravke i nastaviti dalje.\nA društvo oko nas je posebno — uz INVICTUS su ovdje i dva katamarana povezana s mojim prijateljem Ursom, Tamiro i Azul. Tako da danas imamo malu katamaransku flotu usred tirkiznog mora.\nMalo rada, puno mora, prijatelji oko mene… i još jedan potpuno drugačiji dan ovog putovanja.\n     Sažmi", "20.8 06:16": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nČesto mislimo da su hrabri ljudi oni koji se ničega ne boje.\nNe vjerujem u to.\nSvi imamo svoje strahove. I ja ih imam.\nZa mene hrabrost nije trenutak kada strah nestane. Hrabrost je kada znaš da postoji, prihvatiš ga i ipak odlučiš krenuti.\nJer ako cijeli život čekamo da budemo potpuno spremni, sigurni i bez straha, možda nikada nećemo odvezati konope.\nA neke od najljepših stvari u životu počinju upravo s tim prvim korakom u nepoznato.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "20.8 11:10": "Na putu između Antipaxosa i Lefkade.\nMore mirno, tek poneki brod oko nas, na INVICTUSU se usput radi i priprema za dalje… a ja između svega još rješavam i slučaj CT-a, planiranja od mojih pacijenta.\nNeke stvari očito putuju sa mnom oko svijeta.\n     Sažmi", "21.8 07:17": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nCijeli život nekamo žurimo.\nJoš jedan posao, još jedan cilj, još jedno mjesto na koje moramo stići. I nekako uvijek imamo osjećaj da ćemo tek nakon toga imati vremena stati.\nMore ima sasvim drugačiji ritam.\nOvdje možeš napraviti najbolji plan na svijetu, ali ne možeš požuriti vjetar. Ne možeš narediti moru da se smiri.\nPonekad jednostavno moraš ostati gdje jesi i čekati.\nI polako učim da to nije izgubljeno vrijeme.\nMožda ne moramo uvijek što prije stići negdje. Ponekad samo trebamo naučiti biti tamo gdje jesmo.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "22.8 07:17": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nPostoji trenutak kada shvatiš da ti možda ne treba još više.\nJoš više posla. Još više obaveza. Još jedan cilj koji moraš ostvariti prije nego što si dopustiš stati.\nDugo sam živio upravo tako.\nUvijek je postojalo nešto što prvo treba završiti. Nešto što još treba napraviti. A život je u međuvremenu prolazio.\nU jednom trenutku moraš sam sebi reći — dosta.\nNe zato što odustaješ.\nNego zato što si odlučio da želiš više od života, a ne samo više u životu.\nMeni je taj trenutak promijenio puno toga.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "22.8 11:06": "Jučer i danas  je INVICTUS u Sivoti imao radni dan.\n Servis, popravak solara, provjera litijuma i još nekoliko stvari koje treba riješiti prije nastavka puta.\nA nakon posla — lijepa večer, dobra priča i novo poznanstvo s divnim 75-godišnjim jedriličarem. Upravo su takvi susreti jedan od najljepših dijelova ovog putovanja.\n     Sažmi", "23.8 06:36": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nŠto sam stariji, sve više mijenjam mišljenje o tome što zapravo znači biti bogat.\nNekada su važni ciljevi, posao, uspjeh i stvari koje možemo stvoriti ili kupiti.\nDanas sve više vrijednosti vidim u nečem drugom.\nU vremenu koje imam. U ljudima s kojima ga dijelim. U večeri koju nisam planirao. U slučajnom susretu. U razgovoru koji potraje duže nego što je trebao. U jutru kada se probudim i nemam potrebu nikamo žuriti.\nStvari ostaju stvari.\nAli trenuci postaju uspomene.\nI možda je upravo to blago koje na kraju stvarno nosimo sa sobom.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "23.8 16:02": "Solari postavljeni, testna vožnja u tijeku, a Batman  otvoren.\n Predivan dan za jedrenje i sunce. Idemo prema drugoj luci, a sutra nastavljamo s popravcima na INVICTUSU.", "24.8 06:42": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nU Sivoti sam upoznao Nialla, 75-godišnjeg jedriličara koji me podsjetio na nešto što često zaboravljamo — godine nisu razlog da prestanemo živjeti.\nNakon velikih promjena u privatnom životu, otišao je u Englesku, ukrcao se na svoju jedrilicu i doplovio sve do Grčke.\nDanas živi na svom brodu.\nI ne samo to. Još uvijek aktivno jedri, putuje i radi kao skipper na drugim brodovima.\nDok sam ga slušao, pomislio sam koliko često sami sebi kažemo: „Prekasno je.“\nPrekasno za promjenu. Prekasno za novi početak. Prekasno za nešto što smo oduvijek željeli napraviti.\nA onda upoznaš čovjeka poput Nialla i shvatiš da možda problem nikada nisu bile godine.\nMožda je važnije imamo li još uvijek znatiželju, hrabrost i želju krenuti.\nNovi početak nema rok trajanja.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "24.8 17:01": "Stigli smo kratko u Nydri na Lefkasu. Prekrasno malo mjesto i jako zaštićena uvala, puna brodova na sidru.\nNe ostajemo dugo — pokupit ćemo još nekoliko stvari koje nam trebaju za INVICTUS i nastavljamo dalje.\n     Sažmi", "25.8 06:03": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nRano jutro na brodu ima nešto posebno.\nJoš nema gužve, nema buke, nema telefona koji zvone. Samo mirno more, tišina i novi dan ispred mene.\nCijeli život nekamo jurimo i često mislimo da ćemo mir pronaći tek kada nešto završimo, ostvarimo ili stignemo negdje drugdje.\nA možda mir uopće nije mjesto na koje trebamo stići.\nMožda je ponekad dovoljno samo stati, pogledati oko sebe i shvatiti da ti u ovom trenutku ništa više ne treba.\nJutros je jedan od tih trenutaka.\nŽelim vam mirno i lijepo jutro, gdje god bili.\n     Sažmi", "25.8 14:53": "Prebacili smo se u jednu prekrasnu uvalu na Kastosu.\n Sidro je bačeno, a krma vezana konopima za stijene – klasični grčki stil.\nDanas nema žurbe. INVICTUS je pretvoren u malu praonicu.\n Nakon radova na solarima ostalo je ljepila po brodu, pa koristim ono čega ovdje imam dovoljno – vlastitu vodu iz watermakera i struju iz solara. Kärcher radi punom parom, a brod polako ponovno izgleda kako treba.\nA navečer nagrada: poseban restoran uz staru vjetrenjaču.\n     Sažmi", "25.8 17:13": "Malo zabave s našim tenderom i njegovih 30 konja.\nA danas i prvi pravi test novog drona — prati nas sam dok jurimo po moru. Moram priznati, bit će dobrih kadrova na ovom putovanju!\n     Sažmi", "26.8 06:02": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nNavikli smo da svaki dan mora imati neki cilj.\nNegdje stići. Nešto napraviti. Nešto završiti.\nA jučer predvečer — bonaca. More gotovo bez pokreta, pogled prema pučini i nekoliko trenutaka u kojima se zapravo ništa nije događalo.\nI baš zato su bili posebni.\nPolako učim da ne mora svaki trenutak imati svrhu. Ne moramo uvijek nekamo stići da bismo imali osjećaj da smo dobro iskoristili vrijeme.\nPonekad je dovoljno samo biti tu.\nPogledati more. Ušutjeti. I pustiti da trenutak traje.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "27.8 06:15": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nJučer smo s Kastosa krenuli prema Vathiju na Ithaci.\nDosta vjetra, uzburkano more i jedan od onih dana zbog kojih voliš jedriti.\nA onda stigneš, baciš sidro i pomisliš — sada malo odmora.\nNe baš.\nEkipa sa susjednog katamarana otišla je u grad, njihov brod počeo je plesati oko nas, a moje večernje druženje pretvorilo se u dežurstvo da se dva katamarana ne upoznaju malo bolje nego što bih želio.\nI možda je upravo to život na brodu.\nMožeš isplanirati rutu, provjeriti prognozu i zamisliti kako će izgledati dan.\nA onda more napravi svoj plan.\nNe možemo uvijek birati što će nam dan donijeti.\nAli možemo birati kako ćemo na to reagirati.\nPrilagodiš se. Riješiš što treba. I ideš dalje.\nŽelim vam lijep dan, gdje god bili.\n     Sažmi", "27.8 17:31": "Jučer smo s Kastosa krenuli prema Atokosu, malom i gotovo nenaseljenom otoku usred Jonskog mora.\nNaravno, Atokos ima svoje najpoznatije stanovnike – svinje koje slobodno šeću plažom i kupaju se u moru.\nKažu da su tamo prava turistička atrakcija. Iskreno, djelovale su kao da je otok njihov, a mi smo samo došli u posjet.\nNakon kratkog druženja sa „lokalnim stanovništvom“ krenuli smo prema Vathiju na Ithaci. Vjetar se lijepo podigao, jedra gore i napokon ono zbog čega smo ovdje – nekoliko sati pravog, dobrog jedrenja.\nOd Kastosa, preko svinja na Atokosu, do Ithake…\nNa moru stvarno nikad ne znaš kakav će ti dan biti. I upravo je u tome njegova čar.\n     Sažmi", "28.8 06:02": "Dobro jutro s INVICTUSA.\nJutarnja misao…\nVolim ovaj trenutak kada se sunce tek pojavi iznad horizonta.\nMore se polako budi, dan je još tih, a ispred nas je novih 24 sata za koje još ne znamo što će donijeti.\nJučer je već iza nas. Ono dobro nosimo sa sobom, iz onog lošeg nešto naučimo — ali ništa od toga više ne možemo promijeniti.\nDanas možemo.\nNovi ljudi, nova mjesta, nove odluke, možda poneko iznenađenje… i još jedna prilika da od dana napravimo nešto vrijedno pamćenja.\nNe znamo što nas danas čeka.\nI možda je baš u tome ljepota novog jutra.\nŽelim vam dobro jutro i jedan stvarno dobar novi dan, gdje god bili.\n     Sažmi", "28.8 14:10": "Danas smo stigli u Sivotu.\nNakon plovidbe – malo drugačiji način uživanja u moru.\nAwake e-foil pod noge i kratka testna vožnja kroz Sivotu… gotovo kao da letiš iznad mora.\nA onda još nekoliko kadrova iz zraka – Sivota, more, brodovi i onaj pogled koji uvijek izgleda još bolje kada ga vidiš s visine.\nPonekad ne treba
