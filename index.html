hatGPT-a, Claudea i Codexa, a iza nekoliko lijepih ekrana koje danas vidim stoje stotine sati rada, programiranja, testiranja, pogrešaka, novih ideja, spajanja različitih sustava, provlačenja kablova kroz brod i onog poznatog:\n„Zašto ovo danas ne radi kad je jučer radilo?“\nIdeja za ARGO nastala je iz vrlo jednostavnog pitanja.\nVećinu ovog puta oko svijeta plovim sam.\nA čovjek, koliko god iskusan bio, ne može 24 sata dnevno gledati sve.\nVrijeme.\nRadar.\nAIS.\nKamere.\nBrodove i objekte oko sebe.\nMotore.\nBaterije.\nPotrošnju energije.\nSidro.\nStanje svih sustava na brodu.\nPomorska upozorenja i događaje koji se možda upravo događaju nekoliko desetaka milja dalje.\nI tako je nastala ideja:\nMogu li napraviti još jednog člana posade koji nikada ne spava?\nNe nekoga tko će upravljati INVICTUSOM umjesto mene.\nNe nekoga tko će donositi odluke umjesto mene.\nNego nekoga tko će stalno promatrati sve ono što ja u tom trenutku možda ne gledam.\nNekoga tko će jednostavno reći:\n„Darko, pogledaj ovo.“\nARGO već danas može dosta toga.\nPrati vremenske podatke i pokušava me upozoriti na nepovoljne uvjete koji dolaze.\nIdeja je da mi ne kaže samo da je oluja već stigla, nego da vidi odakle dolazi, kako se razvija i može li postati problem za INVICTUS.\nPrati motore i njihove parametre.\nNe samo rade li ili ne rade, nego pokušava prepoznati promjene koje bi mogle značiti da nešto više nije kao prije.\nPrati baterije, proizvodnju i potrošnju energije te autonomiju broda.\nKoliko energije imam.\nKoliko proizvodim.\nKoliko trošim.\nKoliko dugo mogu ostati potpuno neovisan.\nPrati sidro i poziciju INVICTUSA.\nPrikuplja pomorska upozorenja i događaje koji bi mi mogli biti važni — brod u nevolji, nesreća u blizini, čovjek u moru ili neka druga situacija koju bih trebao znati.\nI svaki dan od njega dobivam izvještaje o stanju INVICTUSA — energiji, autonomiji, baterijama, sustavima i situaciji oko broda.\nAli ono što želim postići puno je zanimljivije.\nNe želim da mi ARGO jednog dana samo kaže:\n„Nešto nije u redu.“\nŽelim da iz stotina podataka koje stalno prati može zaključiti:\n„Darko, nešto se mijenja. Pogledaj ovo prije nego što postane problem.“\nTo je zapravo cijela ideja.\nVidjeti ranije.\nA postoji još jedan cilj zbog kojeg je cijela priča s ARGOM zapravo i počela.\nČovjek u moru.\nKada ploviš sam, jedna od najopasnijih stvari koja se može dogoditi jest pasti s broda dok INVICTUS nastavlja ploviti.\nMoj krajnji cilj je da ARGO jednog dana može prepoznati da više nisam na brodu.\nDa digne alarm.\nPošalje moju poziciju.\nObavijesti koga treba.\nI na kraju — zaustavi INVICTUS.\nTo još nisam uspio napraviti.\nI ne želim stvarati dojam da ARGO danas može sve što sam zamislio.\nNe može.\nJoš uvijek je to veliki eksperiment koji svakim danom postaje malo bolji.\nAli prije šest mjeseci nije mogao gotovo ništa.\nDanas već svakodnevno prati moj brod.\nA sutra će znati nešto što danas još ne zna.\nJučer sam zato, umjesto šetnje Portovenerom, ponovno proveo sate na INVICTUSU.\nProgramiranje.\nTestiranje.\nNovi podaci.\nNovi kablovi kroz brod.\nJedna stvar proradi.\nDruga prestane raditi.\nPa ponovno ispočetka.\nI dok sam navečer gledao sve te podatke na velikom ekranu u salonu, pomislio sam koliko se pomorstvo zapravo promijenilo.\nNekada su mornari imali oči, uši, kompas i zvijezde.\nDanas imamo radar, AIS, termalne i AI kamere, satelite, senzore, računala i umjetnu inteligenciju.\nAli jedna stvar se nije promijenila.\nOdgovornost je i dalje na čovjeku.\nNe želim umjetnu inteligenciju koja će zamijeniti kapetana.\nŽelim još jedan par očiju.\nJoš jednog člana posade koji nikada ne spava.\nNekoga tko će povezati informacije koje ja možda u tom trenutku nisam povezao.\nI možda mi jednog dana upravo ARGO kaže nešto zbog čega ću donijeti jednu dobru odluku više.\nA na moru ponekad je upravo jedna dobra odluka donesena na vrijeme razlika između običnog dana i jako lošeg dana.\nNa kraju je možda dobro što jučer nisam pronašao mjesto za gumenjak.\nPortovenere će biti tamo i danas.\nA ARGO je jučer postao malo pametniji.\nTHE INVISIBLE CREW\nAlways watching.\nAlways learning.\nNever replacing the captain.\nUvijek promatra.\nUvijek uči.\nAli nikada ne zamjenjuje kapetana.\nSY INVICTUS • ARGO • AROUND THE WORLD\n     Sažmi", "28.9 13:14": "PORTOVENERE\nS mora izgleda kao mjesto iz razglednice. Šarene kuće uz obalu, uske ulice i crkva na stijeni — baš sam se veselio prošetati njime.\nInvictus je bio sigurno usidren; sidro je dobro držalo i na jačem vjetru. Ali onda je krenula potraga za mjestom gdje mogu ostaviti gumenjak. Četrdeset pet minuta kružio sam uz obalu: plaže zatvorene, molovi privatni, gradska luka puna. Na kraju nisam uspio izaći na kopno.\nTako sam Portovenere ovaj put upoznao samo s mora. Prekrasan pogled, ali i malo razočaranje — bio sam toliko blizu, a nisam mogao prošetati gradom.", "29.9 07:12": "Dobro jutro s INVICTUSA.\n“I didn’t choose where to stop. But I found a reason to stay.”\nJučer sam krenuo iz Porto Venerea prema sjeveru. Prošao sam pokraj Cinque Terre i razmišljao da stanem, ali opet isti problem koji me ovdje sve češće prati: negdje moraš na bovu, a onda nemaš gdje ostaviti gumenjak da bi uopće otišao u grad. Zato sam nastavio prema Portofinu ili Santa Margheriti Ligure.\nA onda se, nedaleko od Sestri Levantea, oglasio alarm: Water in Drive Seal (Stbd) — upozorenje na moguću vodu u brtvi desnog saildrivea.\nTo nije alarm uz koji kažeš: „Pogledat ću kasnije.” U tom trenutku nisam znao je li riječ o senzoru ili o stvarnom prodoru vode.\nI baš tada najviše osjetim što znači biti sam na brodu. Trebao bih biti gore, na komandnom mostu, pratiti kurs, vjetar, valove i druge brodove. A istovremeno bih trebao biti dolje, u motornom prostoru, i vidjeti što se događa. Ne mogu biti na dva mjesta odjednom.\nTo su rijetki trenuci kada mi zaista nedostaje još jedan par ruku. Ne zato što ne mogu sam pokušati riješiti problem, nego zato što netko mora paziti na brod dok sam ja dolje. Kod požara ili nekog drugog ozbiljnog kvara bilo bi isto.\nZato sam odmah promijenio plan. Portofino je u sekundi prestao biti važan. Skrenuo sam u veliku uvalu kod Sestri Levantea i krenuo što bliže obali. Ispred mene bila je velika pješčana plaža.\nU glavi sam već imao i onaj najgori scenarij: ako je voda zaista počela ulaziti i ne uspijem je zaustaviti, pokušat ću brod dovesti što bliže plaži. Ako baš ne bude drugog izlaza, radije ga pokušati nasukati na pijesak nego pustiti da potone dalje od obale. Tamo bih imao bolju priliku pumpama izbacivati vodu i ograničiti štetu.\nSrećom, do toga nije došlo.\nKad sam zaustavio INVICTUS, otišao sam u desni motorni prostor. Nigdje vode. Uz poziv Josipu Špoljareviću i ekipi iz Mariza, na koje se uvijek mogu osloniti kad je frka, pronašao sam senzor, izvadio ga i pogledao prostor ispod njega. I ondje je bilo suho. Senzor sam očistio; kad sam ga stavio u čašu vode, alarm se uredno uključio. Vratio sam ga i upozorenje se više nije ponovilo.\nZašto se oglasio? To još ne znam. Ali znam da je bilo ispravno odmah stati i provjeriti.\nTek kad sam se uvjerio da je sve u redu, pogledao sam gdje sam zapravo završio. Velika uvala, pješčane plaže, duga uređena šetnica — i, što je za mene postalo posebno važno, mjesto gdje mogu izaći na obalu s gumenjakom.\nTamo sam upoznao ekipu iz Lormeggia. Rode, Francesco i još jedan dečko odmah su mi rekli: „Ostavi gumenjak ovdje, kod našeg stola.” Popili smo nešto zajedno i pošteno se nasmijali. Poslije sam biciklom prošao šetnicom i zavukao se među male ulice starog grada, dućane i restorane. Pravo talijansko mjesto koje nisam ni planirao posjetiti.\nKad sam se vratio, dečki su mi rekli da nisam vidio drugi dio grada, onaj prema drugoj uvali. Zato danas ostajem ovdje. Pogledat ću i tu stranu, a onda raditi malo na Argu.\nJutros razmišljam: sam na brodu možeš napraviti jako puno. Ali ne možeš biti svugdje odjednom. Važno je znati kada promijeniti plan, stati i nazvati ljude na koje se možeš osloniti.\nAlarm me zaustavio u Sestri Levanteu. A ljudi koje sam ovdje upoznao dali su mi razlog da ostanem.\n     Sažmi", "29.9 12:38": "Sestri Levante — mjesto koje nisam planirao posjetiti.\nKrenuo sam prema Portofinu, ali alarm na brodu promijenio je plan. Skrenuo sam u prvu veliku uvalu, blizu pješčane plaže, da provjerim postoji li prodor vode. Srećom, vode nije bilo.\nKad je sve opet bilo mirno, spustio sam gumenjak i krenuo upoznati mjesto u kojem sam završio. Dočekali su me ljudi koji su mi odmah napravili mjesto za gumenjak, duga šetnica uz more, plaže, kafići i one male talijanske ulice u kojima se lako zadržiš dulje nego što si mislio.\nTako je Sestri Levante od neplaniranog zaustavljanja postao mjesto u kojem sam odlučio ostati još jedan dan. Evo kako je izgledao moj obilazak.\n     Sažmi", "30.9 07:00": "Dobro jutro s INVICTUSA.\nTHREE COUNTRIES • ONE BOAT\nDanas bez velike jutarnje misli.\nIdeju za današnju priču dao mi je moj prijatelj Kruno Kapetanović, vlasnik hotela Navis u Opatiji.\nNavis je za mene jedan od najljepših hotela na našoj obali. Doslovno je uklesan u stijene iznad mora i napravljen tako da je more praktički dio hotela.\nKruno je napravio i nešto što sam tek tijekom ovog putovanja shvatio koliko znači nama nautičarima.\nNapravio je mol.\nI nije važno dolaziš li velikom jahtom ili samo gumenjakom s broda usidrenog negdje u blizini.\nMožeš pristati, vezati se i otići ravno u njihov restoran na vrhunsku hranu.\nA ako ti nakon dobre večere više nije do povratka na brod — ostaneš spavati u prekrasnom hotelu, a sljedeći dan nastaviš s fenomenalnom masažom i malo wellnessa.\nDrugim riječima, čovjek je razmišljao i o gostu koji dolazi s mora.\nDok živiš na kopnu, taj mol uz hotel možda ti izgleda samo kao lijep dodatak.\nKad živiš na brodu, shvatiš da je to zapravo tvoj parking.\nJer najbolji restoran na svijetu može biti 100 metara od tebe, ali ako nemaš gdje ostaviti gumenjak — za tebe praktički ne postoji.\nPortovenere mi je to ovih dana vrlo dobro demonstrirao.\nI upravo mi je Kruno rekao:\n„Nakon svega što si sada prošao, trebao bi usporediti Hrvatsku, Grčku i Italiju, ali iz perspektive čovjeka koji dolazi s mora.“\nI pogodio je temu.\nNakon gotovo dva mjeseca života na INVICTUSU, ovo je moje iskustvo.\nNije turistički vodič i ne tvrdim da je svaka marina, uvala ili restoran u tim zemljama isti.\nOvo su jednostavno Hrvatska, Grčka i Italija kakve sam ih doživio s INVICTUSA.\n⸻\n HRVATSKA — KOMFOR & DRUŽENJE\nTek kada odeš iz Hrvatske shvatiš koliko smo neke stvari uzimali zdravo za gotovo.\nDođeš u prekrasnu uvalu.\nTamo mala konoba.\nSpustiš gumenjak, odeš do njihovog mola, vežeš ga i nekoliko minuta kasnije sjediš za stolom uz more.\nA često možeš i direktno s velikim brodom pristati na mol ispred restorana.\nNama je to normalno.\nNije.\nVlasnici naših restorana i konoba godinama su investirali u vlastite molove, napravili vezove i bove za goste, a neki su otišli i korak dalje pa organizirali taxi brod koji dođe po nautičare na njihov brod, doveze ih na večeru i poslije vrati natrag.\nTek sada, nakon Grčke i Italije, shvaćam koliko je to zapravo dobro organizirano i koliko nama nautičarima olakšava život.\nU Hrvatskoj gotovo svaka uvala u kojoj postoji ozbiljnija konoba ima neki način da do nje dođeš s mora.\nI postoji još nešto što sam tek kada sam otišao iz Hrvatske shvatio koliko je posebno.\nKod nas postoje mjesta gdje zapravo ne ideš brodom u mjesto da bi pronašao restoran — ideš brodom ravno u restoran.\nJedan od mojih primjera je Porto Rosso u Skrivenoj Luci na Lastovu.\nDrugi je BOWA na Šipanu.\nDođeš brodom, vežeš se praktički pred restoranom i onda ručak ili večera postanu puno više od samog obroka.\nBrod nekoliko metara od tebe.\nMore.\nRiba.\nVino.\nLjudi koje voliš.\nRučak koji se protegne kroz cijelo poslijepodne ili večera nakon koje se zapjeva i više nitko ne gleda koliko je sati.\nDa, košta.\nPonekad i poprilično.\nAli taj spoj broda, uvale, restorana i dobrog društva do sada nisam pronašao nigdje na isti način kao kod nas.\nPogotovo kada si s ljudima koje voliš, onda više ni ne pamtiš račun.\nPamtiš dan.\nA postoji još jedna kategorija u kojoj bih, iz svojeg dosadašnjeg iskustva, bez puno razmišljanja izabrao Hrvatsku.\nDruženje.\nZamislimo da sutra uzmem deset prijatelja ili članova obitelji i kažem:\n„Idemo nekoliko dana zajedno na more.“\nHrvatska, Grčka ili Italija?\nAko mi je najvažnija hrana — Italija bi imala ozbiljnu prednost.\nAko želim slobodu sidrenja i jednostavnost — Grčka.\nAli ako želim da se nas deset stvarno dobro provede zajedno, meni bi izbor bila Hrvatska.\nI ne mislim na klubove ni klasični noćni život.\nMislim na naš način druženja.\nDođeš brodom u malu konobu u uvali.\nSjedne vas deset za veliki stol.\nKrene večera.\nPa vino.\nNetko ispriča priču.\nNetko se počne smijati.\nNetko zapjeva.\nOnda zapjeva drugi stol.\nMožda se pojavi gitara.\nVečera koja je trebala trajati dva sata protegne se do ponoći.\nNitko te ne gleda zato što si malo glasniji.\nNitko te ne požuruje.\nJednostavno se živi ta večer.\nI to je nešto što sam tek sada počeo primjećivati.\nU Italiji i Grčkoj ljudi također izlaze u društvima.\nRestorani su puni.\nLjudi razgovaraju, jedu, piju i uživaju.\nAli atmosfera je drugačija.\nMirnija.\nTiša.\nMožda elegantnija.\nNema toliko tog našeg spontanog trenutka kada se obična večera pretvori u feštu.\nI ne mislim da je jedan način bolji ili civiliziraniji od drugoga.\nSamo je drugačiji način druženja.\nA naš je vrlo poseban.\nZato, kada bih birao mjesto gdje bih s deset ljudi koje volim proveo jednu večer koju ćemo godinama poslije prepričavati, vrlo vjerojatno bih izabrao neku malu konobu u hrvatskoj uvali.\nBrod vezan nekoliko metara dalje.\nVeliki stol.\nDobra riba.\nDobro vino.\nPuno smijeha.\nI u jednom trenutku netko će sigurno zapjevati.\nI tu sam tijekom ovog putovanja shvatio još jednu stvar:\nHrvatska možda jest najskuplja od ove tri zemlje.\nAli postoje stvari čiju vrijednost nije baš lako staviti na račun.\nDobra večer s ljudima koje voliš jedna je od njih.\nNaravno, postoji i druga strana hrvatske nautike.\nImamo odličnu infrastrukturu. Marine, servise, gorivo, trgovine, restorane i opskrbu.\nAli sve je manje uvala u kojima možeš jednostavno baciti sidro i ostati.\nBove su gotovo posvuda.\nA ono što mi još više smeta jest da se polako počela naplaćivati i ona osnovna sloboda jedrenja — sidrenje.\nČak i kada nisi na bovi, zna se dogoditi da dođe koncesionar i želi naplatiti boravak.\nCijene bova su visoke.\nMarine još više.\nMoj rekord ostaje Slano — 310 € za jednu noć.\nA u sezoni često nije dovoljno ni biti spreman platiti.\nAko nisi rezervirao na vrijeme, za katamaran poput INVICTUSA jednostavno nema mjesta.\nHrvatska zato za mene znači:\nnajviše komfora, najbolju dostupnost obale i poseban način druženja — ali uz uvjerljivo najveću cijenu.\n⸻\n GRČKA — SLOBODA & JEDNOSTAVNOST\nGrčka je gotovo potpuna suprotnost.\nPravih marina ima puno manje.\nAli zato ima nevjerojatan broj otoka, uvala i prekrasnih pješčanih plaža.\nI ono što mi se posebno svidjelo:\nsidro možeš baciti gotovo gdje želiš.\nNema osjećaja da će nakon pola sata netko doći naplatiti more.\nA gradski vezovi?\nNakon Hrvatske misliš da je netko pogriješio na računu.\nPlaćao sam vez oko 10 € dnevno, ponegdje sa strujom i vodom.\nZa INVICTUS.\nGotovo smiješno.\nAli Grčka ima svoje specifičnosti.\nMožeš biti usidren ispred prekrasne pješčane plaže i onda shvatiti da nemaš gdje s gumenjakom.\nNema mola.\nNema pristaništa.\nA onda sam upoznao i njihov klasični način sidrenja:\nsidro naprijed, konopi na stijene iza.\nKada vas je nekoliko na brodu — odlično.\nKada si sam na katamaranu od 46 stopa i trebaš istovremeno držati brod, odvesti konop do stijene, vezati ga i vratiti se — malo manje romantično.\nS druge strane, Grčka me jako ugodno iznenadila opskrbom za brod.\nU mjestima poput Lefkade gotovo sve što mi je trebalo za INVICTUS mogao sam pronaći, kupiti, napraviti ili pronaći nekoga tko će mi pomoći.\nTo mi je u nekim dijelovima Italije bilo teže.\nA onda — ljudi.\nTo je možda ono što ću iz Grčke najviše pamtiti.\nDošao sam kao potpuni stranac, a već u prvim uvalama ljudi su me primili nevjerojatno toplo.\nBez osjećaja da si samo još jedan turist kojem nešto treba prodati.\nJednostavno ljudski.\nSivota mi je posebno ostala negdje u srcu.\nNije najveća.\nNije najpoznatija.\nAli tamo bih se bez puno razmišljanja ponovno vratio.\nI restorani?\nJednostavni, odlična hrana i vrlo pristupačne cijene.\nRiba, feta, masline, meso s gradela, čaša vina…\nBez puno filozofije, ali s puno okusa.\nAko gledam odnos kvalitete hrane, cijene i cijelog doživljaja, Grčka je jako visoko.\nGrčka za mene znači:\nsloboda, jednostavnost i ljudi.\n⸻\n ITALIJA — RAZNOLIKOST & GASTRONOMIJA\nA onda Italija.\nNajveće iznenađenje cijelog dosadašnjeg puta.\nOčekivao sam vrlo skupe marine.\nA zapravo sam za INVICTUS često plaćao oko 120–130 € dnevno.\nCapraia oko 120 €.\nPorto Turistico di Roma oko 110 €.\nZa veliki katamaran, uređenu marinu, sigurnost i kompletnu infrastrukturu — sasvim korektno.\nPisa je bila mala iznimka.\nPrva marina u kojoj nisu priznali dužinu broda iz registracije, nego su odlučili sami izmjeriti INVICTUS.\nNaravno, njihov INVICTUS ispao je duži od mojeg.\nPa je i račun bio veći.\nAli marine kroz koje sam prošao uglavnom su vrlo dobro organizirane.\nSidrišta također ima puno.\nProblem je što je velik dio zapadne talijanske obale otvoren prema moru.\nPo lijepom vremenu nema problema.\nAli kada dolazi ozbiljnije nevrijeme, puno je manje mjesta gdje se možeš stvarno dobro sakriti nego u Hrvatskoj ili Grčkoj.\nZato u Italiji puno pažljivije gledam prognozu prije nego odlučim gdje ću prespavati.\nA onda moj talijanski neprijatelj broj jedan:\nGUMENJAK.\nGrad je ispred tebe.\nRestoran vidiš.\nLjudi šetaju rivom.\nTi si 200 metara dalje.\nAli nemaš gdje ostaviti gumenjak.\nPortovenere — 45 minuta traženja.\nNa kraju sam se okrenuo i vratio na INVICTUS.\nU Hrvatskoj mi se to gotovo nikada ne bi dogodilo.\nAli kada konačno dođeš na kopno…\nItalija je fantastična.\nTropea.\nScilla.\nPositano.\nCapraia.\nI još cijeli niz malih mjesta kroz koja sam prošao.\nJedno ljepše od drugoga.\nAko bih morao birati zemlju s najljepšim pomorskim gradovima i mjestima na ovom dijelu puta, za sada bih rekao — Italija.\nI onda restorani.\nTu su Talijani napravili cijelu kulturu od primanja gosta.\nNaručiš Aperol ili neko drugo piće, a uz njega stižu masline, focaccia, čips, mali zalogaji…\nČesto već uključeni u cijenu.\nSjedneš samo nešto popiti, a nakon pola sata shvatiš da si praktički večerao.\nA hrana je stvarno fenomenalna.\nCrudo, pasta, riba, plodovi mora, vino, aperitivo…\nKod Talijana hrana nije samo obrok.\nTo je ritual.\nAko gledam samo ukupnu kvalitetu restorana i doživljaj hrane, meni je za sada:\n1. Italija\n2. Grčka\nHrvatska ima fantastičnih restorana i imam svoja mjesta kojima se vraćam upravo zbog vlasnika i ljudi koje tamo poznajem.\nAli kod nas je turizam ipak puno komercijaliziraniji.\nU Grčkoj i Italiji dogodilo mi se nešto što nisam očekivao.\nDođem negdje gdje ne poznajem nikoga — i nakon sat vremena imam osjećaj kao da sam došao među ljude koji me znaju.\nSjećam se onog malog obiteljskog restorana u Italiji.\nCijela obitelj radi.\nHrana odlična.\nAtmosfera fantastična.\nA kada se posao malo smirio, vlasnik uzme jastuk i jednostavno legne na stol odmoriti.\nTranquillo.\nTa slika mi možda bolje opisuje Italiju od bilo kojeg turističkog vodiča.\nI upravo tu srdačnost ljudi teško je staviti u tablicu.\nU Grčkoj sam je osjećao gotovo od prvog dana.\nU Italiji možda još više.\nNe kažem da su ljudi u Hrvatskoj manje srdačni.\nDaleko od toga.\nImam kod nas restorane i mjesta na koja se vraćam upravo zbog ljudi.\nAli tamo već često dolazim kao poznati gost.\nOvdje sam dolazio kao potpuni stranac.\nI zato me ta toplina možda još više iznenadila.\n⸻\nNakon gotovo dva mjeseca počeo sam zemlje gledati potpuno drugačije.\nPrije sam gledao hotel.\nDanas gledam sidrište.\nPrije parking za auto.\nDanas parking za gumenjak.\nPrije sam gledao koliko je restoran udaljen.\nDanas gledam mogu li uopće do njega s mora.\nGledam mogu li se sakriti ako dođe oluja.\nMogu li pronaći rezervni dio za brod.\nMogu li negdje natočiti gorivo.\nTreba li rezervirati vez.\nHoće li mi netko naplatiti sidro.\nI kakav će biti čovjek koji će me dočekati kada konačno izađem na kopno.\nKad bih nakon svega dosad svaku zemlju morao opisati u nekoliko riječi:\n HRVATSKA — KOMFOR & DRUŽENJE\n GRČKA — SLOBODA & JEDNOSTAVNOST\n ITALIJA — RAZNOLIKOST & GASTRONOMIJA\nAli postoji još nešto što ne pripada nijednoj zastavi:\nLJUDI.\nJer nakon gotovo dva mjeseca putovanja shvaćam da se na kraju najmanje sjećam koliko je nešto koštalo.\nSjećam se tko me dočekao.\nTko mi je pomogao.\nS kim sam se nasmijao.\nGdje sam se osjećao dobrodošlo.\nI zbog koga sam pomislio:\nOvdje bih se jednom volio vratiti.\nTHREE COUNTRIES • ONE BOAT\nSame sea.\nThree completely different ways to experience it.\nIsto more.\nTri potpuno različita načina da ga doživiš.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "30.9 14:43": "Portofino — mala luka s velikom pričom.\nDanas sam s INVICTUSOM stigao pred Portofino. Šarene kuće uz more, zelene padine i Castello Brown iznad luke… S mora odmah shvatiš zašto je ovo mjesto toliko poznato.\nJoš su ga Rimljani zvali Portus Delphini — Luka dupina. Stoljećima ribarsko mjesto, a kasnije omiljeno odredište filmskih zvijezda i simbol talijanske „dolce vite”.\nPosebno mi se svidjela priča o engleskom konzulu Brownu, koji je ugledao tvrđavu sa svojeg broda, zaljubio se u nju i 1867. je kupio. Razumijem ga — neke te obale osvoje već s mora.\nDanas se ovdje susreću ribarske brodice i luksuzne jahte, povijest i glamur. A meni je najljepši upravo taj pogled s broda, dok se mala luka polako otvara pred pramcem.\nJoš jedno lijepo mjesto na putovanju oko svijeta.\n     Sažmi", "1.10 07:04": "Dobro jutro s INVICTUSA.\nDREAMS HAVE A PRICE\nJučer sam na benzinskoj u Lavagni gledao brojke kako rastu.\n2,65 € za litru dizela.\nNa kraju — gotovo 2.000 €.\nMoram priznati, čak sam i ja na trenutak zastao.\nPosljednji put ozbiljno sam tankao još na Krfu. Tada je dizel bio oko 2,35 € po litri i već sam se tamo čudio koliko je skuplji nego kod nas.\nA onda Italija — 2,65 €.\nPrije jučerašnjeg tankanja u svakom spremniku ostalo mi je još otprilike 30% goriva.\nDakle, od Krfa do sjevera Italije potrošio sam gotovo 70% tankova.\nI da — dosta sam motorirao.\nNe zato što sam zaboravio da imam jedra.\nNego zato što velik dio vremena jednostavno nije bilo dovoljno vjetra.\nMogao sam ostati nekoliko dana u svakoj uvali i čekati idealan vjetar.\nAli ovo putovanje ipak ima svoj ritam.\nIspred mene su sada Korzika, Menorca, Mallorca, Ibiza, španjolska obala i Gibraltar.\nOko 20. listopada trebao bih se u Gibraltaru ponovno spojiti s mojim prijateljem Ursom iz Švicarske, koji plovi svojim katamaranom, pa bismo dalje nastavili svaki na svojem brodu.\nDo tada me čeka još otprilike 900 nautičkih milja.\nZato si sada ne mogu uvijek dopustiti čekati savršen dan za jedrenje.\nKada ima vjetra — jedrim.\nKada ga nema, a moram dalje — pale se motori.\nTo je jednostavno realnost ovakvog putovanja.\nKasnije sam objavio fotografiju s benzinske i napisao koliko sam platio gorivo.\nI tada mi se javila prijateljica koja tek treba putovati u Pariz.\nNapisala mi je:\n„Za te novce ja bih si radije kupila Chanel.“\nNasmijala me.\nAli me ta poruka kasnije natjerala na razmišljanje.\nJer zapravo je potpuno u pravu.\nSvatko od nas ima nešto na što mu nije žao potrošiti novac.\nNetko voli torbice.\nNetko automobile.\nNetko satove.\nNetko dobru bocu vina.\nNetko će novac jednostavno ostaviti u banci.\nA ja sam u ovoj fazi života odlučio kupovati snove.\nI tek tada sam se zapitao:\nŠto sam ja zapravo dobio za tih gotovo 2.000 €?\nOdgovor nije bio u jučerašnjem računu iz Lavagne.\nTrebao sam samo pogledati unatrag.\nJer gorivo koje sam posljednji put ozbiljno natočio još na Krfu nije samo nestalo u motorima.\nPretvorilo se u putovanje kroz Italiju.\nU Siciliju.\nScillu i Tropeu.\nU Positano i nevjerojatnu Amalfijsku obalu.\nU Ischiju i Ponzu.\nU Giglio i priču o Costa Concordiji.\nU Elbu i tragove Napoleona.\nU Capraiu.\nPortovenere.\nPortofino.\nSestri Levante.\nI u desetke malih uvala, sidrišta i mjesta između njih čija imena možda jednog dana neću ni pamtiti, ali ću pamtiti kako sam se tamo osjećao.\nU neka sam stigao jedrima.\nDo nekih sam morao motorima.\nAli danas, kada pogledam tih gotovo 70% potrošenih tankova, više ne vidim litre dizela.\nVidim jutra kada otvorim oči i kroz prozor ugledam mjesto na kojem nikada prije nisam bio.\nVidim zalaske sunca koje nisam planirao.\nVidim ljude koje dan prije nisam poznavao.\nVidim večere koje su se slučajno pretvorile u prijateljstva.\nVidim fotografije i videe koje sam putem napravio.\nVidim gotovo dva mjeseca svojeg života.\nGorivo je nestalo.\nAli ono u što sam ga pretvorio — ostalo je.\nA jučerašnji dan kao da je baš htio potvrditi cijelu tu priču.\nNakon tankanja krenuo sam prema Portofinu.\nMjesta nema.\nIdem dalje prema Santa Margheriti Ligure i bacam sidro na mjestu gdje je sidrenje dopušteno.\nNa karti izgleda dobro.\nU stvarnosti veliki trajekti prolaze toliko blizu INVICTUSA da vrlo brzo shvaćam da tamo ne želim provesti noć.\nPonovno dižem sidro.\nI vraćam se u Sestri Levante.\nNa prvi pogled — vratio sam se tamo odakle sam krenuo.\nPotrošio gorivo da bih završio na istom mjestu.\nAli zapravo nisam završio na istom mjestu.\nUzeo sam bicikl i otišao na drugu stranu grada koju još nisam vidio.\nI ostao iznenađen.\nOgromna pješčana plaža uz sam grad, šarene zgrade, kafići, ljudi i more.\nSestri Levante zapravo živi između dvije obale, a ja sam tek jučer otkrio onu drugu.\nNavečer sam završio na piću s ljudima koje sam ovdje tek upoznao — Radeom iz Rumunjske i Francescom iz L’Ormeggia.\nI pomislio:\nDan je počeo računom od gotovo 2.000 €.\nPortofino nije uspio.\nSanta Margherita nije uspjela.\nPlan sam nekoliko puta promijenio.\nA navečer sjedim s novim ljudima, gledam more i mislim:\nOvo je bio stvarno dobar dan.\nI onda sam ponovno pomislio na poruku moje prijateljice i Chanel.\nNemam ništa protiv Chanel torbice.\nAko te veseli — kupi je, nosi je i uživaj u njoj.\nJer poanta nije u tome da je jedan izbor bolji od drugoga.\nPoanta je da shvatiš što tebi vrijedi.\nA ja sam svoj izbor napravio.\nU ovoj fazi života želim manje skupljati stvari.\nA više skupljati mjesta.\nLjude.\nMilje.\nJutra.\nZalaske.\nPriče.\nI trenutke u kojima stanem, pogledam oko sebe i pomislim:\n„Da. Upravo zbog ovoga sam krenuo.“\nZato prijateljici, kada ode u Pariz po svoj Chanel, mogu odgovoriti sasvim jednostavno:\nTebi Chanel na ramenu.\nMeni vjetar u jedrima.\nOboje smo svoj novac pretvorili u nešto što nas veseli.\nSamo što ja svoj, kad god mogu, pokušavam pretvoriti u nešto što ne mogu staviti u ormar.\nU USPOMENE.\nDREAMS HAVE A PRICE.\nMEMORIES HAVE A VALUE.\nFuel disappears.\nWhat you turn it into remains.\nSnovi imaju cijenu.\nUspomene imaju vrijednost.\nGorivo nestane.\nOno u što ga pretvoriš — ostane.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "1.10 18:22": "Sestri Levante – drugi dio\nDanas sam se provozao po mjestu i otkrio još jedno lice Sestri Levantea. Nakon uličica i uvale koje sam vam već pokazao, ovaj put vodim vas uz njihovu prekrasnu plažu.\nA plaža… na trenutak me mislima odvela sve do Brazila.\n Duga obala, more, zgrade uz plažu i taj osjećaj života uz vodu — moja mala talijanska Copacabana. Nije stvar samo u izgledu, nego u onom osjećaju kad pogledaš oko sebe i pomisliš: „Pa ovdje bih mogao ostati još malo.”\nDok putujem, sve više uživam upravo u takvim trenucima. Krenem se samo malo provozati, bez velikog plana, a vratim se s prizorima koje želim podijeliti s vama. Ponekad je dovoljno zaviriti u drugi dio mjesta da te ono ponovno osvoji.\nSestri Levante mi se baš uvukao pod kožu.\n     Sažmi", "2.10 07:00": "Dobro jutro s INVICTUSA.\nJučer mi je gotovo promaknula jedna mala, ali meni prilično velika obljetnica.\nProšla su točno dva mjeseca otkako sam krenuo.\n1. kolovoza isplovio sam iz Punata.\nTada je sve ovo što danas vidim na karti bila samo linija.\nRuta.\nPlan.\nTočke koje sam unosio u navigaciju i imena mjesta koja sam znao uglavnom s karte.\nDanas gledam istu tu liniju i više ne vidim kartu.\nVidim dva mjeseca svojeg života.\nVidim Lastovo i ljude s kojima je zapravo počela cijela priča.\nCrnu Goru.\nAlbaniju.\nGrčku i njezine uvale.\nKrf, Lefkadu, Ithacu…\nA onda Italiju.\nScillu i onu noć koju sigurno neću zaboraviti.\nTropee.\nPositano i Amalfijsku obalu.\nIschiju.\nPonzu.\nGiglio i priču o Costa Concordiji.\nElbu.\nCapraiu.\nPortovenere.\nPortofino.\nI sada Sestri Levante.\nAli kada pogledam ovu kartu, možda su mi još zanimljivija sva ona mjesta koja na njoj nisu označena.\nLjudi koje nisam planirao upoznati.\nVečere koje nisu bile u itineraru.\nKvarovi koje nisam naručio.\nOluje koje bih rado preskočio.\nJutra kada nisam znao gdje ću navečer spavati.\nPromjene plana koje su me na kraju odvele na neko još bolje mjesto.\nI oni mali trenuci zbog kojih ponekad samo sjedneš na brod, pogledaš more i pomisliš:\n„Da… upravo sam ovakav život želio.“\nPrije dva mjeseca nisam znao kako će sve ovo izgledati.\nNaravno, imao sam plan.\nImao sam rutu.\nImao sam INVICTUS pun opreme, karata, rezervnih dijelova i ideja.\nAli danas znam nešto što tada nisam mogao staviti ni u jednu navigaciju:\nputovanje nije ona bijela linija na karti.\nPutovanje je sve ono što ti se dogodi između dvije točke te linije.\nJučer sam pisao o tome kako gorivo nestane, ali ono u što ga pretvoriš ostane.\nJutros gledam ovu kartu i vidim upravo to.\nDva mjeseca.\nTisuće fotografija.\nStotine malih priča.\nPuno novih ljudi.\nNekoliko dobrih prijateljstava.\nNešto straha.\nPuno smijeha.\nNekoliko pogrešnih odluka.\nJoš više dobrih.\nI bezbroj trenutaka koje prije samo dva mjeseca nisam imao.\nA najbolji dio?\nOvo je tek početak.\nJer sada više ne gledam samo trag iza INVICTUSA.\nGledam ono što je ispred njega.\nKorzika.\nBaleari.\nŠpanjolska.\nGibraltar.\nKanari.\nAtlantik…\nI negdje tamo još jako daleko — ostatak svijeta.\nPrije dva mjeseca sve je to bio san i linija na karti.\nDanas je jedan dio te linije iza mene.\nI postao je moja priča.\n**TWO MONTHS AGO THIS WAS A PLAN.\nTODAY IT’S MY STORY.**\nNemoj samo brojati dane.\nNapravi da se dani broje.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "3.10 13:51": "Dobar dan s INVICTUSA.\nYOU NEVER TRAVEL ALONE\nJutros sam krenuo rano.\nZapravo toliko rano da se teško može nazvati jutrom.\nOko 02:30 digao sam sidro u Sestri Levante i ponovno krenuo dalje.\nIspred mene je more, a konačnu odluku još nisam donio — Francuska ili Korzika.\nOdlučit ću putem, prema vremenu, vjetru i onome što mi more danas ponudi.\nAli dok svjetla Sestri Levante polako ostaju iza mene, jutros zapravo ne razmišljam toliko o tome kamo idem.\nRazmišljam o ljudima koji mi omogućuju da idem dalje.\nJučer mi je iz Udina došao moj prijatelj Srđan Perkić.\nI nije došao praznih ruku.\nPosljednjih tjedana njegova adresa u Udinama praktički je postala mali logistički centar SY INVICTUSA.\nDok sam ja plovio dalje, kod njega su stizali paketi sa stvarima koje sam putem naručivao — rezervni dijelovi, zamjene za ono što se pokvarilo ili izgubilo i sve one sitnice koje je gotovo nemoguće organizirati kada ti se adresa mijenja svakih nekoliko dana.\nNova Insta kamera, jer sam svoju izgubio.\nZamjena za Hover Aqua koji je nakon svega dva korištenja odlučio da je njegova karijera završena.\nNovi dio za podizač sidra koji su mi poslali iz Hrvatske.\nI još hrpa stvari koje na kopnu izgledaju kao obični paketi, ali kada ti je brod dom, a ispred tebe su tisuće milja — odjednom postanu jako važne.\nSve je to stizalo kod Srđana.\nOn je primao pakete, čuvao ih, organizirao sve…\nA onda je jučer sjeo u auto u Udinama i dovezao mi sve do broda.\nAli ono najbolje što mi je jučer donio zapravo nije bilo ni u jednoj od tih kutija.\nDošao mi je prijatelj.\nSrđana poznajem i poslovno. Radi nam marketing i društvene mreže za polikliniku, iza njega stoji ozbiljna međunarodna marketinška priča, a bio je i jedan od producenata filma „Svjetla Sarajeva“.\nAli jučer ništa od toga nije bilo važno.\nNije bio marketing.\nNije bio posao.\nNisu bili paketi.\nBila su jednostavno dva prijatelja koja se neko vrijeme nisu vidjela.\nI zato smo navečer otišli van.\nPopili nešto.\nPričali.\nSmijali se.\nI proveli jednu sasvim običnu, ali baš lijepu večer.\nKasnije je Srđan otišao spavati u hotel.\nA ja sam znao da će moj alarm zazvoniti vrlo brzo.\nI evo me sada.\nMrak.\nMore.\nINVICTUS ide dalje.\nI negdje između Sestri Levante, Francuske i Korzike shvatiš jednu zanimljivu stvar.\nNa put oko svijeta možda možeš krenuti sam.\nMožeš sam držati kormilo.\nSam dignuti jedra.\nSam spustiti sidro.\nSam donositi odluke.\nSam pokušavati popraviti stvari kada se pokvare.\nAli ovakvo putovanje zapravo nikada ne napraviš sam.\nIza njega uvijek stoje ljudi.\nNetko ti pošalje dio iz Hrvatske.\nNetko primi paket.\nNetko nazove servis.\nNetko pronađe ono što ti treba.\nNetko prijeđe stotine kilometara samo da ti donese nekoliko kutija.\nNetko pita gdje si.\nNetko prati tvoju poziciju.\nNetko ti pošalje poruku kada zna da je vani loše vrijeme.\nA netko jednostavno kaže:\n„Ne brini. Ja ću to riješiti.“\nI možda se upravo u tim trenucima najbolje vidi što prijateljstvo zapravo znači.\nNe u velikim riječima.\nNe u tome koliko se često vidimo.\nNego u malim stvarima koje netko napravi za tebe iako mu to uopće nije obaveza.\nZato jutros, dok gledam svjetla Sestri Levante kako polako nestaju iza mene, ne razmišljam samo o tome koliko je milja ispred INVICTUSA.\nRazmišljam o svim ljudima koji su na neki način dio ovog putovanja.\nNeki su plovili sa mnom.\nNeki su me dočekali u luci.\nNeki su pomogli kada je nešto pošlo po zlu.\nNeki me prate iz svojih domova i gotovo svaki dan pitaju gdje sam i kamo idem.\nA neki, poput Srđana, možda nisu preplovili sa mnom niti jednu milju…\nali su mi pomogli da mogu prijeći sljedećih tisuću.\nA postoje i oni kojih više nema.\nPrijatelji kojih se sjetim gotovo svaki dan.\nLjudi koje više ne mogu nazvati.\nKojima više ne mogu poslati fotografiju nekog novog mjesta.\nS kojima više ne mogu sjesti navečer uz čašu vina i ispričati što mi se tog dana dogodilo.\nAli nekako imam osjećaj da su i oni ovdje.\nDa plove sa mnom.\nU nekim mislima.\nU nekim pjesmama.\nU nekom zalasku sunca.\nU trenucima kada sam potpuno sam na moru i kada mi se, bez nekog posebnog razloga, pojave u mislima.\nI možda je upravo to jedna od najljepših stvari koje sam do sada naučio na ovom putovanju:\nLjudi ne moraju biti na brodu da bi putovali s tobom.\nNeki plove uz tebe.\nNeki ti donesu dijelove iz Udina.\nNeki te čekaju u sljedećoj luci.\nNeki te prate porukama izdaleka.\nA neki više nisu ovdje…\nali ih svejedno nosiš sa sobom preko svakog mora.\nZato danas jedno veliko:\nHvala ti, Srđane.\nAli i hvala svima vama koji na neki svoj način plovite sa mnom.\nI posebno onima kojih više nema, kojih se sjetim gotovo svaki dan…\na za koje znam da su još uvijek negdje ovdje, na INVICTUSU, sa mnom.\n**THE LONGER THE JOURNEY,\nTHE MORE YOU REALIZE:\nYOU NEVER TRAVEL ALONE.**\nSome people sail beside you.\nSome help you from afar.\nAnd some you simply carry with you forever.\nNeki ljudi plove uz tebe.\nNeki ti pomažu izdaleka.\nA neke jednostavno nosiš sa sobom zauvijek.\nŠto je put duži, sve više shvaćaš:\nnikada zapravo ne putuješ sam.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "3.10 14:57": "JUST US AND THE WIND\nKonačno opet tamo gdje INVICTUS i ja najviše pripadamo.\nNa pučini.\nNegdje između Italije i Korzike.\nKopna nema ni ispred ni iza nas. Samo more do horizonta, valovi, sunce i vjetar.\nI danas napokon — sva jedra otvorena.\nNema motora. Nema buke. Samo zvuk mora koje prolazi uz trup, jedra puna vjetra i INVICTUS koji grabi prema Korzici.\nNakon svih luka, marina, sidrišta, popravaka, paketa i planiranja posljednjih dana, ovo mi je trebalo.\nOnaj trenutak kada prestane biti važno koliko je milja do cilja.\nNe gledaš više obalu.\nNe tražiš sljedeću luku.\nSamo pustiš brod da radi ono za što je napravljen.\nA sebe da uživaš u onome zbog čega si krenuo.\nINVICTUS i ja.\nMore.\nSunce.\nValovi.\nI vjetar.\nNišta više nam danas ne treba.\nJUST US AND THE WIND.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "3.10 17:32": "ARRIVEDERCI ITALIA\n • BONJOUR CORSICA\nNakon toliko prekrasnih mjesta, ljudi, hrane i uspomena — vrijeme je reći hvala, Italija.\nDanas konačno ponovno pučina. Nigdje kopna, sunce, valovi, dobar vjetar i sva jedra otvorena.\nBatman leti, INVICTUS grabi prema Korzici, a ja uživam u svakom trenutku.\nNova zastava. Nova zemlja. Novo poglavlje.\nJust us and the wind.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "4.10 07:07": "Dobro jutro s INVICTUSA.\nMORNING THOUGHT\nSometimes the horizon doesn’t call you to a place.\nIt simply calls you to keep going.\nJučer je bio jedan od onih dana kada tek navečer, kada spustiš sidro i sve se smiri, shvatiš koliko si zapravo daleko stigao.\nU 02:54 krenuo sam iz Sestri Levante.\nI onda — more.\nGotovo 17 sati plovidbe.\n104,5 nautičkih milja.\nProsječna brzina 6,2 čvora.\nItalija je polako nestajala iza INVICTUSA.\nNakon toliko vremena provedenog uz talijansku obalu bilo je pomalo neobično spustiti talijansku zastavu, podignuti francusku i shvatiti:\nJedno poglavlje ovog putovanja upravo je završilo.\nA onda se otvorilo more.\nNigdje kopna.\nSunce, valovi i napokon dovoljno vjetra da otvorim jedra.\nI Batman je ponovno poletio.\nNakon dosta motoriranja posljednjih tjedana, bilo je fenomenalno ponovno čuti samo more uz trup, vjetar u jedrima i INVICTUS kako grabi prema Korzici.\nMi i vjetar.\nUpravo zbog takvih dana sam krenuo na ovo putovanje.\nPredvečer se na horizontu pojavila Korzika.\nNakon gotovo 17 sati na moru očekivao sam zapravo samo jedno — baciti sidro, nešto pojesti i zaspati.\nAli Korzika je očito imala drugačiji plan.\nGrad pun ljudi.\nKafići i restorani puni.\nGlazba, fešta, ljudi na ulicama, život na sve strane.\nNakon cijelog dana na pučini, nisam mogao poželjeti ljepši prvi susret s Korzikom.\nI onda dolazi novo jutro.\nA s njim nova odluka.\nDanas imam dvije potpuno različite mogućnosti.\nMogu nastaviti niz Korziku prema Ajacciu, gradu u kojem je rođen Napoleon.\nJedan lijepi dan plovidbe uz otok i navečer sam ponovno na sidru.\nNovi grad.\nNova večera.\nNova priča.\nIli…\nmogu pogledati prognozu, okrenuti INVICTUS prema zapadu i krenuti ravno prema Španjolskoj.\nA to je već sasvim druga priča.\nTo više nije nekoliko sati do sljedećeg sidrišta.\nTo znači otprilike dva i pol dana otvorenog mora.\nDvije noći bez kopna.\nBez večernjeg sidrišta.\nBez restorana.\nBez grada u kojem ću navečer prošetati.\nSamo INVICTUS.\nMore.\nVjetar.\nHorizont.\nI ja.\nI moram priznati…\nta druga mogućnost me trenutno privlači više.\nMožda upravo zato što sam jučer, nakon dugo vremena, ponovno osjetio koliko volim pučinu.\nPostoji nešto posebno u trenutku kada posljednji komadić kopna nestane iza tebe.\nOdjednom nema više luka.\nNema automobila.\nNema ljudi.\nNema grada.\nNema čak ni pitanja gdje ćeš navečer otići na večeru.\nSvijet se svede na nekoliko vrlo jednostavnih stvari.\nVjetar.\nValovi.\nJedra.\nKurs.\nBrod.\nI horizont.\nI tada shvatiš koliko nam je u svakodnevnom životu zapravo malo potrebno da bismo bili zadovoljni.\nMožda zato danas ne osjećam veliku potrebu unaprijed odlučiti.\nPogledat ću vrijeme.\nPogledat ću more.\nI onda odlučiti.\nJer na moru sam naučio još nešto.\nNe moraš uvijek znati gdje ćeš završiti da bi znao kojim smjerom želiš krenuti.\nPonekad napraviš samo sljedeći korak.\nI onda još jedan.\nPonekad promijeniš plan.\nPonekad preskočiš mjesto koje si želio vidjeti.\nA ponekad jednostavno pogledaš prema horizontu i osjetiš:\nIdemo dalje.\nZato današnja odluka zapravo nije samo:\nAjaccio ili Španjolska?\nMožda je više:\nOstati još jedan dan blizu obale…\nili ponovno pustiti kopno iza sebe i vidjeti što me čeka s druge strane horizonta?\nVidjet ćemo što jutros kažu vrijeme i more.\nAli jedno znam.\nINVICTUS je spreman.\nA ja također.\n⸻\nSometimes the horizon doesn’t call you to a place.\nIt simply calls you to keep going.\nPonekad te horizont ne zove prema nekom mjestu.\nJednostavno te zove da nastaviš dalje.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "5.10 08:17": "Dobro jutro s INVICTUSA.\nJučer oko 7 ujutro napustio sam Korziku.\nOdluka je na kraju pala.\nZbog pogoršanja vremena koje se očekuje oko Korzike nisam krenuo prema Ajacciu, nego sam okrenuo INVICTUS prema otvorenom moru.\nSljedeći cilj: Mahón, Menorca.\nNa ekranu je pisalo:\n275 NM.\nOko 50 sati do cilja.\nSunčan dan, malo vjetra. Dio vremena jedra, dio vremena jedan motor.\nMore mirno, sunce iznad mene i onaj dobar osjećaj kada znaš da si donio odluku i više nema razmišljanja lijevo ili desno.\nIdemo prema Španjolskoj.\nAli fascinantno je koliko je more veliko.\nPloviš cijeli dan, prolaze sati, a kada navečer pogledaš kartu, imaš osjećaj da si još uvijek pokraj Korzike.\nA onda, baš prije noći, primjećujem nešto što mi se nimalo ne sviđa.\nRadar ne radi.\nTo je uređaj bez kojeg ne želim provesti noć na otvorenom moru.\nRadar, AIS i SEA.AI termalna kamera moje su oči u mraku.\nA posljednja dva dana na brod sam spojio nekoliko novih stvari: dodatni daljinski za autopilot i WATCHIT računalo koje se vratilo s popravka iz Izraela. Uz to sam prvi put prebacio Starlink u međunarodni/oceanski režim.\nZovem Mladena iz Belcona.\nNedjelja je.\nČovjek se odmah javlja.\nNjegova sumnja: nešto od novopriključenih uređaja blokira komunikaciju s radarom.\nKreće eliminacija jednog po jednog.\nI izgleda da smo pronašli krivca.\nWATCHIT iz Izraela.\nIznenađenje.\nPonovno rastavljam dio krova salona, skidam kablove, odspajam uređaj…\nI odjednom:\nRADAR IS BACK.\nDobro.\nSada možemo u noć.\nBatman je još otvoren, vjetar dolazi u krmu i INVICTUS lijepo grabi prema Menorci.\nAli more se mijenja.\nValovi odostraga postaju sve viši, vjetar jača i INVICTUS počinje surfati niz njih.\nBrzina raste više nego što mi se sviđa.\nVrijeme je zatvoriti Batman.\nA onda i glavno jedro.\nSpuštanje velikih jedara po danu je jedna stvar.\nRaditi to usred noći, na valovima, potpuno je druga priča.\nSve spremam.\nOstaje jedan motor.\nPrognoza pokazuje da bi me oko 4 ujutro trebalo zahvatiti manje nevrijeme s kišom i grmljavinom.\nZatvaram flybridge zaštitnim folijama.\nJakna.\nSigurnosni pojas.\nOprema spremna.\nBrod spreman.\nJa spreman.\nOko ponoći na horizontu vidim prve bljeskove.\nDaleko su.\nAli područje je veliko.\nI znam da ide prema meni.\nNema zaobilaska. Moram kroz njega.\nMrak.\nRadar radi.\nOko mene nema ničega.\nSamo šum mora, jedan motor i povremeno zvijezde iznad mene.\nA onda se na radaru pojavljuje nešto veliko.\nTanker.\nDolazi odostraga.\nRadar ga je vidio puno prije nego ja i alarm se oglasio. Na AIS-u pratim njegov kurs.\nTrebao bi me proći s desne strane.\nTrebao bi.\nAli kada si usred noći na malom katamaranu, a iza tebe dolazi nekoliko stotina metara čelika, riječ „trebao“ nije baš moja omiljena riječ.\nPalim sva svjetla na INVICTUSU.\nIzgledam kao božićno drvce.\nNaravno, za njega sam i dalje samo mala crtica na radaru.\nAli neka ta crtica barem dobro svijetli.\nGledam AIS.\nPratim radar.\nJoš je blizu.\nPa polako vidim da se odvaja.\nProlazi.\nI ponovno — tišina.\nSamo ja, INVICTUS i nevrijeme koje se približava.\nPospanost već ozbiljno hvata.\nDvadesetak minuta spavam.\nDvadesetak sam budan.\nAlarmi rade.\nRadar radi.\nAIS radi.\nOko 02:00 počinje kiša.\nOko 03:00 nalazimo se usred nevremena.\nJaka kiša.\nValovi.\nVjetar oko 25–30 čvorova.\nNije dramatično, ali dovoljno da INVICTUS dobro skače po moru.\nI onda, gotovo jednako brzo kako je došlo…\nnakon pola sata sve završava.\nSilazim i pregledavam brod.\nJoš uvijek pratim onaj problem sa slanom vodom na port strani.\nMalo vode u kaljuži.\nNišta ozbiljno.\nSve ostalo dobro.\nVraćam se gore.\nI nastavljamo.\nNegdje između sna i jave.\nIzmeđu radara i horizonta.\nIzmeđu jednog vala i sljedećeg.\nA onda se događa ono što se na moru uvijek dogodi.\nPočne svitati.\nMrak polako postaje plav.\nOblaci se razmiču.\nI onda se iznad horizonta pojavi sunce.\nOdjednom ona noć koja je nekoliko sati ranije izgledala beskrajno ostaje iza mene.\nPogledam navigaciju.\n148 NM.\nJoš oko 24 sata.\nI nasmijem se.\nJoš jedan dan.\nJoš jedna noć.\nMožda još malo kiše i grmljavine.\nA onda…\nMenorca. Španjolska.\nI jutros ponovno razmišljam koliko je more zapravo dobra škola života.\nNe možeš kontrolirati hoće li doći oluja.\nNe možeš kontrolirati valove.\nNe možeš kontrolirati tanker koji se pojavi iza tebe.\nPonekad čak ni elektronika ne odluči surađivati baš kada ti je najpotrebnija.\nAli možeš napraviti jednu stvar.\nMožeš biti spreman.\nProvjeriti brod.\nPopraviti ono što ne radi.\nSmanjiti jedra prije nego što postane prekasno.\nStaviti sigurnosni pojas.\nPratiti radar.\nI nastaviti.\nMožda hrabrost zapravo nije osjećaj da se ničega ne bojiš.\nMožda je hrabrost puno jednostavnija.\nVidiš oluju ispred sebe.\nPripremiš brod.\nPripremiš sebe.\nI nastaviš držati kurs.\nJer poslije svake noći koju moraš proći…\nnegdje ispred tebe ipak čeka jutro.\nCOURAGE IS NOT THE ABSENCE OF FEAR.\nIT IS BEING PREPARED — AND KEEPING YOUR COURSE.\nHrabrost nije odsustvo straha.\nHrabrost je biti spreman — i nastaviti držati svoj kurs.\n148 NM TO MENORCA.\nINVICTUS AND I KEEP GOING.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "6.10 07:21": "Dobro jutro s INVICTUSA.\nJutros vam pišem još uvijek s mora.\nAli ovaj put — s društvom.\nJučerašnji dan proveo sam gotovo cijeli na flybridgeu.\nOtvoreno more između Korzike i Menorce. Nigdje kopna.\nDan oblačan, valovi oko dva metra, ali vjetar gotovo idealno s boka.\nI zato ono najbolje:\ngotovo cijeli dan jedrenje.\nINVICTUS nagnut na valovima, jedra puna, motori uglavnom odmaraju i mil ve someone shelter.\nAnd somehow, they make you feel less alone.\nPonekad ti usred oluje život pošalje malo društvo.\nTi nekome pružiš zaklon.\nA on tebi, sasvim neočekivano, učini noć manje usamljenom.\nJoš malo, prijateljice.\nIdemo zajedno do Mahóna.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "6.10 15:14": "MENORCA. WE MADE IT.\nNakon gotovo dva i pol dana otvorenog mora, Korzika je napokon ostala daleko iza nas, a jutros su se ispred INVICTUSA pojavila svjetla Mahóna na Menorci.\nBila su to dva i pol dana svega.\nSunce i jedrenje.\nValovi i vjetar.\nNoći bez kopna.\nRadar i AIS.\nTanker u mraku.\nKiša, grmljavina i munje koje su satima parale nebo.\nI jedna mala ptica koja je usred oluje pronašla zaklon na INVICTUSU i sa mnom odradila posljednju noćnu stražu.\nA onda jutros — mir.\nMore se smirilo, pojavilo se kopno i nakon toliko sati gledanja samo u horizont, ispred mene je konačno Menorca.\nUlazak u luku nakon duge plovidbe uvijek ima neki poseban osjećaj.\nUmoran si, neispavan, brod treba pospremiti i sto stvari čeka…\nAli na trenutak samo staneš i pomisliš:\nStigli smo.\nJoš jedan komadić svijeta iza INVICTUSA.\nA odavde put ide dalje — Mallorca, Ibiza, španjolska obala i Gibraltar.\nAli ne danas.\nDanas ćemo malo uživati u tome što smo ovdje.\nWELCOME TO MENORCA.\n275 NM. TWO AND A HALF DAYS AT SEA.\nONE MORE HORIZON BEHIND US.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "7.10 07:40": "Dobro jutro iz Mahóna.\nNakon dva i pol dana otvorenog mora, jučer je INVICTUS konačno stigao na Menorcu.\nI moram priznati — lijep je osjećaj ponovno hodati po zemlji.\nMahón me ugodno iznenadio. Široke ulice, puno restorana, ljudi opušteni, bez neke nervoze i žurbe. Grad ima baš onu atmosferu u kojoj vrlo brzo i sam malo usporiš.\nNaravno, kod mene „usporiti“ traje otprilike petnaest minuta.\nJer čim sam malo prošetao gradom, ponovno kreće lista:\nŠto danas popravljamo?\nVeć neko vrijeme primjećivao sam malo slane vode u port strani broda, posebno kada bi jači val udario u trup.\nNapokon sam pronašao problem.\nKaljužna pumpa nije radila kako treba, a problem je bio i na crijevu. Umjesto da voda završi tamo gdje joj je mjesto — izvan broda — dio se vraćao unutra.\nDakle, odlazak u trgovinu, nova pumpa, novo crijevo, alat van…\ni ponovno mala brodogradnja na INVICTUSU.\nNova pumpa je unutra. Problem riješen.\nDanas nastavljam.\nTreba riješiti jedan konop gore, nekoliko stvari na gumenjaku i još par sitnica kojih ću se sigurno sjetiti čim završim ove prve.\nNa brodu je to valjda beskonačan proces.\nNe postoji trenutak kada kažeš:\n„Eto. Sada je baš sve gotovo.“\nUvijek postoji nešto što treba zategnuti, zamijeniti, očistiti, provjeriti ili popraviti.\nAli jučer me usred svih tih popravaka nasmijala jedna potpuno drugačija scena.\nPo Mahónu se najnormalnije šeću — kokoši.\nI jedan poprilično ozbiljan pijetao.\nHoda ulicom kao da je grad njegov.\nAutomobili, ljudi, restorani… njega ništa posebno ne zanima.\nU jednom trenutku čovjek lijepo prelazi cestu kao svaki pristojan stanovnik Mahóna.\nNitko ga ne tjera.\nNitko se ne čudi.\nSamo još jedan dan na Menorci.\nI možda me upravo taj pijetao podsjetio na nešto.\nPosljednjih dana stalno nešto rješavam.\nVrijeme. Ruta. Radar. Munje. Valovi. Pumpa. Crijevo. Konopi. Gumenjak.\nUvijek postoji sljedeći problem.\nI tako je zapravo i u životu.\nAko odlučimo biti mirni i zadovoljni tek onda kada riješimo baš sve probleme, mogli bismo čekati jako dugo.\nJer čim riješiš jedan, pojavi se drugi.\nMožda zato nije poanta čekati dan kada više ništa neće biti pokvareno.\nPoanta je naučiti uživati i dok nešto popravljaš.\nPopraviti pumpu.\nPospremiti alat.\nOtići na burger i pivo.\nProšetati nepoznatim gradom.\nNasmijati se pijetlu koji prelazi cestu.\nI biti zahvalan što si nakon dva i pol dana mora ponovno negdje stigao.\nJer život neće nikada biti potpuno „popravljen“.\nI možda ni ne treba biti.\n**THERE IS ALWAYS SOMETHING TO FIX.\nDON’T FORGET TO ENJOY WHAT ISN’T BROKEN.\n**\nUvijek će postojati nešto što treba popraviti.\nSamo nemoj zaboraviti uživati u svemu onome što nije pokvareno.\nDanas servisni dan na INVICTUSU.\nA poslije?\nVidjet ćemo.\nMallorca polako čeka.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "8.10 07:08": "Dobro jutro s INVICTUSA!\nKNOWING WHEN TO MOVE IS JUST AS IMPORTANT AS KNOWING WHERE TO GO.\nJučer prekrasan dan u Mahónu na Menorci. Sunce, opušteni ljudi, šetnja gradom, španjolski specijaliteti i konačno malo odmora nakon dva i pol dana otvorenog mora.\nNaravno, na INVICTUSU nema dana bez popravaka.\nNapokon sam popravio konop glavnog jedra! Sada bih ponovno trebao moći podignuti jedro do kraja. A više jedra znači više brzine!\nOpran i osušen veš, brod malo pospremljen… i otkriven novi problem. Kada pada kiša, voda ulazi ispod jastuka na flybridgeu i tamo ostaje. Još jedna stavka na beskonačnoj listi.\nU šetnji gradom upoznao sam i novog pijetla!\nOnaj od jučer očito kontrolira istočni dio Mahóna, a ovaj današnji zapadni. Izgleda da su lijepo podijelili teritorij. Nitko ih ne dira, oni nikome ne smetaju. Baš opušten život!\nNavečer još jedan povijesni trenutak — prvi put sam koristio ekspres lonac!\nPlanirao sam završiti dan uz Netflix, ali onda sam pogledao vremensku prognozu…\nI TU PRESTAJE ODMOR!\nIz smjera Francuske prema Balearima dolazi ozbiljno pogoršanje vremena. Na kartama za četvrtak i petak sve više crvene i tamnocrvene boje, ponegdje prognozirani vjetrovi od 35 do 45 čvorova, lokalno i jači.\nDvije olujne zone približavaju se području kojim trebam ploviti.\nOdluka je pala.\nU 04:00 napuštam Mahón i krećem prema Mallorci!\nPlan je jednostavan, barem na papiru.\nDo podneva pokušati stići u zeleno područje slabijeg vjetra na prognozi. Do večeri doploviti do Porto Petra ili Portocoloma na Mallorci, a do dolaska najjačeg pogoršanja pronaći dobro zaštićen vez ili sidrište.\nNaravno, zelena boja na karti nije jamstvo sigurnosti. Zato stalno pratim vjetar, valove i razvoj vremena.\nNakon svih onih munja između Korzike i Menorce, baš nemam želju ponovno provesti noć usred nevremena ako ga mogu izbjeći.\nI tu dolazimo do današnje jutarnje misli.\nJučer je sve bilo lijepo. Sunce, mir, dobra hrana, šetnja i jedan gotovo običan dan.\nMogao sam ostati još malo.\nAli negdje iza horizonta već se priprema oluja.\nI nije li tako često i u životu?\nPonekad nam je toliko lijepo tamo gdje jesmo da ne primjećujemo kako se okolnosti mijenjaju.\nČekamo.\nOdgađamo odluku.\nA onda nas promjena zatekne nespremne.\nNe moraš uvijek čekati da te oluja pogodi da bi shvatio da je vrijeme krenuti dalje.\nHrabrost nije uvijek ploviti kroz oluju.\nPonekad je hrabrost promijeniti plan na vrijeme.\nA mudrost je znati kada treba ostati, a kada otići.\nKNOWING WHEN TO MOVE IS JUST AS IMPORTANT AS KNOWING WHERE TO GO.\nNije važno samo znati kamo ideš. Jednako je važno prepoznati trenutak kada treba krenuti.\nMahón, hvala ti na prekrasnom boravku!\nMallorca, dolazim! Nadam se da ću večeras već mirno gledati more iz neke tvoje lijepe uvale.\nDIFFERENT WEATHER. SAME DREAM.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "8.10 16:04": "MAHÓN • MENORCA • BALEARICS\nNakon dva i pol dana otvorenog mora, Mahón me dočekao baš kako treba!\nPrekrasan grad, široke i šarmantne uličice, odlična španjolska hrana, restorani na svakom koraku i nevjerojatno opušteni, simpatični ljudi.\nAli najveće iznenađenje? DVA PIJETLA!\nJedan očito kontrolira istočni dio grada, drugi zapadni. Teritorij je podijeljen, promet funkcionira, a turisti su dobrodošli!\nNisam provjeravao tko je gradonačelnik, ali mislim da znam tko ovdje stvarno vlada!\nMahón, kratko smo se družili, ali ostavio si mi jednu prekrasnu, veselu uspomenu!\nGOOD FOOD. GOOD PEOPLE. TWO ROOSTERS. ONE BEAUTIFUL MEMORY.\n SY INVICTUS • AROUND THE WORLD\n     Sažmi", "9.10 06:49": "Dobro jutro s INVICTUSA!\nCOURAGE IS NOT TAKING BLIND RISKS. IT’S KNOWING WHEN THE RISK IS WORTH TAKING.\nJučerašnji dan bio je jedan od onih kada ti more ponovno pokaže koliko su odluke važne.\nU 04:00 napustio sam Mahón na Menorci, znajući da se sa sjevera približavaju dva ozbiljna olujna područja.\nPrognoza nije izgledala nimalo lijepo. Crveno, tamnocrveno, ponegdje gotovo crno. Vjetrovi koji na otvorenom moru mogu napraviti ozbiljne probleme.\nZnao sam da ću, ako ostanem u Mahónu, vjerojatno nekoliko dana provesti zarobljen u marini čekajući bolje vrijeme.\nA meni se išlo dalje.\nZato sam odlučio pokušati proći između dva područja jakog vjetra, kroz svojevrsni meteorološki koridor, tampon-zonu u kojoj je prognoza pokazivala znatno povoljnije uvjete.\nMalo kockanja? Možda. Ali uz puno planiranja, praćenja prognoze i spremnosti na promjenu plana.\nI na kraju — odluka se isplatila!\nGotovo cijelim putem do Mallorce mogao sam jedriti. Dok su sjeverno od mene bili najavljeni jaki vjetrovi, INVICTUS je mirno grabio prema zapadu.\nA onda — PORTO PETRO!\nUlazak u prekrasnu, zaštićenu uvalu koja me na trenutak podsjetila na neke egzotične uvale Sejšela.\nTirkizno more, stijene, zelenilo i maleno mjesto koje izgleda kao da je netko odlučio malo usporiti vrijeme.\nI ono što me posebno oduševilo — organizacija!\nU uvali je sidrenje zabranjeno, ali postoje odlično organizirane bove.\nJoš ujutro poslao sam e-mail i rezervirao mjesto.\nNa ulazu poziv na VHF kanalu 9.\nDolazi čovjek gumenjakom, vodi me do bove, preuzima konope i pomaže pri vezivanju.\n45 € i sve funkcionira!\nDobijem račun, kartu mjesta, objašnjenje gdje je ponton namijenjen gostima s bova i gdje mogu odložiti smeće.\nSitnice?\nMožda.\nAli nakon toliko prijeđenih milja mogu reći da su upravo takve sitnice ono što nautičaru najviše znači.\nOvdje očito razumiju kako funkcionira život na brodu. Bravo!\nA onda napokon malo uživanja.\nSunce je izašlo, gusti oblaci ostali su daleko iza INVICTUSA, a ja sam se gumenjakom prebacio na obalu.\nPrekrasno, uredno, čisto ribarsko mjesto.\nŠetnja, mali restorani, dobra atmosfera.\nZa večeru vrhunska svježa riba, domaća predjela i čaša dobrog vina.\nPrimjećujem i zanimljivu stvar — velik dio jelovnika i natpisa na njemačkom jeziku.\nOčito je Mallorca vrlo popularna među Nijemcima, posebno umirovljenicima koji ovdje uživaju u životu.\nI moram priznati — razumijem ih.\nNavečer povratak na INVICTUS.\nOdlučim malo pogledati Netflix.\nVelika greška!\nPočnem gledati seriju „Istočno od raja“, pogledam dvije epizode i već je vrijeme za spavanje.\nJer alarm ponovno zvoni u 05:00.\nNOVI DAN, NOVI PLAN!\nPrvotni plan bio je krenuti prema Ibizi.\nAli more ima drugačiju ideju.\nOd prethodnih oluja ostali su valovi od oko dva metra i odlučujem ponovno promijeniti rutu.\nUmjesto Ibize, danas idem prema sjeverozapadnom dijelu Mallorce, dalje od Palme.\nTražim neku lijepu, zaštićenu uvalu i mali ribarski gradić, upravo onakav kakve najviše volim.\nU mraku polako napuštam Porto Petro.\nSlalom između brodova na bovama, navigacijska svjetla, instrumenti…\nA onda ponovno otvoreno more.\nVjetar ugodnih 12–15 čvorova s krme.\nINVICTUS ide dalje.\nJUTARNJA MISAO\nJučer sam razmišljao koliko puta u životu stojimo pred odlukom.\nOstati tamo gdje nam je sigurno i poznato?\nIli krenuti prema nečemu što želimo, iako ne znamo točno što nas čeka?\nČesto čekamo idealne uvjete.\nDa sve bude sigurno.\nDa nema nepoznanica.\nDa se baš sve poklopi.\nAli život rijetko nudi takve trenutke.\nDa sam čekao savršeno vrijeme, možda bih još uvijek bio na Menorci.\nA da sam čekao savršen trenutak za put oko svijeta, možda nikada ne bih ni isplovio iz Punta.\nNaravno, to ne znači da treba riskirati bez razmišljanja.\nNa moru takve odluke mogu biti vrlo skupe.\nAli postoji velika razlika između nepromišljenog rizika i odluke koju doneseš nakon što si proučio sve što možeš.\nNekada treba imati hrabrosti krenuti. A nekada još više hrabrosti promijeniti plan.\nJer cilj nije dokazati da si bio u pravu.\nCilj je sigurno stići tamo kamo želiš.\nI možda je upravo to jedna od najvažnijih životnih lekcija.\nNećeš uvijek imati savršene uvjete.\nNećeš uvijek znati što te čeka iza horizonta.\nAli ako si dobro razmislio, pripremio se i vjeruješ svojoj odluci…\nPonekad jednostavno moraš krenuti.\nCOURAGE IS NOT TAKING BLIND RISKS.\nIT’S KNOWING WHEN THE RISK IS WORTH TAKING.\nHrabrost nije slijepo riskirati. Hrabrost je znati kada se rizik isplati prihvatiti.\nJučer sam između dvije oluje pronašao put do prekrasne Mallorce.\nDanas tražim novu malu uvalu.\nA sutra?\nTko zna.\nTHE BEST STORIES BEGIN WHEN YOU DARE TO MOVE.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "10.10 07:00": "Dobro jutro s INVICTUSA!\nYOU DON’T DISCOVER YOUR LIMITS UNTIL YOU STEP BEYOND THEM.\nJučer je bio jedan od onih dana kada ponovno shvatiš koliko je život na brodu zapravo drugačiji od svega na što si navikao.\nNakon plovidbe uz obalu Mallorce, pod oblačnim nebom i uz dosta valova, stigao sam u Port d’Andratx.\nI kao naručeno — pojavilo se sunce!\nA onda ponovno nešto što me u Španjolskoj stvarno oduševljava.\nOrganizacija!\nBova rezervirana, marinero me čeka, dolazi gumenjakom, preuzima konope i za nekoliko minuta INVICTUS je sigurno privezan.\n41 € i sve riješeno!\nBez komplikacija, bez nervoze, bez nepotrebnog čekanja.\nNakon Grčke i Italije, moram priznati da me Španjolska zasad izuzetno ugodno iznenadila.\nSve funkcionira.\nOd prijema na bove, pomoći pri vezivanju, pontona za gumenjake i organizacije u lukama, do restorana, usluge i sasvim normalnih cijena.\nA turista još uvijek koliko želiš!\nNaravno, Nijemci prevladavaju.\nČovjek se ponekad zapita je li došao na Mallorcu ili u neki njemački grad s palmama.\nAli vratimo se INVICTUSU.\nKako sam stigao rano, odlučio sam napokon napraviti nešto što već danima odgađam.\nVELIKI SERVIS MOTORA!\nINVICTUS ima dva Yanmar dizelska motora.\nSljedeći servis predviđen je na 900 radnih sati, a ja sam trenutačno na 888 sati.\nDakle, vrijeme je.\nA popis poslova nije baš kratak.\nIzvaditi staro motorno ulje — oko 5 litara.\nUliti novo.\nZamijeniti ulje u getribi — oko 2,5 litre.\nZamijeniti filter ulja.\nFilter goriva.\nPredfilter goriva.\nOčistiti  NEW ISLAND. NEW STORIES.\nSY INVICTUS • AROUND THE WORLD\n     Sažmi", "11.10 07:00": "Dobro jutro s INVICTUSA!\nEXPERIENCE DOESN’T MEAN YOU STOP MAKING MISTAKES. IT MEANS YOU LEARN HOW TO FIX THEM.\nJučer još jedan dugačak dan na moru.\nOd Port d’Andratxa na Mallorci pa sve do Ibize. Gotovo cijeli dan plovidbe, a onda konačno — CALA TARIDA!\nPrekrasna, mirna uvala. Velika pješčana plaža, pijesak i na morskom dnu, tirkizno more… baš ono što čovjek poželi nakon dugog dana na brodu.\nAli čim sam spustio sidro, čujem nešto neobično.\nGlazba! I to poprilično glasna.\nNa plaži veliki restoran, ogromni zvučnici, njemački voditelj i — njemačka svadba!\nPa dobro, jesam li ja uopće napustio Njemačku?\nNakon Mallorce sada su me Nijemci dočekali i na Ibizi.\nIzgleda da su Baleari službeno postali njemačka prekomorska pokrajina!\nAli nema vremena za svadbu.\nDok još ima dnevnog svjetla, odlučujem riješiti probleme koji me već nekoliko dana ozbiljno muče.\nPRVI PROBLEM — RAYMARINE!\nMoja tri navigacijska plotera posljednjih dana stalno se blokiraju.\nA na njima su navigacijske karte, radar, kamere i brojni drugi sustavi koji su mi izuzetno važni za sigurnu plovidbu.\nEkrani se zamrznu i više ništa ne reagira.\nKao da je cijela mreža zagušena.\nVeć danima tražim uzrok.\nOdlučujem ponovno otvoriti cijeli strop salona, gdje su skriveni mrežni switchevi i kilometri kabela.\nOdspajam uređaje, provjeravam veze, ponovno sve spajam.\nNa telefonu sam s Mladenom iz Raymarina, koji mi ponovno strpljivo pomaže.\nPokušavamo sve moguće kombinacije.\nAli problem ostaje.\nNa kraju donosimo odluku koju sam želio izbjeći.\nVRAĆAMO PLOTERE NA TVORNIČKE POSTAVKE!\nI onda…\nOdjednom sve radi!\nSva tri ekrana ponovno normalno funkcioniraju.\nRadar, karte, kamere — sve se vraća u život.\nA najzanimljivije je što sam problem, po svemu sudeći, napravio sam.\nPrije nekoliko dana dobio sam novi Raymarine daljinski upravljač za autopilot.\nI spojio sam ga dok je elektronika bila uključena.\nBez isključivanja napajanja.\nPočetnička pogreška!\nSumnjam da je upravo tada nešto poremetilo komunikaciju između uređaja.\nNe mogu to sa sigurnošću dokazati, ali nakon vraćanja postavki sustav ponovno radi.\nSada me još čeka ponovno podešavanje svih mojih postavki.\nAli barem su mi navigacijski sustavi ponovno dostupni!\nDRUGI PROBLEM — GORIVO!\nVeć neko vrijeme imam problem s odzračnom cijevi desnog spremnika goriva.\nU njoj se zadržala nafta, pa prilikom tankanja gorivo ulazi užasno sporo.\nA kada puniš velike spremnike, to stvarno može potrajati.\nOdlučujem riješiti i to.\nOdspajam cijev, ispuhujem zaostalu naftu, ponovno je spajam.\nPola sata kasnije — gotovo!\nCijev prohodna, problem riješen!\nJedino što sam nakon puhanja u cijev bio toliko iscrpljen da sam se osjećao kao da sam upravo napuhao deset gumenjaka!\nI tako, dok se nad Ibizom spušta noć, napokon mogu reći:\nDva velika problema riješena!\nINVICTUS ponovno spreman.\nTuširanje, večera, malo Netflixa, nekoliko stranica knjige…\nI spavanje.\nAli ne zadugo.\nJer alarm zvoni u 02:00!\nNOVI DAN — NOVA VELIKA DIONICA!\nNapuštam Ibizu i krećem prema španjolskoj obali.\nIspred mene je dug dan.\nPrognoza nije idealna.\nValovi, morska struja i vjetar uglavnom u nos.\nTo znači sporiju plovidbu, više rada motora i vjerojatno puno manje prijeđenih milja nego što bih želio.\nAli nema veze.\nU mraku podižem sidro.\nSvi navigacijski uređaji prebačeni su u noćni način rada.\nProvjeravam radar, AIS, instrumente i kurs.\nI ponovno krećem.\nIza mene ostaju svjetla Ibize.\nIspred mene samo more i novi horizont.\nJUTARNJA MISAO\nJučer sam, dok sam sjedio okružen kabelima, otvorenim stropom i navigacijskim uređajima koji nisu radili, razmišljao o jednoj zanimljivoj stvari.\nKoliko god iskustva imali, nikada ne prestajemo griješiti.\nCijeli život učimo kako nešto napraviti bolje.\nPostajemo stručnjaci u svojem poslu.\nStječemo iskustvo.\nI s vremenom neke stvari počnemo raditi gotovo automatski.\nA upravo tada ponekad napravimo najgluplje ti međunarodni transport.\nZatim carinske i porezne formalnosti jer Kanarski otoci imaju poseban režim.\nI na kraju ono najvažnije…\nKAMO UOPĆE POSLATI TU OGROMNU PALETU?\nJoš uvijek tražim odgovarajuću marinu i mjesto gdje će INVICTUS biti početkom studenoga.\nA bez točne adrese teško je organizirati dostavu.\nDakle, još jedan problem koji moram riješiti prije Atlantika.\nI iskreno, ponekad mi se čini da je lakše preploviti sto milja nego organizirati jednu pošiljku!\nVEČER U AGUADULCEU\nNapokon se spušta noć.\nOdlazim u marinu na jedno piće.\nNaručujem pizzu za brod.\nPogledam neki znanstvenofantastični film o ljudima zatočenima u kući.\nAli nema ranog spavanja.\nJer u 22:00 imam Zoom sastanak.\nPOLIKLINIKA SMILE — POSAO NE STAJE!\nNa vezi su moj partner i kirurg Nikola Džakula te kirurg Mario Gržančić.\nRazgovaramo o pacijentima.\nPlaniramo zahvate.\nUsklađujemo metode rada.\nRadimo na standardizaciji naših protokola i edukaciji o No Bone metodama — rješenjima za pacijente koji žele fiksne zube, ali nemaju dovoljno kosti za klasične implantate.\nI tako, dok INVICTUS mirno stoji u španjolskoj marini, ja sam ponovno barem nekoliko sati u svojem drugom svijetu.\nSvijetu kirurgije, implantologije, pacijenata i ljudi s kojima već godinama gradim Smile.\nSastanak završava tek oko 00:30.\nNapokon spavanje.\nAli ne zadugo.\n05:00 — DOBRO JUTRO!\nPonovno sam budan.\nOtvaram računalo.\nPišem upite na pet špediterskih tvrtki kako bih organizirao dostavu pleksiglasa iz Njemačke na Tenerife.\nI onda sjedam pisati ovu jutarnju priču.\nPogledam kroz prozor.\nINVICTUS je mirno privezan.\nNema plovidbe.\nNema prijeđenih milja.\nAli nekako imam osjećaj da sam jučer napravio jako puno.\n⸻\nJUTARNJA MISAO\nJučer sam razmišljao o jednoj zanimljivoj stvari.\nKada putujemo, često mjerimo napredak kilometrima.\nIli u mojem slučaju — nautičkim miljama.\nKoliko smo danas prešli?\nKoliko smo bliže cilju?\nKoliko nam još treba?\nI nekako imamo osjećaj da smo uspješni samo ako se stalno kreć eman.\nElektronika ponovno radi.\nAIS radi.\nARGO dobiva nove mogućnosti.\nZalihe su dopunjene.\nA Gibraltar je sve bliže.\nI sada razmišljam o jednoj zanimljivoj mogućnosti.\nMOŽDA DANAS UOPĆE NEĆU STATI!\nPlanirao sam negdje predvečer pronaći sigurnu uvalu ili marinu i prenoćiti.\nAli što ako jednostavno nastavim?\nAko vrijeme i uvjeti budu dobri, možda odradim još jednu noćnu plovidbu i sutra ujutro stignem ravno u Gibraltar!\nTo bi značilo jednu dugu etapu, ali i jednu veliku prednost.\nMOGAO BIH POSJETITI I GIBRALTAR I TANGIER!\nDva potpuno različita svijeta.\nEuropa i Afrika.\nJedan poznat po svojoj stijeni, britanskoj povijesti i majmunima.\nDrugi po marokanskoj kulturi, uskim ulicama, mirisima i sasvim drukčijoj atmosferi.\nA dijeli ih samo Gibraltarski tjesnac.\nI iskreno, bilo bi mi jako žao propustiti bilo koji od njih.\nZato sada razmišljam…\nMožda malo više napora danas i noćas znači puno više doživljaja sljedećih dana.\nMALO VIŠE TRUDA — PUNO VIŠE USPOMENA!\nNaravno, sve ovisi o vremenu, stanju mora, prometu i tome kako će plovidba napredovati.\nAko uvjeti ne budu odgovarali, stat ću ranije.\nAli ako budu…\nZašto ne?\nNakon nekoliko dana mirovanja ponovno je lijep osjećaj znati da danas idem dalje.\n⸻\nJUTARNJA MISAO\nJučer sam, dok sam satima radio na elektronici, razmišljao koliko se moj život promijenio u posljednjih nekoliko mjeseci.\nCijeli sam život proveo u medicini.\nOperacije.\nImplantati.\nPacijenti.\nEdukacije.\nVođenje klinike.\nTo je svijet koji poznajem.\nSvijet u kojem imam iskustvo, znanje i sigurnost.\nA onda sam odlučio krenuti na put oko svijeta.\nI odjednom se našao u potpuno drugačijem svijetu.\nNavigacija.\nMeteorologija.\nMotori.\nElektrika.\nRačunalne mreže.\nProgramiranje.\nSatelitske komunikacije.\nI svaki dan otkrivam koliko toga još ne znam.\nAli zanimljivo je nešto drugo.\nŠto više učim, sve više shvaćam koliko je lijepo ponovno biti početnik.\nNekada sam mislio da je iskustvo najveća prednost.\nI jest.\nAli danas sve više išta.\nSamo nastavljaju svojim putem.\nVjetra gotovo nema.\nVozim na oba Yanmara.\nStruja i valovi protiv mene.\nBrzina jedva 4,5 čvora.\nOpet borba za svaku milju!\nKiša još lagano pada.\nGledam navigaciju.\nPlanirao sam stići oko 18:00.\nA sada mi pokazuje dolazak u 16:00!\nKako je to moguće?\nPa nisam valjda odjednom toliko ubrzao?\nA onda shvatim.\nMAROKO IMA DRUGAČIJE VRIJEME!\nDva sata razlike u odnosu na hrvatsko ljetno vrijeme.\nDakle, nisam dobio na brzini.\nSamo sam dobio dva sata na satu!\nTANGIER — PRVI SUSRET!\nKiša prestaje.\nSunce se polako pojavljuje.\nI konačno ispred mene Tangier!\nA onda, baš kada se približavam marini…\nVjetar!\nCijelim putem gotovo ništa.\nA sada odjednom 16–18 čvorova!\nBaš kada trebam pristati.\nPA DOBRO, JE LI MENE NETKO GORE NAMJERNO ZEZA?!\nZovem marinu Tanja Marina Bay na VHF kanalu 11.\nNitko se ne javlja.\nPokušavam ponovno.\nNišta.\nUlazim u marinu.\nS lijeve strane vidim benzinsku postaju.\nA odmah iza nje nekoliko carinika naslonjenih na ogradu.\nGledaju me.\nJa gledam njih.\nNitko ništa ne govori.\nČovjek s benzinske viče:\n„DIESEL?”\nKažem mu da trebam gorivo, ali prvo moram na carinu.\nOn odgovara:\n„NO, NO! HERE! EVERYTHING HERE!”\nDobro.\nIdemo!\n24 TONE I VJETAR U BOK!\nPonton benzinske jako je nizak.\nA vjetar mi puše ravno u desni bok i gura INVICTUS prema njemu.\nI to prilično brzo!\nGledam bokobrane.\nSvi su previsoko!\nAko sada nastavim, mogao bih lijepo ukrasiti bok broda.\nOdustajem od prvog pokušaja.\nVraćam se izvan marine, gdje imam više prostora.\nPremještam bokobrane na lijevu stranu i spuštam ih gotovo do površine mora.\nI krećem ponovno.\nU međuvremenu se publika povećala!\nIznad benzinske nalazi se velika šetnica.\nObitelji, djeca, turisti…\nSvi gledaju što će ovaj bijeli katamaran sada napraviti.\nA carinici?\nI dalje naslonjeni na ogradu.\nČekaju predstavu!\nPrilazim paralelno pontonu.\nJoš četiri metra.\nTri.\nDva.\nVjetar odrađuje svoje.\nGura INVICTUS prema pontonu kao da nema 24 tone, nego 24 kilograma!\nI onda…\nSAVRŠENO PRISTAJANJE!\nBokobrani na pravom mjestu.\nVjetar me drži uz ponton.\nDodajem konope.\nGotovo!\nPublika može kući. Predstava je završila bez štete!\nDIZEL — 1,60 €!\nČovjek s benzinske odmah želi početi tankati.\nJa bih radije prvo na carinu.\nAli on inzistira.\nDobro, može!\nA kada čujem cijenu…\n1,60 € PO LITRI!\nU Italiji sam plaćao 2,64 €.\nU Španjolskoj 2,04 €.\nA ovdje 1,60 €!\nMaroko mi se već počinje sviđati!\nCARINA I POLICIJA — DOBRO DOŠLI U MAROKO!\nDok se INVICTUS puni gorivom, odlazim do ureda.\nSve je na jednom mjestu.\nCarina.\nPolicija.\nRecepcija marine.\nDočekuje me vrlo ljubazan agent.\nPrvo pitanje:\n„Where are you from?”\nCroatia.\nA on odmah:\n„LUKA MODRIĆ!”\nEvo ga opet!\nNevjerojatno koliko je taj čovjek poznat!\nPita me odakle dolazim.\nLa Línea.\nJesam li vidio orke?\nKamo idem dalje?\nKažem Madeira ili Kanarski otoci.\nGleda me pomalo začuđeno.\nKao da misli: ovaj stvarno namjerava sam preko Atlantika?\nPregledava dokumente broda, registraciju, osiguranje.\nI znate što?\nNITKO ME NE PITA ZA ONAJ PAPIR IZ LA LÍNEE!\nNakon svih problema u Španjolskoj!\nIspunjavam nekoliko obrazaca.\nZatim me šalju na policiju.\nORAL SURGEON? DENTIST!\nPolicajac kopira moju putovnicu.\nZatim mi nešto govori na francuskom i pokazuje obrazac.\nMislim da želi potpis.\nPotpisujem se.\nOn odmah:\n„No, no! Profession!”\nAha!\nZanima ga čime se bavim.\nPišem:\nORAL SURGEON.\nGleda me.\nNišta.\nPokušavam objasniti.\nImplantati, operacije, kirurgija…\nNišta.\nNa kraju kažem:\n„DENTIST!”\nAaaa!\nOdmah sve jasno!\nPokazuje na zube svojeg kolege kojem bi, izgleda, dobro došao posjet stomatologu.\nSvi se smijemo.\nI tako prolazi moj prvi susret s marokanskom policijom.\nA ONDA — PREGLED BRODA!\nVraćam se na INVICTUS.\nNakon petnaestak minuta dolaze tri carinika.\nUniforme.\nOzbiljna lica.\nIzgledaju kao da će pregledati svaki vijak na brodu!\nKažem:\n„WELCOME!”\nOni se nasmiju.\nDobro, već smo probili led.\nUlaze u salon.\nPrvo pitanje:\n„Do you have alcohol?”\nA iza mene…\nPolice pune boca!\nPokloni prijatelja i pacijenata koje sam ponio za putovanje i buduće goste.\nOkrenem se, pokažem na police i nasmijem se.\nSmije se i carinik.\nKažem mu da je za privatne potrebe.\nVjerojatno misli…\nOvaj zubar baš voli popiti!\nOtvaraju podnice.\nOrmare.\nPregledavaju brod.\nPitanja o oružju, gotovini i opremi.\nSve ide mirno i profesionalno.\nPitanje o dronu.\nPokazujem im svoj pokvareni HoverAir.\nUpozoravaju me da ga ne koristim u Maroku jer je uporaba dronova bez odgovarajućeg odobrenja zabranjena.\nNema problema!\nA onda jedna mala komična scena.\nDvojica carinika odlaze pregledati vanjske dijelove broda.\nTreći ostaje u salonu.\nGleda police s alkoholom.\nPa mene.\nPa ponovno police.\nPokazuje na bocu Zacapa ruma.\n„IS THIS GOOD?”\nPravim se da ne razumijem kamo razgovor vodi.\nKažem mu:\n„No, no, this one is not so good!”\nI ponudim mu jednu hrvatsku travaricu koju sam imao na brodu.\nOn se nasmije.\nPrihvati je.\nI tako završava moja prva marokanska carinska avantura.\nKONAČNO — TANJA MARINA BAY!\nAgent me upućuje na ponton za posjetitelje.\nPonovno malo manevriranja uz vjetar.\nAli sada već znam kako se INVICTUS ponaša.\nPristajem.\nVežem konope.\nMotori se gase.\nINVICTUS JE U AFRICI!\nMarina prekrasna.\nOdlično zaštićena.\nKamere, zaštitari, policija.\nSve čisto, uredno i organizirano.\nI odmah odlazim istražiti grad.\nTANGIER — LJUBAV NA PRVI POGLED!\nIzlazim na veliku šetnicu iznad marine.\nI ostajem iznenađen.\nNevjerojatno čisto!\nNedjeljno poslijepodne.\nObitelji šeću s djecom.\nLjudi nasmijani, srdačni, elegantno odjeveni.\nRestorani i kafići puni.\nS lijeve strane ogromna pješčana plaža.\nDjeca igraju nogomet.\nNeki se kupaju.\nDrugi jašu konje i deve po pijesku.\nSunce.\nMore.\nGlazba.\nMirisi hrane.\nI neka posebna, topla atmosfera.\nMAROKO, GDJE SI BIO DO SADA?!\nŠećem prema gradu.\nKupujem kavu na malom kiosku.\nOdmah ugodan razgovor.\nPrilazi mi jedan Marokanac koji odlično govori engleski
