<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brodski dnevnik INVICTUS</title>
<meta name="description" content="Brodski dnevnik SY INVICTUS: put oko svijeta katamaranom, dan po dan, kao stara knjiga koja se lista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600;700&family=Caveat:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&display=swap">
<style>
/* Knjiga: stari brodski dnevnik. Kožne korice, požutjeli papir, rukom pisani upisi.
   Svaki dan je jedan dvostruki list: lijevo tablica dana i javljanja, desno zalijepljena "fotografija" (video).
   Na mobitelu jedno ispod drugog. */
:root{
  --desk:#22170f;--leather:#5b2a1b;--leather2:#3b1a10;--gold:#c9a24b;--gold2:#e6c97a;
  --paper:#eee1c0;--paper2:#e4d3a8;--edge:#cdb886;
  --ink:#2b2118;--ink2:#5a4a38;--red:#9b2d20;--blue:#22406a;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --blot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .1  0 0 0 .22 -.04'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>");
  --book:min(1200px,calc(100vw - 160px));
}
*{box-sizing:border-box}
html{color-scheme:light;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--ink);font:400 18px/1.62 "EB Garamond",Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(255,200,120,.10),transparent 60%),
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,220,170,.03) 9px 11px,transparent 11px 23px),
    linear-gradient(180deg,#2b1d13,#1b120c);
  background-attachment:fixed}
a{color:var(--blue)}
button{font:inherit;color:inherit}
.hand{font-family:Caveat,cursive;color:var(--blue)}

/* gornja traka */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;max-width:calc(var(--book) + 40px);margin:0 auto;padding:14px 20px 10px;color:var(--gold2)}
.brand{font:600 15px/1.2 Cinzel,serif;letter-spacing:.14em;color:var(--gold2);text-decoration:none;margin-right:auto;text-transform:uppercase}
.brand b{font-weight:600;color:#f4dfa0}
.tb{appearance:none;border:1px solid rgba(201,162,75,.55);background:rgba(20,12,7,.45);color:var(--gold2);font:500 13px/1 Cinzel,serif;letter-spacing:.06em;padding:9px 13px;border-radius:3px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tb:hover{background:rgba(201,162,75,.16)}
select.tb{max-width:260px;padding-right:8px}
select.tb option{background:#2b1d13;color:#f0e2bd}

/* knjiga */
.book{width:var(--book);margin:6px auto 0;position:relative}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:14px;border-radius:8px 8px 10px 10px;perspective:2600px;
  background:var(--noise),linear-gradient(135deg,var(--leather),var(--leather2));
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,220,160,.08),inset 0 0 40px rgba(0,0,0,.45)}
/* listovi papira ispod stranice */
.page{position:relative;min-height:calc(100vh - 150px);padding:34px 44px 56px;
  background:var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28)}
.pl{border-radius:4px 0 0 4px;
  background:linear-gradient(90deg,transparent 88%,rgba(90,60,25,.10) 96%,rgba(60,35,10,.38)),var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28),-1px 1px 0 var(--edge),-3px 3px 0 #e8d9b3,-4px 4px 0 var(--edge),-6px 6px 0 #e3d2a8,-7px 7px 0 var(--edge)}
.pr{border-radius:0 4px 4px 0;
  background:linear-gradient(270deg,transparent 88%,rgba(90,60,25,.10) 96%,rgba(60,35,10,.38)),var(--blot),var(--noise),var(--paper);
  box-shadow:inset 0 0 70px rgba(130,90,35,.28),1px 1px 0 var(--edge),3px 3px 0 #e8d9b3,4px 4px 0 var(--edge),6px 6px 0 #e3d2a8,7px 7px 0 var(--edge)}
/* hrbat s koncem */
.spread>.pl::after{content:"";position:absolute;top:30px;bottom:30px;right:-1px;width:2px;
  background:repeating-linear-gradient(180deg,rgba(80,50,20,.55) 0 7px,transparent 7px 26px);z-index:2}
.folio{position:absolute;bottom:18px;font:500 14px/1 "Cormorant SC",serif;letter-spacing:.12em;color:var(--ink2)}
.pl .folio{left:44px}.pr .folio{right:44px}

/* zaglavlje stranice */
.run{display:flex;justify-content:space-between;gap:10px;font:600 13px/1.3 "Cormorant SC",serif;letter-spacing:.16em;color:var(--ink2);border-bottom:1px solid rgba(43,33,24,.45);padding-bottom:6px;margin-bottom:14px}
.run .leg{color:var(--red)}
.title-day{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.title-day .dn{font:700 54px/0.9 "Cormorant SC",serif;color:var(--ink)}
.title-day .mo{font:600 24px/1.1 "Cormorant SC",serif;letter-spacing:.06em}
.title-day .wd{font:400 26px/1 Caveat,cursive;color:var(--blue)}

/* tablica dnevnika */
table.log{width:100%;border-collapse:collapse;margin:4px 0 22px;font-size:14px}
.log th{font:600 11.5px/1.2 "Cormorant SC",serif;letter-spacing:.14em;color:var(--ink2);text-align:left;padding:5px 8px;border:1px solid rgba(43,33,24,.5);background:rgba(120,85,30,.07)}
.log td{padding:5px 8px 4px;border:1px solid rgba(43,33,24,.5);vertical-align:top;font:400 21px/1.15 Caveat,cursive;color:var(--blue)}
.log td.c{white-space:nowrap}
.log .n{text-align:center;width:1%}

/* javljanja */
.list{position:relative}
.ent{position:relative;display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding:4px 0 22px}
.ent::before{content:"";position:absolute;left:64px;top:0;bottom:0;border-left:1.5px solid rgba(155,45,32,.55)}
.ent .tm{font:700 24px/1.2 Caveat,cursive;color:var(--red);text-align:right;padding-right:6px}
.ent .tm .st{display:block;font-size:20px;line-height:1}
.ent>div:last-child{padding-left:14px;min-width:0}
.ent h3{margin:0 0 1px;font:700 22px/1.2 "Cormorant SC",serif;letter-spacing:.03em;color:var(--ink)}
.ent .pl-name{margin:0 0 8px;font:400 22px/1.1 Caveat,cursive;color:var(--blue)}
.ent .txt p{margin:0 0 .62em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.ent .txt h4{margin:.9em 0 .35em;font:600 16px/1.3 "Cormorant SC",serif;letter-spacing:.1em;color:var(--red)}
.ent .txt>:first-child::first-letter{font-family:"Cormorant SC",serif;font-weight:700;float:left;font-size:3.1em;line-height:.82;padding:6px 6px 0 0;color:var(--red)}
.ent .txt>h4:first-child::first-letter{all:unset}
.ent.sel h3{text-decoration:underline;text-decoration-color:rgba(34,64,106,.55);text-decoration-thickness:2px;text-underline-offset:4px}
.act{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}
.chip{appearance:none;background:none;border:0;padding:0;cursor:pointer;font:600 21px/1.2 Caveat,cursive;color:var(--blue);text-decoration:none;border-bottom:1.5px dashed rgba(34,64,106,.45)}
.chip:hover{color:var(--red);border-color:rgba(155,45,32,.5)}
.chip.on{color:var(--red);border-bottom-style:solid}
.sep{text-align:center;color:var(--ink2);letter-spacing:.6em;margin:-6px 0 14px;font-size:14px}

/* desna stranica: zalijepljena fotografija */
.media{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center}
.photo{position:relative;background:#f8f3e6;padding:12px 12px 14px;transform:rotate(-1.3deg);
  box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px rgba(60,35,10,.35);margin-top:10px}
.photo::before,.photo::after{content:"";position:absolute;width:96px;height:28px;background:rgba(232,220,180,.72);
  box-shadow:0 1px 2px rgba(0,0,0,.15);backdrop-filter:blur(.5px)}
.photo::before{top:-12px;left:-26px;transform:rotate(-38deg)}
.photo::after{top:-12px;right:-26px;transform:rotate(38deg)}
.player{height:min(calc(100vh - 290px),620px);aspect-ratio:9/16;background:#1d1610;display:flex;align-items:center;justify-content:center;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.fbonly{flex-direction:column;gap:14px;text-decoration:none;color:#f1e4c4;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 35%,#3a2a1c,#17110b 75%)}
.fbonly .pb{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gold2);padding-left:6px;transition:transform .15s}
.fbonly:hover .pb{transform:scale(1.08);background:rgba(201,162,75,.15)}
.fbonly .fl{font:600 30px/1.1 Caveat,cursive;color:var(--gold2)}
.fbonly .why{font:italic 15px/1.4 "EB Garamond",serif;color:#bfae88;max-width:240px}
.ph{color:#cdbb92;text-align:center;padding:20px;font:400 22px/1.3 Caveat,cursive}
.ph a{color:var(--gold2)}
.cap{margin:8px 2px 0;text-align:center;font:400 23px/1.15 Caveat,cursive;color:var(--blue);max-width:340px}
.cap span{color:var(--red);margin-left:8px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 0}
.tab{appearance:none;cursor:pointer;border:1px solid rgba(43,33,24,.45);background:rgba(255,248,230,.55);padding:3px 11px 1px;font:600 20px/1.2 Caveat,cursive;color:var(--ink2);border-radius:2px 2px 8px 8px}
.tab.on{background:var(--red);color:#fbeedd;border-color:var(--red)}
.mnote{margin:12px 0 0;font-size:14.5px;font-style:italic;color:var(--ink2);text-align:center}
.nophoto{margin-top:60px;text-align:center;border:1.5px dashed rgba(43,33,24,.4);padding:40px 24px;transform:rotate(.6deg);max-width:340px}
.nophoto p{font:400 24px/1.3 Caveat,cursive;color:var(--ink2);margin:0 0 8px}
blockquote{margin:34px auto 0;max-width:380px;text-align:center;padding:16px 10px 0;border-top:1px solid rgba(43,33,24,.35)}
blockquote q{display:block;font:italic 400 21px/1.4 "EB Garamond",serif;quotes:"„" "“"}
blockquote cite{display:block;margin-top:6px;font:600 12px/1.3 "Cormorant SC",serif;letter-spacing:.14em;font-style:normal;color:var(--red)}

/* naslovnica: kožne korice + naslovni list */
.leather{position:relative;border-radius:6px 2px 2px 6px;color:var(--gold2);text-align:center;padding:30px;
  background:var(--noise),radial-gradient(ellipse at 40% 35%,#6f3524,#45200f 75%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 60px rgba(0,0,0,.55),inset -14px 0 18px -8px rgba(0,0,0,.6)}
.frame{position:relative;height:100%;min-height:calc(100vh - 210px);border:2px solid rgba(201,162,75,.75);outline:1px solid rgba(201,162,75,.5);outline-offset:-9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 24px}
.frame::before,.frame::after{content:"❦";position:absolute;font-size:22px;color:var(--gold)}
.frame::before{top:14px;left:50%;transform:translateX(-50%)}
.frame::after{bottom:14px;left:50%;transform:translateX(-50%) rotate(180deg)}
.gilt{background:linear-gradient(180deg,#f6e2a2,#c9a24b 55%,#8e6a26);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.leather .small{font:600 15px/1 Cinzel,serif;letter-spacing:.42em;margin:0}
.leather h1{margin:4px 0 0;font:700 clamp(40px,5.2vw,68px)/1 "Cinzel Decorative",serif;letter-spacing:.06em}
.leather .sub{margin:0;font:500 15px/1.3 Cinzel,serif;letter-spacing:.3em}
.leather svg{width:150px;height:150px;margin:12px 0}
.leather .verse{margin:16px 0 0;font:italic 400 19px/1.45 "EB Garamond",serif;color:#e7cf8f}
.leather .henley{margin:0;font:500 11px/1 Cinzel,serif;letter-spacing:.24em;color:#bfa063}
.titlep{display:flex;flex-direction:column;align-items:center;text-align:center}
.titlep h2{margin:16px 0 0;font:700 40px/1.05 "Cormorant SC",serif;letter-spacing:.06em}
.titlep .of{font:italic 400 20px/1.4 "EB Garamond",serif;margin:2px 0 18px;color:var(--ink2)}
.rule{width:60%;height:10px;margin:2px auto 18px;background:linear-gradient(var(--ink2),var(--ink2)) center/100% 1px no-repeat;position:relative}
.rule::after{content:"⚓";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:var(--paper);padding:0 10px;font-size:16px;color:var(--ink2)}
.ledger{width:100%;max-width:470px;margin:0 0 20px;text-align:left}
.ledger div{display:grid;grid-template-columns:150px 1fr;align-items:baseline;border-bottom:1px solid rgba(43,33,24,.35);padding:5px 0 1px}
.ledger dt{font:600 13px/1.2 "Cormorant SC",serif;letter-spacing:.12em;color:var(--ink2)}
.ledger dd{margin:0;font:400 24px/1.1 Caveat,cursive;color:var(--blue)}
.stats{width:100%;max-width:470px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:4px 0 22px}
.stats>div{border:1px solid rgba(43,33,24,.4);padding:8px 10px 6px;text-align:center;background:rgba(255,250,235,.25)}
.stats>div.nm{grid-column:1/-1}
.stats b{display:block;font:700 30px/1 Caveat,cursive;color:var(--red)}
.stats .nm b{font-size:40px}
.stats span{display:block;font:500 13px/1.25 "Cormorant SC",serif;letter-spacing:.07em;color:var(--ink2);margin-top:3px}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{appearance:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 15px/1 "Cormorant SC",serif;letter-spacing:.12em;padding:11px 16px 9px;border-radius:2px}
.btn:hover{background:rgba(43,33,24,.08)}
.btn.go{background:var(--leather);border-color:var(--leather);color:var(--gold2)}
.btn.go:hover{background:#6c3322}
.how{margin:18px 0 0;max-width:430px;font-style:italic;font-size:16px;color:var(--ink2)}

/* strelice sa strane knjige */
.side{position:fixed;top:50%;z-index:20;width:58px;height:58px;margin-top:-29px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(201,162,75,.8);color:var(--gold2);font:400 34px/1 "EB Garamond",serif;display:flex;align-items:center;justify-content:center;padding:0 0 4px;
  background:var(--noise),radial-gradient(circle at 35% 30%,#7a3a26,#3b1a10);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.25);transition:transform .15s,opacity .2s}
.side:hover{transform:scale(1.08)}
.side:disabled{opacity:.25;cursor:default;transform:none}
#sprev{left:max(8px,calc(50vw - var(--book)/2 - 74px))}
#snext{right:max(8px,calc(50vw - var(--book)/2 - 74px))}
.side .lb{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 Cinzel,serif;letter-spacing:.14em;color:#bfa063;pointer-events:none}

/* donja traka */
.nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:22px 16px 30px;color:#d8c08a}
.nav button{appearance:none;background:none;border:1px solid rgba(201,162,75,.45);color:var(--gold2);border-radius:3px;padding:7px 14px;cursor:pointer;font:500 13px/1 Cinzel,serif;letter-spacing:.06em}
.nav button:disabled{opacity:.3;cursor:default}
.pg{font:500 13px/1.3 Cinzel,serif;letter-spacing:.08em;text-align:center}
.pg b{font-weight:600;color:#f1dc9f}

/* okretanje lista */
.leaf{position:absolute;z-index:10;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.45,.05,.3,1);pointer-events:none}
.leaf.fwd{transform-origin:left center}.leaf.bwd{transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}.leaf.bwd.go{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face>.page{min-height:100%;height:100%;box-shadow:inset 0 0 70px rgba(130,90,35,.28)}
.face.back{transform:rotateY(180deg)}
.leaf .face.front::after,.leaf .face.back::after{content:"";position:absolute;inset:0;pointer-events:none;animation:shade .75s ease-in-out forwards}
@keyframes shade{0%{background:rgba(0,0,0,0)}50%{background:rgba(40,25,10,.28)}100%{background:rgba(0,0,0,0)}}
.under{position:absolute;z-index:5;overflow:hidden;pointer-events:none}
.under>.page{min-height:100%;height:100%}
.slide-next{animation:sn .4s ease-out}.slide-prev{animation:sp .4s ease-out}
@keyframes sn{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sp{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* sadržaj */
dialog{border:0;padding:0;width:min(720px,94vw);max-height:86vh;border-radius:4px;color:var(--ink);
  background:var(--blot),var(--noise),var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(130,90,35,.3)}
dialog::backdrop{background:rgba(15,9,5,.72)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:16px 26px 10px;background:var(--paper);border-bottom:1px solid rgba(43,33,24,.45);z-index:1}
.dh h2{margin:0;font:700 28px/1 "Cormorant SC",serif;letter-spacing:.1em}
.dh .btn{padding:8px 12px 6px}
.toc{padding:6px 26px 26px}
.toc h3{margin:22px 0 6px;font:700 19px/1.2 "Cormorant SC",serif;letter-spacing:.08em;color:var(--red);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(155,45,32,.4);padding-bottom:3px}
.toc h3 small{font:400 15px/1.3 "EB Garamond",serif;font-style:italic;color:var(--ink2);letter-spacing:0}
.toc button{appearance:none;display:grid;grid-template-columns:62px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted rgba(43,33,24,.35);padding:5px 4px 3px;cursor:pointer;align-items:baseline}
.toc button:hover,.toc button.cur{background:rgba(155,45,32,.08)}
.toc .td{font:700 19px/1 Caveat,cursive;color:var(--red)}
.toc .tt{font-size:17px}
.toc .tn{font:400 18px/1 Caveat,cursive;color:var(--blue)}

@media (max-width:1100px){.page{padding:28px 30px 54px}.pl .folio{left:30px}.pr .folio{right:30px}}
@media (max-width:860px){
  :root{--book:calc(100% - 12px)}
  body{font-size:17.5px}
  .top{padding:10px 12px 8px;gap:8px}.brand{flex-basis:100%;font-size:13px}
  #jump{flex:1 1 150px;min-width:0;max-width:none}
  .spread{grid-template-columns:1fr;padding:7px;perspective:none}
  .page{min-height:0;padding:22px 30px 50px}
  .pl,.pr{border-radius:3px;box-shadow:inset 0 0 50px rgba(130,90,35,.28)}
  .spread>.pl::after{display:none}
  .day .pl,.day .pr{display:contents}
  .day{grid-template-areas:"head" "media" "list";background:var(--noise),linear-gradient(135deg,var(--leather),var(--leather2))}
  .day .phead,.day .list,.day .pmedia{background:var(--blot),var(--noise),var(--paper);box-shadow:inset 0 0 50px rgba(130,90,35,.25)}
  .day .phead{grid-area:head;padding:22px 30px 6px;border-radius:3px 3px 0 0}
  .day .pmedia{grid-area:media;padding:10px 30px 26px}
  .day .list{grid-area:list;padding:14px 30px 50px;border-radius:0 0 3px 3px;position:relative}
  .day .folio{display:none}
  .media{position:static}
  .player{height:auto;width:min(100%,340px)}
  .fbonly{aspect-ratio:9/12}
  .photo{transform:rotate(-1deg)}
  .title-day .dn{font-size:46px}
  .log th:nth-child(4),.log td:nth-child(4){display:none}
  .ent{grid-template-columns:46px 1fr;gap:0 8px}
  .ent::before{left:46px}
  .ent>div:last-child{padding-left:10px}
  .ent .tm{font-size:21px;padding-right:2px}
  .ent .txt p{text-align:left}
  .frame{min-height:480px;padding:48px 16px}
  .leather .sub{letter-spacing:.18em;font-size:13px}
  .leather{border-radius:4px;margin-bottom:7px}
  .side{width:34px;height:52px;margin-top:-26px;font-size:30px;opacity:.9;border-width:1.5px}
  #sprev{left:0;border-radius:0 26px 26px 0;border-left:0}
  #snext{right:0;border-radius:26px 0 0 26px;border-right:0}
  .side .lb{display:none}
  .ledger div{grid-template-columns:118px 1fr}
  .stats{grid-template-columns:1fr}
  .nav .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.leaf,.slide-next,.slide-prev{transition:none;animation:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#">SY <b>INVICTUS</b> · Brodski dnevnik</a>
  <button class="tb" id="tocBtn" type="button">☰ Sadržaj</button>
  <select class="tb" id="jump" aria-label="Skoči na dan"></select>
  <a class="tb" href="dnevnik.html">Karta i cijeli dnevnik</a>
</header>

<button class="side" id="sprev" type="button" aria-label="Prethodni dan">‹<span class="lb">natrag</span></button>
<button class="side" id="snext" type="button" aria-label="Sljedeći dan">›<span class="lb">dalje</span></button>

<main class="book" id="book" aria-live="polite"></main>

<nav class="nav" aria-label="Listanje">
  <button id="prev" type="button" aria-label="Prethodni dan">‹<span class="lbl"> Prethodni dan</span></button>
  <div class="pg" id="pg"></div>
  <button id="next" type="button" aria-label="Sljedeći dan"><span class="lbl">Sljedeći dan </span>›</button>
</nav>

<dialog id="toc" aria-label="Sadržaj">
  <div class="dh"><h2>Sadržaj</h2><button class="btn" type="button" id="tocClose">Zatvori ✕</button></div>
  <div class="toc" id="tocList"></div>
</dialog>

<template id="statsTpl"><!--@STATS@--></template>

<script>
/*@DATA@*/
const MON=["","siječnja","veljače","ožujka","travnja","svibnja","lipnja","srpnja","kolovoza","rujna","listopada","studenoga","prosinca"];
const WD=["nedjelja","ponedjeljak","utorak","srijeda","četvrtak","petak","subota"];
const LEGN=Object.fromEntries(LEGS.map(l=>[l.id,l.n]));
const pad=n=>String(n).padStart(2,"0");
function dm(v,lat){const a=Math.abs(v),d=Math.floor(a),m=Math.round((a-d)*60);return (lat?pad(d):String(d).padStart(3,"0"))+"°"+pad(m)+"′"+(lat?(v>=0?"N":"S"):(v>=0?"E":"W"));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isVid=id=>/^\d+$/.test(id);
const roman=n=>{const r=[[1000,"m"],[900,"cm"],[500,"d"],[400,"cd"],[100,"c"],[90,"xc"],[50,"l"],[40,"xl"],[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];let s="";for(const [v,c] of r)while(n>=v){s+=c;n-=v;}return s;};
// Darkov izvorni tekst: retci u odlomke, kratki retci velikim slovima kao međunaslovi
function fmt(e){const t=T[e.key];if(!t)return `<p>${esc(e.text)}</p>`;
  return t.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{const letters=l.replace(/[^A-Za-zČĆŽŠĐčćžšđ]/g,"");const up=letters.replace(/[^A-ZČĆŽŠĐ]/g,"").length;
    return (letters.length>=6&&up/letters.length>.8&&l.length<110)?`<h4>${esc(l)}</h4>`:`<p>${esc(l)}</p>`;}).join("");}
const fbUrl=id=>isVid(id)?`https://www.facebook.com/reel/${id}/`:`https://www.facebook.com/darko.slovsa/posts/${id}`;
const embedUrl=(id,w)=>`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent("https://www.facebook.com/darko.slovsa/videos/"+id+"/")}&show_text=false&width=${w}&t=0`;

// dani
let year=2026,lastM=0;const DAYS=[];const byKey={};
E.forEach((e,i)=>{const [d,m]=e[1].split(".").map(Number);if(m<lastM)year++;lastM=m;
  const key=`${year}-${pad(m)}-${pad(d)}`;if(!byKey[key]){byKey[key]={key,y:year,m,d,ents:[]};DAYS.push(byKey[key]);}
  byKey[key].ents.push({leg:e[0],date:e[1],tm:e[2],k:e[3],title:e[4],text:e[5],fb:e[6],hl:e[7],place:e[8],i,key:d+'.'+m+' '+e[2]});});
const START=Date.UTC(2026,7,1);
DAYS.forEach(D=>{D.n=Math.round((Date.UTC(D.y,D.m-1,D.d)-START)/864e5)+1;D.wd=WD[new Date(Date.UTC(D.y,D.m-1,D.d)).getUTCDay()];
  D.legs=[...new Set(D.ents.map(e=>e.leg))];});
// zadnji dan svake etape dobiva citat
const legLast={};DAYS.forEach((D,ix)=>D.legs.forEach(l=>legLast[l]=ix));
const PAGES=DAYS.length+1; // 0 = naslovnica
const jav=n=>n===1?"javljanje":(n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"javljanja":"javljanja");

const book=document.getElementById("book"),pg=document.getElementById("pg");
const prevs=[document.getElementById("prev"),document.getElementById("sprev")],nexts=[document.getElementById("next"),document.getElementById("snext")];
let cur=0,sel=0;

const COMPASS=`<svg viewBox="-100 -100 200 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc98"/><stop offset="1" stop-color="#9c7630"/></linearGradient></defs>
<g fill="none" stroke="url(#g)" stroke-width="2"><circle r="92"/><circle r="84" stroke-width="1"/><circle r="30" stroke-width="1.2"/></g>
<g fill="url(#g)">${[0,45,90,135,180,225,270,315].map(a=>`<path transform="rotate(${a})" d="M0 ${a%90?-58:-80} L${a%90?7:11} 0 L0 0Z" opacity="${a%90?.75:1}"/><path transform="rotate(${a})" d="M0 ${a%90?-58:-80} L${a%90?-7:-11} 0 L0 0Z" opacity="${a%90?.45:.6}"/>`).join("")}
${Array.from({length:32},(_,i)=>`<rect transform="rotate(${i*11.25})" x="-.8" y="-92" width="1.6" height="${i%4?5:9}"/>`).join("")}</g>
<text y="-62" text-anchor="middle" fill="#f3dc98" font-family="Cinzel" font-size="14" font-weight="600" dy="-32">N</text></svg>`;

function cover(){
  const st=document.getElementById("statsTpl").innerHTML;
  const last=DAYS[DAYS.length-1];
  return `<article class="spread cover">
  <section class="page pl leather"><div class="frame">
    <p class="small gilt">Brodski dnevnik</p>
    ${COMPASS}
    <h1 class="gilt">INVICTUS</h1>
    <p class="sub gilt">S · Y · Around the World</p>
    <p class="verse">I am the master of my fate,<br>I am the captain of my soul.</p>
    <p class="henley">Invictus · W. E. Henley</p>
  </div></section>
  <section class="page pr titlep">
    <h2>Brodski dnevnik</h2>
    <p class="of">jedrilice SY INVICTUS na putu oko svijeta</p>
    <div class="rule"></div>
    <dl class="ledger">
      <div><dt>Brod</dt><dd>SY INVICTUS, katamaran</dd></div>
      <div><dt>Zapovjednik</dt><dd>Darko Slovša</dd></div>
      <div><dt>Luka polaska</dt><dd>Marina Punat, 1. 8. 2026.</dd></div>
      <div><dt>Zadnji upis</dt><dd>${last.d}. ${MON[last.m]} ${last.y}., ${esc(last.ents[last.ents.length-1].place)}</dd></div>
    </dl>
    <div class="stats">${st}</div>
    <div class="cta"><button class="btn go" type="button" data-go="1">Otvori dnevnik ›</button><button class="btn" type="button" data-go="${PAGES-1}">Zadnji upis</button><button class="btn" type="button" data-toc>Sadržaj</button></div>
    <p class="how">Na svakom listu su Darkova javljanja tog dana u cijelosti, a desno je zalijepljen video. Listaj strelicama sa strane knjige, tipkama ← → ili povlačenjem prsta.</p>
    <span class="folio">i</span>
  </section></article>`;
}

function dayPage(ix){
  const D=DAYS[ix];const ents=D.ents;
  const places=[...new Set(ents.map(e=>e.place))];
  const c=P[ents[ents.length-1].k]||[0,0];
  const legTxt=D.legs.map(l=>LEGN[l]).join(" → ");
  const vids=ents.filter(e=>isVid(e.fb));
  if(sel>=ents.length)sel=0;
  // zadani odabir: prvo javljanje s videom
  const chosen=ents[sel]&&isVid(ents[sel].fb)?ents[sel]:(vids[0]||ents[sel]);
  const list=ents.map((e,j)=>`<div class="ent${e.hl?" hl":""}${e===chosen?" sel":""}">
      <div class="tm">${esc(e.tm)}${e.hl?'<span class="st" title="istaknuto">✶</span>':""}</div>
      <div><h3>${esc(e.title)}</h3><p class="pl-name">${esc(e.place)}</p><div class="txt">${fmt(e)}</div>
      <div class="act">${isVid(e.fb)?`<button class="chip${e===chosen?" on":""}" type="button" data-sel="${j}">${e===chosen?"▶ video je desno":"▶ pogledaj video"}</button>`:""}${e.fb?`<a class="chip" href="${fbUrl(e.fb)}" target="_blank" rel="noopener">objava na Facebooku ↗</a>`:""}</div></div></div>`).join(`<div class="sep">✦ ✦ ✦</div>`);
  const quotes=D.legs.filter(l=>legLast[l]===ix&&Q[l]&&l!==DAYS[DAYS.length-1].legs.slice(-1)[0]).map(l=>`<blockquote><q>${esc(Q[l][0])}</q><cite>Jutarnja misao · ${esc(Q[l][1])}</cite></blockquote>`).join("");
  let media;
  if(chosen&&isVid(chosen.fb)){
    if(NOEMBED.has(chosen.fb)){
      media=`<div class="photo"><a class="player fbonly" href="${fbUrl(chosen.fb)}" target="_blank" rel="noopener"><span class="pb">▶</span><span class="fl">Pogledaj video<br>na Facebooku</span><span class="why">Facebook ovaj video ne dopušta prikazati izvan Facebooka, vjerojatno zbog glazbe u njemu.</span></a>
      <p class="cap">${esc(chosen.title)}<span>${esc(chosen.tm)}</span></p></div>`;
    }else{
      media=`<div class="photo"><div class="player" id="player"><div class="ph">Učitavam video…</div></div>
      <p class="cap">${esc(chosen.title)}<span>${esc(chosen.tm)}</span></p></div>`;
    }
    media+=`${vids.length>1?`<div class="tabs" role="tablist" aria-label="Videi ovog dana">${ents.map((e,j)=>isVid(e.fb)?`<button class="tab${e===chosen?" on":""}" type="button" data-sel="${j}">${esc(e.tm)}</button>`:"").join("")}</div>`:""}
      ${NOEMBED.has(chosen.fb)?"":`<p class="mnote">Ako se video ne učita, <a href="${fbUrl(chosen.fb)}" target="_blank" rel="noopener">otvori ga na Facebooku ↗</a></p>`}`;
  }else{
    media=`<div class="nophoto"><p>Za ovaj dan u dnevnik nije zalijepljen video.</p>${chosen&&chosen.fb?`<a class="chip" href="${fbUrl(chosen.fb)}" target="_blank" rel="noopener">objava s fotografijama na Facebooku ↗</a>`:""}</div>`;
  }
  const fl=2*(ix+1);
  return `<article class="spread day">
    <section class="page pl">
      <div class="phead">
        <div class="run"><span class="leg">${esc(legTxt)}</span><span>Dan ${D.n}. na moru</span></div>
        <div class="title-day"><span class="dn">${D.d}.</span><span class="mo">${MON[D.m]} ${D.y}.</span><span class="wd">${D.wd}</span></div>
        <table class="log"><thead><tr><th class="n">Dan</th><th>Mjesto</th><th>Javljanja</th><th>Pozicija</th></tr></thead>
          <tbody><tr><td class="n">${D.n}.</td><td>${esc(places.join(", "))}</td><td class="c">${ents.length} ${jav(ents.length)}</td><td class="c">${dm(c[0],1)}<br>${dm(c[1],0)}</td></tr></tbody></table>
      </div>
      <div class="list">${list}</div>
      <span class="folio">${fl}</span>
    </section>
    <section class="page pr">
      <div class="pmedia"><div class="media">${media}${quotes}</div></div>
      <span class="folio">${fl+1}</span>
    </section>
  </article>`;
}

function mountPlayer(){
  const pl=document.getElementById("player");if(!pl)return;
  const D=DAYS[cur-1];const vids=D.ents;const e=vids[sel]&&isVid(vids[sel].fb)?vids[sel]:vids.find(x=>isVid(x.fb));
  if(!e||NOEMBED.has(e.fb))return;
  const w=Math.max(220,Math.min(380,Math.round(pl.clientWidth||320)));
  pl.innerHTML=`<iframe title="${esc(e.title)}" src="${embedUrl(e.fb,w)}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe>`;
}

const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const desktop=()=>matchMedia("(min-width:861px)").matches;
function snap(node){const n=node.cloneNode(true);n.querySelectorAll("iframe").forEach(f=>f.remove());n.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));return n;}
// list se okreće oko hrpta: naprijed desna stranica preko na lijevu, natrag obrnuto
function turnLeaf(dir,oldSp){
  const sp=book.querySelector(".spread");if(!sp)return;
  const tgt=sp.querySelector(dir>0?".pr":".pl"),oth=sp.querySelector(dir>0?".pl":".pr");
  const h=Math.min(tgt.offsetHeight,window.innerHeight+200);
  const box=(el,d)=>{d.style.left=el.offsetLeft+"px";d.style.top=el.offsetTop+"px";d.style.width=el.offsetWidth+"px";d.style.height=h+"px";};
  const under=document.createElement("div");under.className="under";box(oth,under);under.appendChild(snap(oldSp.querySelector(dir>0?".pl":".pr")));
  const L=document.createElement("div");L.className="leaf "+(dir>0?"fwd":"bwd");box(tgt,L);
  const f=document.createElement("div");f.className="face front";f.appendChild(snap(oldSp.querySelector(dir>0?".pr":".pl")));
  const b=document.createElement("div");b.className="face back";b.appendChild(snap(oth));
  L.append(f,b);sp.append(under,L);
  L.addEventListener("transitionend",()=>{L.remove();under.remove();},{once:true});
  setTimeout(()=>{L.remove();under.remove();},1000);
  requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add("go")));
}

function render(dir){
  const oldSp=book.querySelector(".spread");
  const html=cur===0?cover():dayPage(cur-1);
  book.innerHTML=html;mountPlayer();
  pg.innerHTML=cur===0?"<b>Naslovnica</b>":`<b>${DAYS[cur-1].d}. ${MON[DAYS[cur-1].m]}</b> · list ${cur} / ${PAGES-1}`;
  prevs.forEach(b=>b.disabled=cur===0);nexts.forEach(b=>b.disabled=cur===PAGES-1);
  document.getElementById("jump").value=String(cur);
  const h=cur===0?"":"#dan-"+DAYS[cur-1].key;
  if(location.hash!==h)history.replaceState(null,"",h||location.pathname);
  if(dir&&oldSp&&!reduced()){
    if(desktop())turnLeaf(dir,oldSp);
    else book.firstElementChild.classList.add(dir>0?"slide-next":"slide-prev");
  }
}
function go(n,keepSel){n=Math.max(0,Math.min(PAGES-1,n));if(n===cur)return;const dir=Math.sign(n-cur);cur=n;if(!keepSel)sel=0;
  if(dir&&window.scrollY>book.offsetTop)window.scrollTo({top:Math.max(0,book.offsetTop-10),behavior:"auto"});
  render(dir);}

prevs.forEach(b=>b.onclick=()=>go(cur-1));nexts.forEach(b=>b.onclick=()=>go(cur+1));
document.addEventListener("keydown",e=>{if(document.getElementById("toc").open)return;if(e.target.closest("select,input"))return;
  if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
book.addEventListener("click",e=>{const s=e.target.closest("[data-sel]");if(s){sel=+s.dataset.sel;render(0);if(!desktop()){const m=book.querySelector(".media");if(m)m.scrollIntoView({behavior:"smooth",block:"start"});}return;}
  const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return;}if(e.target.closest("[data-toc]"))openToc();});
// povlačenje prstom
let sx=null,sy=null;book.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
book.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(cur+(dx<0?1:-1));},{passive:true});

// skok na dan
const jump=document.getElementById("jump");
jump.innerHTML=`<option value="0">Naslovnica</option>`+DAYS.map((D,i)=>`<option value="${i+1}">${D.d}. ${D.m}. ${D.y}. · ${esc(D.ents[0].place)}</option>`).join("");
jump.onchange=()=>go(+jump.value);

// sadržaj
const toc=document.getElementById("toc");
function openToc(){toc.querySelectorAll(".cur").forEach(x=>x.classList.remove("cur"));toc.showModal();const el=toc.querySelector(`[data-p="${cur}"]`);if(el){el.classList.add("cur");el.scrollIntoView({block:"center"});}}
document.getElementById("tocBtn").onclick=openToc;document.getElementById("tocClose").onclick=()=>toc.close();
toc.addEventListener("click",e=>{if(e.target===toc)toc.close();const b=e.target.closest("[data-p]");if(b){toc.close();go(+b.dataset.p);}});
document.getElementById("tocList").innerHTML=LEGS.map(L=>{const ds=DAYS.map((D,i)=>[D,i]).filter(([D])=>D.legs[0]===L.id);if(!ds.length)return"";
  return `<h3>${esc(L.n)}<small>${esc(L.r)}</small></h3>`+ds.map(([D,i])=>{const t=D.ents.find(e=>e.title!=="Jutarnja misao")||D.ents[0];
    return `<button type="button" data-p="${i+1}"><span class="td">${D.d}. ${D.m}.</span><span class="tt">${esc(t.title)}</span><span class="tn">${D.ents.length}×</span></button>`;}).join("");}).join("");
document.querySelector(".brand").onclick=e=>{e.preventDefault();go(0);};

// početna stranica iz adrese
function fromHash(){const m=location.hash.match(/^#dan-(\d{4}-\d{2}-\d{2})$/);const i=m?DAYS.findIndex(D=>D.key===m[1]):-1;cur=i>=0?i+1:0;sel=0;render(0);}
window.addEventListener("hashchange",fromHash);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur>0)mountPlayer();},400);});
fromHash();
</script>
</body>
</html>
